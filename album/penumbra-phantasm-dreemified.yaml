    THANK YOU ALL FOR 200 FOLLOWERS!!!

    Here's part one to my 200 follower special,<br>
    one song for each hundred followers of course!!

    Wowie, 200!!<br>
    That’s like 10 whole classrooms worth of friends.

    Again, I’m still so shocked I even got to this point.<br>
    It surely has been a journey with all of you.

    I truly feel like I have gotten so much better at making music,<br>
    and I love seeing and responding to all of your comments.

    Anyways, I have been working on this for a few weeks now,<br>
    playing around with the shreddage presets and whatnot.

    I tried to replicate the original piano test of this song,<br>
    incorporating the unfinished version as well.<br>
    I couldn't forget to add the Don't Forget segment (pun intended),<br>
    as every hero needs a legend.

    I also have been messing around with some LoFi stuff,<br>
    as you can see with my most recent songs.<br>
    I might do some more of them later.

    Also maaaybe expect an earthbound-esque style song.

    ...Probably.

Commentary: |-
    <i>Decon Theed:</i> (liner notes)

    The original path I took with the [[track:coolkid-j-machines-93-style-remix|Coolkid remix]] was honestly not that different from the final version. Some bits are downtuned or uptuned differently because I wound up getting confused (a lot of samples I have are tuned oddly or differently, and I’ll sometimes need to have other samples tuned in a strange way to get everything matching up correctly). The breakdown that comes at the end was originally supposed to be the middle section, but thats honestly the only real major change between this and the final barring the stripped-down nature of the demo.

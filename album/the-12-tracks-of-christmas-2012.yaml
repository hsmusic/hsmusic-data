Track: The Bitter Battle of Manor Road
Duration: 4:35
URLs:
- https://103records.bandcamp.com/track/the-bitter-battle-of-manor-road
Sampled Tracks:
- Everything Ended
- Do You?
Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/the-bitter-battle-of-manor-road) / liner notes)

    The fifth entry in the 12 Tracks Of Christmas project, and its a bit of a strange one.<br>
    Well, its not flat out weird, but it mixes elements of rave, breakbeat, acid, and ambient all together. In a lot of ways, its a little bit like a track made by The Freestylers, or a recent Shut Up & Dance tune, and probably wouldn’t be too out of place in a wipEout game. Which Im ok with, because Im a BIG fan of wipEout.<br>
    As for the relevance to Christmas/the title, allow me to explain; about two or so years ago, it had snowed quite heavily very close to Christmas (most of it had melted by Christmas day, though), quite late in the day. I was hanging out with a few mates for most of the night, and we didn’t notice it had snowed, or how heavy it had snowed, until about 11Oclock at night. Upon this discovery, we did what any normal 18/19 year olds would do; we went out and had a grandiose Snowball Fight- no, a full out Snowball War that lasted until about 3 or 4 in the morning. We actually rang up a couple of other friends of ours and had them come all the way down to London Colney just for the fight, thats how serious this shit was to us. Most of the fight took place on a street near to where I live named Manor Road- hence, the title.
Crediting Sources: |-
    <i>Decon Theed:</i> ([Bandcamp credits blurb](https://103records.bandcamp.com/track/the-bitter-battle-of-manor-road))


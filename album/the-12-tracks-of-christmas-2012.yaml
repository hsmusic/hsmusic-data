Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/coolkid-j-machines-93-style-remix) / liner notes)

    The day's not even started and already I've done track 7 for the 12 Tracks project!<br>
    So basically [[artist:haunter|IKARUS]] is a cool fucking dude that makes boss tunes the likes of wish I was only half as talented enough to make, and [[track:coolkid]] is definitely one of my favourites (and to say Im humbled that a track of mine wound up as part of [[album:coloUrs-and-mayhem-universe-a|coloUrs & mayhem]] alongside it is a huge understatement). I’ve wanted to put my own spin on Coolkid for a while, but I wasn’t sure what sort of style I wanted to do it in- originally I thought of just doing something similar to [[track:gold-mage]] in style under the [[artist:repeatedscales]] name, but I thought that was a little bit too predictable.<br>
    In the end, I settled on an Oldskool Hardcore/early 90s rave type sound, because I thought the main melody riff really worked when rendered with Raves synths. Many, many liberties are taken and a lot of original melodies/chord progressions are added, but most major parts from the original song are recreated by ear to the best of my ability. This was, however, partially done from memory, so it might not be 100% accurate. Still, I tried my best.

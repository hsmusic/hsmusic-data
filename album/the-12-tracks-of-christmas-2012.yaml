Sampled Tracks:
- Fools Gold
Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/the-most-deadly-game-theme-of-guidestuck) / liner notes)

    Whoa now hold up, a FINISHED bit of Guidestuck music? And its a 12 Tracks Of Christmas entry too? Goddamn son call the media this shit’s bananas.<br>
    So, around about the last week or so, I’ve been really getting into Guidestuck. Guidestuck is a Homestuck fan adventure created by one [[artist:scarvenrot|miss scarvenrot]], and generally switches the rolls between the kids/guardians and trolls/lusii around in a complete 180. There is definitely a lot more to Guidestuck then that, but you didn’t come here for a plot synopsis!<br>
    There’s been a contest going on for a while, and while I have been working on a couple of pieces of Guidestuck music, Im kinda stuck on where to go with them. And after finishing Attract Mode last night and deciding to stick it on another project, I was kinda lost with what to do for today. Then somehow this happened and all my problems were solved!<br>
    This is, effectively, a general theme for Guidestuck rather then any character or land or scenario specifically. Like you could probably think of this as my interpretation of Guidestuck’s answer to [[Sburban Jungle|Suburban Jungle]]. The piece as a whole is kind of a mish mash between synthpop, soundtrack, techno, drum n bass, and even a bit of (fake) chiptune at the very end for good measure. Im planning on doing a full chiptune mix using the little chiptune section at the end as well, so keep an eye out for that sometime in the near future!<br>
    Again, this track has no real relevance to Christmas, but I promise the next one will be!
Crediting Sources: |-
    <i>Decon Theed:</i> ([Bandcamp credits blurb](https://103records.bandcamp.com/track/the-most-deadly-game-theme-of-guidestuck))


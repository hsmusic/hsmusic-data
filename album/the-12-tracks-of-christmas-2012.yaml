    This was actually the first song I attempted for the 12 Tracks project. I dug the concept I was working with, but it not only sounds the weakest compared to the other demos and the final tracks, but even before all the other tracks where completed the thing felt kinda weak and lacking, so I scrapped it pretty quickly. The only element I really think came out ok where the drums, of which only one of the drumloops was 100% custom anyway. Might revisit this one later, but I wouldn’t hold your breath.

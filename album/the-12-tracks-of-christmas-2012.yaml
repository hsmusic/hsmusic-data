Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/snowfall-in-shibuya-a-tribute-to-nujabes) / liner notes)

    Track 4 of the 12 Tracks project, and it's a hip hop joint. Because to be frank I've needed to put out a Hip Hop track that actually sounds sorta pro-ish, and not just like a cheap beat thrown together by an amateur like most of my previous attempts. This is oldskool hip hop style; there ain't no overdone 808 booms and snaps here, just breaks, horns, and piano loops. Very, very, VERY heavily inspired by the jazzy vibes of Nujabes, a Japanese hip hop producer most known for providing music for the anime series Samurai Champloo, especially for the series' iconic theme song Battlecry (done in collaboration with rapper Shing02). Sadly, he was taken from us back in 2010, after he was involved in a serious car accident. He was only 36 years old.
Crediting Sources: |-

Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/album/the-12-tracks-of-christmas-2012))

    103RX0001

    Join a selection of 103 Records musicians as they gather round the fire, not to roast chestnuts, but to cook up a lovely assortment of beats, breaks, loops, riffs and jams for your audial pleasure. The perfect post-Christmas-pre-New-Year treat!

    <i>Decon Theed:</i> (liner notes)

    I gotta say, sticking to doing two tracks a day throughout most of December on top of everything else I normally have to do over the Christmas season? Not an easy task, and one that I wasn’t entirely sure Id be able to manage. But lo and behold, I managed to pull it off; 12 Tracks, each on even numbered days, never too late and never too early. As per the norm, there’s definitely some stuff I wish Id done better on these tracks, but this is probably the least intense I’ve ever felt that feeling of oh, but if I did this I could have etc. etc. This is, without a doubt, some of the best sounding music I have ever put out, and my growth as an artist over this month is incredible.

    Id like to thank [[artist:dio-maxwelle|Dez]], not only for the moral support throughout this month of sheer insanity (god knows shes probably have an even harder time of it then I have!), but for also doing the absolutely fantastic cover art for me (and for saving my ass in the process by doing it!) You’re an absolute saint, ya crazy bint. Id like to thank not just my parents and my uncle- who not only gave their usual support, but really took to heart how important this project was to me- but also my extended family, who have also shown support for the project over the month. Seriously, you guys are great, and I could not possibly ask for nicer, funnier people to call my blood relatives (yes Les, even you’re pretty alright in my book.)

    And finally, thanks to all of you dudes over on Tumblr and Soundcloud for putting up with my month-long music spamming. Its been tough, but its all over now. Mostly.

    <i>Dio Maxwelle:</i> (sketch & inks of cover art)

    <img src="media/misc/the-12-tracks-of-christmas-2012-sketch.jpg" width="350" height="357">
    <img src="media/misc/the-12-tracks-of-christmas-2012-inks.jpg" width="350" height="349">

Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/silenced-without-a-trace-theme-of-clapham) / liner notes)

    The tenth track done for the 12 Tracks project; we're in the home stretch now!<br>
    Todays piece is another gift track (all the remaining tracks will be) done for a friend of mine who I've been through some very weird and uneasy times with this year, but who is nonetheless important to me. They're not only creative, but incredibly talented at both writing and drawing, and one of their ideas struck such a chord with me, that it lead to inspiring this track. There's definitely some shades of inspiration from [[artist:akira-yamaoka|Akira Yamaoka's]] work on [[artist:silent-hill]] here too. Also, at 65bpm, it's probably the slowest track I've done.<br>
    Stay ghetto, Terry. It's no pair of shoes, but I hope it impresses all the same.

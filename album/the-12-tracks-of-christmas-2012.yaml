Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/the-undersea-peanut-the-mean-beans-are-on-think-tank-patrol) / liner notes)

    I've been fascinated by the concepts of Mash Ups (the mixing of two or more songs together) and Mastermixes (the art of making a (usually long) track without a traditional verse-chorus-verse structure that usually seems more like multiple songs mixed together- or actually IS multiple songs mixed together), and partially due to not having enough time to make a longer, fuller track, I got my chance to attempt to realise that with what limited technology I currently have at my disposal. It's halfway between a (very short) Mastermix and a Mash Up and contains a large amount of original material, but it's a good start none the less. Hopefully the 14th's track will be a bit longer (permitting I don't have further technology problems and am not sick as shit on the 14th). Samples from The Goofy Goober Song, Dr. Robotnik's Mean Bean Machine, and Tank!

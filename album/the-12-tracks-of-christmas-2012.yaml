Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/that-fat-slim-boy-guy-makes-a-rather-daft-discovery-a-micromix-for-dio) / liner notes)

    And here we are, the last (OR IS IT?!) track for this year; another short'un (and a micromix at that), but by no means does that mean this track is insignificant. Far from it.<br>
    Well, it had to be done, didn't it? And it pretty much had to be Christmas Eve too, of course. We've been through some crazy times in the four or so years that we've known one another; some good, some bad, some amazing, and all of them worth it. I wouldn't change a single minute of my time spent on this earth since Christmas of 2008, if only because you've been so prominent in my life since that point that it isn't even funny. And I mean that.<br>
    We have our disagreements, but I know one thing we can definitely agree on is [[artist:daft-punk]] (mostly) and Fatboy Slim (completely), so those are the two subjects I picked for this mix. I realise I SHOULD by now know what your favourite tracks by each artist are, so I sampled some of my personal favourites (and, in the case of Fatboy Slim, favourites based on the CDs of his I could actually find). On top of the original material in the track, I sampled Harder, Better, Faster, Stronger, Crescendolls, High Life, and Robot Rock by Daft Punk, and Song For Lindy, Going Out Of My Head, Everybody Needs A 303, Ya Mama, and Weapon Of Choice by Fatboy Slim.<br>
    Thank you, [[artist:dio-maxwelle|Dio]], for being such an integral part of my life that you, for all intents and purposes, basically ARE me. Just American, shorter (hurr hurr), and you don't have annoying dangly bits between your legs. You're my sister, my best friend, and so much more. Here's to another four years of insanity, eh?
Crediting Sources: |-
    <i>Decon Theed:</i> ([Bandcamp credits blurb](https://103records.bandcamp.com/track/that-fat-slim-boy-guy-makes-a-rather-daft-discovery-a-micromix-for-dio))


Track: Emergency on Old Mother Earth (Countdown to White Day)
Duration: 2:26
URLs:
- https://103records.bandcamp.com/track/emergency-on-old-mother-earth-countdown-to-white-day
#Sampled Tracks:
# - Smokers Outside the Hospital Doors
# - The Racing Rats
# - Machine Gun (Portishead)
Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/emergency-on-old-mother-earth-countdown-to-white-day) / liner notes)

    The penultimate track. Can you believe it's just a couple of days 'til Christmas? I know I can't!<br>
    This track is dedicated to a friend of mine who, really, I met by pure chance. Some real "right place, right time" type stuff. In the time since we met (dear god, I think it was roughly two years ago!), we've become fairly close. I cop to not having always shown very well how much he means to me (in fact once or twice I know I've been kind of a dick), but the gods honest truth is I value him highly as a friend and a creative partner, and I really should make more of an effort to chat to him.<br>
    This song was done for one of this friend's fan projects- and, in fact, the fan project that actually got us to meet one another in the first place, a MOTHER fangame titled Old Mother Earth. In fact, that's why I picked that course to go down, it seemed the most fitting! The samples from favourite songs of ours (Smokers Outside The Hospital Doors and The Racing Rats by the Editors, Machine Gun by Portishead) are little extra bonuses. I didn't create this to actually be included in OME, and was more inspired by the general tone and direction of the story (or what I know of it, because even after two years I STILL don't know the full story!) and was structured to be like a "Welcome To The Worlds Of OME" type song. The title is also a reference to the Jamiroquai song "Emergency On Planet Earth", more or less because I could.<br>
    Keep going strong, Rec. I know you have your rough days, but I want you to remember that you mean a hell of a lot to many people, and that includes me.
Crediting Sources: |-
    <i>Decon Theed:</i> ([Bandcamp credits blurb](https://103records.bandcamp.com/track/emergency-on-old-mother-earth-countdown-to-white-day))


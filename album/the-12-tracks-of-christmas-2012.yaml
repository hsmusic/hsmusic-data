Track: Trip 2 Hemel [On a Santa Ting Mix]
Artists:
- Decon Theed
- J-MACHine
Duration: 4:48
URLs:
- https://103records.bandcamp.com/track/trip-2-hemel-on-a-santa-ting-mix
Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/trip-2-hemel-on-a-santa-ting-mix) / liner notes)

    And today marks the official start of the very first 12 Tracks Of Christmas project! The idea is that every second/even numbered day, all the way up to Christmas Eve, I will release a brand new track. Some will be Christmas themed, some will (at least) be winter themed, others might just be general tracks, and Ill be doing them under any and all aliases I work under. There might even be a remix or cover here and there!<br>
    For the first track this year, I decided to finish up a song I started a couple of weeks ago. Its a fairly simple number that is an intentional homage to the classic rave (tune and one of my personal favourite records), Trip 2 Trumpton. I had originally wanted to sample a kids show of some kind to keep in line with the homage, but technical issues got in the way. At the very least, I managed to get the track intro done (and yes, that is me speaking, albeit under a hi-pass filter). This will probably wind up being the longest of the 12 tracks, but that all depends on how busy I wind up being over the next month. As for the relevance to Christmas/the deal with the name; Hemel Hempstead is the name of a city a few miles away from where I live, and is where me and my folks/uncle have done our Christmas shopping for the last 3 or 4 years.
Crediting Sources: |-
    <i>Decon Theed:</i> ([Bandcamp credits blurb](https://103records.bandcamp.com/track/trip-2-hemel-on-a-santa-ting-mix))

    composed by [[artist:decon-theed]]

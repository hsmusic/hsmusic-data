Track: Survive (Like I Know You Can)
Artists:
- Decon Theed
- Piston Quints
Duration: 4:01
URLs:
- https://103records.bandcamp.com/track/survive-like-i-know-you-can
Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/survive-like-i-know-you-can) / liner notes)

    This one, admittedly, doesn't really have any relevance to Christmas, or the Christmas season per say. This piece of music in some ways could be considered to be what I think the mindset of someone that continues to be brave and face their demons, be they haunting memories of the past or even just the will to get up, might sound like- somewhere between happy and sad and yet both at the same time. ... Yeah, that sentence was in English I think. I drew inspiration from equal parts what I've seen in so many friends of mine, all of whom have their own demons to face, and my own experiences and battles with anxiety and depression (over the past year especially). The track was also inspired by the works of Underworld and [[artist:aphex-twin]], the tracks Best Mamgu Ever and Flim.
Crediting Sources: |-
    <i>Decon Theed:</i> ([Bandcamp credits blurb](https://103records.bandcamp.com/track/survive-like-i-know-you-can))


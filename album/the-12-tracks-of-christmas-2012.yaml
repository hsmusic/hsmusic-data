Commentary: |-
    <i>Decon Theed:</i> ([Bandcamp about blurb](https://103records.bandcamp.com/track/merry-glitchmas-my-best-friend-the-arpeggiator-comes-over-for-santa-day) / liner notes)

    The ninth track done for the 12 Tracks Of Christmas Project. Although not actually the first chronologically (or even the first composed), this is the first in a long planned series of tracks I've named the My Best Friend The Arpeggiator series, done solely under my [[artist:visor-jack|Visor Jack alias]]. These songs typically won't be very long, will be fairly minimalistic-ish type guff, and as the name implies rely on heavy use of arpeggiated rhythms. A lot of my work uses arpeggiated rhythms and synth lines anyway, but I ramp it up to 11 on these tracks on purpose, because I love the kind of looped sound it gives off. If you're unsure of what 'arpeggiated rhythms' means or it's use in electronic music, I'd say look it up; trust me, there's a 100% chance you've heard it used in a song, as even pop songs have made heavy use of it (especially 80s pop). Nothing too complex about this one, it's just a short, sweet, mechanical sounding dance-type number to tap your feet along with.
Crediting Sources: |-
    <i>Decon Theed:</i> ([Bandcamp credits blurb](https://103records.bandcamp.com/track/merry-glitchmas-my-best-friend-the-arpeggiator-comes-over-for-santa-day))


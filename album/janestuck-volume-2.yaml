    References<br>
    [["Savior of the Corrupted Lands"]] by Nexx Mowarek<br>
    [["Black Rose / Green Sun"]] by Malcolm Brown<br>
    "Showtime" by Malcolm Brown<br>
    [["Aggrieve"]] by Mark Hadley<br>
    [["Versus"]] by Toby Fox<br>
    [["Jane Dargason"]] by Clark "Plazmataz" Powell and Robert J! Lake<br>
    [["Cupcake Girl"]] by Liam O'Donnell<br>
    [["Jane's Theme"]] by David "Dirtiest" Dycus (dirtiestmusic.tumblr.com)

    <i>Lilithtreasure:</i> ([HSMusic Discord](https://discord.com/channels/749042497610842152/1353743089164095548/1371057573473816588), excerpt, 5/11/2025)

    so the references for Pure Breath / Tainted Light are listed in this order *[see above]*

    but listening to it, most of the motifs are in a different order, but I can't quite pick up where [[Cupcake Girl]] and [[Jane's Theme]] (and even [[Black Rose / Green Sun]]) are, but I feel like,

    - [[Versus]]
    - [[Jane Dargason]]
    - [[Showtime (Original Mix)]]
    - [[Aggrieve]]

    is right, cause that's the order they're heard in the song, but everything else is wishy-washy

    it has me considerably stumped (which is why my status for a while was like "🏠 stuck in leitmotif hell")

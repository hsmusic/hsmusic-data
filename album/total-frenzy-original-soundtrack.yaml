    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/fienal-boss))
    Final boss theme. The fienal confrontation is at hand.
    This is essentially a high-octane metal remix of the previously heard Fien’s theme. Same elements from that track are dialed up. The lead instrument is now zunpets. Hell yeah.
    Throughout the first half of the track you can very subtly hear the full melody of Eternal Pulse, which is another track i made for [[album:lofam5a2|an album]]. There is no real narrative reason for that, i just thought it would be cool. Riveting commentary, i know.

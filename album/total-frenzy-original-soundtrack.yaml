Track: Ja, Vi Avskyr
Duration: 1:01
Referenced Tracks:
- Ja, vi elsker dette landet
URLs:
- https://jebb.bandcamp.com/track/ja-vi-avskyr
Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/ja-vi-avskyr))
    Track that Fien plays on his organ before the final boss. This is actually just Norway’s national anthem but tweaked to fit on an organ - as we all know, while Fren is from the good country of Sweden, Fien is from the eeeeevil country of Norway. As such, he is playing his homeland’s tune.
    The reason this track is called that is because the original national anthem’s name is “Ja, vi elsker dette landet”, or “Ja, vi elsker” for short, meaning “Yes, we love this country”, or “Yes, we love” for the short version. This track, however, is titled as something a bit more appropriate for Fien - “Ja, Vi Avskyr”, meaning “Yes, We Hate”.
Referencing Sources: |-
    <i>Jebb:</i> ([Bandcamp credits blurb](https://jebb.bandcamp.com/track/ja-vi-avskyr))
    Built on a midi taken from BitMidi (https://bitmidi.com/national-anthem-norway-mid)

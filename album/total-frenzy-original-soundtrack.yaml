Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/skeleton-metal))
    Boss theme for the Skeleton. Hey, the game needed a mandatory skeleton, why not throw in a superboss at the end of the game.
    This has a BUNCH of references jam packed into it - all about skeletons. Well, skeletons *and* Joel’s music. I tried to fit in as much as would be reasonable to fit into a track like this. For more details on everything that was referenced you can check the references list. One i am especially proud of is the final section with Earth Boiling Dystopia, which is a track i enjoy very much. Unfortunately, this section didn’t appear in the actual stream as that build of the game finished an unfinished version of the track, but now you can hear it in its full glory!
    Additionally, this is the longest unlooped track in the game. As i said, i tried to go completely ham for this one and just have fun with it. I hope you have as much fun listening to it as i did making it.

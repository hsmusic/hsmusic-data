Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/fren-zone))
    The main theme! This track went through about 4 iterations actually, which isn’t really common for me, but i ended up settling on this chill, 90s-esque one. I think this is still one of the most professionally sounding tracks i have made, and i am proud of it.
    The melody of this became a very recurring motif throughout the rest of the soundtrack, so keep your ears peeled… (rather weird phrase, no? I do not want to peel my ears. I want my ear skin intact, personally.)
    As many people noticed, i snuck a little bit of the deltarune theme at the very end of the organ solo (which i noticed a lot of people calling the “freedom motif”, and, no, it’s not that, it’s the main theme. But i get why people think it would be that, it’s used a lot lol). This has no thematic reasoning and was just added there for fun. Sorry, no deep lore implications here!
    I added a sample of Hot Dad’s Fren song, which ended up also turning into a motif in its own right. I mean, it’s one of the Fren songs, so no reason why it shouldn’t be in here. I struggled with figuring out the key change for a bit while putting together the track, but it ended up really good, so, hell yeah!
    Lastly, for the album-only ending of the track i added a nod to [the little solo Joel attempted to play on his guitar at the end of the song](https://youtu.be/NLEkxIu_AI4?t=2601). I am thankful for the honor, and that little gesture is now in the song itself!
Referencing Sources: |-
    <i>Jebb:</i> ([Bandcamp credits blurb](https://jebb.bandcamp.com/track/fren-zone))

Track: Colleague Location
Duration: 2:25
Referenced Tracks:
- Fren Zone
URLs:
- https://jebb.bandcamp.com/track/colleague-location
Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/colleague-location))
    Another bonus track.
    This is a combination of several original attempts at the main menu theme before the one that’s used in-game finally came together - fast but with soundfont drums and slow with sampled drums (this is fast with both drums).
    In fact, there was initially supposed to be a title screen theme and the hub menu theme, but the title screen theme never got finished and the hub menu theme also became the title screen theme. The title screen theme was supposed to be much more high octane than the hub theme, as you can see in this track.
    The only thing i actually added to this while working on the album is the subtle [[artist:hot-dad]] [[“fren”]] motif in the back of the second half of the track, since i felt like it was kinda empty.
    I placed this track last in the album since i thought it’d be appropriate to start on the main and most iconic track of the game and end on the prototype version of it.
    If you’re listening to this in album order, you’re done with the album now! I thank you a lot for checking the ost out, and thank you for listening!
Referencing Sources: |-
    <i>Jebb:</i> ([Bandcamp credits blurb](https://jebb.bandcamp.com/track/colleague-location))
    References [["Fren Zone"]] by [[artist:jebb]]

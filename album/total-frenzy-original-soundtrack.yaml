Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/splinter-scuffle))
    The forest fight theme. I made the bassline for this extra heavy by layering the lighter and faster slap bass with slower and heavier acoustic bass.
    Considering this is a fight with much lower stakes and a much calmer context, i decided to make it less action-y and more retrospective in its vibe.The lead chiptune instrument is layered with an accordion for a harmony.
    At the last section of the track before the loop you can hear a very subtle chiptune section playing an approximation of the first part of LEGO Racers 2 OST - Bonus Game, which is commonly used as Fren’s theme. Thought it would be only right to sneak it in the game somehow.

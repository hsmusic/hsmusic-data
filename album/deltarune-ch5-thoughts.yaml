Commentary: |-
    <i>Toby Fox:</i>
    For this song, I arranged a demo of the first dozen seconds, and sent that alongside a few minutes of me playing the piano and singing. I also provided a text description of each part. [[artist:camellia|Camellia]] did all the actual work beyond that. Lol. Anyway the chiptune demo I gave him was originally just the first 6 seconds of this plus the melody but I added some more just now to make it worth listening to thanks.

Commentary: |-
    <i>Witch's Cadence:</i> ([Bandcamp about blurb](https://witchscadence.bandcamp.com/album/the-witchs-archives))

    This "album" is a collection I have gathered of some of my favorite unreleased/vaguely published songs that I've made since 2022. It has original songs for scrapped projects, silly one offs, some fan music, and a couple of covers as well! All of these are full quality versions of these songs that I still had laying around my hard drive. Please enjoy this small piece of my journey, and perhaps someday in the future I will find and add more older songs for you to enjoy here.
Crediting Sources: |-
    <i>Witch's Cadence:</i> ([Bandcamp credits blurb](https://witchscadence.bandcamp.com/album/the-witchs-archives))

    Album art done by the wonderful [[artist:napster]]!

Commentary: |-
    <i>Devi McCallion:</i> ([Bandcamp about blurb](https://blacksquares.bandcamp.com/album/prince-of-dogs))

    Hi!! These are some songs that I made which are based on the hit webcomic Guidestuck, a fan-work based in on the supermonolithic Homestuck (which is also a webcomic if you didn't know)!!

    Three of these songs are featured on [[album:guidestuck-volume-one|Guidestuck Vol .1 (the first Official Guidestuck Soundtrack)]], but three of these songs are completely new never-before-heard masterpieces!! It would suck if you missed out on them so like, don't!!

    Thanks so so much to [[artist:missy]] for the super awesome album art!!

    Read Guidestuck<br>
    https://mspfa.com/?adv=932&id=1

    Listen to the entirety of the super awesome Guidestuck Volume 1<br>
    https://guidestuckofficial.bandcamp.com/album/guidestuck-volume-one

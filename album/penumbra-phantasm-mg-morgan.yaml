Commentary: |-
    <i>MG_Morgan:</i> ([YouTube description](https://youtu.be/2WLkqDfRKao), excerpt)
    Yes, the actual video sucks. I had no ideas -_-

    Most of you may know that [[track:penumbra-phantasm]], an unreleased [[artist:toby-fox]] song originally composed for Homestuck, is NOT* coming to Deltarune. Well... I think it almost definitely is! The main reason? The name is too cool to not use. ;)<br>
    (Jokes aside, it makes perfect sense, and there's literally already that motif in [[track:the-holy]] that works as the perfect replacement...)

    Working on this song, I wanted to include motifs that actually meant something and worked contextually in the game. We don't know much about the Roaring right now, but it's probably gonna end up happening around the end of Chapter 7, and that's basically what I aimed for the song to be for. Whatever happens, this song is almost certainly going to be played somewhere important, and so I wanted to include the most important, central motifs to the game and the prophecy - THE HOLY, [[Don't Forget]], [[track:dark-sanctuary]], [[track:guardian-deltarune]], [[track:the-legend]], to name a few. And, obviously, the Penumbra Phantasm ones, or as close as I could get, anyway.

    But yeah. I know the mastering isn't perfect, and there's definitely room for improvement here and there, but I'm pretty happy with the finished product!

    I hope you enjoy :D

    (And, happy 10th anniversary, UNDERTALE!)


Commentary: |-
    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/arcjecs-theme), 8/13/2019)

    Track 2 on the new Vast Error album "Catch 322," a collection of Alterniabound-esque jams that may be seen in future walkarounds and flashes! I started this song back in April 2019, when Austin approached me with an idea to make a character theme inspired by [[artist:anamanaguchi|Amanaguchi's]] [[track:the-dark-one-scott-pilgrim|"The Dark One"]] off the Scott Pilgrim video game OST. The original track is an intense rock-chiptune fusion packed full of energy, and I tried to harness it best I could on this moody theme for everyone's favorite boy.

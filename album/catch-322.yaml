    Masafumi Takada - [[track:danganronpa|Dangan Ronpa!]] from Danganronpa: Trigger Happy Havoc<br>
    Jukio Kallio - [[Where the Guns At]] (ft. Joonas Turner) from Nuclear Throne<br>
    Jukio Kallio - [[Venus Mansion]] (ft. Doseone) from Nuclear Throne<br>
    The Edgar Winter Group - [[Frankenstein]]<br>
    "Say what again!" dialogue from Pulp Fiction<br>
    Laugh SFX from New Danganronpa V3: Killing Harmony<br>
    Arianne - [[Komm, süsser Tod]] from The End of Evangelion<br>

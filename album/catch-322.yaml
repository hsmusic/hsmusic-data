Commentary: |-
    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/minute-to-win-it), 8/13/2019)

    Track 1 on the new Vast Error Music Team album "Catch 322," a collection of Alterniabound-esque jams that may be seen in future walkarounds and flashes! I wrote three tracks for the album; this one was the last I started but the first I finished. It was born [[track:home|out of a jam session during the production of Home]] and I worked at it over the course of June 2019. I wanted to make a fast-paced battle theme to switch things up from my slower ambient-oriented tracks.

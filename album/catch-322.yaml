Commentary: |-
    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/murrits-theme), 8/13/2019)

    Track 9 on the new Vast Error Music Team album "Catch 322," a collection of Alterniabound-esque jams that may be seen in future walkarounds and flashes! This track was the first I started but the last I finished for the project. I laid the first samples down at the end of January but, after making several other tracks in the interim and battling sickness in the summer, Murrit's mashup-heavy funk jam was only finished in the middle of August. I hope it was worth the wait!
Referencing Sources: |-
    @@ [Bandcamp about blurb](https://vasterror.bandcamp.com/track/murrits-theme) / [SoundCloud description](https://soundcloud.com/splitsuns/murrits-theme)

    Contains samples from:

    DJ Shadow - [[Best Foot Forward]]<br>
    "It was me all along" dialogue from Raw Is War<br>
    "Who the hell are you?" dialogue from The Simpsons S2E10 - Bart Gets Hit By a Car<br>
    Lyn Collins - [[Think (About It)]]<br>
    Vanilla - [[track:summer-vanilla|Summer]]<br>
    "There's only one thing to do at a moment like this: strut!" dialogue from The Simpsons S6E7 - Bart's Girlfriend<br>

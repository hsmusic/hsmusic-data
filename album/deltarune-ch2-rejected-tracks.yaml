Commentary: |-
    <i>Toby Fox:</i> ([UNDERTALE / DELTARUNE NEWSLETTER: ISSUE 7 - Autumn 2024](https://toby.fangamer.com/newsletters/autumn24/), excerpt)

    Although it's technically UNDERTALE's anniversary, I consider this day to be a celebration of DELTARUNE, as well. Sorry guys, you have to share a birthday party this year…

    Since it's been a while since Chapter 2's release, please allow me to share some materials from its development! I hope you enjoy it!

    <i>Toby Fox:</i> ([CHAPTER 2 REJECTED TRACKS](https://toby.fangamer.com/interviews/chapter2_music/))

    <img align="center" src="media/misc/music-deltarune-ch2-rejected-tracks.png" width="450" height="370" inline>

    Creating music first can be a useful way to figure out the identity and tone of a boss or scene. However, ideas and characters change, and those initial ideas don't always end up working out…

    So, here's some rejected tracks from the second chapter!
---
Track: Power of NEO (Unfinished)
Artists:
- Toby Fox
Duration: '2:42'
URLs:
- https://toby.fangamer.com/assets/interviews/9th/music/power_of_neo_unfinished_wip.mp3
Referenced Tracks:
- Power of "NEO"
Commentary: |-
    <i>Toby Fox:</i> ([CHAPTER 2 REJECTED TRACKS](https://toby.fangamer.com/interviews/chapter2_music/))

    <b><center>Power of NEO Unfinished</center></b>
    <center>♪ Power of NEO (Unfinished)</center>

    <audio align="center" src="/media/misc/archive/power_of_neo_unfinished_wip.mp3"></audio>

    After creating UNDERTALE, one of my goals for DELTARUNE was for players to finally be able to challenge a "real" version of Mettaton NEO that didn't just end in one turn. For that purpose, I actually created a few music mockups for an extended version of [[track:power-of-neo|Power of NEO]].<br>
    There's even another one from 2016 (lol)

    … Unfortunately, try I might, I could never create a full-length version of the song that I was satisfied with. Eventually, the boss concept evolved to involve Spamton, and with that, the music changed as well.

    I still like the last half of the song. The guitar section was inspired by Brandish's song ["Ending 2"](https://www.youtube.com/watch?v=CbW1vBBlEMc). All of it is pretty placeholder though.<br>
    It's still fun to imagine fighting something to this... Though, if I was given another opportunity to extend [[track:power-of-neo|POWER OF NEO]], I would probably do something different.

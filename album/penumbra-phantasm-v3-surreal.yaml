Commentary: |-
    <i>surreal:</i> ([Final Boss Animatic video description](https://youtu.be/fWH8jmOyPFw))
    The final one.

    Farewell.

    ===========================================================

    As you can tell I have been a little busy...

    I started this project shortly after uploading ["Savior of the Waking World"](https://youtu.be/v7LtIAFHFs0), and I am glad that we were able to finish it and make it real. I am very proud of this, so I sincerely hope that you all will enjoy it.

    Although [[track:penumbra-phantasm|Penumbra]] might officially be dead, I hope that this serves as a good send-off to it. I wouldn't be where I am today without it.

    In the following days I will be uploading the standalone music of this along with some nice extras as an album of sorts, so look forward to that as well.

    Happy Halloween and Happy 7th DELTARUNE Anniversary.

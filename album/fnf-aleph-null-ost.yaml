Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/falmeamaybe))
    Unused WIP track from the FNF: Aleph Null mod.

    For a while i wanted to also do a Falmea week for the mod, it being set in a club. I felt like heavy trap music fit her, so i tried to go for that sorta feel.
    This... this just sucks though. I am sorry you had to hear this track, i mostly only dug this up for archival reasons lmao. For the listener's sake i adjusted the mixing a bit so that your ears wouldn't bleed, but otherwise i left it in as bad of a state as i left it back then. As you can see by this track the idea of the Falmea week didn't really go anywhere beyond some brainstorming.

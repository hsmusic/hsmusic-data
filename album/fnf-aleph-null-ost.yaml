Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/menu))
    Main menu theme from the FNF: Aleph Null mod.

    Main menu theme for the mod, it being a mix of the regular FNF menu theme and the main Aleph Null theme... and also a ton of other tracks. I tried to cram in as many AN melodies as possible in the end medley.
    I also decided to add bitcrushed [[artist:insane-clown-posse|ICP]] vocals since i felt like it added something to the menu. [[artist:clockworkreapers]] said that it wouldn't really make sense since it is set far after the events of the [[artist:insane-clown-posse|ICP]] and double presidents etc.... and yeah, i do agree, lore-wise it's an absolute wreck - at the time i really wanted to add more Homestuck stuff to the OST, as you can hear by the melodies from the webcomic being scattered across the soundtrack, even though it wouldn't really make sense. Did it make things better or worse? Up to you really.

Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/wardchaotic))
    Unused WIP track from the FNF: Aleph Null mod.

    I wanted to have WARD go absolutely batshit insane and then it sloooowly fades out as Sauron sings the main melodies and then there's a reprise and yada yada. That sorta cliche stuff. However, as more and more updates released and more and more of WARD's personality got revealed, i realized that making WARD a killing machine in his track would make no sense whatsoever. That is also partly why the whole idea got canned - how would one even rap against an unfeeling machine?

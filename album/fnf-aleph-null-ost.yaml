Track: 'Null'
Suffix Directory: true
Additional Names:
- Doomed (original name)
Duration: 2:25
Has Cover Art: false
Referenced Tracks:
- English
URLs:
- https://soundcloud.com/jebbjabroni/null
Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/null))
    Vocal track from the FNF: Aleph Null mod.

    3rd track in the week. This one took me SO long to make - several months i'd say? Granted, now i have made tracks over a longer period of time but in my memory it took an eternity to make this.
    Looking back, i'd say i went a biiiiit over the top. Maybe not a bit. It's just that i always wanted to make a track like this at that point, so i wanted to make it whether it fit Sauron or not. Not sure if dnb metal is what was intended for him by [[artist:clockworkreapers|Clock]], buuuut... yeah lmao.
    Initially, this track was called Doomed (after doomed timelines), and it was called that over the course of making the entirety of it, only being given its new name during release.
    For some reason i decided to add a lot of Lord English stuff - the old name of the song being named after doomed timelines, his roar being sampled, his melody being used... I imagine i was trying to add intensity to the track via that, even if it didn't fit the lore of the mspfa.

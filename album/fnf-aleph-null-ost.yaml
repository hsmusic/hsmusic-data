Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/downpour))
    Vocal track from the FNF: Aleph Null mod.

    1st song in the week, and, funnily enough, the last one i made timeline-wise! I feel like this track captures the vibe of Sauron the most out of the three, however it doesn't really lend itself to invigorating gameplay.
    The naming of this track was a bit of a shitshow. First it was Rain, then i changed it to Petrichor, then i realised that i had already made a track made Petrichor (Sauron's theme) and updated the mod like a year later with a new name for the track. And now i realise that i should have kept the name as Rain from the start. Sigh.

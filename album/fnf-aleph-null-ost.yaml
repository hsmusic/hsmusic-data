Track: NULL Restored
Duration: 1:39
Has Cover Art: false
URLs:
- https://soundcloud.com/jebbjabroni/null-restored
Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/null-restored))
    Unused vocal track from the FNF: Aleph Null mod.

    So, this track has had a pretty interesting history. It was made very, very early on, and at first it was supposed to be almost 2 times as fast, and be the third and final song (That's why the name is Null, same as the final 3rd song). Then i decided to slow it down for fun, and noticed that it worked even better with the new speed, so i decided to do a 180 and make it the 1st song instead. However, after finishing it, i realized that it would not be fun to play at all - constantly repeating patterns followed by very slow notes followed by constantly repeating patterns... yawn. So, after a bit of trying to fix the vocals and failing, i decided to scrap the track altogether and replace it with another track (Which later was chosen to be [[track:downpour]]).
    For this release of the OST, i decided to restore the track so that you can finally check it out! So, hope you enjoy it.

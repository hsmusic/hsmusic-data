Commentary: |-
    <i>ruby:</i>
    \* Stage lights are blaring.


    What started as a simple transcription and recreation of the [[track:power-of-neo-unfinished|scrapped, longer Power of NEO]] [[artist:toby-fox|Toby]] worked on for DELTARUNE, turned into an 11 minute-long anthem for an exhausting fight between an immovable object and an unstoppable force. Basically, "What if Mettaton NEO actually put up a fight?"

    The fight drags on, tension rises. Those who remain watch on in fear and amazement. The fate of the world is at stake.


    00:00 - As the smoke dissipates, the silhouette of the robot becomes visible.
    00:39 - Action! The fight is on. KILLER ROBOT vs. UGLY LITTLE CREATURE
    02:25 - It's not even clear anymore whether this is a fight to the death or a dance battle.
    02:52 - The fight gets more and more intense, Mettaton NEO blocks the monster's attacks, the monster perfectly dodges Mettaton NEO's attacks.
    03:58 - They are perfectly in sync. Like a well-oiled machine. But the robot knows exactly what is at stake.
    04:51 - Now it's time to get serious. With the power of those who failed to stop you, Mettaton NEO's attacks intensify!
    06:50 - Over in the capital, a skeleton is watching the broadcast. It'll be a bad time if Mettaton fails now...
    07:17 - Mettaton slips up! He makes one wrong move, the monster immediately takes advantage and finally lands a hit.

    \* ...

    07:40 - Lights start flashing in sync with the beat.

    \* ...

    \* Didn't...

    \* Didn't you know...?

    \* DIDN'T YOU KNOW NEO IS FAMOUS FOR ITS HIGH DEFENSE!?

    08:06 - Despite everything, Mettaton NEO persists. More determined than ever. He can't give up now, everyone is counting on him. He is the star.

    10:20 -










    huge thanks to [[artist:yuudii|yuuDii]] for allowing me to use her [[track:super-killer-robot|Super Killer Robot]] track! when i thought i got everything out of [[track:power-of-neo|Power of NEO]] that i could get, she dropped it and told me i could use it for my track if i wanted to. i ended up making an entire extra phase!

    also thanks to [[artist:ender|EnderSlime]] for helping out with the song title, in addition to the awesome art!

    <i>Ender:</i>
    I like Mettaton. We all know this about me.

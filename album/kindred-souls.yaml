Commentary: |-
    <i>tsundereCat [TC]:</i>
    My take on what an extended version of "[[track:the-legend-ch4|The LEGEND...?]]" could sound like. The title not only comes from the fact that "UNALTERED" is an anagram of "DELTARUNE," but also from "The LEGEND...?"'s name in the game files, "legend_altered.ogg."

    <i>allahrts:</i>
    From the beginning star-nomad and I knew we wanted to do a collaborative piece together, but we weren't sure which track. The second we heard unaltered though, we both knew immediately that we wanted to work on this piece together. [[artist:star-nomad|Star]] and I hopped into a call together and started sketching immediately. star-nomad drew the rough, and then I was handed the file to work on. Stained glass art isn't something I've ever done before. I must've spent hours just looking at stained glass pieces, seeing how glass worked. As I went I progressively added more and more glass windows. What started as five windows quickly became more. Throughout the whole thing I was gettting feedback from star. After nearly 3 days of constant work I finally handed off the piece to Star, finishiing my role in the piece.

    <i>star-nomad:</i>
    man this album's really been testing my painterly skills, huh? i was blown away by the finished stained glass, so naturally i had to attempt to match her top tier work!

Commentary: |-
    <i>ruby:</i>
    I originally intended to touch up an old remix of the DELTARUNE main theme I had done back in 2022.

    Then, the DELTARUNE Nintendo Switch 2 trailer dropped, which used [[track:deltarune-nintendo-switch-2-announce-trailer-music|an arranged version]] of the [[track:game-main-theme-piano-sketch|piano demo]]. I've always been a huge fan of the main theme demo, and a little disappointed it never made it past the demo stage, so hearing a more produced version for THE DELTARUNE release date trailer, it definitely gave me some feelings.

    So, instead of including an old remix, I re-transcribed the song, including the additional strings and EarthBound piano.

    (someone bug me whenever this commentary makes it onto the wiki, I can include some wips and screenshots.)

    at some point, I decided to increase the tempo, add guitars, basically make it way more J-Rock-like. I really liked how it sounded so I kept working on it.<br>
    I decided I wanted to make it a full-lenght song, and even write lyrics for it. Great ideas, but let's first try to finish a demo.

    I had the full structure in my head, I knew I wanted to use the lyrics of [[track:dont-forget|Don't Forget]]. then, I knew I wanted to have cool imagery in the lyrics, some lyric concepts I wrote down in the moment made it to the final song even!

    I really had a concrete vision, at the time I literally said:<br>
    "I can't stop thinking about it, all I know is i have to make this song a reality. now I know how [[artist:toby-fox|Toby]] felt after his fever dream, but I was awake when I conjured this concept. I need to make it.........."

    After Chapters 3+4 released, I did end up updating the bridge section to include the [[track:guardian-deltarune|GUARDIAN]] melody. Before, the bridge always felt like it was missing something. The overall arrangement was done, I could focus on writing guitar parts, and mixing.

    I'm not a guitarist, but I tried to make it realistic, something [[artist:jun-senoue|Jun Senoue]]-like or something.

    As the lyrics were slowly reaching completion (there were a lot of lines where I couldn't think of anything and they only really came together last minute lol), [[artist:jebb|Jebb]] was just like:

    "Ok but consider<br>
    Miku for vocals.<br>
    Or teto."

    now, I hadn't done much vocaloid or synthv stuff before, I had only played with [[artist:hatsune-miku|Miku]] a bit earlier this year, but it was the perfect suggestion. I also had been listening to some [[artist:jamie-paige|Jamie Paige]] music with my partner, specifically Constant Companions, which has [[artist:kasane-teto|Teto]] on various tracks. so, I decided I would just try it...

    and it... worked!

    so the last month of working on this song was me finishing the guitars, finishing the lyrics, and programming Teto.

    that's awesome and everything, I am very proud of what I managed to achieve with this song. there are parts of the production I think are lacking, but considering I also had to put time into stuff like writing lyrics, I think it was a fair trade-off.

    maybe some day I will make a version with live vocals, or maybe guitar or something... that'd be cool!


    despite all this, I still didn't have a title. I just called it the "deltarune anime opening", which isn't really a satisfying title for a track with this much effort lol.

    so then I saw the final art by [[artist:selan-pike|SelanPike]], which said it...

    デルタルーン

    it's just the Japanese name for deltarune, but that's just perfect for a hypothetical anime opening for the game, so I adopted it as track title too.

    I really hope you enjoy the track! and, if you read through all this, I hope this was a neat insight into the song's creation!

    PS        as the title is デルタルーン, if you want to translate or "localize" it to English... as it's just the Japanese name for the game, it's just "DELTARUNE" lol

    <i>Selan Pike:</i>
    Originally I was going to do the usual jokey UwU school anime thing, but the more I looked through inspo images, the more I wanted to base it on 90's fantasy anime. In the end, I based this image heavily on a specific manga illustration from Magic Knight Rayearth, which was a huge inspiration to me when I was a kid.

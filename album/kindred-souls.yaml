Commentary: |-
    <i>Erik Scheele:</i>
    One of the initial ideas I had for this album was "hey, what if I did [[track:descend|Descend]], but I crammed in as much of Deltarune's incidental motifs as possible, instead of any main motifs?". Wouldn't that be a fun throwback, I thought. Wouldn't that be so silly.

    And then the anime news dropped and it was like well okay fine, this HAS to happen now.

    Anyway, I'm sure none of these random motifs will turn out to be anything really important later or anything. What would the chances be of that!

    Thanks to the folks that put up with pestering about mixing and mastering, and Sartorially for the track art!

    <i>Sartorially:</i>
    "[[track:upward-movement-dave-owns|Upward Movement]] but make it Deltarune?" By the Divine Hogs, thy will is done. — This is a somewhat important illustration for me! Originally, this WAS going to be a redraw of Dave ascending the stairwell, featuring Kris! But I realized that it felt like an ever-elevating escape from the narrative of Deltarune itself—a Susie's Idea if you will. Plus... Let's be honest: replacing Lil Cal with Kris just made so much sense,and adding Noelle / Ralsei / Lancer just made MORE sense. This piece is striving to illustrate Susie's unbreakable will, her sense of justice, and her hope pushing through the narrative veil. Ganbatte, Susie!

Track: Echo Flowers
Artists:
- Rose Gray
Contributors:
- Rose Gray (clarinet)
- Melissa Lank (cello)
- Neil Ren (piano)
Duration: 17:06
URLs:
- https://unofficialmspafans.bandcamp.com/track/echo-flowers
Cover Artists:
- Circlejourney
Art Tags:
- Frisk
Referenced Tracks:
- Waterfall
- track:ruins-undertale
- His Theme
Commentary: |-
    <i>Rose Gray:</i>
    Echo Flowers was written for the 2025 fan music album Kindred Souls, published in September 2025 by the Unofficial MSPA Fans in commemoration of the 10th anniversary of the video game UNDERTALE by [[artist:toby-fox|Toby Fox]]. The piece depicts the above conversation from the game, overheard by the protagonist in passing through titular echo flowers amidst the deep blacks and shining teals of the Waterfall area. The conversation is one of yearning, of wanting freedom, of wanting a better life for you and your loved ones; it is one of hope, of imagining a better life, of imagining a world that has moved beyond war and beyond strife; and it is one of connection, of vulnerability, of sharing your hopes and dreams with those you love.

    This tone poem is in three sections. First, an atmosphere of resignation is established. Yearning is present, but it has no release, leaving it to first softly groan before building to a great pained wail. Then, hope emerges, and the passersby’s imaginations bloom into a beautiful world beyond the gloomy caverns of Waterfall. This middle section briefly transforms into fear and despair at the thought of such a world never coming to fruition, but hope ultimately perseveres. The final section is solemn once again, a return to reality, though it is not without one final note of hope, indomitable and ever present hope.

    It should be noted that the themes in Echo Flowers are based on those in the [[album:undertale-soundtrack|UNDERTALE soundtrack]], composed by [[artist:toby-fox|Toby Fox]].

    <i>Circlejourney:</i>
    It was a privilege to illustrate this piece! Waterfall is one of my favourite areas of the game and I feel this tone poem gives it a lot of depth. I wanted to illustrate a piecefull of flowing lines and whirling clouds over a field of flowers to evoke the piano cadenzas and the piece's melancholy yet hopeful atmosphere.

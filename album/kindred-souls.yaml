Track: Soar Like an Ego
Artists:
- Jebb
Duration: 2:02
URLs:
- https://unofficialmspafans.bandcamp.com/track/soar-like-an-ego
Cover Artists:
- star-nomad
Art Tags:
- Glyde
Referenced Tracks:
- Catswing
- Mysterious Place
Commentary: |-
    <i>Jebb:</i>
    So, tell me for a second. WHY is Glyde THE only one of the Kickstarter bosses to not have a boss theme? Muffet has one! I mean, even So Sorry has one! Why does Glyde for some random reason not get a boss theme when all the others do?? Like, his spawn location gets a completely unique atmospheric track ([[track:mysterious-place|Mysterious Place]]) but his actual fight doesn't? What?? Why?? Glyde is COOL and RADICAL and he does NOT deserve this injustice!!!

    I decided to fix that.

    Anyways. The inspiration for this track was in big part [[track:gamebro-original-1990-mix|GameBro (Original 1990 Mix)]] and [[track:catswing|Catswing]]. You can hear the GameBro inspiration most in the duty cycle and the Catswing inspiration in, well, the completely unaltered Catswing motif.<br>
    Actually, i remembered that i was advised to at least tweak the motif a bit to not make it blatantly Catswing but i completely forgot to do that. Whoops, oh well. Let's just pretend that Catswing actually originated in Undertale as part of Glyde's totally real boss theme. Yeah.

    Also, said Catswing motif is played by SGM's Comp Clav, which is the same instrument that plays the "[[track:sans|sans.]]" lead. You figure out the lore implications.

    I tried to make the track more "sleazy gamer cool" than "jazzy villain" coo (thus the GameBro inspiration) but the muzes lead me more into the 2nd direction. Must say, i don't regret it! I feel like it channels enough of both energies to work just fine.

    I am a big fan of how the drums ended up sounding in the last part of the track, the additional percussion layered on kicks and snares adds some very nice texture to it.

    Additionally, thanks a lot to [[artist:star-nomad|star-nomad]] for making track art for this literally like half a week before the deadline! It's the same idea i was envisioning doing for the piece, just so much better executed than if i were to try to do it myself. Also thanks to Tavvy for coming up with the wonderful wordplay for the track's name. If not for him, it would have possibly still been called glyde2.

    <i>star-nomad:</i>
    inspired by that one crown zenith lumineon alt art. if you know, you know. (also you're very welcome, [[artist:jebb|jebb]]- this one was a ton of fun to do and i really wanted this track to not be stuck in art limbo. i'm glad we had the same idea for it)

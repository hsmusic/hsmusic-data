#Commentary: |-
#    <i>Unofficial MSPA Fans:</i>
#    ~[[album:jpeg|.jpeg]]~ 𝓕𝓸𝓷𝓭𝓵𝔂 𝓡𝓮𝓰𝓪𝓻𝓭 𝓘𝓵𝓵𝓾𝓼𝓽𝓻𝓪𝓽𝓲𝓸𝓷 is a concept album: the team's artists draw some art and the musicians have to make music based on that art, instead of the usual other way around.
#
#    <i>tempest2k:</i>
#    i like it
#
#    <i>Circlejourney:</i>
#    Can it be? After a year and a half in the making, the "Art First Album" is finally out?
#    Typically at UMSPAF, musicians produce the music first, then visual artists illustrate every track. For this album, we flipped the script: developing it in the same pattern as [[group:canmt|CANMT's]] [[album:jpeg|.jpeg]], the artists made the illustrations first, and then musicians created tracks based on them.
#    The album began work on 23 September 2023. 568 days later, it is finally out in the world. This thing's old enough to walk at this point, but I promise the wait wasn't for nothing. It has some of the best fanmusic I've heard outside a LOFAM (and I'd go so far as to say it rivals a LOFAM in quality).
#    So, after that protracted development period, I'm beyond delighted that the wider world is finally getting to...
#    **Fondly Regard Illustration**.
#
#    <i>Circlejourney:</i>
#    Many thanks to all our <b>artists and musicians</b> for contributing their talents to this album over the course of the past year, and to <b>our mastering team</b> for bringing the sound of the album together. And thanks go out to <b>the manager team</b> for coordinating this album, and <b>Makin</b> specifically for putting together the Bandcamp page, collating the art & music files, and setting up this album booklet. We made this hapen.
#
#    <i>Makin:</i>
#    Conditional thanks to all our <b>artists and musicians</b> as long as they never, ever, ever, ever make a <b>SLOT ALBUM</b> again. Even this one was too close.
#    Slot albums slow things to a crawl because people drag their feet on picking or finishing that one <b>last track</b>, holding everyone else back... if you elect me as <b>UMSPAF president</b>, I will lobby the <b>United Nations</b> to make freeform albums mandatory. Thank you.

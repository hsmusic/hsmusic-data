Art Tags:
- Frisk
- Final Froggit
- Whimsalot
- Madjick
- Astigmatism
- Knight Knight
Referenced Tracks:
- CORE
- Gaster's Theme
Commentary: |-
    <i>Jebb:</i>
    I really like Carpenter Brut's stuff. Like, it's REALLY good. At the time of writing this commentary, i have semi-recently checked out all of their non-soundtrack albums. A big reason for me doing that was because when this album rolled around, "[[track:core|CORE]] but in the style of a Carpenter Brut track" was one of the ideas i had come up with. This was the result.

    I felt like Brut's heavy, electronic, very rhythmically straightforward style fit Core - it's a track for a "final stretch battle gauntlet" after all, the area putting you up against the underground's toughest monsters, so it makes sense for it to fit an intense style.<br>
    (Actually, that being said, i feel like [[artist:ender|EnderSlime]]'s wonderful cover art made for this track reflects that idea very much! A literal wave of enemies isn't something to scoff at.)

    A lot of the effects and practices were actually taken directly from a previous Brut-styled track i did for an mspfa. I assume this is a thing that a lot of composers do frequently, definitely was a new thing for me though.

    I actually intended on using one of the basslines for a different track which may or may not come out at some point, even considering cancelling this track to focus on that one instead. However i felt like this track was close enough to being finished compared to that one for it to not be worth cancelling this one. Glad that i didn't! Not like there can be enough Undertale tracks for the Undertale anniversary album.

    Lastly, i wanted to say thanks to Zumi's vgmdb CORE midi for assisting me with putting together a lot of the foundation for this track!


    And, as always - Beware of the man who speaks in hands.

    <i>Ender:</i>
    Carpenter Brut is… it's weird. I've never played a single game he's ever done music for. But one day my best friend, my friend group's longtime DM, had a brand new combat playlist for us, and it was filled with the coolest tracks we had ever heard. We were all instantly obsessed. She uses it for particularly straining or important battles, so it's special and memorable when we hear his music. It's strange having someone's work affect you so much, completely separated from the context in which it was made. So here I am, making track art for an Undertale remix that emulates his style. Ship of Theseus type shit.
---

Commentary: |-
    <i>Jebb:</i>
    DON'T YOU SEE? THE MISSING SISTER. WE HAVE FINALLY FOUND HER.

    ...WHY AREN'T YOU SMILING..?

    ---

    This track (my last track on this album) was very much inspired by the undead "true form" Dess design made by euclicide and all the various other interpretations of the concept that have followed. After the long search, the Roaring Knight is finally revealed to be the lost girl. However, she isn't quite herself.

    I liked the concept a lot, and it ended up spawning this track. I wanted to translate the unsettling fear of seeing something such as that concept while also keeping the high octane metal nature of [[track:black-knife|Black Knife]] (she IS still The Knight after all (probably)). Additionally, i wanted to add a lot of tragic over/undertones to the track, though the [[track:raise-up-your-bat|Raise Up Your Bat]] part also carries a slight bit of hope/heroism - perhaps the last remnants of Dess which still remain in there, somewhere.

    The track samples [[track:c|Carol's theme(?)]], which isn't a Dess motif, no, but i felt like it sounded really good as ambience and worked narratively, so why not.

    The ending of this track also ends on a little piano resolution, just like [[track:thread-the-needle-kindred-souls|Thread The Needle]], though i don't mind it since i think it also sounds really neat. If it ain't broke, don't fix it, i suppose.

    Thanks a lot to [[artist:dreadedender|dreadedender]] for the great art (with tweaks by [[artist:tavvy|Tavvy]])! It turned out really good and ominous, matches the vibe a lot.

    <i>dreadedender:</i>
    I am hyperfixated on Dess right now and getting to draw her horrifically was a dream! Thank you to [[artist:tavvy|Tavvy]] for making the final edit for it!! It is perfect now!

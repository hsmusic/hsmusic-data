Commentary: |-
    <i>Jebb:</i>
    Oh Seam, our dear old grandthey. Such a mysterious character they are, with plenty of skeletons in the closet (not those skeletons and not that closet).

    This track was an attempt to make a boss theme for Gerson-type Seam bossfight - perhaps a semifriendly spar of Seam testing the Fun Gang.

    This was the latest addition to the album by me, but also one of the ones that i am the most proud of. I really felt like "Seam boss theme" is a track idea that hasn't been explored nearly enough by the fandom.

    The arrangement directly borrows a lot of instruments used in [[track:rude-buster|Rude Buster]], which i referenced heavily in this track considering Seam's theme, [[track:lantern-deltarune|Lantern]], is a variation on that track. (Actually, did you ever think about the fact that we have heard Lantern in more chapters by now than we have heard Rude Buster?)

    The strings take a much more of a backseat in the track after their initial appearence in the first part for no particular reason. This track has a full part dedicated to referencing Jevil, since we know how much of a connection Seam has to him. I think this is one of the very few tracks on this album which is referencing the other part of [[track:the-world-revolving|The World Revolving]] and not the freedom motif.

    I really like that little ending part. I made it while messing around and decided to keep it in for the final version of the track.

    Thanks a lot to [[artist:ddp|DDP]] for the wonderful colorful track art! It turned out super well! Great to see the Seam Ripper, his definitely very iconic weapon that appears nowhere other than the official cross stitch book, visualised.

    <i>DDP:</i>
    sure, we already got an old man secret boss. but what about the second old man secret boss. btw, a special thanks to [[artist:jebb|Jebb]] for the inputs and making me aware of the official undertale cross stitch book. the seam ripper idea is fantastic.

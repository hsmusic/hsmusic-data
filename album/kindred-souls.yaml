    I aimed for the feeling of accidentally triggering a boss fight with an angel. Or a demon. Whatever Starwalker wants to be. I wanted to capture that sinking feeling that you are too under-leveled to fight this enemy.

    <i>Levc:</i>
    As a shy composer and producer involved in many fandoms, undertale/deltarune always struck me as one of the coolest because of their HONORABLE TRADITION in making fan songs that could fit in its source. This is my take at something like that, but with a joke character that people would only give a song as a joke or an elaborated shitpost. There’s no irony tho, just an actual attempt to give starwalker an actual song.<br>
    I think this is the only thing I could do to celebrate undertale. To this day, I don’t believe to be good enough to make a cover or arrangement of an undertale track and not make it sound like a cheap copy. So an original theme about a character that gets no music is a good place to work with. It only has the freedom motif because that’s funny… Wait I said there’s no irony, fuck.

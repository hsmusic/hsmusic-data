    <i>Awkward:</i>
    "Fun Gang Standing There All Cool And Stuff" is a broad category of Deltarune fanart that I've been trying to draw since, like, right after the first chapter came out. For one reason or another, though, it never quite worked out. I drew it and redrew it and scrapped it and deleted it and inevitably restarted and yet it still never looked right, so I gave up every time. There's at least seven failed versions of this piece in my files going back to 2018. Probably more. Then I actually made *this* piece, for this song, and didn't realize until after I was done that I actually did the same drawing that I had been attempting for years and years and years. It's real now!!

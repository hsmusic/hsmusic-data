Commentary: |-
    <i>Circlejourney:</i>
    Fan spaces like to theorise on the reason Frisk climbed Mount Ebott. One of the more common headcanons—and the one that shaped this song—is that it was a suicide attempt. While obviously not the only interpretation, this reading compels me because of its deep resonance with not only my own life but also the themes of the game. Beginning from a hopeless space sets Frisk's journey in contrast—as an arduous climb back home, along which they save the Underground by steadfastly choosing mercy and life over vengeance and death.

    To be saving others' lives even while struggling to save one's own—I hoped to capture just a sliver of that sentiment here. The song is situated in the moment Frisk falls into the Underground, told like a future vision of everything they are and could become. I wanted to play with different sense of "falling": a regression, an escape from despair, a leap of faith?

    <i>Tavvy:</i>
    Recently, I've come to adore Frisk as a character. Regardless of their reason for climbing Mt. Ebott, their journey through the Underground is marked by a prevailing sentiment of determination. That powerful determination, whether it's used for nice or not-so-nice reasons... that dichotomy was what I hoped to depict.

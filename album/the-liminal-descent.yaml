Track: The Siege
Duration: 4:25
URLs:
- https://eidolonorpheus.bandcamp.com/track/the-siege
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/the-siege))

    Leaving the caravan behind, the pair reaches the southern border of Alacastor, only to find their current location a battleground. Though safely beyond the quarantine line, they learn of a necromancer hiding out in a fort that was renamed Specter's Hand before the southern military forces pushed the Miasmics back. Recognized as a mage by Colonel Ameste, Annette and Corvus are dragged into the conflict with mixed feelings. Ameste is wary of the pair and curious about their background, but requires their aid in breaching the fort and apprehending the necromancer. The military assaults the Miasmic hold. In the midst of the battle, Annette and Ameste come face to face with the necromancer hiding inside.
---
Track: The Duelist
Duration: 4:04
URLs:
- https://eidolonorpheus.bandcamp.com/track/the-duelist
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/the-duelist))

    Trapped in the fort when the southern military pushed the quarantine further into Alacastor, Erik had failed to reach the Capillarian Forest. Now, he attempts to escape the two mages, a seemingly hopeless endeavor. That is, until he notices something strange about the younger, with traces of the Miasma in her movement. During the confrontation, he tries to find out more, asking her questions and hinting at something that doesn't seem to click for her. In the end, however, he is arrested by the colonel, his arms severed to prevent magic usage, and made a prisoner of the military to be temporarily held in the fort.
---
Track: Death in Life's Clothing
Duration: 3:34
URLs:
- https://eidolonorpheus.bandcamp.com/track/death-in-lifes-clothing
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/death-in-lifes-clothing))

    During the fight, Ameste realized what Erik was implying while Annette is still clueless. She confronts Annette, accusing her of being a Miasmic. Shocked by the accusation, she can neither confirm or deny it, not knowing herself. Ameste offers her an ultimatum: because she's different from the others, to work with the military in quarantining and eventually eradicating its existence, or face the same fate as Erik. Still trying to process the idea as connections are made and the revelation takes its hold, Annette asks for some time to figure things out. Realizing she genuinely didn't know, Ameste allows it, but demands an answer by morning. Now knowing the name of the prisoner, Annette uses the tracking method Margaret taught her. Sure enough, he's the Erik she was looking for. In order to hold her end of the bargain with Margaret and in light of her recent discovery, she decides she and Corvus must free Erik and escape the military.
---

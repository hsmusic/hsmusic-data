Track: The Whispering Veil
Duration: 4:47
URLs:
- https://eidolonorpheus.bandcamp.com/track/the-whispering-veil
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/the-whispering-veil))

    Knowing they would be hunted until extermination or evacuation from Alacastor, and probably even after, Margaret and Erik travel south. They agree to part their forces once they reach the other side of a canyon, known as The Whispering Veil, to avoid being easily tracked through the Miasma. Centuries previous, Percival, a prophet of Mortis, sought to make a pilgrimage to the north to find the Mortiseum, the house of Mortis, which was allegedly at the top of the world. The story goes that Mortis tested Percival's faith by letting him hear the whispers of the dead from the dark canyon walls and observing if he was resilient against their goading and questioning. When he proved himself strong willed enough to carry on, Mortis spoke from behind a veil of dark clouds in the sky, stating that Percival may continue his quest. Though Margaret tries to pass time by telling the story, Erik is uninterested. Instead, its connection to Mortis returns his thoughts to their present situation: running away from what most people in Alacastor have come to believe is Mortis himself.
---
Track: Right Hand of God
Duration: 3:17
URLs:
- https://eidolonorpheus.bandcamp.com/track/right-hand-of-god
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/right-hand-of-god))

    Almost clear of the canyon, the Miasmic host is ambushed by a prophet known as Faust, one of the Congregation's high inquisitors. Most of the Miasmics clear the canyon as Margaret, Erik, and a group of revenants (Miasmics still bearing self-awareness) hold the prophet's attention. As Faust is distracted, Margaret asks Erik to continue south, beyond Alacastor's border, and then move east, toward the Capillarian Forest. He complies and takes half the host. Margaret duels with Faust just long enough for Erik to disappear, then calls for a truce, stating she knows something valuable to Mortis. Faust stands down, and agrees to let Margaret meet with Mortis at a different location to further discuss the matter. She heads west, toward the lake Nostros, with Faust, who relays the news to Mortis.
---
Track: The Crone
Duration: 2:34
URLs:
- https://eidolonorpheus.bandcamp.com/track/the-crone
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/the-crone))

    Time and location skip forward to Annette and Corvus, now traveling west along the tributary they had used to escape the Watcher's drones toward what they hope is the location of the Gottestrane, the plant mentioned in her parents' ledger. The further into Alacastor they travel, however, the more human-like and less hostile the Miasmics seem to become, at times ignoring them completely. The landscape also changes, gradually appearing more natural and less scarred, though not by a large degree. Annette decides to try and blend in, risking verbal contact with some revenants to get better directions. After some short encounters with surprisingly helpful villagers, all of their answers point toward a figure referred to as "The Crone," who resides in Galvansburg and tends to the Deathless Gardens, housing plants similar in description to the Gottestrane.
---
Track: Margaret
Duration: 3:42
URLs:
- https://eidolonorpheus.bandcamp.com/track/margaret
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/margaret))

    In Galvansburg, the pair seek out "The Crone." Along the way, they encounter many oddities, including alchemical creations bearing a strong resemblance to Corvus. Eventually, they find the garden and "The Crone," a necromancer named Margaret. She greets Corvus first, but her focus shifts to Annette after noticing her "aliveness," expressing surprise at seeing a living mage this far into Alacastor. She introduces herself as a renowned alchemist and researcher under the direction of the Congregation of Mortis. Annette, being raised in a setting removed from society, inquires about the order. Margaret tells her about the Congregation and its ruling: an order of mages who gave their lives to use the Miasma to grant the people of Alacastor eternal life. At its head is a living god named Mortis who supposedly brought this gift to humanity at his second coming. When Margaret asks what brought the pair to Galvansburg, Annette tells her of her parents' disappearance and the contents of the ledger. Intrigued by what she's hearing, Margaret pries into Annette's past and tells the pair that she might know something interesting of Annette's parents and perhaps Annette herself… but will only divulge the information if she is willing fetch a companion of hers from their location to the south.
---

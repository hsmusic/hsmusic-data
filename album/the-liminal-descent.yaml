Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/dead-flight))

    Annette and Corvus break Erik out of prison just before dawn. He and Annette discuss her realization before charging through the fort. Corvus takes a crossbow bolt to the arm. Though stricken with anxiety and the target of the military forces awakening, Annette and the guys manage to get over the wall and move down the road. Just as they think they're clear, however, Ameste ambushes them, incinerating Erik and bearing down on Annette and an injured Corvus with fire. In the end, Annette resolves to accept her being a Miasmic and tries to replicate the method used by the Watcher by combining Miasma affected blood with the earth. She impales Ameste with a tendril of earth.

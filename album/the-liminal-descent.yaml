Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/traveling-in-plain-sight))

    Margaret allows Annette and Corvus to depart with caravan set to stop near the southern border of Alacastor. She tells them that her companion is a man named Erik who should hopefully be near the Capillarian Forest by now. She teaches Annette a way to track him through the Miasma once they are close enough. Though she expresses some concerns about traveling in the open on the roads, Margaret reassures them that they will be safe from suspicion surrounded by revenants, and that even then, she is probably the safest person in Alacastor.

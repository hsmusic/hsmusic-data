    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/crossroad))

    Crossroad: Forced into an exodus, otherwise facing complete decimation at the hand of a god, necromancers Erik and Margaret lead their host of Miasmics from the smoldering remains of their camp. Erik, under the guidance of Margaret, began researching the Miasma more thoroughly than the state, and its head, desired. Unlike Margaret, who had already delved deeper into the truth, Erik made his findings and intentions less subtle when brought in front of committees, compromising their standing with the Congregation of Mortis, the order behind it all. Margaret agrees to provide Erik with much of her work and to continue researching, though out of the reach of the Congregation.

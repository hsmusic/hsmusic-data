Track: Flower Castle
Additional Names:
- Name: >-
    改造 花ノ城
  Annotation: >-
    [Japanese release](https://tobyfoxjp.bandcamp.com/album/deltarune-chapter-5-ost)
Main Release: DELTARUNE Soundtrack
Contributors:
- Marcy Nabors (MIDI transcription)
Duration: 4:30
URLs:
- https://tobyfox.bandcamp.com/track/flower-castle
Commentary: |- #i think this is how we dated commentary
    <i>Marcy Nabors:</i> ([Tumblr post](https://www.tumblr.com/shadolith/821811914043752448/toby-fox-flower-castle-i-worked-on-deltarune), 07/11/2026)

    I worked on Deltarune Chapter 5! Just a little bit :)

    I was lucky enough to continue my role as music assistant to [[artist:toby-fox|Toby Fox]] on the fifth chapter of Deltarune for the track "Flower Castle," which I worked on in a very similar capacity to the work I did on "[[track:attack-of-the-killer-queen|Attack of the Killer Queen]]" from Chapter 2.

    This time around, [[artist:toby-fox|Toby]] sent me a full multi-track acapella demo for me to transcribe to MIDI before sending it back over to him to arrange. It was amazingly fleshed out just from the reference he sent!

    I worked on transcribing this concurrently with the "[[track:abandoned-town|Abandoned Town]]" and "[[track:underwater-town|Underwater Town]]" tracks for the [[album:undertale-10th-anniversary-stream-soundtrack|Undertale 10th Anniversary stream]], and was very surprised when they turned out to not be for Chapter 5 😅

    Thank you all for the amazing response to Chapter 5!!! It means the world to me to see how much it's resonated with so many people <3

    <i>Hilary Troiano:</i> ([Tumblr reblog](https://jaydeis.tumblr.com/post/48471274630/gamefreakdude-posts-this-again-fun-fact-1), April 20, 2013)

    Fun fact 1: The idea that lead to this was a clump of lyrics about a pair of young lovers sitting together, watching the last sunset before the end of the world.

    Fun fact 2: A lot of my songs have partial or full lyrics to them, which you'll never hear because they read like bad middle school poetry and I sound like a frog.

    Fun fact 3: Yes I know that that instrument is supposed to be used for the baseline. I wanted a more strummy sound for the baseline and a more flutey sound for the melody, so I figured I'd switch them. Apparently this is committing a grave sin in chiptunes, as a better musician has told me to knock that shit off. So fine, I won't do it again. I mean, I won't fix any of my old songs that do it because I'm lazy, but now I know better.
    

    <i>Jamie Paige:</i> ([Jamie Paige's Community - Bandcamp](https://jamiepaige.bandcamp.com/community?sid=1852303&st=sm), 06/20/2025)

    happy summer solstice! how the seasons change... a perfect time to talk about what else I've been up to!

    I don't really like the idea of doing deluxe editions. I'm usually very particular about the fixed presentation of my albums, at most being supplemented by singles, informal b-sides, and various apocrypha. however, two things have me feeling differently when it comes to [[album:constant-companions|Constant Companions]].<br>
    one is that I never got the chance to do a physical release! I had far fewer resources to do such when it first came out, and at this point, it would feel wrong to simply put the unaltered album on cd and call it a day.

    two... is that Constant Companions has been missing [[track:clouddrop|a song]].

    the album was always meant to have 12 main tracks, but for reasons I would rather not get into, I had to remove one at the last minute. the cut song is a seven minute long behemoth, one of the most ambitious things I've ever recorded, and my favorite song I've ever written - and until recently, I was resigned to never release it properly, never let it see the light of day.<br>
    I revived the song, though - brought it back from the brink of death, for the sake of my heart. I've racked up a couple b-sides and bonus tracks as well... so, now, Constant Companions (Deluxe Edition) has the chance to be the album I wished I've could've shown the world in the first place.

    and I'm very excited for you to start hearing it soon! the first track you'll hear is [[track:birdbrain|a silly one]], though - I'll be saving (almost) everything else for the album drop :~)<br>
    here's to the changing of the seasons!

    from where it's autumn every day,<br>
    jamie paige❤️💚

    p.s. -<br>
    as a wise scholar once said:<br>
    "robot sex revival /<br>
    jamie put that shit on vinyl"<br>
    📣🐕

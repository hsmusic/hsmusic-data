Track: Negrocity [Canon Cut]
Artists:
- TheFloorIsEvil
Duration: 2:24
Referenced Tracks:
- track:negrocity-janestuck
Sampled Tracks:
- track:negrocity-janestuck
Commentary: |-
    <i>Nexx Mowarek:</i> ([YouTube comments](https://www.youtube.com/watch?v=t2nJPcpYmRs), 2/2/2017)

    *IQuick 143:*<br>
    Canon cut as the scissors were shot from a cannon?

    *Nexx Mowarek:*<br>
    It's an entirely different story actually. Do you remember that scene from [[flash:1940|[S] Descend]] where Jack cuts the chain of Prospit in half? We asked him if he could do the same thing with one of our old cannons lying around in the basement (please do not attempt to recreate without the aim of at least one professional Jack Noir), and as it turns out, the noise made during the event is exactly the same as [[track:negrocity-janestuck|Janestuck - Negrocity]] except for a few glitches here and there.

    I wonder if the music team should just start using this seemingly lot more convenient method of music composition...

    *IQuick 143:*<br>
    Thats a very interesting story.<br>
    I would like more great songs like this!

    *Nexx Mowarek:*<br>
    Then all you need to do is await the arrival of the next album (;

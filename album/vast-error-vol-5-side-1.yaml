Commentary: |-
    <i>Rainy:</i> ([YouTube description](https://www.youtube.com/watch?v=PKqRYTXaLiQ))

    Okay so. this song had a bit of a troubled development. For various reasons, this song went through like 3-4 different iterations before it became the song you’re hearing now. More so, this final version of the song was almost completely written 48 hours before the album came out. Despite all of that however, Torchlight probably one of my favorite songs I’ve ever written at up to this point. In terms of inspiration for this track, I took influence from the songs [[“Softly”]] and [[“Stellarum Salve”]] by RJ Lake. In addition, I also drew inspiration from the song [“Shanghai”](https://www.youtube.com/watch?v=-01sgnVgkRc) by King Gizzard and the Lizard Wizard. I wanted this song to be bright, saccharine and little cute like those songs I mentioned previously because I felt that vibe fit Jentha perfectly. I’m pretty proud of this one not just because of how I was able to write this in such a short period of time but also because the song gave me an avenue to experiment with synthpop production for the first time. For that I will probably always love this song despite the issues.

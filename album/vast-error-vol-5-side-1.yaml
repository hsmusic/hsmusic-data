    Here is the first song of mine for Vast Error Volume 5! This is my first track on Side 1. It's a hard hitting industrial rock piece for Taz, done in a [[artist:nine-inch-nails]] sort of style. I deliberately pushed myself far out of my comfort zone with this track, as it's not a style I am used to. It was originally composed as an instrumental, but I decided to add vocals with [[artist:rom-m|Rom]] and [[artist:castigadora|Julia's]] aid. Their assistance was invaluable!

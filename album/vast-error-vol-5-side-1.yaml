Commentary: |-
    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/searching-for-answers))

    Here is the second song of mine for Vast Error: Volume 5! This is my second track on Side 1. I originally made this piece back in January 2020 as an ode to [[artist:oneohtrix-point-never|Oneohtrix Point Never's]] early progressive electronic style (although a little more maximalist). It was meant to be released on a solo EP, but thanks to the pandemic that never quite materialized. I always loved the track, though, and when time came for work on Volume 5 to begin I decided to throw it on the album. I still consider it to be one of my best songs.

    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/searching-for-answers), 1/6/2020)

    "What once was is now lost."

    I've had [[artist:oneohtrix-point-never]] stuck in my head for the last few months so this is my synthesis of his ideas in music form. Shoutout to Returnal and Memory Vague for helping me through finals.

    Going to try and release an EP before the year's over. This will be on it, as well as another song I've published here and some others in progress.

Lyrics: |-
    <i>Michael Guy Bowman:</i> ([artist's lyrics](https://bowman.bandcamp.com/track/on-the-thirteenth-day))

    Fresh off the page of this terrible tome
    You've come of age, the child is no more
    Spending your days in the comfort of home
    Stuck in your ways behind your bedroom door

    Now is the naming of names
    Where once we were just playing games
    Pretending is over, it's time to go

    On the thirteenth day
    It will take you away
    Whether you're ready or not
    For what now must be done
    The end has begun

    One little star that hangs in the sky
    Once was so far but now is far too near
    Some will depart and others will die
    Steady your heart and make your answer clear

    Now plays the haunting refrain
    The shiver that runs through your veins
    Says this time is showtime or no time at all

    On the thirteenth day
    It will take you away
    Long be the road laid before you
    No others may run
    The end has begun

    Our guardians fail us
    They cannot avail us
    The course we have chosen
    So rigidly frozen
    Reducing to one from the infinite
    Each second left that remains

    So reach out your hands
    For something to hold
    You must understand
    It can't be controlled

    Now lick the taste from your lips
    You circle the Möbius strips
    From humble beginnings
    To requiems

    On the thirteenth day
    It will take you away
    Into the fray of a war
    That will never be won
    The end has begun

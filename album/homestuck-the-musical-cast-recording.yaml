    @@ [YouTube description](https://www.youtube.com/watch?v=k3Ifpz_KOqM)

    Trick or treat! Let's celebrate this holiday with one of our most asked-for songs in the show! It's funny, since way before  the musical was even a thought in our heads, [[artist:rebecca-peterson|Rebecca]] and [[artist:lumistarlight|Lumi]] were crammed in a tiny room working out the harmonies and piano parts of what would evolve into Scratch The Disk and [[track:cascade-homestuck-the-musical|[S] Cascade]]. And now, for the two of them to be able to come together and sing it again, it really feels like we're coming around full circle. And really, we could not ask for better singers to celebrate and perform this with than [[artist:murphy-mcshane|Murphy]] and [[artist:petal|Petal]]. They are wonderful singers and they really bring the song to it's full  potential.

    Cast:

    John Egbert: [[artist:rebecca-peterson|Rebecca Peterson]] of @moustachefreemedia

    Dave Strider: [[artist:murphy-mcshane|Murphy McShane]]

    Rose Lalonde: [[artist:petal|Blossoms]](known as Petal these days)


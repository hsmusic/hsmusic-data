Commentary: |-
    @@ [YouTube description](https://www.youtube.com/watch?v=fbok8fYy_9w)
    As opposed to the usual irony of It's Not Over, it is, in fact, not quite over yet. But boy are we almost there. This song was originally planned as the end of the first act, but upon actually writing it it was obvious it was meant to be our finale. The harmony at the end is the only time in the musical the entire cast is singing together and was dubbed ‘The Chorus of Angels' by the cast. There is an incredible power that overwhelms you when you're in the same room.


Commentary: |-
    @@ [YouTube description](https://www.youtube.com/watch?v=2yP3bhIb2Rk)
    And here we are the final song of our Cast Album! It truly has been a long journey and now that we are here: at the end and looking back at everything that has happened on the road to where we are now. It is weird to think that with this we will be done. There has been so many ups and downs, so much that we have learned, so many people we have met, it truly has changed our lives. And we hope it has changed yours as well, no matter how small that change is.

    Thank you so much for supporting us, and for taking this journey with us. It is you, the audience that really has made this all worth while. We'll see you on the other side.


Lyrics: |-
    ROSE:
    Pray for the fallen and pray for the dead
    You can pray all you want but no one's listening

    Except for the voices whispering in your head
    How it fills me with dread, so we'll take the fall instead

    Call out my fixation, my relationship with doom
    I regret- I didn't get- I've barely started living yet
    What an odd sort of comfort, to be destined to fail
    Isn't it ironic, brother dear? So smile

    It's coming down, it ends tonight
    No more time and no more light
    Try to salvage our defeat
    It's almost time to sleep, we'll
    Watch it fall, won't try to hide
    Waiting for our time to die
    And it might be a relief
    From this endless grief
    
    There is nothing left here for us
    Go and save them, reign victorious
    And leave me here alone
    With the cold inside my bones


    DAVE:
    I'm not a hero, if anything I hate the fight
    Can't trust me to be anybody's knight, I fail all the time, but if there's one thing I know
    It's that time is a tempo and I've got the music in my bones so

    This song won't go unsung just because I've got no breath in my lungs
    And space might be collapsing, my light going out
    But I promise I am not without a cause to be devout about so never doubt

    This rhythm, this story, neither will repeat 'cause I am still on fire and I've still got the beat
    Got my rests, my staccatos, and the triplet crash
    My rhymes won't be a broken record made of ash

    'Cause the fight might stop
    But the beat is never-ending like the ticking of a clock
    So I'll keep pretending, just a little more, that I can be a hero
    Just until we close this door on doom.

    BOTH:
    It's coming down, it ends tonight
    No more time and no more light
    Try to salvage our defeat
    It's almost time to sleep, we'll
    Watch it fall, won't try to hide
    Waiting for our time to die
    And it might be a relief
    From this endless grief

    ROSE:
    There is nothing left here for us
    (DAVE: Take it one more time)
    Go and save them, reign victorious
    (DAVE: From the top)
    And leave me here alone
    With the cold inside my bones

Commentary: |-
    @@ [YouTube description](https://www.youtube.com/watch?v=PTY3KHIFkzk)

    We're sorry to have to take a break from lyric videos, but everyone is super busy with work and school, but we still want to share our recording with you so we will be uploading like this for a little while( don't worry we will resume lyric videos when things calm down a bit)

    Now here's a voice you know well enough, but from a very different role in the musical! [[artist:murphy-mcshane|Murphy]] steps out of his STRONG performance as Equius to take on the role of Dave, showing that he not only has a beautiful singing voice, but also can lay down some sick rhymes and rhythms. Look forward to hearing him as the rest of the beta songs are posted.

    We also get to see an expanded role for [[artist:petal|Blossoms]], we felt it was a terrible oversight that Rose gets to rap in the comic but not in the musical, and [[artist:lumistarlight|Lumi]] was very excited to test out her rap-writing chops, so we rewound, remixed, redid and are proud to present a new and improved version of Doomed!

    Cast:

    Dave Strider: [[artist:murphy-mcshane|Murphy McShane]]

    Rose Lalonde: [[artist:petal|Blossoms]](known as Petal these days)

    Davesprite: [[artist:ari-sunshine|Ari Sunshine]]

    You can check out the updated lyrics over here!

    Lyrics and original composition by lumistarlight, whitesandandcherryblossoms

    You can check out the new lyrics over here: [http://homestuckthestagemusical.tumbl...](https://homestuckthestagemusical.tumblr.com/lyrics-doomed)

    “Homestuck: The Musical” is a musical adaption of Homestuck, the webcomic by [[artist:andrew-hussie|Andrew Hussie]], which can be found here:http://mspaintadventures.com

    We performed at Northwest Fanfest 2014 in Vancouver, Canada.

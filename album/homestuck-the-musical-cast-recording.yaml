    The third and final person is someone you know, but not necessarily in an on-stage sense. [[artist:sammi-nickel|Sammi Nickel]], who a writer for Homestuck: the Musical, will be singing Terezi's part! She already knows the character inside and out and has the voice to bring them to life!


Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp credits blurb](https://circlejourney.bandcamp.com/album/solstices-equinoxes))
    The four seasons have always seemed fantastical to me. Maybe it's because I grew up in a place that didn't have them. Still, we celebrated seasonal festivals imported from abroad; they were the sum total of what spring, summer, autumn and winter meant to me.

    Each of these songs, too, is like a boundary marking festival, contemplating what each season symbolises and the transitional periods when each one moves into the next.

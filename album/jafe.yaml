Commentary: |-
    <i>Ethan Clark:</i> ([Monthly blog post: Apr 2026](https://nuvobloggo.medium.com/monthly-blog-post-apr-2026-53566a5e32d8))

    As you probably don’t remember (I’m not expecting you to remember every detail from these blog posts,) I’m currently on a game development hiatus. Which means that for these next few months, I’ll be focusing on talking about things I did in the past.

    This month, I have a weird story to tell. It’s the fun kind of weird, though!

    <b>Troubled Cosmos</b>

    In late 2025, I was in a Discord server when I saw a post that piqued my interest. A user named Vibri was talking about how her friend Andrew had planned out a visual novel game. Vibri tried to bring the game to fruition, but unfortunately she got too busy with other stuff to work on it.

    I replied to Vibri, saying that I had game development experience and could help out with the project if needed. Vibri was polite but didn’t follow up on my offer, because I was just a stranger to her.

    …At least, that’s what I *thought* would happen.

    I was surprised when, around Christmas time of that year, Vibri began messaging me asking if I would still be able to work on the game. And shortly after, I was put into a Discord server with a few other people.

    We were given a script for the project, called “Troubled Cosmos,” that contained 99% of the visual novel’s dialog along with all of the images we needed. So most of the work was simply taking that stuff and making it into a playable thing.

    However, there were a few things here and there that we got to create ourselves. Notably, Andrew didn’t include any music in their assets. Well, the script did say that the game should play a crappy-sounding song when the game ended, but it didn’t specify what song it should play.

    And as soon as I read that, I knew *exactly* what song to use. But to explain it, I need to talk about jafe.ogg

    <b>jafe.ogg</b>

    In the 1960’s, McDonalds [aired a commercial](https://www.youtube.com/watch?v=xXoUvwbD0oI) wherein their mascot, Ronald McDonald, advertised his fast food to children. Unbeknownst to the humble clown, his voice lines would be remixed and sampled in the hit indie game Undertale. Flowey’s “That’s a wonderful idea” line is the most notable, but several other sound effects were taken from the commercial.

    Perhaps the nichest sound effect from the commercial is “mus_sfx_voice_jafe”. Ronald McDonald saying “shake” got edited into something that sounds like “Jafe.”

    I didn’t know that the sound effect came from the commercial until very recently. In fact, some people think that Jafe isn’t used in the game at all. [Those people are wrong](https://www.youtube.com/watch?v=l_5QZT2uCXs), by the way.

    After learning about this sound effect, I was amused by it. I decided to make a song which used the jafe.ogg sound effect, appropriately called “Jafe.” It was, rather intentionally, a very “crappy” sounding song.

    <i>(aside: it was actually meant to be a character theme for Lupelo from Cyclepest. What’s Cyclepest? Well, the TL;DR is that in 2021 I got an idea for a webcomic and started to plan it out. I have a big stockpile of unreleased songs for it, as well as various other planning documents, some of which are outdated. I don’t know if/when/how I will release Cyclepest.)</i>

    <i>(aside aside: Wait, I said there’s a stockpile of “unreleased songs,” but “Jafe” is actually released! Because it’s in Troubled Cosmos! Enjoy your one (1) Cyclepest song, I guess. Maybe I’ll drip feed you all the other songs later.)</i>

    Now, I’m a square when it comes to using samples in music, so I wanted to get permission from jafe.ogg’s creator before I released a song using it. Except jafe.ogg’s creator is Toby Fox, who is, uh… not that easy to contact due to his celebrity status.

    Luckily, I had a way because, and this is the lead that I’ve been burying, the “Andrew” I’ve been mentioning is “Andrew Hussie,” creator of <i>Homestuck</i>, who for well documented reasons is in touch with Toby Fox. So I asked Vibri to ask Andrew to ask Toby if I could use jafe.ogg in Troubled Cosmos.

    Vibri ran it up the chain, and I was told that Andrew said it was okay. So I put the song in the game.

    <i>(aside aside aside: actually, the song you hear in Troubled Cosmos is not exactly the same as the one used for Lupelo’s theme, since I modified it to have more distorted drums.)</i>

    <i>(aside aside aside aside: by the way, Cyclepest was inspired by me reading Homestuck, and Lupelo was inspired by Nepeta from Homestuck, so in a roundabout way Andrew ended up inspiring the song. Though I think I only decided “this would be a good fit for Lupelo’s theme” after I created the song? I don’t remember the exact cause and effect here.)</i>

    <i>(aside aside aside aside aside: Coincidentally, having the music be first made for one project and then used for another was also the case for much of Undertale and Homestuck’s music, or so I’m told. I said “coincidentally” in the last sentence, but in reality I chose to put Jafe in Troubled Cosmos in part because I wanted to use a song with an interesting story behind it, much like e.g. [[track:megalovania-undertale|Megalovania]] has an interesting story behind it.)</i>

    <i>(aside aside aside aside aside aside: Wow, these “aside” segments have gotten so long and convoluted that it’s almost like they’ve overtaken the main segments in terms of relevance. Someone should make a web comic where that happens.)</i>

    Anyways, if you want to play TC, you can do so [here](https://mspaintadventures.itch.io/troubled-cosmos) (cw: various mature content.)

    <img inline pixelate width="315" height="250" align="center" src="media/misc/troubled-cosmos.jpg">

    So yeah, that was my one major contribution to the game, besides making the instrumentals for the post credits song, but Fruz [already made a writeup about that](https://fruz.quest/mspa/atroubledscosmos/) (cw: same CW as before.)

    Troubled Cosmos is in the public domain (to the extent legally possible,) and so is Jafe. Actually, let me officially declare that:

    <b>To the extent possible under law, ETHAN CLARK has waived all copyright and related or neighboring rights to the songs that are published in the folder contained in the following hyperlink (https://drive.google.com/drive/folders/1ANPJDcs7qm7TblEheFtMkktrGLMgSuaF?usp=sharing) circa April 13th, 2026</b>

    There. You can now use Jafe in your own projects. [Here’s the link again if you need it](https://drive.google.com/drive/folders/1ANPJDcs7qm7TblEheFtMkktrGLMgSuaF?usp=sharing). If you use Jafe in a game or something, let me know so I can feel happy about it. Though the happiness of your audience is not guaranteed.

    Actually, you might have noticed that I provided a song called “Ratcore Jafe” in the download link. What’s that doing there?

    <b>Jafe in The Words In Your Mouth</b>

    That’s right. A remixed version of Jafe is going to be the used in The Words In Your Mouth, my visual novel puzzle game that’s going to release some time in the future. Still. I promise. It’s just taking its sweet time.

    Ratcore Jafe is actually going to be an Easter Egg, since there’s only a 1 in 128 chance for it to play at a specific point. Though I suppose it’s not much of an Easter Egg if I’m literally announcing it to you. Well, uh… pretend to act surprised if you hear it.

    Also: Even though Ratcore Jafe is in the public domain, the rest of the soundtrack probably won’t be. At least for a while. But it will be free to listen to at least.

    Like the Jafe song, I encourage you all to use Ratcore Jafe in your own projects to make the cultural legacy of Jafe even richer.

    <b>Cultural Legacy?</b>

    Now, I know that it might sound like I’m aggrandizing myself by hyping up Jafe’s “rich cultural history,” as if I’m putting myself on the same grandiose pedestal as Toby Fox and Andrew Hussie. And… I promise I’m not trying to, but to some extent I guess that’s unavoidable? Sure, I can remind everyone that I had zero (0) direct contact with those people and emphasize that I’m just a person who was quite literally in the right virtual place at the right time. But at the end of the day, I can’t control how people perceive me, which is ironically a major problem for celebrities.

    Having all said that: I don’t think you need to be a famous in order to make something culturally significant. We tend to think of culture as a series of Great Works made by Great Men, but the Little Stuff made by Little People is just as important. Really, it’s all just stuff, and we’re all just people.

    So, let’s say, hypothetically, your friend is showing you their latest short film and you ask them where they got that weird nightcore sounding song from. They launch into a long info dump that explains how McDonalds, Undertale, and two visual novel games all connect together.

    “Basically, a lot of important people influenced this” they say.

    Now, there are a lot of ways you could respond to that. But if I were in this situation, I would look at the friend and say:

    “You forgot the most important person of all: you.”

    And then they would move closer and bring me into a loving embrace. And by that, I mean they would hold my hand in a totally g-rated way, because I don’t want this blog post to get too wild. It’s nice of them to respect my sensibilities like that. In fact, if I didn’t know any better, I’d say they’re just a hypothetical person I conjured for my own purposes.

    …

    Wait, where were we?

    <b>What’s next for Troubled Cosmos?</b>

    After all this, you might be asking: am I going to do more projects like this? Am I going to work on another Troubled Cosmos game? Am I going to release Cyclepest?

    Short answer: I don’t know. We’ll see what happens.

    As for Troubled Cosmos specifically: since it’s public domain, anyone is free to make their own sequels. In fact, someone already released [a sequel consisting of a single still image](https://mx-ereux.itch.io/troubled-cosmos-2). 10/10, no notes.

    <b>Cool Links</b>

    - Dee made [another great Puzzlescript game](https://dee-3.itch.io/a-man-walks-into-a-scrollbar).
    - In case you missed it, my friend released [their game too](https://store.steampowered.com/app/4300020/Jamhouse/).

    <b>Before we go</b>

    I’d like to give a special thanks to everyone involved in making TC happen. They were all super nice, and I’m glad to have been given the opportunity to work on the project.

    I’d also like to thank you for reading this. It’s taken a bit of work to adjust to this new era of my life, but it helps to know that I have a not-huge-but-still-important group of people who care about me and what I do.

    <b>Thanks for reading</b>

    Have a very Jafe day.

Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor, 10/20/2024)

    This album was released on the artist's main Bandcamp ([flutterwhat](https://flutterwhat.bandcamp.com/album/let-me-dance-let-me-glisten)) as well as on the dedicated ScourgeQuest Bandcamp ([scourgequest](https://scourgequest.bandcamp.com/album/let-me-dance-let-me-glisten-single)). These releases are combined as one album for the wiki.

    <i>Flutterwhat:</i> ([Bandcamp about blurb](https://flutterwhat.bandcamp.com/album/let-me-dance-let-me-glisten), artist discography release)

    This version of the single differs from it's ScourgeQuest bandcamp release. [(bit.ly/1CIjqsF)](https://scourgequest.bandcamp.com/album/let-me-dance-let-me-glisten-single) It includes two additional tracks from the [ScourgeQuest III BETA 1 Release](https://scourgequest.bandcamp.com/album/scourgequest-iii-beta-1), both of witch share the same core melody.

Commentary: |-
    <i>Flutterwhat:</i> ([Bandcamp about blurb](https://flutterwhat.bandcamp.com/track/let-me-dance-let-me-glisten), artist discography release)

    This song is dedicated to Porrim Maryam, a character from Homestuck who is gorgeous and would most likely be the one to dance in clubs. I wanted this song to be my sexiest song yet!

    This song is also my contribution to the [[album:beforus|beforusalbum]], a fan album made to showcase songs about the dancsestor characters of Homestuck. They are currently recruiting musicians and artists!

    Because I actually have a job now, and combined with the fact that I'm still using 10+ year old hardware, Progress on my songs has been much slower then ever before. ScourgeQuest III has stalled somewhat as i am hitting metaphorical walls because I am limited in time now as well as the previous software limitations.

    <i>Flutterwhat:</i> ([Tumblr](https://teamvirgoprojects.tumblr.com/post/116379118897/happy-4-13-art-by-snerkflerks-listen-download), excerpt)

    Fresh off the musical oven that is my PowerMac G5, I present to you my latest single: Let Me Dance, Let Me Glisten. (Available first on [the ScourgeQuest BandCamp](https://scourgequest.bandcamp.com/album/let-me-dance-let-me-glisten-single). Coming soon to all other Flutterwhat channels.)

    Inspired by many of the amazingly supportive and welcoming peeps in a certain “Homestuck nudist colony\*”, This song is dedicated to Porrim Maryam, a character from Homestuck who is gorgeous and would most likely be the one to dance in clubs. I wanted this song to be my sexiest song yet!

    This song is also my contribution to the [[album:beforus|beforusalbum]], a fan album made to showcase songs about the dancsestor characters of Homestuck. They are currently recruiting musicians and artists!

    Because I actually have a job now, and combined with the fact that I’m still using 10+ year old hardware, Progress on my songs has been much slower then ever before. ScourgeQuest III has stalled somewhat as i am hitting metaphorical walls because I am limited in time now as well as the previous software limitations.

    ~~\* that colony being *“Nudestuck”*~~

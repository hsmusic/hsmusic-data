Commentary: |-
    <i>davepetaleider:</i> ([YouTube description](https://www.youtube.com/watch?v=wMRb3aLotGU))

    special super thanks to whatjosaid for rendering this behemoth, seriously, this wouldve never released if it wasnt for them

    special super thanks 2 to hamstier for organizing everything in the masterdoc and making the credits, you're insane

    of course we cant forget the 51 other people that helped make this entire thing possible, you guys are crazy

    thank you newgens ❤️

    <i>hamstier:</i> ([credits document](https://docs.google.com/document/d/1BhXgJX_6vmyugxUh_jhb-85QuFGNZPXbQpLVk0pdb4g/edit?tab=t.0) - special mentions)

    davepetaleider, for organizing this and keeping us on track for over 3 months.<br>
    The Homestuck Official Discord moderators, for making us our own thread (Thanks you, President Munroe), letting us make this for the newgens, and also proofreading this (Thanks Andy!).<br>
    Roudiru, for a banger ass demo (1:30 of torturing their own vocal cords solo).<br>
    Roudiru AGAIN for making a second demo that was yet again 1:30 of torturing their vocal cords.<br>
    Ignoblepalm and Ethan Clark, for starting a FRAF thread with the same idea a bit before we did this.<br>
    The rerelease new readers, for being subjected to this on at the end of the rerelease.<br>
    The rerelease new readers, again, for being subjected to a preview of this on the same day as Cascade's rerelease.<br>
    The peeplings (new reader observers), for being fuckin awesome and contributing to this.<br>
    XTRATUNA, for making the song this is a parody of, An Under's Tale.<br>
    Andrew Hussie, for creating Homestuck.<br>
    Lord English, for also creating Homestuck.<br>
    Vibri, for creating the Homestuck Official Discord server.<br>
    Vibri again, for letting us play this to you all after the rerelease<br>
    ME, Hamstier, for combing through so many fucking messages in this thread to assemble these credits. Holy shit, why did we not collect these before the verses were finished, why did we wait an entire goddamn month before even thinking of writing down who did what, this shit took forever. Honestly at some point I was just procrastinating on my verses/sprites by playing accountant and making my lists of what needs to get done or claimed and reminding people to do their claimed verses or drawings and tracking down who wrote what and telling people what to do for their stuff and writing these credits. This was fun af though, wouldn't trade it for the world.<br>
    Our parents, for creating us.<br>
    Pan’s mom especially.<br>
    And also Sasquatch’s chaser mother.<br>
    But not Gardenagnostic’s mother, not her.<br>
    Our grandparents, for creating them.<br>
    Noxy, for emotional support.<br>
    Page 1315, also for emotional support<br>
    Gamze, also also for emotional support. #hydration baybee<br>
    Arguablyari, for wanting to be in here and being cool.<br>
    The brazing bull, for also being cool.<br>
    Whoever made Discord, Google Docs, FL Studio, Davinci Resolve, and whatever recording/art programs we all used. I don't care enough to look it up.<br>
    Oh yeah, Alan Turing, for being the father of computer science.<br>
    Uhhh who else, Toby Fox is indirectly responsible for this I think.<br>
    Rufioh, for going until December 14th until anyone bothered to claim his voice OR art. Congrats bud! Nobody wants to do anything for you.<br>
    Lord English and Obama, for somehow being the last two voice roles to be claimed.<br>
    Goatdad, for being the last art role to be claimed. Does anyone even remember him anyway?<br>
    Issac Newton I guess, for inventing gravity.<br>
    Oil dog, for emotionally terrorizing us<br>
    Jake English, for inventing the UK.<br>
    Electrons, sure as hell wouldn’t have been positive without em.<br>
    Vivziepop. I mean someone involved probably got into Homestuck because of the pilot, right?<br>
    Grug, for inventing music.<br>
    Potato salad, for always being there for us.<br>
    Literally everyone who worked on Machina Mori.<br>
    3Y3B1T3’s cat, Temmie (not Chang)<br>
    The people who made the UHC and Homestuck wiki. Like yeah I think it would've been pretty hard to make this without those.<br>
    Shit wait I forgot Toby also made Descend, yeah so he's even more responsible for this.<br>
    Amelia Earhart.<br>
    Libakaru’s friend, for lending them the glasses.<br>
    Al Gore, for inventing the internet.<br>
    As Gore, for driving his car, or something. I don’t even remember that meme at this point, it’s Jan 1st 2026 (happy new year) at the time of writing, how long ago was that?<br>
    The inventor of autism. Seriously if we were neurotypical this wouldn't exist.<br>
    Text to Speech, for making text into speech.<br>
    The people who worked on the Homestuck rerelease.<br>
    Gandalf the Grey and Gandalf the White and Monty Python and the Holy Grail’s black knight and Benito Mussolini, and the Blue Meanie and Cowboy Curtis, and Jambi the Genie.<br>
    Robocop, The Terminator, Captain Kirk, and Darth Vader.<br>
    Lo-pan, Superman, every single Power Ranger.<br>
    Bill S. Preston and Theodore Logan.<br>
    Spock, The Rock, Doc Ock, and Hulk Hogan.<br>
    Thanks, Obama.<br>
    Jork, for being Jork.<br>
    Oxygen, rooftops, estrogen, and Miyamoto, wouldn’t have been possible without them.<br>
    Minghao from Seventeen? Idk who that is I think Sprink likes them though.<br>
    All 3 official Homestuck merch stores.<br>
    Hideo Kojima, his influence was obvious.<br>
    Spongebob, because he's really cool.<br>
    Speakercrab, for emotional support.<br>
    Whoever directed Con Air.<br>
    Reverse thanks to Noxy, she's distracted me from this project so much.<br>
    Ernest Cline, for something.<br>
    Tenna from Deltarun<br>
    Gabe Numan<br>
    Gary Newell<br>
    Dandelion<br>
    Oscar<br>
    Dill<br>
    Barlow<br>
    Percy<br>
    Iris<br>
    Petunia<br>
    Lavender<br>
    Milkshake, Puddin' Tame, Egg, knives 8, rock rock, and any other anonymous writers that contributed! (Seriously I looked through the entire thread, asked around a bit, and still have no idea who you are, sorry!)<br>
    Anyone who made edits/additions to verses that I missed.<br>
    All 51 people listed in the credits. We couldn’t do this without you!<br>
    ...And everybody else who contributed in ways beyond writing/singing/art!<br>
    But especially you, the viewer, for being awesomesauce!

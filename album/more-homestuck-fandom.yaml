    <i>cookiefonster:</i> ([SoundCloud description](https://soundcloud.com/cookie-fonster/call-and-new-2-chronic-jungle-redone), 5/29/2017)

    [[artist:cryptanark|crypt]] said [[chronic jungle]] from call and new 2 sounded exactly like all my other music from that time (i made that thing in fucking november) so i redid it by remixing the same songs but with actual thought into it so its really a completely different song. i still made it in about an hour total but i like to think im good at music now.

    im not redoing my other song ([[bolin's cereal journey]]) because even though i dont like that song either i dont see much "couldve been better/more interesting" in it either. i mean its already hard enough to make [[artist:splitsuns|splitsuns]] better and i failed in that but at least made a maybe more interesting rack. its still a minute long track i made in an hour but my mind tells me this time the track isnt complete shit.


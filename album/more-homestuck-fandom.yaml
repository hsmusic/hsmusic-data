Commentary: |-
    <i>Buyo:</i> ([Tumblr](https://king-bu-blog.tumblr.com/post/16746825771))

    <b>Nachturne - Void Hopper (Work in Progress)</b>

    So yeah I guess I’m doing [[album:coloUrs-and-mayhem-universe-a|the music contest for Homestuck!]] Roxy is my favorite character so I decided to see if I couldn’t do her justice with a piece of music!

    The beginning is supposed to be wizardy, and I tossed in a waltz rendition of [[track:chorale-for-jaspers|Jasper’s theme because cats]]. After that, I used the bassline from [[Aggrievance|Aggrievance (Mom’s strife theme)]]. Then a chiptune section because she’s a gamer grrrl. I’m still a little unsure about the part at the end because I’m afraid that it might not fit her very well, but we’ll see. It’s supposed to represent her sleepwalking dreamself flying around Derse and the Furthest Ring.

    More to come soon!

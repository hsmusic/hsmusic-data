Track: Bane
Directory: bane-old
Artists:
- Mark J. Hadley
Duration: 5:48
URLs:
- https://media.hsmusic.wiki/misc/archive/Bane.mp3
Commentary: |-
    <i>Mark J. Hadley:</i>
    Whew... this is a really, REALLY old one of mine. I wrote the first version of "Bane" in 2001, and this version (the 'latest' one) was written in 2005. It's been a long time since I did anything with this theme, but I still really like it. I've been thinking about making a [[track:bane-p-s|newer version]] of it (since surely I've gotten better over the past decade, right?).

    I kind of regret not slipping this theme into Homestuck somewhere; I feel like this could have easily been a recurring signature theme for projects I work on (like [[group:toby-fox|Toby Fox]] does with '[[track:megalovania-ebhh|Megalovania]]').

    <i>Quasar Nebula:</i> (wiki editor, 8/13/2025)

    ~~Theoretical~~ common root for the versions of this track released [[track:under-the-hat|on One Year Older]] and [[track:under-the-hat-lofam|on Land of Fans and Music]].

    The booklet commentary on [[track:trollcops]] makes reference to a "fan music piece" called Under the Hat, and gives the impression that this track was publicly listenable, just unofficially/independently released or posted:

    > Also, it should be pointed out that in [[Trollcops (Radio Play)|the version with vocals]], there's a name drop of [[track:under-the-hat-lofam|the fan music piece]] that this is based off of. Yes, it takes this long to re-use things, sometimes.

    Meanwhile [the Tumblr commentary](https://jitmakesstuff.tumblr.com/post/5889719815/and-now-more-piano-recordings-so-i-discovered) for [[track:under-the-hat|the One Year Older version]], recorded either in May 2011 or some amount of time earlier, describes that arrangement this way:

    > In other words, it’s played plain, then with an improvised solo (that has some sucky bits), then through again with a little reprise.

    And *[[track:under-the-hat-lofam|the LOFAM commentary]]* describes the more energetic arrangement there, this way:

    > So this started off as some music for Dad. And then I was like "this isn't strife-y enough!" cause it was supposed to be strife-y and then this happened. Since it's supposed to be battle music and all, the more laid-back chill version wouldn't really work.

    So this track in particular - "original", which is an unofficial title we've given it - is a recording of the track before it had ever been arranged further, "laid-back" and "chill" and simply "played plain".

    ~~We haven't found this track,~~ but figure it's substantially older than March 2011. (Booklet commentary: "It takes this long to re-use things, sometimes.")

    <i>Quasar Nebula:</i> (wiki editor, 8/24/2025)

    We found it! Thanks wertercatt!!

    [[artist:cryptanark|crypt]] said [[track:chronic-jungle|chronic jungle]] from call and new 2 sounded exactly like all my other music from that time (i made that thing in fucking november) so i redid it by remixing the same songs but with actual thought into it so its really a completely different song. i still made it in about an hour total but i like to think im good at music now.


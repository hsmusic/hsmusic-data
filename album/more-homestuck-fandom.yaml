- Rex Duodecim Angelus
Commentary: |-
   <i>Malcolm Brown:</i> ([Tumblr](https://dragonxvi.tumblr.com/post/101437602443/another-music-doodle-today-is-there-a-word-for), 10/31/2014)
   Another music doodle today. Is there a word for those? A Moodle? Muudle? Y'know what sod it it's a Musicoodle.

   Figured I hadn't done any Halloweeny music on 'ere so whipped up another quick. 45 minutes! Although this one's cheating because it's full of [[track:crustacean|borrowed]] [[track:rex-duodecim-angelus|Homestuck]] stuff. It was goin' to be some kind of Underwater Level music originally but then I remembered "Oh yeah, Halloween" so here we are.

   Also hey! That [[track:sound-judgement|Terezi track WIP]] I posted up a while back has had quite a bit of interest. Should have some good news for your guys come the inevitable [[album:homestuck-vol-10|VOLUME 10]] since I've been workin' on it since then, although at this point it's kind've in "Alternate Universe"-ville given the current state of affairs and whatnot.

   Right it's the weekend. Expect another Musicoodle over the weekend of some form. Might even hook up a keyboard and actually compose stuff live which is something I almost never do and really should.

   Good weekend ya'll!

   <i>Quasar Nebula:</i> (wiki editor, 9/24/2024)

   Also unofficially called "Cheer up, crabface, it's Halloween!", which appears to originate from [this YouTube upload](https://www.youtube.com/watch?v=9nQIPA5KcNI) by Cri. Based on [this comment](https://www.youtube.com/watch?v=9nQIPA5KcNI&lc=UgyjeNL5FuLWeRBJt0p4AaABAg.8ZPBmlPLzXh8ZPO2ANyfw6)...

   > I **WAS** going to add the source but I forgot, sorry. I got the entire Homestuck soundtrack from a download link I found from a thread on the wiki, and I don't know how to find it again due to not knowing exactly what I had searched for to find it. My fault all the way, sorry.

   ...it seems Cri obtained this track from the sound test, or a similar source, rather than directly from the composer's Tumblr. This version of the name certainly *doesn't* originate from the sound test, where the track is instead called "Cheer up, Crabface, it's Halloween".

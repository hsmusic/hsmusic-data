    <i>Quasar Nebula:</i> (wiki editor, 1/1/2025)

    The name for this track is taken as [[artist:rj-lake|Robert J! Lake]] refers to it in the booklet commentary for its complete version, [[track:freefall]]. As Makin noted in an in-data comment:

    <i>Makin:</i> (wiki editor, data-file comment, 8/20/2023)

    No official name, this one ["Cascading Events"] is possibly fan-sourced?<br>
    Also known as "Descend2 Demo", "Freefall Beta" or "cascade2"

    <i>Quasar Nebula:</i> (wiki editor, 1/1/2025)

    The MP3 for this track (obtained directly from tumblr) has a date/year field of 2010. As RJ noted in Vol. 10's booklet commentary - this track is older than [[flash:4109]] itself! (There is no track / file name for the MP3 or as part of the original tumblr post.)

    The Descend2 reference in this track, pointing to [[track:descend2-11-24]], is arbitrarily chosen. All versions of Descend2 were posted to Tindeck around the same date ([[date:11/24/2010]]), so we assume the latest, "most complete" version was sampled, but we haven't musically backed this up yet.

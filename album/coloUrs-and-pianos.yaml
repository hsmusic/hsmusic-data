Commentary: |-
    <i>Willow Ascenzo:</i> ([SoundCloud description](https://soundcloud.com/wellmanicuredman/sets/homestuck-colours-and-pianos-1))
    I'm a little late for 6/12, I know, but I just finished some piano arrangements of my tracks from [[album:coloUrs-and-mayhem-universe-a]]. I composed the originals back in January 2012--two and a half years ago! My, how time flies when you're having fun.

    I have to thank my piano professor from last semester for these. No, I can't play these pieces live, not yet at least--but taking a piano course really improved my level of comfort and familiarity with composing for pianos. I just might make sheet music available, though!

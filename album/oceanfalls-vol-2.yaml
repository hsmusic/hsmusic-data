Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor, 3/22/2024)

    This track isn't labelled "(Bonus Track)" on Bandcamp as [[track:atomic-oceanfalls|the]] [[track:kiss-of-death|previous]] [[track:kotori-with-a-gun-fusion-collab|three]] are. It's also not labelled "(bonus)" in the YouTube full album stream, and isn't included in the stream's timestamp list at all. ([It is part of the stream, though!](https://youtu.be/UyeKdsKg0vw?t=4641))

    <i>Quasar Nebula:</i> (wiki editor, 2/13/2025)

    It's not presented as a bonus track in the discography's individual-track uploads either. However, Nights indicated (via [the Oceanfalls discord](https://discord.com/channels/267390861220773889/604990351995830289/1339707325677572199)) that the exclusion from the full-album timestamp list was probably an accident. So, on the music wiki, we're continuing to display it as a bonus track, alongside the preceding three.

Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor, 3/22/2024)

    This track isn't labelled "(Bonus Track)" on Bandcamp as [[track:atomic-oceanfalls|the]] [[track:kiss-of-death|previous]] [[track:kotori-with-a-gun-fusion-collab|three]] are. It's also not labelled "(bonus)" in the YouTube full album stream, and isn't included in the stream's timestamp list at all. ([It is part of the stream, though!](https://youtu.be/UyeKdsKg0vw?t=4641))

    <i>Quasar Nebula:</i> (wiki editor, 2/13/2025)

    This track isn't presented as a bonus track in the discography's individual-track uploads either. However, Nights indicated (via [the Oceanfalls discord](https://discord.com/channels/267390861220773889/604990351995830289/1339707325677572199)) that the exclusion from the full-album timestamp list was probably an accident. So, on the music wiki, we're continuing to display it as a bonus track, alongside the preceding three.

    <i>Quasar Nebula, Nights|[[artist:nights]]:</i> ([Oceanfalls Discord](https://discord.com/channels/267390861220773889/604990351995830289/1339699392374112347), excerpt, 2/13/2025)

    > <i>[[artist:quasar-nebula|Lan]]:</i> Hey [[artist:nights|@Nights]] and [[artist:wights-end|@Wight]], I'm adding the discography-wide YouTube listening links rn, and remembering how Nuclear Winterfalls basically isn't actually displayed as a "bonus" track anywhere... Since it's part of the album stream (from January 2025) but excluded from that video's track timestamp list, would it look good on the music wiki to display it as a "secret track", instead, like below?

    Strange, I don't think that was ever intended to be secret. The missing youtube timestamp is likely just a mistake on my part

    I'm going to edit that and add the stamp<br>
    Sorry for the confusion!

    > That's all good! Just always found it interesting that it's placed at the end of the album, past the other bonus tracks, but not described as a bonus track itself

    Yeah I think that was just an oversight :ninoCursed:<br>
    That reminded me, it was added to the album at like the last minute of production

    *(Continued in [[track:kiss-of-death]])*

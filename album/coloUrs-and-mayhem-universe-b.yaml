    I don’t know how to end this piece quite yet; that’s why it’s a WIP. But it’s reasonably close.

    <i>Elaine Wang:</i> ([SoundCloud description](https://soundcloud.com/hesperidia/dord-density-waltz-final)/ [Tumblr](https://shutthedord.tumblr.com/post/16556672829/dord-final-version-intended-for-the-homestuck), 1/26/2012)

    Dord, final version, intended for the Homestuck music contest.

    "Dord" is a rather amusing typographical error that occured back in 1934 when someone in the Merriam-Webster editing staff misread "D or d", intended as abbreviations for density, as "Dord" and... made up a pronunciation for it. (Whoops.)

    Given Roxy Lalonde's penchant for drunk typing^W^W lexicographical creativity, I thought it was appropriate. The accidentals, at least as much so. As for the waltz part of it... well, I have no idea either.

    <i>Elaine Wang:</i> ([Tumblr](https://shutthedord.tumblr.com/post/21037296442/wow-im-happy-that-i-got-onto-the-album-but-the), 4/13/2012)

    > So is this the part where I go
    > "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    > eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    > eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    > eeeeeeee*breathes\*eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    > eeeeeeeeeeeeeeeeeeeeeeeeeeee, ect" for you? :D<br>
    > i see your song got onto the album!! congrats!!!<br>
    > Congrats on getting into the album, dang!<br>
    > Congrats on making it onto the fan album with Dord Waltz! O:

    Wow, I’m happy that I got onto the album, but the fact that everyone else is happy is making me grin like a lunatic.

    …Not that that’s a bad thing, mind you.

    My song’s Dord Waltz, which I am actually quite surprised got on considering how good all the other songs are too!

    Fun facts:

    1. It was written as a Roxy song. It will now be a Roxy song until the end of the Internet.<br>
    2. I came up with the title first and the music second. The accidentals were there the first time I put down the notes. (They are going to stay there.)<br>
    3. The above is not normal for me. I have more recently taken to using random word generators to title my music, because I often struggle with that.<br>
    4. I am told that the song has some similarities to [[Endless Climb]]. That part is most definitely not deliberate. Not going to rule out subconscious influences though.<br>
    5. The album art is by [[artist:merrigo|merrigo]]. She (?) does cool work. Go look at her tumblr too.<br>
    6. "Dord" is [a real thing](http://en.wikipedia.org/wiki/Dord) that happened in the Merriam-Webster in the 1934 edition. Read the article for more information.<br>
    7. A dord is also [a kind of instrument](http://en.wikipedia.org/wiki/Dord_(instrument)). There's none of them in the song, just so's you know.<br>
    8. Although if you're willing to play Dord on a dord I can send you sheet music.<br>
    9. Full disclosure: I'm not actually finished with the Dord sheet music. Remind me in two weeks and I'll probably have something.<br>
    10. The above two points also apply even if you aren't going to play Dord on a dord. (I have no idea what the range of that instrument is, so whatever.)

    If you’re still interested in my stuff you can go look at my [Soundcloud](http://soundcloud.com/hesperidia). I’d point you to my personal website but I haven’t fixed it in forever, so unless you want to help me redesign it?

    (That’s a serious inquiry by the way.)

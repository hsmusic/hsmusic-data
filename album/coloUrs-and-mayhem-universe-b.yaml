Commentary: |-
    <i>paradiddlesjosh:</i> (co-composer, [Newgrounds description](https://www.newgrounds.com/audio/listen/466582), excerpt, 1/17/2012)

    Here we are, NG. This is the twenty-sixth and final entry of Project 26. A combined 40 hours between me and [[artist:pixelseph]] went into this ending track, between the writing, recording, mixing, remixing and mastering processes (not to mention the software crashes, OH SHIT UNDO actions and other time wasters), but it's finally done.

    We consulted a college level textbook on the art of mixing in order to get the soundscape just right for this piece. The result is nothing short of beautiful, in our collective opinion.

    Now, many of you have probably never heard of, much less read Homestuck (and let me tell you about Homestuck...), so the material in "Clockstopper" will likely be new stuff. Hopefully you'll enjoy listening to new things; otherwise, prepare to be disappointed by the fact that this isn't a video game remix. Hey, we DO do more than just video game remixes!

    Where was I? Oh, right. This piece centers around themes from Homestuck for the character Dave Strider, the Knight of Time. Dave is an all-around badass whose lifestyle revolves around multiple layers of irony, creating music, partaking in TIME SHENANIGANS, and killing shit with broken swords.

    This isn't the completely finished product, though. Seph and I are submitting this piece to the Homestuck Music Contest, where it will be featured in the next Homestuck album if it wins (and that means it's now a piece of commercial music). That means, if it's on NG, we're violating our own copyright by having it available for free when it shouldn't be. This file, however, is the unmastered final cut, so it's technically a different file with a different (Creative Commons) license (and you can totally tell because we didn't even bother to chop off the nine seconds of silence at the end). I'll upload the mastered version if we don't win, though. :P

    <b>TIME/TEMPO:</b> 5'55"/127/135/120/16 0/105 BPM (4/4 and 6/4 time)<br>
    <b>KEY:</b> C Minor

    <b>ORIGINAL THEMES:</b> [["Beatdown (Strider Style)"]] and [["Beatdown Round 2"]] by [[artist:curt-blakeslee]], [["Atomyk Ebonpyre"]] by [[artist:toby-fox]] and [["Upward Movement (Dave Owns)"]] by [[artist:kalibration]]. Some melodic work in the breakdown of "Beatdown" by Joseph Brown (pixelseph/viaSatellite).<br>

    <b>MIDI TRANSCRIPTIONS:</b> "Beatdown (Strider Style)" and "Atomyk Ebonpyre" by [[artist:mrcheeze|MrCheese]] on the MSPA forum. "Upward Movement" was transcribed for piano by BRPXQZME on the MSPA forum.

    <b>SOUNDFONTS USED</b> (* denotes a new soundfont):<br>
    SGM v2.01 (Shakuhachi, Koto, Room Kit)<br>
    Musica Theoria (Standard Kit 1)<br>
    Metal Drums* (MetlDrums 3 Soak)<br>
    Bass Multiple Rock Guitars (FBass w/Harms #2)<br>
    Strings Florestan<br>
    Strings Florestan Martellato<br>
    Caltronix MegaSound GS* (Violin)<br>
    EchoMoog Lead*<br>
    CymbalRoll 2*<br>
    Drum Set Vinyl V1* (Funkdrum 1, Funkdrum 2, Funkdrum 4, Funkdrum 8)

    Guitar tracks recorded using an Epiphone Custom Shop Silverburst Les Paul directly into FL Studio 9 via Rocksmith Guitar to USB connection. Written in Guitar Pro 5; recorded, mixed and (roughly) mastered in FL Studio 9.

    Enjoy! Don't forget to leave a review and check out my other works. Subscribe to the RSS feed of my submissions so you don't miss one! :D

    ~paradiddlesjosh

    P.S.: There will be more Homestuck works to come. It is a thing that is definitely happening.

    <i>Kurimja:</i> ([DeviantArt](https://www.deviantart.com/kurimja/art/HS-Land-of-Heat-and-Clockwork-270993514), excerpt, 11/26/2011)

    Alpha Dave in LoHaC ftw~

    This one was... not as much of a pain in the ass as some pieces have been, but there were a lot of technical problems I was having - thankfully, [[artist:len-yan|len-yan]] was there to save the day as always <img src="media/misc/deviantart-heart.gif" alt="heart" width="15" height="13" inline>

    Mm, done from scratch in Adobe PS CS4 with intuos3 tablet, scaled to 30% of the original size - some detail shots at 100% available [here](https://www.deviantart.com/kurimja/art/Details-of-Land-of-Heat-and-Clockwork-270994754).

    <i>Kurimja:</i> ([DeviantArt](https://www.deviantart.com/kurimja/art/Details-of-Land-of-Heat-and-Clockwork-270994754), 11/26/2011)

    Just a few sections from this piece, scaled at 100%. I'm quite fond of that eye;


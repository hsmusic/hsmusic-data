Commentary: |-
    <i>Plumegeist:</i> ([YouTube description](https://www.youtube.com/watch?v=5sMVgbTOiOc), excerpt)

    Roughly two months ago I submitted two tracks to the Homestuck music contest, and they both won a spot. The first track I submitted was [[Rust Maid]], and it appeared on the album [[album:coloUrs-and-mayhem-universe-a|"coloUrs and Mayhem: Universe A"]]. This is the second track I submitted, and it appeared on the follow up album that was released today. This is a track for the character Dirk Strider, and it's called Orange Hat.

    I'd like to extend some special thanks to [[artist:toby-fox|Radiation]] for helping me master and tweak this track, and also the music team and [[artist:andrew-hussie]] for letting me be a part of this project. It's been a fantastic experience which I will never forget.

    <i>Plumegeist:</i> ([YouTube comments](https://www.youtube.com/watch?v=5sMVgbTOiOc), 4/18/2012)

    > Congrats on getting on BOTH albums! Were your tracks originally made for Aradia and Dirk?

    Thank you! Yes, both were made with Aradia and Dirk in mind. The original title for [[Rust Maid]] was Apocalypse Maid while this track was originally titled Breakdown since I envisioned a sort of futuristic, spiritual successor to [[track:beatdown-strider-style|Beatdown]].

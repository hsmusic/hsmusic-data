Commentary: |-
    <i>Solatrus:</i> ([Bandcamp download blurb](https://solatrus.bandcamp.com/album/endless))

    Endless is an 18-minute trance set comprised of three tracks: Skies, Ocean, and Sands. Each track is related to each other in tempo and in key, but they each follow a different "scene," if you will, reminiscent of their track names.

    By downloading Endless, you'll be supporting me and my music, and directly encouraging me to get some more tracks out. :D

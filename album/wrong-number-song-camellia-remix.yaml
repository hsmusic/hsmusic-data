Commentary: |-
    <i>Camellia:</i> ([YouTube description](https://www.youtube.com/watch?v=Ymex1MC7aDY), excerpt)
    - [[track:wrong-number-camellia-remix|The original remix]] (used in the anniversary stream) was made at the request of [[artist:toby-fox|Toby Fox]], but this full version and the video itself are unofficial works created without his supervision.

    The other day [[artist:toby-fox|Toby]] asked me "I wanted to do something silly for Undertale's 10th anniversary, so I'd like you to make a Camellia remix (8 seconds in total) of '[[track:wrong-number-song|Wrong Number Song]]'." I replied, "It's really ridiculous, I love it," and made an 8-second remix.<br>
    And since I'd love to celebrate it further, I made a full-length version! Using the "[[track:wrong-number-song|Wrong Number Song]]" to celebrate Undertale's 10th anniversary is a rather... fun choice (isn't it), but I'd be happy if it added some flowers to its garden (yellow talking flowers).<br>
    And my friend [[artist:yohaku-monochrome|Yohaku]], who is also a huge Undertale fan, made an amazing music video for it! I hope you enjoy it.

    Happy 10th Anniversary Undertale!

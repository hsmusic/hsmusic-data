Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/the-murky-passage))
    Corvus severs the head of the "Watchman" through a torrent of flame after Annette traps his earthen snakes under ice, and his body is cast into the lake. No longer with a guiding voice, however mad, giving the drones purpose, they become frantic and hysterical. To escape, Annette and Corvus resolve to move with a nearby river deeper into the state of Alacastor.

Track: The Last Great Lake
Duration: 6:32
URLs:
- https://eidolonorpheus.bandcamp.com/track/the-last-great-lake
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/the-last-great-lake))
    "Annette didn't answer, let her blue eyes fall half shut, and gazed over the bow. Her head rested on her knees as she braced her legs against her abdomen as best as she could in the white hide jacket. She was lulled into a dream like state by the mesmerizing gray waters.
    Gerhardt dropped his head with a nodding motion, resting it on the wheel and staring at his boots with a not-so-subtle sigh. He surveyed his ship with a sideways glance, saw everyone he recognized in their places, but found his attention resting upon the girl's odd companion. Barely within the boat, the bird-man leaned over the edge, rags flapping in the wind, as though he were some skeletal vulture preparing for flight. No, he thought, he was what was left of the bird, a pile of calcified memories reminiscing, the flight all in its head."

    Annette and Corvus manage to hire a transport ship to cross Lake Nostros. After a bit of idle chat with the captain, Gerhardt, and a short storm, the crew are greeted by an interesting sight just ahead.

Track: Dear Wasteland,
Duration: 3:15
URLs:
- https://eidolonorpheus.bandcamp.com/track/dear-wasteland
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/dear-wasteland))
    "The eyes behind that enigmatic bird mask always stared ahead, never toward her. His rags made him blend in with shadowed alleys and corners, never stepping into broad daylight unless called upon. He walked silently, but quickly, avoiding attention and diminishing his presence however he could. A curious being, an artificial construct, but neither a golem, being made of true flesh and bone, nor homunculus, being larger than a sparrow. For as long as she could remember, he existed with her family, but for what reasons, she did not know. Ever since her parents' departure, he had followed her and acted like a guard dog, sensing danger and unease, popping out from behind walls occasionally to check up on her, then scurrying back to some hiding spot."

    The pair set up a temporary camp in a secluded, stone outcropping as Annette reflects on her parents' sudden disappearance, Corvus, and their what they'd witnessed thus far.

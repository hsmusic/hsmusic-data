Track: Cinderfall
Duration: 3:12
URLs:
- https://eidolonorpheus.bandcamp.com/track/cinderfall
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/cinderfall))
    "They approached a desiccated fountain outside what appeared to have been the city hall. He didn't relinquish his grip on her shoulder though she strongly felt the urge to shrug him off. Turning counterclockwise in place, she found a path branching from the small plaza. A crooked watchtower, scorched into a new existence as an ashen monolith, stood like a grave at the edge of the town. Hopefully, this was the right place."

    Annette, a young mage, awakens in a small town ravaged by the Miasma and passing military forces. She and her guardian, Corvus, search for a path outlined in her parents' ledger through nearby mountains in their journey to find them.
---
Track: The Ashen Tower
Duration: 3:02
URLs:
- https://eidolonorpheus.bandcamp.com/track/the-ashen-tower
Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/the-ashen-tower))
    "The first few impacted with the ground and rushed at the pair in all manner of unnatural positions. Annette froze, but Corvus took a step forward, extend his right leg, and, with his foot, pushed one head-over-back into the dust, crushing its worn chest. He impaled a second with his taloned, right hand as it leapt over the grounded mongrel. Even with a foot through its upper body, it clawed at his legs, and the other gnashed its crooked teeth, trying its best to pull itself closer to him. With a flick of her wrist, not quite out of her daze, Annette set their heads alight, and Corvus retracted his arm, stepped out of the fallen body, and hurried back to her. More approached, too many to deal with at once. Even the once blazing wall waned dangerously, partially due to her split attention. Stalling them here seemed to be a fruitless effort."

    Finding a watchtower mentioned in the ledger, the two attempt to travel down the path beside it, only to be ambushed by remaining Miasmics not flushed out or incinerated by previous forces. Testing her abilities in a combat situation, Annette breathes in "inspiration," magical energy, from the ruined town, but overuses her conjured fires, burning into her own bodily energy in the midst of the defense. Corvus is forced to drag her from the wretched horde and flee down the path to an old trade route tunnel through the mountains.

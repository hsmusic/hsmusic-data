Commentary: |-
    <i>Jamie Paige:</i> ([Bandcamp about blurb](https://jamiepaige.bandcamp.com/album/matryoshka-club-mix), excerpt)

    Twisted up and marching with a 1, 2, 1, 2☆~

    I remade an old dorky remix of Matryoshka I did for some cool friends of mine who do english covers of Vocaloid songs - not my usual fare, but I think it's cool?

    Check out the video!: www.youtube.com/watch?v=UqLBxAn6XP4

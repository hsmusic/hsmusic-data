Commentary: |-
  <i>lavenderSiren:</i> ([Soundcloud](https://soundcloud.com/shinyjiggly/sets/sbargv2-hotel), 2013/02/09)

  A bunch of midis with SNES samples slapped onto them and minimal post-processing (mostly just fades and echoes). Most of these were just pulled out from my midi archive.

  <i>wertercatt, lavenderSiren:</i> (Conversation in private discord, 8/29/2025)

  *wertercatt:*<br>
  [https://soundcloud.com/shinyjiggly/sets/sbargv2-hotel](https://soundcloud.com/shinyjiggly/sets/sbargv2-hotel) Do you remember which of these are derived from your MIDI archive and which are original compositions?

  [Editors Note: LS sent a bulleted list of track by track commentary here. That has been split up into the individual track pages. Rest of conversation continues]

  *lavenderSiren:*<br>
  as a note, I was very careful not to cross pollinate between publicly released stuff during v2 and staff released stuff during v2, to keep my cover as a staff member intact<br>
  so this collection specifically does not use any officially released sbargv2 related motifs

  *wertercatt:*<br>
  Thanks for the details! It was unclear from just the Soundcloud album description on if these were covers of other artists or covers of your own past material.

  *lavenderSiren:*<br>
  no problem. it's all my stuff, it's just that I used soundfonts from various games on there

  *wertercatt:*<br>
  I'm probably going to attach it to the SBARGv2 'group' page on hsmusic, just for organization purposes. But I think I'll put it under a heading like 'Dubiously Official'

  *lavenderSiren:*<br>
  yeah, it's certainly v2 related, since that album was for the hotel rp (which [FI](https://hsmusic.wiki/tag/rise-emit-sbargv2/) did show up in early on as a retroactive acknowledgement that it was noticed by staff)

  *wertercatt:*<br>
  Do you have a higher res and/or PNG copy of the album art kicking around

  *lavenderSiren:*<br>
  I think so yeah<br>
  fortunately, my v2 nonstaff art folder is called `hotel` so it was easy to find<br>
  note: the first one is a version I applied a gimp filter to, the second one is the crunchy original

  *wertercatt:*<br>
  I think the album art is cropped from hotel2.png?

  *lavenderSiren:*<br>
  yeah

  *wertercatt:*<br>
  Thinking in terms of album colors:
  *SBARGv2 Hotel*: #d48cd3 (Derived from SJ's text color)<br>
  *SBARGv2 Glitchquest Soundtest*: #898989 (Color I'm using for Chronos, because pure black on a #222 background doesn't meet accessibility standards)

  *lavenderSiren:*<br>
  looks good to me
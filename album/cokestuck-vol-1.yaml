Commentary: |-
    <i>DudeBro231:</i> (wiki communications over reddit DMs, 1/4/2026)

    > <i>[[artist:quasar-nebula|Lan]]:</i> [...] I wanted to ask if your album Cokestuck Vol. 1 is affiliated with the MSPFA/comic itself, or if that was a fan album that you made? Also if you had any commentary you wanted to share looking back on that music!

    Yes, that album was officially affiliated with the comic. I approached Lusha early in the comic's run because I liked what he was doing, and offered to make music for it. I think 5/6 songs on that album were used in the comic proper, all of them except [[Larohn Mansion Alt Vers.|the alt. version]] of Larohn Mansion.  As for commentary, I don't really have anything special to say. I wish I mixed some of these better, I guess, lol. Thanks for reaching out, though!

    Oh yeah, I guess if this counts, I also did most of the non-music sound design for Cokestuck (sound effects and stuff like that).

Commentary: |-
    <i>WarxTron:</i> ([SoundCloud description](https://soundcloud.com/user-98942170/ophiuchus-pt-4-takeover-havoc-ft-david-ellis-a-lunatics-daydream), excerpt)

    It is finally here, the fourth part of Ophiuchus, featuring the amazing [[artist:david-ellis]] from Homestuck's Music Team on the Hammond Organ and my friend [[artist:fabricio-podesta]] on electric guitar. Im really proud of this song, probably my best so far. Hope you enjoy!!

    <i>David Ellis:</i> ("Warxtron Ophiuchus Organ Solo" - [YouTube description](https://www.youtube.com/watch?v=-UwPROFqghs), excerpt, 9/14/2020)

    I was asked if I'd do a prog rock style organ solo for another Homestuck fan piece and as I hadn't played much organ for a while I figured I'd work something out and make a video of the recording.

    Done in 2 parts because there's a big settings change that's not really possible to do on the M3 (Drawbars, Percussion and Vibrato all at once on an organ with no presets)

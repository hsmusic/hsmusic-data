Commentary: |-
    <i>Allegra Rosenberg:</i> ([Bandcamp download blurb](https://wethinkwereplayinginaband.bandcamp.com/album/we-think-were-playing-in-a-band-a-tribute-to-tally-hall))

    Download comes with 14-page PDF booklet full of [[artist:tally-hall|Tally Hall]] art & writing from fans across the world.

    <i>Allegra Rosenberg:</i> ([Bandcamp about blurb](https://wethinkwereplayinginaband.bandcamp.com/album/we-think-were-playing-in-a-band-a-tribute-to-tally-hall))

    In November 2005, [[artist:tally-hall|Tally Hall's]] first album Marvin's Marvelous Mechanical Museum was released on indie label Quack. A genre-defying debut, MMMM instantly electrified critics and gained Tally Hall a devoted fanbase.

    Fast forward to 2015. Ten years after the album hit the shelves and four years after Tally Hall left the stage, that fanbase has come together to celebrate the legacy and longevity of Ann Arbor's finest.

    Featuring over twenty collaborators, including some of Tally Hall's former tourmates, YouTube singer-songwriters, members of the Homestuck music team, and many talented young fans, "We Think We're Playing In A Band" pays tribute to Tally Hall with covers spanning their entire discography. With interpretations ranging from the faithful to the wildly inventive, incorporating genres from Brazilian jazz guitar (Rio de Janeiro band [[artist:espinoza|Espinoza's]] cover of [[The Bidding|"The Bidding"]]) to pummeling metal ([[artist:gary-patterson|Gary Patterson's]] version of [[All of My Friends|"All Of My Friends"]]), these covers show off the creative spirit of a fanbase inspired by Tally Hall's musical excellence.

    All proceeds from the album will go towards the University of Michigan’s Mott Children’s Hospital, a charity selected by the band. The download also includes a 14-page digital booklet featuring art and writing from fans across the world.
Crediting Sources: |-
    <i>Allegra Rosenberg:</i> ([Bandcamp credits blurb](https://wethinkwereplayinginaband.bandcamp.com/album/we-think-were-playing-in-a-band-a-tribute-to-tally-hall), excerpt)


Track: Montreal ~Memory~
Duration: 4:32
URLs:
- https://catboss.bandcamp.com/track/montreal-memory
- https://soundcloud.com/catbossstudio/montreal-memory
Commentary: |-
    <i>Catboss:</i> ([SoundCloud description](https://soundcloud.com/catbossstudio/montreal-memory))

    The first track of Stray Cat ~Walkabout~, my first album, which was inspired by a month-long road trip, and completed over the course of a single week. This song is based on my visit to Montreal; more details about the specific inspiration for this song below.

    ------<br>
    "Even if the people forget, a city shall remember..."

    Inspired by Old Montreal. The story is that I went out on a Monday afternoon hoping to go to a few museums but apparently, Monday is Museums-Are-Closed Day or something, because I went to three museums and they were all closed. So I ended up spending three hours just walking around Old Montreal instead.

    It's a rustic place, stone-paved roads and everything. It even has horse carriages! And the buildings are all really old; I love old buildings and architecture. I feel like old buildings have a lot more personality than new ones, like there's a meaning to its design other than cleanliness and efficiency. It makes me feel like every building has a story to tell; what transpired in these halls?

    Perhaps we'll never know.

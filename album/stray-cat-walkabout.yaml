    <i>Catboss:</i> ([Bandcamp about blurb](https://catboss.bandcamp.com/album/stray-cat-walkabout))

    Created entirely over the course of spring break, this 39-minute mini-album is inspired by my travels during winter break of 2011.

    Enjoy!

    <i>Catboss:</i> ([Bandcamp credits blurb](https://catboss.bandcamp.com/album/stray-cat-walkabout), excerpt)

    All music composed and produced by [[artist:catboss|Mai Yishan (Cat Boss)]]

    Special thanks to:<br>
    My travel companions, [[artist:clara-loh]] and Shi Cong<br>
    My fellow [[album:sburb-ost|Sburb OST]] artists and musicians

    Album cover by [[artist:clara-loh]]<br>
    Banner by [[artist:dawn-davis]]

    <i>Catboss:</i> ([Tumblr](https://konec0.tumblr.com/post/20339589497/stray-cat-walkabout-album), excerpt, 4/2/2012)

    This album was made entirely over the course of 9 days, p. much non-stop composing, mixing, and mastering. 8 tracks, total runtime of 39 minutes, which means it isn't quite a full-length album. Hence mini-album!

    But I am honestly really friggin' proud of it. This is easily some of the best material I've ever written, and that's including [[track:guns-blazing|Homestuck]] [[track:vodka-mutiny|contest]] [[track:daywalker-rise-contest|entries]] and [[album:7th-gate-project|the Seventh Gate Project]].

    It's also a very personal project. It was inspired by my travels during winter break and the places I visited, and you don't necessarily have to agree with my (musical) interpretation! I'm essentially experiencing these places from the perspective of a tourist, after all.

    In the coming days I'll probably be posting commentary on the individual tracks, so stay tuned for that if you're interested. Otherwise I'll be tagging them #stray cat so those of you with tag-blocking things know what to do!

    <small>#finally #\*collapses\*</small>

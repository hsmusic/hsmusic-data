Track: Montreal ~Memory~
Duration: 4:32
URLs:
- https://catboss.bandcamp.com/track/montreal-memory
- https://soundcloud.com/catbossstudio/montreal-memory
Commentary: |-
    <i>Catboss:</i> ([SoundCloud description](https://soundcloud.com/catbossstudio/montreal-memory))

    The first track of Stray Cat \~Walkabout\~, my first album, which was inspired by a month-long road trip, and completed over the course of a single week. This song is based on my visit to Montreal; more details about the specific inspiration for this song below.

    <hr>

    "Even if the people forget, a city shall remember..."

    Inspired by Old Montreal. The story is that I went out on a Monday afternoon hoping to go to a few museums but apparently, Monday is Museums-Are-Closed Day or something, because I went to three museums and they were all closed. So I ended up spending three hours just walking around Old Montreal instead.

    It's a rustic place, stone-paved roads and everything. It even has horse carriages! And the buildings are all really old; I love old buildings and architecture. I feel like old buildings have a lot more personality than new ones, like there's a meaning to its design other than cleanliness and efficiency. It makes me feel like every building has a story to tell; what transpired in these halls?

    Perhaps we'll never know.

    <i>Catboss:</i> ([Tumblr](https://konec0.tumblr.com/post/20578498150/stray-cat-commentary-montreal), 4/6/2012)

    \[[Bandcamp embed](https://catboss.bandcamp.com/track/montreal-memory)]

    <i>Even if the people forget, a city shall remember.</i>

    So basically what happened is I went out on a Monday to go to museums and shit, but apparently Monday is museums are closed day? And then I was like "Montreal why do you do this to me" but I got to walk around Old Montreal and it was nice and pretty. I actually really love old buildings, and old architecture. I mean I don't actually know anything about architecture, but it's pretty okay.

    Soooo pretty.

    I also like the idea that every building has a story to tell! These buildings have been around for a long long time - who knows what fascinating things have happened within their walls?

    Anyway! That little walk was - for me - the seed, of sorts, for this album. I remember playing a song in my head as I was walking around. It wasn't this particular song, but that got the idea into my head to make an album containing what is essentially walkabout songs for the places I visited.

    Personally, Montreal is also my favorite song from this album, because I feel that it is the closest to what I consider my usual style. It's a chill song, something of a mix between "real instrument" samples (piano, sustained strings) and electronic things (mostly chiptune-y sounds I whipped up in FM8). It also had me experimenting with something new though, that is to say glitching! (it's glitchy because memory is glitchy get it ohoho i'm so witty) Why did no one tell me that glitching things was so damn fun. Because it is! I use it at least a couple more times on this album, because I love it so much. Expect me to be experimenting more with it in the future!

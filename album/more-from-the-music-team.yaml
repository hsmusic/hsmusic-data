Track: Nautical Climb
Name Style: unofficial
Artists:
- Toby Fox
Duration: 2:13
URLs:
- https://www.youtube.com/watch?v=gbiS4WkCOVo&t=25090
- https://media.hsmusic.wiki/misc/archive/Nautical%20Climb.mp3
Referenced Tracks:
- Endless Climb
- Chorale for Jaspers
Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor, 2/8/2025)

    Included on the Homestuck Sound Test starting with its 4/13/2017 edition. We understand this track to precede [[Nautical Nightmare]] based on Toby's booklet commentary there:

    > Originally Nautical Nightmare was an orchestral piece for Rose's Denizen. I wasn't completely satisfied with the end result so it was ultimately scrapped, but the melody and chords kept dancing in my head.

    We don't have a precise date for this track, but in the same commentary, Toby wrote that he decided to remake it "MANY months later". (AlterniaBound released in March of 2011. Rose's denizen was introduced [in March of 2010](https://homestuck.com/story/1626).)

    Wiki editor Lilith compared the ways this track and [[track:descend]] ([[album:homestuck-vol-5]], June 2010) both include Endless Climb. ([#music-discussion](https://discord.com/channels/749042497610842152/749067042250031214/1282186638545649676), 9/8/2024)

    > <i>[[artist:lilithtreasure]]:</i><br>
    > so [[descend]] references [[endless climb]], but I've noticed that the way it sounds there, here in this one (Nautical Climb) (around 1:13), it's like, less buried and rawer
    >
    > <audio src="media/misc/nautical-climb-endless-climb.mp3" inline></audio><br>
    > <audio src="media/misc/descend-endless-climb.mp3" inline></audio>

    Also, this track's name is probably unofficial. "Nautical Nightmare" *could* be derived from "Nautical Climb", but the latter just makes sense as a combination of the two main two themes apparently referenced. [NSND](https://homestuck.net/music/references.html), for comparison, lists Nautical Climb as referencing Nautical Nightmare, rather than the other way around. Anyone aware of this track probably didn't notice Toby actually talked about it in commentary. (But Lilith did!)

    This track is spiritually succeeded by [[Earthsea Borealis]], as Toby noted in his booklet commentary.

    > I have since done something better called "Earthsea Borealis." Maybe you will hear it someday.

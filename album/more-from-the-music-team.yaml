- Artists: [Quasar Nebula]
  Quoted Artists: [Niklink]
  Annotation: wiki editor
  Date: May 6, 2026
  Body: |-
    We looked into this track in December 2023 (Discord, [#hsmusic-chat](https://discord.com/channels/749042497610842152/779895315750715422/1184982162844418068)). During December 2011, Neil Cicierega ran a [[Brodyquest]] remix contest—of some sort—on Tumblr. Toby was on the ball and submitted a track the next day. It was 0:55 long and is the one we've linked above, in a media.hsmusic.wiki link. However, the version of Brodylovania found in the unofficial Homestuck Sound Test (current YouTube link above; also [[media:misc/archive/3-28 Brodylovania.mp3|wiki archive]]) is longer, 1:23.

    We were starting from the YouTube description that constantDweller wrote in their upload (["Brodylovania - Homestuck Soundtest"](https://www.youtube.com/watch?v=JoQsVkjYt6w), mysteriously 2:35 instead of 0:55 or 1:23):

    > Original “Release Date”: Not released but created in 2011
    >
    > This song is a parody of Brody Quest by Neil Cicierega, Toby probably made it for the 2011 Brody Quest remix contest that Neil hosted on his Tumblr. The robotic voices say “Adrien Brody” repeatedly, this is the actor that the original Brody Quest was making fun of. The person speaking at the start is Toby himself.

    We wrote in December 2023:

    > wait ?? oh god<br>
    > okay so tumblr: 0:55, clearly cut off<br>
    > sound test: 1:24, still cuts off but a bit later<br>
    > youtube: https://www.youtube.com/watch?v=JoQsVkjYt6w 2:35 cuts off at the same "loop" point so<br>
    > i think the uploader just looped it???<br>
    > but that doesnt explain the 1:24 version in the sound test

    Niklink added:

    > there is... one possibility<br>
    > maybe the 1:24 version was posted on mspaf [the mspa forums]<br>
    > i put brodylovania in the sound test and i dont remember the particulars

    Apparently we summed it up in a pull request we never ended up merging, too. Our notes from then, below!
- Artists: [Quasar Nebula]
  Date: December 14, 2023
  Annotation: wiki editor
  Body: |-
    There are two versions of this track archived; a [[media:misc/archive/brodylovania/tumblr_lwjkxwnNJD1qjxbkwo1.mp3|0:55 version]] posted on Tumblr (which has Toby's commentary above), and a [[media:misc/archive/brodylovania/3-28 Brodylovania.mp3|1:23 version]] in the [Homestuck Sound Test](https://sanctferum.tumblr.com/post/638058644066435072/homestuck-sound-test-12202020-edition). The YouTube upload linked ~~above~~ [here](https://www.youtube.com/watch?v=JoQsVkjYt6w) is seemingly a fan-extended version of the Tumblr one.

    The date for this track is taken from the shorter (and presumably earlier) Tumblr version; duration, from the longer version.

    It's not known exactly where or when the version on the Sound Test originates, but Toby's post with commentary is the only one tagged #brodyquest on his Tumblr as of [March 24, 2012](https://web.archive.org/web/20120324114951/http://fwugradiation.tumblr.com/tagged/brodyquest). [[artist:niklink]] (who started the Homestuck Sound Test) doesn't remember for certain, but said the longer version might have been posted on the MSPA forums.

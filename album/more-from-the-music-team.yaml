Track: Ruins
Name Detail: SoundCloud
Date First Released: September 6, 2010
Artists:
- Erik Scheele
- Michael Guy Bowman
Duration: 3:08
URLs:
- https://soundcloud.com/erikscheele/ruins
Referenced Tracks:
- track:ruins
Commentary:
- Artists: [Erik Scheele]
  Annotation: >-
    [SoundCloud description](https://soundcloud.com/erikscheele/ruins)
  Body: |-
    This track is really only half mine. I did the piano stuff, [[artist:michael-guy-bowman|Bowman]] did the rest.
- Artists: [Quasar Nebula]
  Annotation: wiki editor
  Date: May 7, 2026
  Body: |-
    This is a rather different mix of [[Ruins (With Strings)]]. Although it was uploaded to SoundCloud a few months after Vol. 5 released, we haven't got any sure idea which was produced/finalized first, so we've left the two as both branching from [[track:ruins]].

    <details><summary>However, I HAVE A HUNCH...</summary>

    ...that it's the precise track which Bowman shared on the MSPA forums, following up Scheele's original Ruins. See Bowman's commentary: (transcribed from [video commentary](https://youtu.be/85VXWZTg-vo?t=1139))

    > I also arranged strings for a piece by [[artist:erik-scheele|Erik Scheele]], which was called "Ruins". He had submitted Ruins to the forum, and I said, well, here's my, you know, decoration - my production on top of it, I said, this is Ruins with strings, and for whatever reason it was just published on the album as as, you know, "Ruins" - in parentheses - "(With Strings)". Which, I was just like, *yeah,* it's really just Ruins... but you know... whatever.

    Vol. 5 at large has mastering and equalizing work credited first to [[artist:clark-powell]] and then [[artist:toby-fox]], courtesy Andrew Hussie: ([news post](https://web.archive.org/web/20100719132135/http://www.mspaintadventures.com:80/?game=autosave&s=6&p=001901))

    > Thanks to [[artist:clark-powell|Clark Powell]] for doing great mastering/equalizing work on all the songs, and thanks to [[artist:toby-fox|Toby Fox]] for doing <i>additionally great</i> work of a similar nature.

    Plus a general credit, noting how the tracks were generally touched up in preparation for the album: (same news post)

    > Thanks to all the musicians for lighting a fire under their bone bulges to get high quality files to us and of course not being able to help themselves from making all these killer upgrades to the music itself in the process.

    It's possible Michael Guy Bowman, being the producer of Ruins (With Strings) itself, made adjustments before handing off the final cut musicians' track, then Clark and possibly Toby did the usual finishing touches to match/balance the rest of the album audio.

    ALL IN ALL, HOWEVER, since we've only got the two versions and we don't know how far along any process *this* track had reached, we can't speculate all too meaningfully.
    </details>

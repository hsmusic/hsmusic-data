Track: Cascade1
Artists:
- Toby Fox
Excluding URLs: not clearly public
Referenced Tracks:
- Cascade (Director's Cut)
- track:explore
Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor, 5/5/2026)

    We are excluding listening links for this track because we haven't located a source indicating the artist ever made it publicly available. For the wiki's purposes, we *are not* using the 4/13/2018 or later versions of the unofficial Homestuck Sound Test as a source for Toby Fox's tracks.

    <i>ruby:</i> (wiki editor, 4/7/2025)

    As Jebb stated below, there is some uncertainty surrounding this version of Cascade. It is presumably based on a wip version that came anywhere between [[track:cascade-beta|Beta]] and [[track:cascade-directors-cut|Director's Cut]]. As we have no other [[artist:tensei]]-produced versions that came between those two, it is impossible to tell when exactly this one came from. The easiest way to think about it is that this is an edit of what would eventually become Director's Cut. That's why, as of writing this commentary, and unlike as of the writing of Jebb's commentary, this track is listed as referencing Director's Cut. The [[track:sburban-jungle]] and [[track:beatdown-strider-style|Beatdown]] references come from [[artist:tensei]]. It's impossible to tell whether [[artist:toby-fox|Toby]] had access to any stems for the song and was able to make the edits heard in this version himself, or if Tensei provided the base and Toby *only* layered in the additional instruments, but what it comes down to is that Cascade1 isn't in itself relevant to Tensei's "Cascade canon", from [[track:descend-original-version]] to the full [[track:cascade]], which uses a combination of Beta and Director's Cut.

    <i>Jebb:</i> (wiki editor, 12/26/2024)

    This track actually samples some unknown nebulous OLDER version of Cascade which was made inbetween Cascade (Beta) and this one. From what it seems Toby's addition here are the instruments layered on top of the standard Cascade sounding thing, and the Sburban Jungle and Beatdown references are by [[artist:tensei]]. However, we do not have the original version of Cascade which this track samples, so as it is now we are using this track as the reference for [[track:cascade-directors-cut]], as it is the earliest known version of this track which has that little bit at the beginning.

Track: Lupus Mortis Aeternae
Artists:
- Malcolm Brown
Duration: 0:32
URLs:
- https://www.youtube.com/watch?v=gbiS4WkCOVo&t=14121
- https://media.hsmusic.wiki/misc/archive/Lupus%20Mortis%20Aeternae.mp3
Commentary: |-
    <i>Malcolm Brown:</i> ([Tumblr](https://dragonxvi.tumblr.com/post/47559525089/canned-corner-x2-double-canned-combo) re: [[track:calliope-malcolm-brown|"Calliope"]] and [[track:caliborn-malcolm-brown|"Caliborn"]], 4/9/2013)

    These're very short 'n sweet, and were mainly thrown up to give an idea I had for opposing versions of the same theme - namely because I wanted to reuse some stuff I did a while back (which regular viewers will recognize as This Guy [(dead link)](http://scythe-studios.co.uk/music/mspa/lupus_mortis_aeternae.mp3) which I still plan to remake/finish but possibly not for MSPA).

    <i>Quasar Nebula:</i> (wiki editor, 5/7/2026)

    Malcolm Brown mentioned this track (with a link to his own website—[dead URL](http://scythe-studios.co.uk/music/mspa/lupus_mortis_aeternae.mp3)) in commentary on [[track:calliope-malcolm-brown]] and pair track [[track:caliborn-malcolm-brown|Caliborn]]. (Excerpt above! "This Guy" is Lupus Mortis Aeternae.) That URL was never archived on the Wayback Machine, but the track is preserved in the unofficial Homestuck Sound Test. That's what's linked above.

    The track was uploaded to Tindeck at some point, as linked in [Rafe's musician spotlight](https://www.reddit.com/r/homestuck/comments/1p5cx0/musician_spotlight_1_malcolm_brown/). But we're not aware of Malcolm Brown uploading anything to Tindeck, so we figure this might be someone else's upload. Unfortunately the URL was not archived ([dead link](http://tindeck.com/listen/itli)).

    Malcolm regularly posted commentary about his music and other work to his Tumblr blog, and the passage above indicates the track still *was* posted at a previous point. The only thing we could find on Tumblr was [[Yet More Sneakery]], which doesn't include Lupus Mortis Aeternae. So we figure this track was shared on an earlier platform (e.g. the MSPA forums). We haven't dug around much besides Tumblr.

    Lupus Mortis Aeternae *is* included in the sound test from Niklink's time, when he was gathering music from general public spaces (blogs, youtube etc). Seeing as Calliope and Calliope *aren't* included there, Niklink must have grabbed this track from wherever else it was shared, earlier on. (From available sound test track listings, this track was added between 10/27/2011 and 1/20/2012.)

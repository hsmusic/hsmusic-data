    Here's my contribution to Vast Error Vol. 4, the latest album from the Vast Error Music Team that released this past Halloween! It's a character theme for Occeus Coliad, a reclusive scientist with a mysterious third eye who is determined to save his race from an undead plague. I felt drawn to make a dark and foreboding track for this troll, and I hope it fits the season.

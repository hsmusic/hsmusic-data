    This was made for Vast Error Vol. 4, and it's about Occeus and Calder who are both supposedly linked together by an interest/obsession with immortality.

    Immortal is one of the most "different" things I've made. I actually love music like this and this was my first attempt to make it that didn't fail miserably. Thank you so much to [[artist:silentneptune]] for the sexy track art.

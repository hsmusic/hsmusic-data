Commentary: |-
    <i>Guffy:</i> ([Bandcamp about blurb](https://guffin.bandcamp.com/track/jail8r8k))

    2025/05/23

    yo that one scene where vrissy and vriska breakin out of jail<br>
    thats the idea lol!<br>
    tried fucking with a few time signatures but landed on basic ass 4/4. got that mission impossible-ish bass, though its kinda similar to some other vriska themes?<br>
    currently got a kinda stand in drum rhythm, just a In Built Groove in my plugin.<br>
    but! i think ive gotten a good enough vibe for the main guitar part. i dont have access to the guitar soundfont used in tracks like [[track:killed-by-br8k-spider|killed by br8k spider]] or what have you, but that kinda long vibrato-y guitar ive got a hand on. im also quoting [[track:killed-by-br8k-spider|killed by br8k spider]]'s melody a bitty. yay !<br>
    i also have power chord guitar. might replace this with some synths or chiptune ass stuff. iunno !

    2025/05/24

    i replaced the chords with some synth stuff, and arpeggiated it in the next section. redid the drums, and did fun Tom Stuff in section two!<br>
    section two also has excerpts from [[track:superego|superego]], as well as a second guitar doin' some [[track:spiders-claw|spider's claw]]! having fun mashing these things together.<br>
    section three: pulling back all da instruments same for the kit and bass, because its time for a bass solo. for the most part it is just what Sounds Cool, and then that bit of [[track:spiders-claw|spider's claw]] again.<br>
    at this point it feels like im almost dropping the mission impossible type of thing and its just back at Vriska Shit. thats fine ! im having a great time with this. its da process baybee

    2025/05/25

    i need to stop umming and ahhing over the idea that "every character needs an instrument" but im thinking about like... here vriska is the guitar. clear and in the front and shit. but hand off the bass to vrissy maybe? during the jail break its about testing her skills and stuff. vriska can just Break Out, but it's vrissy's test.<br>
    anyway ive doubled the bass solo lengths lmao<br>
    i keep going "man how do i make this longer" and landing at the though of hey not everything needs to be Long<br>
    having the second guitar line at points kinda gives a bit more weight to the Two Vriskas situation. idk ! ive had a lotta fun making this.


Commentary: |-
    <i>Guffy:</i> ([Bandcamp about blurb](https://guffin.bandcamp.com/track/gumption))

    2025/06/02

    as of this moment, i dont know if i'll be writing this track!<br>
    i want to write something for jake. sort of left stuck under jane's thumb. being her husband is a toll, especially when shes. you know. like that.<br>
    being brought to his senses with ghost brain dirk, helping the resistance against jane, up to trying to Blast Her Head Off, and the subsequent [S] 8r8k.<br>
    i want to something that shows that oppression/hopelessness he had, and follow that train into becoming one with his aspect again.<br>
    to this effect i want to sample songs (or use libraries that are somewhat harsh and sound like they could be sampling) to build the start, something gritty and basically [[artist:nine-inch-nails|nine inch nails]] like, but grow it out into a big blossoming orchestra.<br>
    we'll see what happens.

    [later]

    fucking around with something, but its messy. maybe too agressive and not oppressed? dunno as of yet, but i have infinite time to play with it.<br>
    he was sort of just. a puppet for jane to control, and he wants to break free.<br>
    putting a lead in with a segment from [[track:elephant-gun]].

    2025/06/03

    im enjoying how this sounds a lot but at the same time, i am struggling to find its relevance for jake? its just not quite hitting it for me yet, i dunno.

    2025/06/04

    im at the big orchestra now! ive kinda successfully shifted it to major, but i need to make the transition nicer i think.<br>
    if i had my acoustic guitar library working (fuck you native instruments) id probably be using it here but whatever.<br>
    holy fuck this thing is going to be a nightmare to mix<br>
    i am now changing the title to "GUMPTION", for reference, it was "I hope we make it."<br>
    title change is like. the original title is not something that is said in the comic (probably) and is just there because it contains the word hope, which is The Jake's Thing. kinda chose the title at random before.<br>
    while gumption is a word that Jake uses and i think it fits definition wise<br>
    "(I finally grew the gumption to get off the back foot, and were all going to meet the reaper regardless.)" ([p.628](https://beyondcanon.com/story/628))

    2025/06/06

    trumpet :)<br>
    im starting to struggle through this thing, im picking away at it slowly. in comparison to the other songs ive done so far which had maybe a max of 5 or 6 tracks, this has 23. wooooooooo

    2025/06/09

    sort of realising that like. the way ive been drescribing it, this track can be used for Jane as well? since shes Doing the Opressing.<br>
    anyway, I think this is done. unless i can find something actively wrong with it i think we are golden.

    <i>Guffy:</i> ([FRAF forums: "Beyond Canon fan music"](https://www.fruityrumpus.com/forums/reply/688f5e9e8bcb18323dd135a4), excerpt, 8/3/2025)

    GUMPTION is a track about like, jake leaving the oppression of jane and getting back to his Hope Filled self. uses a bit of motif from [[track:elephant-gun]].

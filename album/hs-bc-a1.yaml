Commentary: |-
    <i>Guffy:</i> ([Bandcamp about blurb](https://guffin.bandcamp.com/track/ectogenesis))

    2025/06/23

    i want this to be a longer, drawn out track. more mellow and synthy. dirk and rose(bot) focused, making their new player races for the new game. part of why im doing this track is because i have like what, 3 tracks from the candy timeline? damn thats actually less than i thought lol. i thought it was a vast majority. i guess my brain has seperated deltritus schenanigans to those who are travelling there and Catnapped (mentioning these two because i have done music for those lol). all meat/Canon timeline!<br>
    finally using motifs from Beyond Canon, im grabbing "[[track:now-im-a-villain]]" for a bit of dirk echoes<br>
    the swarminet is such an interesting sound to use. i want to use these swarm instruments more. big thanks to paul koch for making these and putting them up for free, and getting back to me instantly when it down so i could use them. theres something about the like. sudden bits that stick out? like a new clarinet joins the swarm but it starts too loud before it comes back down, or its almost doing a drive by doppler effect style almost. dunno what im talking about, its 11pm and im rambling.

    anyway. something about ectobiology is so... incomprehensible and scary to me. ive never really gotten the mechanics it. if someone explained it to me maybe i'd uderstand it for a minute but i'd lose it again. its probably my memory being the main issue in that kind of situation but you know!<br>
    the work is important for dirk and rose, it has to be done. of course, they're making entirely new species for their future game. along the way they're fucking up and making horrible things and its rough and scary. id imagine deltritus being almost serene and then an abomination that these two have let out after finding it imperfect just comes up and rocks my shit<br>
    im trying to justify why this has a kind of scary tone for some of it. that swell in the first section.<br>
    i need to make it sound more like its in the cave, in the lab.<br>
    maybe remove that drum side stick. we were kind of using it as a click but became attatched, but we probably dont need that. add more texture around instead.

    2025/06/25

    yoinking a bit of [[track:assembly]] as well. makes sense I think, i'm assuming that track is kind of similar in vein for what im doing. assembling the new players and stuff. journey to a new session. idk. its the pit in the pizz strings here, kinda early on in [[track:assembly]].

    2025/06/27

    terezi is here too of course. i wasnt going to add harpsichord but there had to be at least a bit on this album, i love harpsichord so much. terezi has big shoes to fill i think<br>
    after a terezi section, adding a shooort break with more swarminet being scary. dirk influence on the story, changing things back to align with his will, making the harpsichord and pizz strings follow his motif.

    2025/06/28

    the thing about a track this long is its hard to fucking mix. i get distracted very easily so its hard to sit down and just. Listen To It for the whole runtime!<br>
    i added some like. electrical interference sounds and some Bubbling shit for background ambience. theyre in that lab. my favourite hs:bc panel is dirk walking by a ton of server racks. theres cool green Tubes with creature.

    just thinking more about the implications of how i wrote this again. the pizz strings have their own thing but they mesh into the dirk motif pretty easily. terezi's section is just too bombastic and separate from everything, it would outshine dirk's motif, so he has to grab it and pull it in line. may as well line up the strings at the same time. i know i said this shit last entry but still. elaborating a little bit more<br>
    terezi's harpsichord is original (or at least is intended to be, i dont think i grabbed any motifs for it)

    <i>Guffy:</i> ([FRAF forums: "Beyond Canon fan music"](https://www.fruityrumpus.com/forums/reply/688f5e9e8bcb18323dd135a4), excerpt, 8/3/2025)

    dirk and co./meat timeline stuff. grabbed some motifs from "[[track:now-im-a-villain]]" from the beyond canon album

    wheee

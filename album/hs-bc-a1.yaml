Track: can i sit down
Duration: 3:20
URLs:
- https://guffin.bandcamp.com/track/can-i-sit-down
- https://www.youtube.com/watch?v=nhwvpD1YYxE
Referenced Tracks:
- Upward Movement (Dave Owns)
- Darling Kanaya
Commentary: |-
    <i>Guffy:</i> ([Bandcamp about blurb](https://guffin.bandcamp.com/track/can-i-sit-down))

    2025/05/21

    first track writing for this thing. this album or what have you, if thats what this is. been wanting to write more 'core' homestuck music for a while.<br>
    couldnt figure out what i wanted to do, where to go with an album so... just decided to start reading. i havent gotten back to reading hs:bc since the hscu took over it, so i thought i'd read, catch up, get some ideas.<br>
    theres a scene early on ([around page 108](https://beyondcanon.com/story/106)) where kanaya and dave just. sit down and talk a bit. talk about feelings?<br>
    something resonated with this scene and me. this was a thing to write for, i guess.

    from memory (which is admittedly pretty spotty) kanaya's themes are sort of piano-y, based higher in the register. usually a bit dense, notes wise? i dont know if what im trying to say is coming across but ive written a part for her which is less that. more open and sparse. rose "left" her and shes... mourning? again, im bad with words. she thinks about her a lot.<br>
    dave's part is pretty clear in the percussion. the whole piece is drowning in reverb and echoes, which fits the emotions flying from the two. dave's lost a lot of his friends, but still has some family.<br>
    the string part is a piece of rose, but in this case its meant to be calling back to instrumentation in [[track:upward-movement-dave-owns|dave owns]].<br>
    as of the current date i have some horns in there (karkat representation) but im probably going to remove it. it makes this thing more agressive sounding, but a. thats not the vibe i really need in this track, and b. hes elsewhere.<br>
    i dunno man.

    2025/05/26

    i added a bassline with like. sega genesis bass stuff and gave it a 'solo' because Here, thats for dave. bit of arpeggio stuff over it in the piano. did this a few days ago and forgot to write here that i did it. oops.<br>
    i should probably put like actual motifs from either of their themes in here but i cant really figure out how. over the bass solo thing i put the [[track:upward-movement-dave-owns|upward movement]] drum line in at least.<br>
    actually figured out how to do it. its a small segment, but in the piano im adding a teeny bit of [[track:darling-kanaya|darling kanaya]], the melody movement at like 15 seconds in.<br>
    i felt Bad having a dave motif but being unable to put a kanaya thing in when its equally her song as well. glad i fixed that. now this track can be over.

    <i>Guffy:</i> ([FRAF Forum](https://www.fruityrumpus.com/forums/reply/6891788012d2f423d1be95f8))

    can i sit down - that scene where dave and kanaya have a chat on their ship kinda early on in act 1. i think this was the first track i wrote when i decided to make this album!

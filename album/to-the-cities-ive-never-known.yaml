Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/bird-song))
    I don’t know how much I’ve said about the forever-unfinished Eagles and Swans musical, but I’ve only ever released one other song under this concept: Memorialisation.
    Bird Song is the second. It was conceptualised as a character song for Hollia, a birdkeeper who inherited her job from her parents. (Hollia is also the character featured in the track art for Idyllic.)
    The introductory piano refrain and the line “How can you miss something you’ve never had?“ have existed in my MIDI drafts since 2016 or so, but I never had any push to complete the song...
    ...until I had a dream about writing a four part vocal harmony that just happened to have the exact chords I had envisioned for Bird Song. I recorded it the minute I woke up and, just like that, the song fell together. First the piano draft, then the orchestral rendition.

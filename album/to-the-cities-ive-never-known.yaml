    Written for [[artist:neotheatre]]’s House of Haunts • https://toyhou.se/HouseofHaunts
    Hauntsong began as a 6-instrument song for NECROTHEATRE, but I always felt like the composition was suited to a full orchestral piece, so I went ahead and expanded the instrumentation.
    House of Haunts tells the story of a cook-for-hire who joins the titular houseand becomes trapped in a game where newcomers must face a new opponent every night, either defeating them or being fed to…whatever lives in the pit. It's eerie, it's gay, it has astronomical symbolism. Various lines here reference the manor’s many rooms and past inhabitants.

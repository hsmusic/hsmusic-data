Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/wherever-you-were))
    Wherever You Were is a character song for Marin and Cielo, the deuteragonists of my webcomic [[Compass]](https://compass.circlejourney.net/) who spend the story sailing in search of the edge of the world. It was an absolute privilege to collab with Céleste on this; I sing Cielo’s part and she sings Marin’s.
    Long before they meet, the two sense there’s something they are searching for without knowing what it is. The lyrics gesture at the sense of déjà vu they have when they see each other for the first time in a port city.
    Wherever You Were was initially released by itself, and I wrote a big block of commentary (https://circlejourney.net/music/whereveryouwere/) to accompany it. I’m so pleased with how it came out that I decided to rerelease it here with improved production.

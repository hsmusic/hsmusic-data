Track: Rainy Sunday
Duration: 1:06
Lyrics: |-
    From the first pitter patter
    A flock, a flight, a chatter
    Of birds that must know better
    I feel the wind grow wetter
    All through the streets a whisper
    The rising southeaster
    Turning the wind rose, there's
    Something coming closer

    Empty office calling
    Twenty five and falling
    Every boats a-mooring
    Tidal forces shoring
    Radiowaves are roaring
    Word has started pouring in
    They say we'll begin
    Breath in, and

    Bang, walls fall like paper
    Wind swings skyscrapers
    Watching radars, arrays of rain and vapour
    Boom, a beach goes under
    Shorelines shake with thunder
    The gales will gather while we
    Wait and wonder

    All the trees are thrashing
    Powerlines are lashing
    Joining neighbours
    To watch the lightning flashing
    All alone together
    Talking 'bout the weather
    A rainy sunday that goes on forever
Commentary: |-
    <i>Circlejourney:</i>
    Rainy Sunday was written in March 2025, while/about waiting for Tropical Cyclone Alfred to pass. I recorded the entire songwriting process, which you can watch on [YouTube](https://youtu.be/2Ytumk4xjss).
Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/the-fall), excerpt)
    Undertale, am I right? I wrote this song for a [[album:kindred-souls|10th anniversary Undertale + Deltarune album]]. I won’t repeat the full commentary here, but it’s inspired by the interpretation of the Undertale intro where Frisk is on Mount Ebott for a suicide attempt.
    I guess it is somewhat my style to take a dour, even ~edgy~ theme and turn it into an upbeat, optimistic song. I relate to that version of Frisk standing at the top of the mountain wondering if it would be better to end it all, but went on to save everyone else in the process.
    Glad I could finally pay tribute to a game that has changed many lives. It was cathartic to lyrically portray the notion that you mean the world to far more people than you could possibly imagine.

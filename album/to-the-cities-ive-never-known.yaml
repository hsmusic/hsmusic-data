Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/and-scene), excerpt)
    ...and scene was inspired by the art piece by DDP (left) for the Unofficial MSPA Fans’ Fondly Regard Illustration. (For that album, artists drew their illustrations first and then musicians created tracks based on them.)
    The painting features Ardata from the Hiveswap Friendsim, a livestreamer who tortures trolls for her audience’s entertainment. A completely sound way of coping with your problems if you ask me.
    I wanted to hint at the disjoint of her on- and offscreen identies and the way the horror of her daily doings seep through the cracks in her facade, no matter the image she projects on camera.

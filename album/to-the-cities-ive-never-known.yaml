Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/down-the-road))
    Down the Road came to me in a dream where I was still a teen living in Singapore. In the dream, I was producing this song in FL Studio, and I listened to the chorus so many times that it was still stuck in my head when I woke up.
    I’m a part-time country music aficionado; beyond the predilection for the major pentatonic scale and lyrics about mundane details of everyday life, I love the way many of them tell a story that gradually changes the meaning of a repeating chorus or refrain.
    In hindsight, my love for such narrative songs heavily influenced my songwriting style, and that’s probably why dream-me chose to make one in homage to that.

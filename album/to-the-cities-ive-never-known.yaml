Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/postcard-lullabies))
    Postcard Lullabies is the most biographical song on this album. Here I go inventing a spectrum of biographicality just for this album, but if the majority of these songs are a 1 – 3 on the scale, then Equator is a 7, and this one is a 10.
    This song was originally intended to be the third track on my EP Love Letters, but for various reasons, it finds its home here instead.
    I could go on for ages about all the significant details here, but the most important is the quote of [[track:interlude-machina-solis]], a song that (to my knowledge) is not publicly available to listen to and will likely remain that way. Unearthing the stems for that song in an old USB drive is what made Postcard Lullabies come to be.

Commentary: |-
    <i>Circlejourney:</i> (Booklet commentary)
    “There is no place that is not haunted by many different spirits hidden there in silence, spirits one can "invoke" or not. Haunted places are the only ones people can live in—and this inverts the schema of the Panopticon. But like the gothic sculptures of kings and queens that once adorned Notre-Dame and have been buried for two centuries in the basement of a building in the rue de la Chaussee-d'Antin, these ‘spirits,’ themselves broken into pieces in like manner, do not speak any more than they see. This is a sort of knowledge that remains silent. Only hints of what is know but unrevealed are passed on ‘just between you and me.’”
    Michel de Certeau, The Practice of Everyday Life (translated by Steven Rendall)

    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/album/to-the-cities-ive-never-known), excerpt)
    Can we ever truly know a city?
    
    By the time we believe we’ve distilled its essential nature—strained it out of that bright chaos of sensation and emotion—wouldn’t it have morphed into something different?
    
    What do we have but the stories we tell about them?
    
    I love writing songs about those stories: the ones we tell about places, that become those places in time. I see it as one of the wonders of music, that we can conjure landscapes, scenes, and atmospheres with simple turns of melody and phrase.
    
    To the Cities I’ve Never Known is a compilation of my favourite songs from the past two years. Some are about narrative and imagined worlds. Others are about cities that are hazy from years of distance; yet others are snapshots of scenes that now only exist in memory.
    
    All of them are about the places that haunt me wherever I go. Enjoy!

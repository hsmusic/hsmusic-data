Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/dreams-and-wakes), excerpt)
    Dreams and Wakes is the second track on this album that was made for [[group:unofficial-mspa-fans|UMSPAF]]’s [[album:fondly-regard-illustration]]. This one was inspired by [[artist:selan-pike|SelanPike]]’s illustration of Problem Sleuth (main character from the comic of the same name) using his final attack Sepulchritude, rendered here in the Renaissance Piéta motif.
    Dreams and Wakes aims to evoke the feel of transcendence and the deific themes of the comic scene and the art piece. Why does dreamy dancepop sounds like gods and angels to me? Not sure, I just rolled with it.
    I had many candidates for the penultimate track, but of my repertoire from the past 2 years, this is perhaps the track I’m proudest of, and I wanted it in my public discography.

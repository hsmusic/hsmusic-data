Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/equator))
    I wrote Equator the day before I left on a trip back to Singapore, and it ended up being about that moment in time.
    Usually, these kinds of songs are about escaping to a tropical paradise...so I wanted to subvert that aesthetic with lyrics that are instead about wanting to go home.
    跟我一起看大海: come watch the ocean with me<br>
    海浪代表我的爱: the ocean waves symbolise my love
    The latter line is structurally a nod to the titular line from 月亮代表我的心 (the moon symbolises my heart).

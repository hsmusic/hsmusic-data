Commentary: |-
    <i>Circlejourney:</i> ([Bandcamp about blurb](https://circlejourney.bandcamp.com/track/time-keeps-marching))
    As a teen, running away from home/school was how I coped with feeling like I wasn’t enough. Time Keeps Marching speaks to that: the solace of vanishing into the unknown, the magnet-pull of home, the comfort of knowing it will pass. (It’s probably a 5 on biographicality.)
    The project was initially spliced together from two different drafts that happened to have the same chords and syncopated rhythm—one with the bells and strings, the other with the piano. I meant for it to be instrumental, but after a few listens I sensed a sparkle that compelled me to start singing lyrics over it.
    I knew the layered sections needed multiple singers to distinguish the various voices. I’m incredibly grateful that I got to collaborate with [[artist:ucklin]] and [[artist:d-taylor|Waltz]] and for how much their vocal talents add to the track!
Crediting Sources: |-

Commentary: |-
    <i>Cool and New Music Team:</i>
    no things besides re mains

    <i>cookiefonster:</i> (Booklet Assembler)

    Happy tenth anniversary to the Cool and New Music Team! Or technically, happy tenth anniversary to the team’s first album, since the team was founded on June 18, 2016. We released [[album:cool-and-new-voulem1|volume 1]] on July 2, 2016, and since then, we’ve done several anniversary albums: [[album:9|9]] for our first anniversary, [[album:cool-and-new-volume-3|Volume 3]] for our fifth anniversary, and now Volume 4 for our tenth anniversary.

    Even though Volume 3 was meant as a final album for the team, all of us agreed it’d be a good idea to do a brand new album for the tenth anniversary. All of us also agreed that I’d be the one assembling the booklet again, although I put that off until a few days before the album release. Then in those final few days, my brain refused to let me work on anything other than this booklet and the remaining track art for this album.

    All of us on the team are very proud and excited to present this new album, and I can promise you we have more CANMT projects coming up later this year.

    <i>pktgrillao:</i> (Cover Artist)

    I live next to the beach. It's been a clear inspiration for me and it's an integral part of who I am. That's why it's one of the things I could portray even with my eyes closed. And... about what the art itself means? I took a good look on how [[media:album-art/cool-and-new-volume-3/cover.jpg|Volume 3's cover]] portrayed an ending, and I thought that I could do a good continuation off it. How? Making a parody of the ending of The Planet of the Apes where Jhon did not escape, but instead travelled to a future where the CANMT is back in full force, which is now.

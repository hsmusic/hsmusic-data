Commentary: |-
    <i>Cecily Renns:</i>
    This song and title is an obvious nod to [[artist:alex-votl|Alex Votl's]] [[Not Canon in F major, Op. 69|"Not Canon in F Major, Op 69"]] from [[album:beyond-canon|the Beyond Canon album]]. I'm a big fan of Alex's work, in particuarly their [[album:sbahj-the-album|"SBAHJ: The Album" record]], which I maintain is the best piece of Homestuck fan music of all time. I'm just a sucker for this combination of emo-pop and chiptune. So this song is a tribute to his works, and also to my good friend [[artist:cryptanark|Crypt's]] compositions, which I believe are some of [[Unintentional Touhou|the most iconic]] and [[Tick / Tock|memorable motifs]] from all of the CANMT discography.

    <i>pktgrillao:</i>
    This art shouldn't had taken a month. But it did anyways! Cecily suggested to take inspiration from [[Not Canon in F major, Op. 69|Not Canon in F major, Op. 69's]] art and I gave it a cool and new webcomic coat of paint. And also a Flandre Scarlet Hecka jef from [[Unintentional Touhou]] fame. [[artist:jebb]] suggested some final touch ups and I gotta give him credit for it because it really looks better.

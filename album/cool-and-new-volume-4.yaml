    <i>Cryptanark:</i>
    Thank you to the team for inspiring me to create. Thank you, listener, for encouraging me to be me. I'm so grateful for these memories. What can I say—it's cool and new.

    <i>Cecily Renns:</i>
    If I may elaborate on the song, Gio posted [the Bluesky post (or skeet)](https://bsky.app/profile/im.giovanh.com/post/3mfa74gxys22r) depicted in the art, and we had a good laugh about it, and Crypt was the only one who actually decided to dedicate his song to Gio. As you might know, Gio is a good friend to many of us, and as the former maintainer of the Unofficial Homestuck Collection, we all owe a debt to him for providing us with the best method to experience Homestuck. They'll never make us hate you, Gio. Thanks dude! (As for the art, it was entirely Crypt and [[artist:jebb|Jebb's]] idea, and Jebb and [[artist:wights-end|Wight]] did the final touches, so all credits goes to them)

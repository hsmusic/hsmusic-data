- track:sunrise # one year older
- Showtime (Original Mix)
Lyrics: |-
    Mornin’ spreads as I hit the road, on my way to meet old friends
    A faded sunrise from my past, is spreadin’ far ahead
    I see the open light
    Greeted kindly by all I missed, ever since I moved on
    It’s almost like I never left; I hear the same old songs
    They take my hand and say

    “Hey, it’s okay that you’re here.
    And we would like it if you’d stayed, for a while
    While we move ahead
    It’s so much better travellin’ with a friend around
    When you’re leavin’ homeward bound”

    Land of wind and evening shade, and sweet gardenia scent
    The silhouette of my younger self, stands amidst the well
    She smiles and softly sighs

    “Do you recall how it felt when we were part of the parade?
    We’re still here; not a thing has changed!
    There’ll be band tunes and plenty of merry-go-rounds
    When we head back homeward bound”

    “Light, Space and Time, Air and Me are one
    We solemnly walk past this same old ground
    And movin’ onwards, only facing forward now
    We’ll be leavin’ homeward bound”
Commentary: |-
    <i>WarxTron:</i>
    Was very, very moved to be invited to contribute to this album. I stepped down from making Homestuck tracks in 2020 when I contributed [[track:ophiuchus-full-suite|a fairly lengthy progressive rock track]] to [[album:lofam5|Land of Fans and Music 5]]. I felt this reunion album was a good opportunity to come back and do the exact opposite. So I came up with this gentle folk Neil Young-ish song with some Homestuck leitmotifs that I never stopped loving. I dedicate this track to everyone on this team, for these awesome ten years, and for giving me the space to grow as a musician and be a part of this community back when I was just a kid with FL Studio and far too young to be reading Homestuck. Even though I wasn't involved throughout much of CANMT's history, I always felt like everyone saw me as a part of it. Being invited back for this album genuinely meant a lot to me. Thank you all.

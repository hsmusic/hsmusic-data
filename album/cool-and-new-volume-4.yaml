Commentary: |-
    <i>Shwan:</i>
    Alternatively, Variations on a theme of Crypt. Although the variation is not on the theme itself but the accompaniment and harmony. So technically this is closer to a Passacaglia? But not really that either, since it's not written in triple meter and the ostinato is not on the bass so idk :P.

    Regardless, I like experimenting with modernizing classical forms. I tried to make each variation as unique as possible to avoid boring out the lsitener while still making everything feel connected as a whole. I hope you will enjoy it as well :D

    <i>pktgrillao:</i>
    I wanted to make something that represented [[Moshi Moshi]] as a motif. Decided to take a small hint from the song and place 12 references to other Moshi Moshi related arts, even ones from volume 4. So, let's play a game, if you find my 12 evil references you'll win a golden ticket to the cool and new factory. I'll give you a hint. Vrasky counts double.

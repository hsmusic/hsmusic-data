Commentary: |-
    <i>Cello:</i>
    I'll be completely honest and admit that I joined to work on this project entirely as a whim and to be able to do something for this community that has given me and everyone else so much. I think it's pretty common that everyone's first shot at everything kind of suck, and I'll admit that my track art isn't exactly the prettiest thing, but it's Neat enough for me to accept it as my first art.

    For Vast Ruses, the idea immediately came up to me was of this great SBURB treasure that could be deployed multiple times to create ruses and distract enemies for massive damage. I described it also as "some sort of high-tier item you'd get if you went down some bastardised SBAHJ-ified SBURB alchemy route", which I think is fitting with CANWC.

    If it sounds like there wasn't much thought in trying to fit this into CANWC properly beyond the obvious reference, it's because I honestly haven't read or thought of Cool And New Web Comic in so long that all I could keep in mind was Sweet Bro And Hella Jeff, so the sock in the picture was cut from the sock ruse strip.

    And to finish my commentary:<br>
    - I would like to apologise to pixel artists for underestimating how hard pixel art really is.
    - And a fuck you to GIMP for its piece of shit UI.

    also wheres my vn [[artist:o]] you circular fuc

Commentary: |-
    <i>ft-rj:</i>
    it's ten years later and i am now ten usernames in. funny how that works. in retrospect, "_" and repeating it a few times was a shitty username idea, but it wasn't much better than what i ran before that, which was precisely twenty colons "::::::::::::::::::::" on various forums. so, really, i didn't come up with a username of true usernamence until i was 18 with 'sylvarn', but then it clashed with some french guy in a game i was playing, so i changed it to 'ft-rj', since i'd already been going by rj for years. this was timed pretty well as it allowed me to kind of have an organic musical identity? of sorts. not much of the old has followed me into the new, though i'll always be really happy about how this team took me from zero musicality to All Of It. seriously, i think i'm really good. maybe too much, actually. it's like the opposite of how i was back then! ahem. now, anyways. haha, [[artist:rollercoaster-tycoon|roller coaster]], am i right? you don't find that funny anymore? revise your edition? no? shit... what? what's that? aaAH... [...]

    [unpause.] it has been 10,000 years. i have lived a hundred lives. [[Meet the Flintstones|grand dad]] is still not that funny but pretty cool when it shows up in a [[artist:siivagunner|siivagunner]] rip. cool and new volume 12 is just about ready but they're asking me to do some commentary. audacity 8.5947.4 version b134 can do your mashups for you, and it sucks. i still haven't saved up enough for my beloved fursona to get a suit of. what? you're saying this text box goes to the past? no, no way. time travel isn't even real, the felt were a bunch of hacks... hacks... wait a second... i could hack into the cool and new government mainframe. I'm sure they have a way...

    [BEEP!!!!]

    ---AH, ah. what was that? that was scary. anyways, revising another edition some day, i just can't figure out how to do it. fl studio 25 kind of fucked with the tempo matching and i don't wanna do it manually again. by the way, my bandcamp is ready to go and has been for years. everyone should move there now if you haven't already. sorry everyone else. #evil. by the way, i'm purple now. this won't affect anything in a few thousand years, though. nothing's gonna be the same...you guys think we're gonna get an update this decade?

    <i>TheCosmere64:</i>
    This song is so sick and [[Even in Death]] is already one of my favourite homestuck songs, i HAD to make some cool looking art that gives the same mystical and ominous vibe. CANWC's Pink Sun is way cooler than a Green Sun too and a pink black hole is really cool. (Even if it is more Purple kinda) Also Rose's Space and Time outfit is incredible i wanted an excuse to draw her that way and shes too cool to look at explosions (aftermath)

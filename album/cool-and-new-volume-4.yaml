Commentary: |-
    <i>Jebb:</i>
    I wanted at least one of the tracks i made for this album to actually feature CANMT melodies, so i picked [[Moshi Moshi?|Moshi!]] It's a fun melody, so why not.

    I imagined this as a track that would be played in a stadium of concerningly sweaty people, and the sampled cheers reflect that. Halfway in it breaks out in a double time, and the cheers speed up.

    I felt like the solo earthbound overdrive guitar sounded a bit harsh, so in the track it is layered with an earthbound accordion to add some texture.

    Also, this track was actually inspired by the cover art! The artist made it when the track was very early in development, and i decided to add the electronic piano to reflect hecka playing it on the cover.

    <i>bunnysoryu:</i>

Track: Final Credit
Artists:
- greenTetrahedron
Cover Artists:
- bunnysoryu
Art Tags:
- Michael Guy Bowman
Duration: 10:34
URLs:
- https://coolandnewwebcomic.bandcamp.com/track/final-credit
Referenced Tracks:
- Bowman's Credit Score
Commentary: |-
    <i>greenTetrahedron:</i>
    "I wish I had made more stuff for Cool and New Music Team" was the main thought running through my head when I realized I had a chance to put something on Volume 10. CANMT was my first foray into "making art online" and being part of the team was an absolute blast, but at no point did I ever go all-in on it like so many others. The vast majority of the stuff I made never even got posted in the Discord because the thought of inviting judgement on my work was terrifying. It still is, even with ten more years of experience in both, and this has held me back as an artist more than anything else. But CANMT was something special, a truly judgement-free space where anyone could make anything they wanted to. If you find yourself part of something like that, treasure the time you have and make as much "bad" art as you can! Be cringe and be free! Without CANMT helping me break through that paralysis, I'm not sure I would have ever started making music or posting anything I made online. That ethos of "just make stuff" has stuck with me hard. So I love this team, I love what we made together, and I love the tiny part I played in it. Okay, enough sappy stuff! This song was made in a single-day frenzy because I noticed [[track:bowmans-credit-score|a startling lack of credit score]] on the rest of the album and felt compelled to create a send-off to the best worst meme that ever graced our collective ears. The atmosphere builds slowly into something completely overwhelming, and in some sense I wanted to try and capture what it must have felt like for the Big Man Himself to hear his voice repeated and distorted so many times. Despite the oppressive nature, I wanted this track to touch on something sublime and for the soundscape to be something that you could close your eyes and find yourself totally lost in. I took a lot of inspiration from that one TikTok of the tornado sirens harmonizing. I really wanted to make more than just this track, but May and June ended up being extremely busy months for me both in the IRL deparment and the Drehmal development department (BTW play Drehmal at [https://www.drehmal.net](https://www.drehmal.net)). Maybe I'll make two tracks for our twentieth anniversary album. Anyways, I hope you enjoy Final Credit!

    <i>bunnysoryu:</i>
    shook my head each time i made an edit to this image to let the audience know i disapprove of my own actions. its bowman as madotsuki.

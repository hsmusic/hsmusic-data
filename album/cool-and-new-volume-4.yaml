Commentary: |-
    <i>Cecily Renns:</i>
    I believe this was the first song ever made for the album. We started talking about a potential comeback album way back in August of 2023, so that's how old this track is. I think I wanted to adapt one of my most iconic CANMT motifs (although [[track:in-the-beginning-basement-tale|this motif]] in particular is more popularly known as [[CONTACT]], arranged by [[artist:difarem|Difarem/DeltaPsi]]) into an emo-pop type song that I'm more known for writing now. Now that it's almost 3 years old, it honestly sounds dated again, but it's a fun tune and the chorus is one of my favourites I've ever written. Even though there is an audible MIC POP you can hear when I sing "pieces.“

    <i>cookiefonster:</i>
    I wanted to make track art that calls back to the early days of the team, back when most of us were high school students learning how to make music for the first time. The piano roll plays [[track:in-the-beginning-basement-tale|the melody of the original In the Beginning]], and the calendar includes the dates of the [[album:cool-and-new-voulem1|first]] [[album:cool-and-new-volume-2|few]] [[album:cool-and-new-volume-ii|CANMT]] [[track:gunshow-singalong|albums]].

Commentary: |-
    <i>artist:nedthenerd:</i>
    From the depths of the Homestuck discography, Cool and New Music Team dredges up a forgotten early version of Penumbra Phantasm (Ska). We hope you enjoy a behind the scenes look into the making of the classic Penumbra Phantasm (Ska) you have grown to know and love.

    When I was looking through the CaNMT discord server, I stumbled upon a message lamenting the lack of Penumbra Phantasm (Ska). I took it upon myself to remedy this issue, but my hubris blinded me and I flew too close to the sun... I was not ska enough to finish this track. The original idea was to continue the track into the B-section of [[Penumbra Phantasm]], then go into [[FantasyP]], then [[Sunsetter]] to end the track. I'll probably finish it at some point, but I want to redo the instrumentation and record real guitars... maybe for the next CaNMT album.


Commentary: |-
    <i>cookiefonster:</i>
    Jungle #4 is a song that I had wanted to make for many years, to continue the series of [[Sburban Jungle]] and [[Another Jungle]] by Michael Guy Bowman, and [[Jungle #3]] by me. CANMT volume 4 gave me that push of motivation to do it, and to make my first piece of music that's not a chiptune nor an edit of existing video game music in far too long! The last such song I made I believe was [[The Fifth World]] from a [[album:call-and-new-v|2018 CANMT album]].

    I struggled for the longest time to decide what the song should actually sound like, until one day on the way home from work I started humming a repeating riff to myself, and filmed myself singing it using my cell phone so I wouldn't forget it. That riff would become the opening of Jungle #4. Then the rest of the song came together piece by piece over the course of about a week. I decided to make the song match Sburban Jungle structurally but not quote it directly, so that it functions as a rescore of [[flash:1149|[S] Enter]], [[album:cool-and-new-homestuck|Cool and New Homestuck]] style. It was a real joy putting together this song and my favorite part has to be the bridge section quoting one of Bowman's non-Homestuck songs, [[This Is As Good As It Gets]].

    Creating this song taught me that it's never too late to make an idea you've wanted to do for years into reality. Speaking of ideas I've had for years… I'm currently working on a brand new CANMT solo album that I've wanted to do since 2018. You better be excited.

    <i>TheCosmere64:</i>
    Sburban Jungle is one of my top favourite songs from Homestuck proper and this remix is so stellar i really wanted to do it justice in how i interpreted the song as a piece of art while not being obvious and just copying the original jumping rose track art from [[album:homestuck-vol-4|the OG album]].

    Rose is raising the stone head which is the iconography for Bowman's [["This Is As Good As It Gets"]], readying herself to smash it on the edge of her home as she did the wine bottle to enter the Medium, or even just to chuck it into the water, who knows :)

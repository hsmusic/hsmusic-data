Commentary: |-
    <i>Wights End:</i>
    This track started out as an attempt to write a song in the style of [[artist:pendulum]]. I had nearly all the synths selected and a fair bit of mixing done before I even added [[Moshi Moshi?|the melodies and riffs from Moshi]] which is kind of an absurd way to try and write a song. Surprisingly, Moshi seemed to lend itself really well to the style, so I'm quite pleased with the result. Despite how long it had been since I listened to the original track, I still adored Moshi as a motif. It really just tickles that part of my lizard brain that likes hype things, so it was an easy choice for a song to come back and do a cover of.

    <i>pktgrillao:</i>
    I wanted to draw [[tag:canmt-tan|CANMT-tan]]. I really, really wanted to draw CANMT-tan.

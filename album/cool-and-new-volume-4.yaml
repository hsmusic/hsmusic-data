Sampled Tracks:
- Homestuck Anthem
Commentary: |-
    <i>Interrobang:</i>
    This song took me a long, long time to make, and I could say a ton about it. However, as tempted as I am to write a mutli-page, LaTeX’ed deep dive on every reference, influence, and production technique, I’ll keep it to the essentials. I could always do that later anyway.

    The project file for this song on my computer says “September 6, 2023” but the seeds of this song are quite a bit older, and I think that the original inspiration came to me in 2016, a few months after we started CANMT. In a similar way, I’ve always wanted to do [[Penumbra Phantasm|a Penumbra remix]], and I’ve discarded a handful of them over the years. Is this song even really a Penumbra Phantasm remix? Maybe, maybe it’s just “all the ideas I had left in Homestuck music”. There’s a good chance this is the end for me on that front, especially because after two years of working on this track, finishing it became more of a chore than anything else. On the other hand, I think I said I was done after [[album:cool-and-new-volume-3|Volume 3]]. So who knows - I could be back. This song is really two in one, hence the title. Keep an eye out for meme number times, and enjoy. Thanks to opossumcarrion for the wonderful track art. Thanks to the team for coming together once again to make this album happen, and thank YOU for listening!

    <i>opossumcarrion:</i>
    Yin and yang, John and jhon, canon and fanon. Canon orbits the Green Sun, fanon orbits the Pink Sun, but neither's light reaches the other. Penumbra Phantasm, silent and omitted but integral to Homestuck, is loud and triumphantly celebrated in fanon. This song naturally lends to this visual representation. Serendipitously, the Blender noise tools driving the volumetrics glitched fantastically, providing the checkered artifacts. Much to say, little space: I've loved CANMT for a decade, thank you for producing some of my favorite music to ever exist, and for giving me the opportunity to contribute track art.

    <i>Makin:</i>
    References [["Penumbra Phantasm"]] by Toby Fox and a lot of other motifs the musician refuses to share, good luck hsmusic wiki...

    Some freebies:<br>
    [["Get Up"]] by Toby Fox is at the start, [["FantasyP"]] by Erik Scheele after that, also [["Doctor"]] by Buzinkai and Michael Guy Bowman (potentially even Michael Vallejo because the drums are the exact same) five minutes in, then it moves onto [["Another Medium"]] by Toby Fox? Or maybe [[Patient]]? And then the [[Asgore]] leitmotif??? or is that already in Another Medium? And then [["Gaia Queen"]] by Toby Fox, I'm going to be real with you I have no idea what that has to do with PP. Maybe it's the Queen from Deltarune and we get to fight her again in Chapter 7? What do you know, interrobang... wait what the fuck why is [["Unlabeled"]] by Erik Scheele here? Or is this [[Gymnopédie No. 1|Gymnopédie]] again? Both?

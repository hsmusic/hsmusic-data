Commentary: |-
    <i>WHATISLOSTINTHEMINES:</i>
    This song was an attempt to experiment with kind of jungle-y drum production and programming, much more so than I usually do.<br>
    Hopefully it captures the truly cool and new feeling. And [[artist:rollercoaster-tycoon|roller coasters]], of course. Insane to think that we're 10 years on now.

    <i>pktgrillao:</i>
    What would cool and new web comic be without [[artist:rollercoaster-tycoon|rollercoaster tycoon?]] A miserable pile of Homestuck references. Talking seriously, been almost 10 years since I joined the CANMT, and I'm surprised how much I improved when it comes to art. I am not a professional artist, and I don't pretend to be, but I do love making art and it's what matters. I'll leave a fun callback to I would have done this 10 years ago, remember [[tycoonival]]?


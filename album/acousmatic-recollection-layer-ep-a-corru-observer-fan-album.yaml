Lyrics: |-
    The gods took their pleasure on me! Paying back, I suppose, some old sin of my ancestors. Because you will find nothing in me, no guilt, no sin, however assiduously you look, for which these crimes I unwittingly committed, damning myself and all my family, could be just punishment!

    I know one thing for certain, that no one will take you from here or anywhere against my will. I've heard threats before, noisemakers and bullies and always very free from them, very rarely do they come to anything when people calm down and assess the situation rationally. These people may have spoken very grandly of taking you away. Any voyage of that kind would be across very stormy seas, I can promise you that. Don't be afraid. Apollo is your protector as much as I am. Besides, you will find my name is enough, even when I am not here, to keep you safe.

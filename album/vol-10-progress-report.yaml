Commentary: |-
    <i>rj lake:</i> ([SoundCloud description](https://web.archive.org/web/20160609093821/https://soundcloud.com/spellmynamewithabang/sets/vol-10-progress-report-current/s-gTH70))

    things are actually going well? i can't believe that this project is even happening, much less that it's running smoothly. we have a lot of time until release (almost five whole months, tho i want to make a hard deadline at beginning of october so we have some time for mastering/wiggleroom and figuring out contracts and stuff) to patch things up, so it's okay that a lot of this is rough right now, but make sure you all find time to get track art and final recording done. and don't be afraid to talk to each other, guys! the more collabs the better, i say.

    btw the art is [[artist:kate-holden|kate holden]]. it's very wip she says but i'm liking it as it is now!

    <i>Kate Holden:</i> ([Bluesky](https://bsky.app/profile/darthmongoose.bsky.social/post/3los64gxqzk23), 5/10/2025)

    > <i>[[artist:tempest2k]]:</i> [...] wait i just realized you're on here. do you have a higher quality version of this artwork anywhere? google reverse image search came up blank

    Ahh, the old cover I did for Stuckhome Syndrome! Well, I have this one on imgur. For anything better I'd maybe need to root around on old hard drive backups! [(imgur link)](https://imgur.com/e8JPT0f)

    Also, if you ever need "lost Kate Holden art", it's almost never actually lost. I tend to keep just about everything, so never hesitate to reach out! ❤️

    > <i>[[artist:lilithtreasure]]:</i> is Stuckhome Syndrome just what you call it (Homestuck) or do you mean like rj's album
    >
    > still, amazing to see it in PNG form after so long of seeing it as only as a JPEG! wow!

    So... it's been years and I may be misremembering, BUT, in my memory, this was art for some sort of post- Homestuck album gathering unreleased tracks that didn't make sense to go on vol 10 because they were for older story events or dead characters, and it was going to have that name.

    > <i>nikki:</i> aa omg! i didn't expect the video to have enough reach to be worth bothering anyone over, but am very glad me being dumb and missing an obvious source led to this being shared in higher quality

    No worries! It was kinda fun to revisit that piece. It's a shame the album it was teasing, a sort of official 10.5 for unreleased tracks, didn't really happen. I love the HS music team!

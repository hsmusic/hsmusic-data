Commentary: |-
    <i>James Roach:</i> ([SoundCloud description](https://soundcloud.com/jamesroachmusic/there-shall-be-no-peace-while-james-roach-haunts-these-halls), 4/26/2019)

    earlier this years i was contacted by the good people at vast error asking if i wanted to do some tracks for their friendsim-esque game and it sounded fun so hell yeah i did it.

    this has my favorite sound in the world, the mouth harp. you play the mouth harp by putting a springy metal thing on your teeth and twanging it towards your mouth and hoping you dont smack yourself in the incisors. yes that is really how you play this instrument.

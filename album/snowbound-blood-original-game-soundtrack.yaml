Commentary: |-
    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/crytums_theme), excerpt, 1/10/2021)

    I'm reporting in with another track for Snowbound Blood! This song plays [[flash:sbb-vol10|in Crytum's route during Volume 10]]. Since he is Sabine's neighbor, I wanted to contrast [[track:i-admit-it-i-dont-know-how-king-crimson-works|Sabine's jittery eclectic theme]] with a more laid-back and melancholy track that stayed in one lane: 16-bit soundfonts. Comment if you recognize any of them, there's one in particular I used a lot!

    Thanks again to the Syndication team for letting me work on this project, and a special thanks to [[artist:silentneptune|Donut]] for sending several video game tracks my way as reference!

    <i>Vast Error:</i> ([Bandcamp about blurb](https://vasterror.bandcamp.com/track/thank-you-capn-valken-david), excerpt)

    Shoutouts to The Cap'n
Referencing Sources: |-

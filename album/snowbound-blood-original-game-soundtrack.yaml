Track: Snowbound Blood
Artists:
- Veritas Unae
Contributors:
- Rom M (production)
Cover Artists:
- Rjay
Art Tags:
- 'cw: blood'
Duration: 5:36
URLs:
- https://vasterror.bandcamp.com/track/snowbound-blood
Lyrics: |-
    She's facing a troll of green
    Who works behind the scenes unseen
    And it's a race against the clock
    To stop his schemes

    She weaves with her thread of teal
    Connecting those who help reveal
    Barren grounds that time forgot
    And will not heal

    Snowbound Blood
    Dripping through the cracks of the land
    Snowbound Blood
    A chilling mystery at hand

    Her tracks lead her to and fro
    Traversing places few dare go
    Forming teams to stop the rot
    And beat her foes

    But when his face was on the screens
    That young troll with the blood of green
    To pick between herself and him
    Was not forseen

    Snowbound Blood
    Dripping through the cracks of the land
    Snowbound Blood
    A chilling mystery at hand

    That face in that crowd
    That voice from behind
    It feels so familiar
    Like you're losing your mind

    But when you got the call
    And you knew that was all
    Where she stood there lay nothing

    Just her work
    And her desk
    She was gone…

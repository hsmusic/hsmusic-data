Commentary: |-
    <i>Circlejourney:</i> ([circlejourney.net](https://circlejourney.net/music/to-the-flights-that-havent-flown/))
    Often, I'm commissioned to make musical themes for characters that owners have played in tabletop RPGs. This was one of them: a theme for Gladys, Cosmignon's character in the Dicefunk podcast! I aimed to capture her frenetic personality in the music, as well as some of the incidental sounds from inside a potion shop.

    Cosmignon's commentary:

    > Gladys Antimony could be described as small, nervous, and afraid of most things. She's also endlessly curious, and braver than she knows. This kobold alchemist is a ttrpg character invented and played by Cosmignon. She starred in a campaign as one of three draconic-aligned characters that traveled through a post-apocalyptic world in search of a new home. Her special talents included potion brewing and observation; she acted as the one in charge of documenting every discovery the team made in her trusty notebook.

    <i>Circlejourney:</i> ([Bandcamp credits blurb](https://circlejourney.bandcamp.com/track/kobold-concoction))
    For cosmignon (https://cosmignon.info)

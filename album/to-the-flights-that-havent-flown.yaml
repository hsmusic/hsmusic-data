Commentary: |-
    <i>Circlejourney:</i> ([circlejourney.net](https://circlejourney.net/music/to-the-flights-that-havent-flown/))
    This track was made for 5word's animation project [From Nowhere](https://www.youtube.com/watch?v=y-vyuKWzlf8). Attending to the project's inspirations in the Western genre, I went for the breezy, optimistic feel of an adventure beginning, with some tense, gritty sections.
    
    [5word](https://www.youtube.com/@5wordsman)'s commentary:

    > From Nowhere is a personal world building project revolving around the goings on in the supercontinent of Somwyr. In this world, the present time is akin to our world's 1800s. The dominant races are humanoid elementals. Separated into their own kingdoms, their tumultuous relationships are coated in conquest, innovation, and outworldly faith. Within the far reaches are unsung stories of heroism, hope, and wonder. Once revealed, they share lost lore that history books don't share in the lands of Somwyr.

    <i>Circlejourney:</i> ([Bandcamp credits blurb](https://circlejourney.bandcamp.com/track/from-nowhere))
    For 5word (https://www.youtube.com/@5wordsman)

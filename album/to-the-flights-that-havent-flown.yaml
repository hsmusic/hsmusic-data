    A theme for Waltz's wandering traveller, Rhine! From [Rhine’s profile](https://toyhou.se/208147.rhine):

    > A strange young girl walks by along a forest trail, a pack upon her back, boots well-worn and dusted with the dirt of the road. Softly, she sings to herself, a song that sounds both ancient, and timeless, a melody that feels as though it's drifting in from another world. The sun filtering through the trees glints off her glossy hair. A fragrance of distant flower fields lingers behind her. Where is she going? How many sights lie behind the light in her soft grey eyes? How many stories have her ears heard? What could she be looking for?

    This track has a special place in my heart as the first music commission I did after officially opening them.


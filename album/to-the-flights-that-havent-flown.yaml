    Holly France's commentary:

    > Season 3 theme for the Stardust comic series.
    >
    > What does it mean to be alive?—‘With everything on the line, a group of dysfunctional demigods must come to terms with their previous lives in an attempt to save their current ones—and everyone else’s too that is.’

    <i>Circlejourney:</i> ([Bandcamp credits blurb](https://circlejourney.bandcamp.com/track/supernova))

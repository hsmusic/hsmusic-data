Commentary: |-
    <i>Circlejourney:</i> ([circlejourney.net](https://circlejourney.net/music/to-the-flights-that-havent-flown/))
    This is a moody theme for TLverse, a project by [123penguin64](https://toyhou.se/123penguin64) and [lbqfm](https://toyhou.se/lbqfm). I think the focus on the guiro and pizzicato upright bass give it a really fun texture I've never achieved in any of my other music before.

    123penguin64's commentary:

    > TLverse is about learning how to live with oneself and the different ways people can coexist with themselves. Two people keep reincarnating and change significantly within each iteration, drawing on the premises of nature vs nurture. How they live with themselves is up to them, though each different self has very different opinions on the previous self... Between The Walls captures the feeling of growing together, the cognitive dissonance of looking at yourself and seeing a different person, but together you are all the same in the end ✨

    <i>Circlejourney:</i> ([Bandcamp credits blurb](https://circlejourney.bandcamp.com/track/between-the-walls))
    For 123penguin64 (https://toyhou.se/123penguin64)

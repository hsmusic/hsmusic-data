Commentary: |-
    <i>Circlejourney:</i> ([circlejourney.net](https://circlejourney.net/music/to-the-flights-that-havent-flown/))
    A theme for 2041 C.E., a project by Waltz and Firo. This story is set in a futuristic world in the throes of an epidemic and follows the exploits of two scientists amid it.

    [Waltz](https://waltz.moe/)'s commentary:

    > In the not too distant future, the world's populations have been struck by a wave of strange and violent mutations. Though not often referenced through public channels, the affected sectors kept under strict isolation, nothing widespread can be contained for long; despite a government response, efforts from officials are too little, too late, and thus the private sector has begun to take matters into their own hands.
    >
    > Though a handful of influential institutions and corporations have begun research into the mechanisms of this epidemic, what can be learned from it, and potential cures, what is perhaps the most groundbreaking research will never be found in any journal. A certain institute, established by a wealthy private investor with dreams of personal grandeur, sits well outside the public eye. Though employing some of the top scientific minds from across the globe, their work is highly classified, rumored to be incredibly fringe in nature. Free from oversight of the government, the law, and most other aboveboard review, researchers of the institute push the boundaries of what should and should not be, in pursuit of the ultimate secrets of the world's current crisis.

    <i>Circlejourney:</i> ([Bandcamp credits blurb](https://circlejourney.bandcamp.com/track/2041-ce))
    For Waltz (https://koyoba.tumblr.com)

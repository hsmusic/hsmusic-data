Commentary: |-
    <i>Jamie Paige:</i> ([Bandcamp about blurb](https://pamiejaige.bandcamp.com/album/video-hunting-specimen-original-soundtrack), excerpt)

    Take a dive into the bygone era of a burgeoning digital frontier— where driven laypeople have just begun to scratch the surface of digital creativity; where the uncanny valley is more than a stone’s throw down the road, abstract art is more the rule than the exception, and 480p video is but a glimmer in the distance.

    In a time where an active internet connection comes at the expense of interrupted phone service and megabytes are delivered to your device at a snail’s pace, a CD-ROM is a window into a world of expanse, a world of quality and quantity only available to those with the fervor and intent to grasp a shimmering disk full of hopes and dreams and place it so very gingerly into their PC.

    Video Hunting Specimen is a 3D platformer game created in April 2025 for CanDev & The Internet Archive’s The DiscMaster Jam, a celebration of the early years of CD-ROM media that encourages participants to make games whose assets are sourced primarily from data searchable within the Internet Archive’s DiscMaster search engine. Search high and low for coveted VHS tapes containing vignettes of a different time, all the while enjoying an evolving soundtrack full of eclectic sounds from a veritable feast of music sample CDs.

    <i>Jamie Paige:</i> ([Bandcamp credits blurb](https://pamiejaige.bandcamp.com/album/video-hunting-specimen-original-soundtrack), excerpt)

    soundtrack for Video Hunting Specimen - [plum.itch.io/video-hunting-specimen](https://plum.itch.io/video-hunting-specimen)<br>
    created for the 2025 DiscMaster Jam, hosted by CanDev & the Internet Archive - [itch.io/jam/discmaster-jam](https://itch.io/jam/discmaster-jam) <br>
    entirely using samples from the DiscMaster archives! 100% homegrown old internet sampling! yes, even the 909 hihats on [[track:workit|Workit]] are straight from the archives and that's how you know we took this shit seriously!

    With disc 2 I wanted a more violent, powerful feel to assimilate the feeling of terror all the battles the ancestors fought.

    <i>Rebecca Peason:</i> (booklet commentary)

    I wanted the Disc two piece to be related to the first in that it showed the wear and tear their actual lives had on them. Where they ended up, how they died, what happened, etc. Signless is completely smashed out of the window as if he never existed, a few of the panels are modified, but some have holes smashed through them, indicating their deaths in some way or another. Just as this disc is meant to be the story of the Ancestors, I wanted this track's art to reflect that in comparison to the first disc's.

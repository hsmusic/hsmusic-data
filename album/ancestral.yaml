    <i>Seijen:</i> (booklet commentary)

    So this is a re-hash of one of my first tracks from about 2 and a half years ago. The original title of the track was "Robot Pirate Island" and had a shift into a ravecore EDM as opposed to the constant high energy baroque sound we have here. This current edit is from april of 2016. I would create another, had it not been for the project crashing upon loading. It sounds incredibly rough in comparison to my current skill and Im losing a little sleep over it. A damn shame since the amount of tools and knowledge I have now could make this sound night and day in quality, but what you hear is what you get.

    <i>Sigourney Martin:</i> (booklet commentary)

    While working on this piece, the song wasnt difficult per-say? It was more challenging, because I had many different images on how i wanted this to look like. in the end, I chose what I drew and It was fun! I tried watercolours (though it might not be noticable) and I think it turned out alright!

Commentary: |-
    <i>WC:</i> (booklet commentary)

    I made this once and then realized it sort of sounded like a song for clowns, and then I didn't sleep well the next few nights because at the time I was scared of clowns and thought they were influencing me subliminally.

    There's a beeping section in the middle, except it's actually bad Morse code, and it spells out 'no homo.' I don't have an explanation for this.

    <i>YoItsCro:</i> (booklet commentary)

    […song] is called Purple and Purple. Might as well have a focus of purple in the piece, and purple with a meaning at that! Chucklevoodoos always feels like some kind of signature sign with the Makara line. Not only that, but it leaves a sense of unease. Overall, the song gave an overall ominous feel to me where surrounding the Grand High Blood in an atmosphere was not only complimenting, but fitting! Also, blood on the walls for that extra touch. It's safe to say that the picture pays homage to his appearance in the comic, with the stylizing and unique attributes of course!

    Getting that glow was my prime focus, and to also light up and put some focus at that wicked paint of his! They have to be some of the physical characteristics that stand out the most to me, and certainly focal points that I attempted to pull attention towards.

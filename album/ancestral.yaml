Commentary: |-
    <i>Nate Tronerud:</i> (booklet commentary)

    Cursed with visions of a better Alternia, one of love and peace, the Signless walks ever forward. Visions of such a world may bring to Him great pain, but also great hope: it is a world worth striving for, one He could possibly see in His own lifetime, and so he continues walking. He spreads the message of such a world knowing it will fall on mostly deaf ears, even met with hostility. But for the chance to bring love and happiness to even a single troll, it fills Him; His suffering is worth it, even if it means making the ultimate sacrifice in the name of peace...

    <i>Lilly Higgs:</i> (booklet commentary)

    I wanted to experiment a little with this one! And great apologies to Austin Wintory and the whole team who worked on Journey by That Game Company. This song seemed very lonely, very solitary, and so I envisioned the Signless wandering through the dunes between city and township of people who won't listen, lit by the light of two moons, but only remembering one.

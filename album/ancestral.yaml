    <i>Rebecca Peason:</i> (booklet commentary)

    I didn't even realize how little we know about these characters outside of the tragedy in their stories. Putting together an image that had to do with the good times was interesting. I tried to keep the window pane motif as the last two discs, but I thought it departed enough from the first two discs which dealt with what happened in canon and their known stories. I wanted to make it feel like something more readable than the rose windows, like it's own little story.

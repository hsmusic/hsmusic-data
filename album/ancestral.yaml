Commentary: |-
    <i>Sara Stebbins:</i> (booklet commentary)

    This piece is written about the Handmaid's struggle against the Condesce, her ultimate defeat, and a sort of bitter-tinged relief she feels from it. I wrote parts of this piece in twelve-tone, alluding to the twelve zodiac signs and the twelve numbers on a clock. I tried to keep this piece as simple as I could because I feel that the Handmaid has this silent, brooding austerity with a sense of anger within, which I tried to bring out in occasional dissonance.

    <i>Sigourney Martin:</i> (booklet commentary)

    So right away this song made me feel *really* sad. For Handmaid i mean. She needs hugs. But yeah, this song really makes me hear and or see her pain and I suppose relief from just being away from lord english's grasp. the jerk.

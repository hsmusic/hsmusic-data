Lyrics: |-
    (I have thought of the summoner often. I have been troubled to know that as one so common blooded, he could not possibly have been hatched yet, nor will he wriggle from the caverns for many sweeps. So I must have patience to take my role in his story of heroism. It is a tale which reads to me as though lifted from a child's story, yet, I know I'd be a fool to doubt its veracity entirely. He would rise through the ranks of the cavalreapers and assume command, having proven the most skilled and fearless of them. He would exhibit a remarkable pupation, the sort only recorded in myth, growing, or perhaps simply revealing, a striking pair of wings. His army thus inspired would spearhead a major rebellion. Surely one at least on the scale of the sectarian revolt crushed by the Highbloods, who thereafter forbade its mention, or any invocation of the heretical symbols at all, even in private journals. Which is why I will stick to the fable of the summoner, and not risk another execution with even oblique reference to the compelling tale of the sufferer.)
Commentary: |-
    <i>irl-porrim-maryam:</i> (booklet commentary)

    I was absolutely ecstatic when I was given the track of the Summoner! Though there's not much canon information on him, towards the end I was able to include an excerpt from [Page 5658](https://www.homestuck.com/story/3758), in which Mindfang journals about the Summoner. I also looked to [[Bronze Rebel]] from coloUrs and mayhem and [[♉ - Breathtak1ng|Breathtak1ng]] from the Beforus Album to get a feel on what instruments I should be using. I gave the song a bit more of a minor key since the Summoner's life most likely wasn't the easiest or most fun life to lead. This track was definitely great fun to work on, and I'm definitely honoured to be a part of the Ancestral Album!

    <i>Molly:</i> (booklet commentary)

    I quite like how this piece came out! The track itself was lovely and soothing, and the vocals at the end added an interesting feeling to it, almost like a story book. I wanted to showcase the atmosphere rather than The Summoner directly, but still wanted it to be obvious that this is The Summoner's track, and a view point from behind where you can obviously see his defining characteristics but not directly see his face felt like the best way to accomplish that! That, and a purple and blue night sky above the rust-blooded Summoner, with a golden fire in front of him feels rather poetic in a way. This was definitely a learning experience, and a really fun piece to work on for the album. I'm excited to see what's next!
---

    I was thinking about how I could include all twelve trolls in a picture that sort of introduced them in a sense. The organ sounding bit in the song made me think "rose window" and, of course, the only direction given to the artist who made the Ancestor silhouettes for the [[flash:3520|showdown]] [[flash:4085|flashes]]: "Heavy handed religious imagery."

Commentary: |-
    <i>The One Music Maniac:</i> (booklet commentary)

    "On The Hunt For Something Unknown" is not about the events that took place within the Disciple's lifetime, but rather how these events allowed her to define who she became: a Warrior, a Lover, and a Survivor. The overall title is a play on her cat-like survival skills, while the definition of "unknown" can be led to open interpretation-- a love beyond quadrants, equality in a society that's built upon an oppression of heirrarchy, etc.

    <i>Melissa Peebles:</i> (booklet commentary)

    For this song I pictured people gathered around a fire late into the night listening to fables, the beat and thrill of a hunt, and the undefinable love between Disciple and Signless echoed in the heartbeat at the end. This track defines Disciple beautifully and I wanted to show who she had become through symbolism.

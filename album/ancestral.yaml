Commentary: |-
    <i>aeolianChemist:</i> (booklet commentary)

    Legacy is written in the voice of the Disciple, reflecting on the story of the Signless and her role within it. Musical inspiration for the song came largely from [[artist:phemiec|phemiec]]'s fansongs and [[Olive Scribe]] (from Colours and Mayhem:Universe A). Composing it was a journey in itself; along the way she taught me a lot about her history, her undying dedication, and storytelling. She had so much to say, it was difficult to limit myself to such a concise song. Each line has been frequently rewritten, reconsidered, and countless have been cut - I was making revisions up until the final recording.

    In the end, I hope the story you hear is the one she wanted to tell.

    <i>Rangzhe:</i> (booklet commentary)

    I wanted to express the bittersweet ending of Disciple and Signless' relationship, and how even though shes still trying to move on she looks back, reminiscing the moments.

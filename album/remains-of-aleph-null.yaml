Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/downpour))
    Initially i intended this track to have Friday Night Funkin vocals and be an fnf remix of the original "W.A.R.D." track made by [[artist:founddeadinla]], with the vocals replacing the instruments. However, while working on this album i figured that would be too simple and boring, thus i made this a regular, non-fnf remix.

    With the original track being more of a heavy electronic track, this is quicker and more metal-oriented.

Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/downpour))
    "Sticks" is a track that i cobbled together for fun after reading the Aleph Null minicomic, titled "Sticks and Stones". It featured small Sauron, so i made a small Sauron theme. That's about it really.

    This track is like a lullaby, reminiscing about old times. Where did the good times go? Back when we were small Sauron? Ah, memories.

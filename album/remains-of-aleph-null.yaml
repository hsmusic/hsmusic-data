Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/downpour))
    As you can see, i wanted to make something grand for the trailer, and a orchestral-cyberpunkish remix of the main theme of the comic seemed appropriate.
    I also used some motifs from other characters, timed to when they appear. Speaking of timing, making the timing right for all of the moments was quite difficult - probably the hardest part of the project. The hardest probably was the little part of sound design i decided to do when the logo gets constructed.

Track: Last Resort
Duration: 1:43
Referenced Tracks:
- Thresher (Cyrusk's theme)
URLs:
- https://jebb.bandcamp.com/track/last-resort
Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/downpour))
    Piece made for a fight scene flash, taking place in a hotel (thus the name, Last Resort, hah).

    For this track i wanted to flex my skills and attempt to make a [Carpenter Brut](https://en.wikipedia.org/wiki/Carpenter_Brut)-esque tune. A big reason why it ended up sounding so meaty is thanks to the mastering advice of [[artist:adrian-gravitygauntlet-wahrer|Adrian "gravitygauntlet" Wahrer]], who also made the art for this album! The same advice also ended up helping with my second attempt at a Brut sound, that being the [[track:core-brutalized]] remix.

    The main riff is very much inspired by the melody of the Hotline Miami track ["Hydrogen"](https://youtu.be/SNE2oCZH_4k), made by M O O N.

    Funnily enough, the name of this track ended up being very prophetic, since it's the last track i made for the webcomic before it got taken down from mspfa and i left the team. It didn't even have an official release anywhere beyond the flash itself - until now!
Referencing Sources: |-
    <i>Jebb:</i> ([Bandcamp credits blurb](https://jebb.bandcamp.com/track/downpour))
    References [["Thresher (Cyrusk's theme)"]] by [[artist:rabooski]]

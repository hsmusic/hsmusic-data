Track: Business Disputes
Duration: 3:39
URLs:
- https://jebb.bandcamp.com/track/business-disputes
Commentary: |-
    <i>Jebb:</i> ([SoundCloud description](https://soundcloud.com/jebbjabroni/downpour))
    My take on a theme for the comic antagonist Tyrell, a violetblood CEO, who we... well, didn't know much about prior to the comic's end, so this might be a very loose interpretation.

    Fun fact - the original track that i built on was the part from 0:00 to 0:47 - i REALLY did not have much to build on! But hey, i managed. The end result is a symphonic/cyberpunk-ish villain theme, fitting for a futuristic CEO.
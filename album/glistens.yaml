Commentary: |-
    <i>Flutterwhat:</i> ([Bandcamp about blurb](https://flutterwhat.bandcamp.com/album/glistens-bandcamp-version))

    Glistens has been a project that's taken over year to finish. Starting off as a vision for a musical, the album evolved into a mix of sounds ranging from gentle to harsh.

    The musical side of the project was known as [[track:scourgequest-iii|"ScourgeQuest III"]] and was intended to follow up on two previous releases. in the end, "ScourgeQuest III" and [[track:justice-oh-justice|"Justice, Oh, Justice"]] are the only two tracks to completely hold onto the musical idea.

    As the project evolved into Glistens, the album became more about the community on tumblr known as "Nudestuck" as multiple songs started to draw from inspiration from the positivity and sense of family that comes from that particular community.

    Some local friends in the Corpus Christi Homestuck community also helped out.

Commentary: |-
    <i>D-CELL SOUND TEAM:</i>
    the complete original score and soundtrack to UNBEATABLE, a game by D-CELL published by Playstack: https://store.steampowered.com/app/2240620/UNBEATABLE/. contains all background music, cop fights, cutscene tracks, minigame tracks, and additional vocal tracks.


    The [[artist:d-cell-sound-team|D-CELL SOUND TEAM]] is:

    [[artist:rachel-lake|rachel lake]] - vocals, production, arrangement
    [[artist:rj-lake|rj lake]] - music direction, production, composition
    [[artist:clara-maddux|clara maddux]] - composition, arrangement, lead performer
    [[artist:vasily-nikolaev|vasily nikolaev]] - composition, arrangement, mastering

    btw yes the game is out

Commentary: |-
  <i>wertercatt, lavenderSiren:</i> (Conversation in private discord, 8/28/2025)

  *wertercatt:*<br>
  I do gotta admire the vinyl presentation, the fact that every track switches to a crackling loop of run out groove audio after ending is neat.

  *lavenderSiren:*<br>
  yee<br>
  can prolly tell that we really wanted to make it similar in flavor to the meteor sound test in homestuck, since that location is what the skaian magicant in glitch faq is based off of (though I opted to make my own tileset instead of using ff6 tiles)

  <i>wertercatt:</i> (artwork creator(?))
  This album both did and didn't have artwork made for it. Art assets for the flash were made by [[artist:lavendersiren]]. Each track has a different colored disc that appears when you click on it, but I did take and edit the screenshots used for the hsmusic wiki presentation.<br>
  Process steps:<br>
  1) Open flash in standalone player<br>
  2) Fullscreen<br>
  3) Select track<br>
  4) Take screenshot<br>
  5) Paste into gimp, trim off red border<br>
  6) Paint out volume symbol<br>
  7) Export as PNG

  [[artist:lavendersiren|LS]] did approve of this presentation.

  <i>wertercatt:</i> (wiki editor)
  There are two orders given for the tracks. I've chosen to use the presented order as the main one, but the internal order is documented here for anyone wanting to try listening that way instead.<br>
  Glitchquest Soundtest presented track order:<br>
  1) BALAD OF THE GUARDIAN {sic}<br>
  2) LANDSWEEP<br>
  3) SPAGHETTI CODE<br>
  4) CATACLYSM<br>
  5) BACAFE<br>
  6) PROSPIT CATHEDRAL<br>
  7) EVENTUAL CONNECTION

  Glitchquest Soundtest internal track order:<br>
  1) [[track:1-cacksadsfhas-mp3|1_cacksadsfhas.mp3]]<br>
  2) [[track:landsweep-sbargv2-glitchquest-soundtest|2_ls.mp3]]<br>
  3) [[track:eventual-connection-sbargv2-glitchquest-soundtest|3_fs.mp3]]<br>
  4) [[track:prospit-cathedral|4_dc.mp3]]<br>
  5) [[track:spaghetti-code-sbargv2-glitchquest-soundtest|5_cl.mp3]]<br>
  6) [[track:cataclysm-sbargv2-glitchquest-soundtest|6_c.mp3]]<br>
  7) [[track:balad-of-the-guardian|7_botg.mp3]]<br>
  8) [[track:bacafe-sbargv2-glitchquest-soundtest|8_bcp.mp3]]<br>

    Okay, here we are at the conclusion of this album. Rex Mille Geromius, the Cool and New Web Comic version of [[track:rex-duodecim-angelus|Rex]].

    In this song, someone—as I said, someone—I think it was [[artist:cecily-renns]]—suggested that I make a Cool New version of Rex, and I decided to do it as a chiptune because—because chiptunes are good. And this monstrosity of a song happened. I decided to base it on the characters on the cover of the [[album:cool-and-new-volume-ii|volume ii]] cover art, which would be, um, Jhon, Rose, Dabe, Jaed, Hecka Jef, no, not Hecka Jef, Germysprit, Kraket, Corrupt Terezi, Equius, and Gametez, Kanaya, and Femorafreack and Dadd, I think I listed everyone, but except I couldn't think of a theme to use for Dadd, so I replaced him with Jack Noir, and he, even at the time of this album, already had a fair few songs to his name. People really like making themes for this guy, for some reason.

    And yeah, the art—I specifically asked the artist to reflect that, and the art was actually made by three people. One of them did some—did the shading, and one of them only drew Rose's hand. But yeah, I'll kick in.

    Ah, the actual melody to this song. It was such a struggle to write. I wanted to make a main melody for this song, and I don't even remember what melodies I had come up with previously, if anything. I just sort of sat there blankly until I was like, fuck it, I'll make something that harmonizes with the original Rex melody. It's a bit lazy, but it actually works pretty well when I made Rex fade in on the backing synth, and it doesn't really sound bad.

    I mean, the song isn't the greatest song, but I—at least I finished this. I finished a monstrosity song with themes for 12 characters and everything. Oh yeah, I also did some maybe cool arpeggio shit in this background.

    Oh, as a bonus, I think I used literally the same drum pattern throughout this whole song, even by my standards, that is really damn lazy, using the same drum pattern the whole song. Does it say something that the drum pattern at the same—the whole thing at the same time does sound out of place?

    I used [[track:my-little-pony-friendship-is-magic-theme|the My Little Pony theme song]] for Corrupted Equius, and I don't remember why that was a good idea. Like, I don't remember why I thought that was a good idea. Like, sure, he likes horses. At least I'm not the only person who remixed that theme song [[artist:tensei]] did in [[Arisen Anew]]. There it was for 5 seconds in here, it was for 10 seconds.

    Then the next section, Kraket, Corrupted Karkat's section, is an example of me being short on ideas. As of now—as of this speaking, he still doesn't have any music to his name, so I just made a descending version of Karkat's theme. Maybe when a Cool and New Web Comic Trolls Album [[album:haroldbound|rolls]] [[album:troleplanet|around]] for the corrupted versions of the trolls, then it will happen.

    Oh yeah, here's Jack Noir's section, where I painstakingly transcribed the melody of the song [[Archagent Everlasting]], because I hadn't memorized the name of that song at the time. No, I have not memorized the melody, and the gal who made Archagent, [[artist:cecily-renns]], she was really thrilled to see me have remixed that song. Though after that point, 10 people have used it in their songs, and I was just like the second person at the time to remix, the only other was in the [[track:fruity-pebbles-redux|cover]] of the [[Fruity Pebbles Jingle]].

    Oh yeah, Dave's part, with [[Atomyk Ebonpyre]], another example of me running out of ideas. This is me returning to the chorus, which is lazy, but I get a free pass because Rex does it. God bless you, [[artist:malcolm-brown]].

    Oh yeah, this is where I came up with the B section to the Rex melody. Now B sections of things are a funny story, because unlike coming up with actual melodies, coming up with B sections to accompany existing ones, it isn't impossible.

    I wanted to remix the song [[Terexi]] from [[album:cool-and-new-volume-2|volume 2]], but I ended up just remixing [[track:terezis-theme|her theme]] because Terexi doesn't have an original melody, and what do you know, she actually does have her own song in [[album:v8lume|volume 8]] called like [[track:413143413414143|413111411413 or whatever]]. And yeah, that was another lazy part.

    But up next, oh boy, Femorafreack section. As [[justice must be a serve]], [[Post-Apocalyptic Fedora]] put through the [Wub Machine](https://github.com/psobot/wub-machine), but since I didn't know that at the time, I made out a melody out of that and used it in the song, I actually transcribed a Wub Machine song and incorporated it into this mess of a song, but I really did do it. I made—I transcribed a Wub Machine song and remixed it. That's Cool and New at least. Oh yeah, Jhon gets Rollercoaster Tycoon to his name. [[RollerCoaster Tycoon Theme]] is a classic. Even if everyone remixes it, it's Cool and New by nature, and I can't hate using that as a melody.

    Rose's part's another lazy part. It's just [[Dance of Thorns]], blah blah blah. It took a long time for people to actually be willing to make music for her, but at least eventually Rose did get some good tunes like the song [[Amidst This Mess]] and maybe [[Unity of Thorns]] and [[Misery Loves Company]] from earlier albums? There has to be some Rose-related songs I'm forgetting.

    Here's the return of the Chorus section again. Again, I get a free pass on doing that. Because, you know. Yeah.

    And here's the B section of the chorus again. What do you want me to say when I repeat sections of the song?

    Here's Germysprit's short section of the song. I combined [[track:where-making-this-hapen|Sweet Bro and Hella Jeff]], and [[Harlequin]] because the song Germy had for him didn't have an original melody, yet another character who would actually get a theme later on. The Jayed, Jaed, Corrupted Jade section? I should have used [[Dogsong]] for that. I know it's an Undertale song, but it's her theme. It's her actual theme. And even before I played Undertale, I wished I had used that song.

    Still, like, at least [[Courser]] is a good song, but I should have used Dogsong. Because associating characters with Corrupted and the non-Homestuck songs is Cool and New.

    Oh yeah, Kanaya's section is [[Chalk Emerald]], a remix of [[Virgin Orb]]. I don't know if I just end up referencing Virgin Orb.

    Oh yeah, Gametez's section is just [[track:miracles-icp]] by [[artist:insane-clown-posse|ICP]], and I'm still the only person on the team to have remixed that song somehow. How is that possible? How have not more people remixed the ICP song?

    Anyway, I kind of was rushed through [unintelligible] of the latest sections, though I didn't realize that at the time I was really lazy and short with the sections like Germy's section and Kanaya's section.

    Yeah, this song, I could have done it better in a lot of ways. I could have waited til, like, volume 8 or so to have found good melodies to use for all the characters on the volume ii cover, even though Dadd in Cool and New Web Comic still doesn't have any songs associated with him, besides a [[album:canwc-sound-test-1|Sound Test]] song called [dadd: flashback](https://coolandnewwebcomic.bandcamp.com/track/s-dadd-flashback) I could have maybe used [[Under The Hat]], but I couldn't really pass up using one of the many themes for Jack that people had made.

    But, all things considered, I'm happy that I actually did finish making Rex Mille Geromius.

    It ended up unpolished, but it has some pretty Cool track art there. It's also pretty New, don't you think?

    *(Continued in [[track:of-troles-and-frytunes]])*

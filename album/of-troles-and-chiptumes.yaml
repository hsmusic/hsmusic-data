    So the opening song of this album, which is, it has a dumb long name for Aradia, Aradia, Aradia, how do you want to say it? I don't know. But this was the second song that I made for this album, and it's not one of the best.

    Some people don't like the intro that I have of the song. Say it's... that it's really grating or whatever, and it is with headphones like these. I mean, I'm not wearing good headphones, but I can see why the intro is grating.

    And I tried to make this song I guess match up with its title, the name is taken from a [line](https://www.homestuck.com/story/3596) from Homestuck, as you should know, because if you don't have an encyclopedic knowledge of the comic, you can get out of here.

    Okay, then the drumline kicks on, which is like, this part of the robot form of the character, and I forget how much I twisted the melody from the song [[Rust Maid]], I guess, and yeah, I remixed a lot of [[album:coloUrs-and-mayhem-universe-a|coloUrs and mayhem]] in this album, which some people seem to be afraid to touch remixing that album, even [[Gold Pilot]], which is a super popular song that I somehow forgot to remix in [[track:the-gemoni-mustard-blood|the Sollux song]], even though people really like that song, and...

    Yeah, yeah, this song is one of the worst ones. At least it has a drum beat that doesn't sound half bad.

    Oh yeah, [[Crystalanthemums]]. That melody actually found its way in there. It's a good melody, and I can pretend it's associated with the character this song is for because of [that one flash](https://www.homestuck.com/story/2578) in Homestuck, but it's not like... this melody was a little shoehorned in.

    Oh god, this section was supposed to be [[Arisen Anew]]. This is one of the weaker songs, and I think most people agree on that. Yeah, Arisen Anew is a good song, and I could have done more with that, but it's a really good [[artist:tensei]] Dance-Dubstep song. Tensei is also an amazing musician.

    Even though his songs aren't working with crazy melodies, he makes rad music too, and...

    Yeah, this is the part where I think I reiterate the music from the song in backwards order. I forget why I did that. Maybe I can pretend this was some kind of time gimmick because, you know, this song is about a Hero of Time, I guess?

    Wait, this song is still going on? Oh yeah, it's the longest song in this album, I guess. No no no, that's not true. [[track:rex-mille-geromius|Rex]] is much longer. And yeah, Rex is one of the few times I've made a song that's actually a decent length, but that's because I ripped the idea from the Homestuck song, [[track:rex-duodecim-angelus|Rex]].

    And... it's over. It's over, I guess. This song is over.


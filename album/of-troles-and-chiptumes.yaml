    *(Continued from [[track:rex-mille-geromius]])*

    Oh yeah, my solo album has a bonus track that I made a few days before the album actually came out.

    It's called of troles and frytunes.

    Now, once I had finished the album, besides [[track:rex-mille-geromius|Rex]], I finished most of the album over the course of a week or two, then sat there for a while and Rex, RMG for short, took me longer because I had vacations during that time and I had to do a lot of actual planning for it and the art for it took a while.

    But, still, the album was sitting there for quite a while and it was released, I guess, along with the [[album:cool-and-new-volume-v|Doctor Remix album]]. But when the album was finally ready to release, the sidebar for it had the album spelled in emojis as, like, a troll face, french fries, and a musical note. So, if you're... trolls and chiptunes, except here, we don't call them chips, we call them french fries. So, I made a song called of troles and frytunes.

    I'll let you listen for yourself, I don't even need any commentary, it's literally just layered with Fry lines from Futurama, but it would be doing this album huge injustice not to at least play this song.

    And yeah, that was of troles and frytunes for you. I hope that song spoke for itself

    It's this album's secret bonus song, but it's... I hope hearing frytunes without me even talking about it was worth your time.


    Oh yeah, second song, Mexican But Not Really, is for the guy you see here, Tavros, I guess? And the idea I had was to write a Spanish-sounding song, and then I listened to it and was like—okay, the recording starts—and I was like, wait, what the fuck, this doesn't sound Spanish at all except for the intro. But looking back, it does sound at least a little Spanish. In my opinion, at least.

    Okay, so I accidentally messed up the recording, and I'll need to start over with commenting on Mexican But Not Really. But I guess I can pick up where I left off 20 seconds in.

    And yeah, there's the remix of [[track:breathtak1ng|Breathtak1ng]], that song from the fan album [[album:beforus]], which is a really long album with a lot of pre-scratch trolls, and it's generally regarded as a not-very-good album, but it has some gems in, and Breathtak1ng is actually one of them, and it's a pretty similar song to the troll songs on this album. It was a song for Rufioh, and it's basically a medley of songs for him and his ancestor and all the Taurus trolls, and it's actually a good song, even though the whole Beforus album encouraged original compositions.

    Oh wait, fuck, that's my solo section of this song. It's one of the few songs I did that, and some people actually particularly like this song out of the album, and I think I turned it out at least somewhat unique and fun to listen to compared to the more dull parts of this album, at least.

    Oh yeah, and I used [[Penumbra Phantasm]] because that was in the Beforus song Breathtak1ng.

    Oh yeah, I think I'm one of the few people on the Cool and New Music Team if not the only one to remix something from Beforus. I don't even know if any songs for any other Homestuck fan music remixes songs from Beforus, and, I mean, it's not that I blame people for not wanting to remix Beforus, but the album does have some highlights, and, I mean, I'm sure someone has remixed, like, [[Skaia Ad Infinitum]], one of the album's popular songs, but...

    Yeah, this shouldn't be Beforus rambling, this should be rambling about this song sounding, like...

    I still do think this song sounds Spanish in retrospect, even though I thought it ended up not even close to true for this title. Maybe it is after all, I don't know.

    But yeah, this song ends with a pretty typical way I like to end songs, just with a short riff, sometimes repeating a bit of the song and then ending with a chord.

    I like ending songs that way instead of with fade-out endings, because fade-out endings make me want to die, but short bullshitted endings of my songs, it's not like anything I do with making music isn't bullshitty, but yeah.


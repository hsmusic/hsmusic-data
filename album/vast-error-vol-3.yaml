- https://soundcloud.com/splitsuns/commercial-break
Commentary: |-
    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/commercial-break), 12/19/2017)

    This is my track for the Vast Error Music Team's third album. If you haven't read Vast Error yet, it's a webcomic stylized like Homestuck but with some major differences in worldbuilding that really set it apart from your traditional fan-comic fare. I'm very lucky to have been given the opportunity to make a track for this project! Expect more Vast Error-related content from me in the future...

    Fun fact: I sampled one of the endings to FEZ at the end of the track to help bring home the effect of the instruments decaying into static. I think it turned out well. Hopefully I can do content more directly related to FEZ soon...

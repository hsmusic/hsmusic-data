Commentary: |-
    <i>Toby Fox:</i> ([UNDERTALE/DELTARUNE NEWSLETTER WINTER 2025](https://toby.fangamer.com/newsletters/winter2025/))

    I composed [[track:tv-world|the music for "TV World"]] in 2015. I used the project file for [[track:death-by-glamour|Mettaton's battle theme]] as a base. Closer to release, I modified it to add the theme from [[Hip Shop]] / [[track:welcome-to-the-green-room|Green Room]].

    Actually, I had started composing a totally different concept for TV World in 2018 that focused more on the motifs from the rest of the Chapter... but my friends' reaction to it was like "Yeah... sure... it's good..." so I was like... okay... fine... I'll go back to the original...

    (note: this song is unfinished so don't take it seriously)

    <center>♪ TV Land (WIP)</center>

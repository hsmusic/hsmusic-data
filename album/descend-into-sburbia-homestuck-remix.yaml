Commentary: |-
    <i>Brandon Giesing:</i> ([Bandcamp about blurb](https://bgiesing.bandcamp.com/track/descend-into-sburbia-homestuck-remix))
    Thanks to [[artist:toby-fox]] and Undertale, I have discovered the internet gem known as [Homestuck](https://homestuck.com)! I haven't got very far yet but the song in the [[flash:1149|Enter]] animation at the beginning is so amazing. I knew I had to do something!

    So similar to my ["7 Rockin' Seas" remix](https://bgiesing.bandcamp.com/track/7-rockin-seas-f-777-remix), I figured this song needed guitar but that's not all! We have Tubas, Saxes, various drum types, and much more! Honestly, this might be my most intensive remix to date.

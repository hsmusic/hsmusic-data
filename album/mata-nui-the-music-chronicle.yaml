Commentary: |-
    <i>SerialSymphony:</i> ([Bandcamp about blurb](https://bioniclefanmusicteam.bandcamp.com/album/mata-nui-the-music-chronicle))

    Designed as a soundscape of the 2001-2003 era of Bionicle Gen 1, this album focuses on the Island of Mata Nui and the music that gave it life. Featuring songs from across the six Wahis and a few extras, Mata Nui: The Music Chronicle is a tribute to the original setting that introduced so many fans into the world of Bionicle.

    <i>SerialSymphony:</i> ([Tumblr](https://serialsymphony.tumblr.com/post/154183620294/mata-nui-the-music-chronicle-by-bionicle-fan), 12/8/2016)

    Hey Bionicle fandom, remember a couple months back when that guy who makes bionicle music did a bunch of posts about a project and then never mentioned it again?

    WELL IT HAPPENED.

    With many thanks to the contributors [[artist:rahisaurus]], [[artist:neon-system-95]], [[artist:kmb]], and also Elissa for helping out. Special thanks to data2048, who without, this project wouldn’t of gone ahead.

    What is this album? Mata Nui: The Music Chronicle is ‘a tribute to the original 2001-2003 era of Bionicle Gen 1, that introduced so many fans into the world of Bionicle.’ With 10 tracks in total, ranging from across the island and world of Mata Nui, this album seeks to capture that nostalgic MNOG feeling in all of us.

    Give it a listen if you’re interested, and please share it with others, cheers!

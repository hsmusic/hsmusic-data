Commentary: |-
    <i>computermachine:</i> ([Bandcamp about blurb](https://computermachine.bandcamp.com/track/sburban))
    This is a song I did based off of Sburban Jungle by Divine Being [[artist:michael-guy-bowman|Bowman]]. I tried to replicate the many emotions/sections in a lot of film music. I did my best to keep the """epic""" feel of Sburban Jungle while also introducing many new elements. The piano/synth section in the middle was based on the piano breakdown in the middle, and the chord progression was built by taking the sburban jungle chord progression with a major I chord instead of a minor one. I think it just gives the song more bounce and feels more "homestucky" - being both very serious but at the same time very fun. I also added a section at the end resembling Skaia after the final build up and false ending to resemble how the kids have now fully entered the medium and are in the presence of, essentially, a god.

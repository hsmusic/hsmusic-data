Commentary: |-
    <i>Rainy:</i> ([YouTube description](https://www.youtube.com/watch?v=aXTq2L8Hwr8))

    If you’re reading this then I’m assuming you’ve read the commentary [[track:deconstruction-visions-of-a-future-untold|on the arrangement]] I had Cass Preston make for the album. Here I wanted to explore more about the composition process for this song and what I was thinking at the time. As I discussed previously, I wanted to try and recreate the process of having my track arranged by someone else much like how [[artist:buzinkai]] had her track arranged for homestuck album. With that in mind, the composition is very much me indulging in a bit of Buzinkai worship. I tried my best to write something in her style without blatantly ripping off any of her songs. There are some obvious influences for sure; [[track:doctor]] and many of her other homestuck era tracks were among the primary influences guiding the track along. It wasn’t the only one though. Another major influence was [[track:terras-theme|Terra’s Theme]] from Final Fantasy VI which was playing at the time. I felt that the “somber but determined” vibe of both the songs mentioned fit Sestro’s general vibe although that might just because he feels very Egbert coded to me. Because I was writing this song with the intention of it being arranged by someone else, I wrote it in a such a way so that Cass would have lots of room to expand on it in any way she wanted. To that end, I packed a lot of material within the short loop. One of the things that is so compelling about her music how she’ll often have background elements filling out the empty space in a mix. These can be anything from strings, to arpeggios to even entire counter melody lines. So, in the writing process, I utilized many of the song writing devices she would do in her music. It honestly made me appreciate her music even more as every aspect of her songs was deliberately written in a way to completement the other component parts. This is probably the most explicitly Homestuck sounding my VE music will ever get but I do think it works. Much like how Vast Error deconstructs the original comics tropes  and reconstructs it into something new, this song borrows the sound of one of the Homestuck music team’s most important figures to pay homage to her while doing something entirely new.

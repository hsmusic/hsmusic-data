Commentary: |-
    <i>Rainy:</i> ([YouTube description](https://www.youtube.com/watch?v=5cTogdXyCK4))

    Addendum: I wrote this commentary sometime in 2024 when a early version of Vol.6 was initially coming together. Rather than try and rewrite the commentary I'm leaving it as is.

    Spacewalking with You was the final song I wrote for Volume 6 and was a late submission to the record. I’ve had the idea for a jaunty, space adventure themed track for Rypite Koldan since I finished Syzygy earlier this year. I honestly didn’t think much of Rypite during his appearances during the comic and Snowbound Blood but seeing him geek out over cheesy science fiction movies endeared me to him. Because of my general feelings of burn out in in the middle part of the year (2024) and the deluge of music I made for Volume 6 prior, I made my peace about holding it for a future Vast Error album. It wasn’t until the team received a two-week extension for the volume 6 submissions, that I decided that it might be worth it to round out my submissions with this song. Regarding the song Itself, Spacewalking with You was my love letter to 70s and 80s electronica. Yellow Magic Orchestra was the main inspiration for this track as their distinctive brand of melody driven synth pop melded well with the idealistic, retrofuture sci-fi vibe I was going for. To best emulate their style, I limited myself to using plugin emulations of analog synths they could have used during their run as a band. While the sound of the song is a lot fuller than anything they could have done during the 70s and 80s, I do think I get close to their sound which makes me happy. Additionally, I pulled influence from songs like [“Theia”](https://www.youtube.com/watch?v=SX434YUUOH0) by [[artist:king-gizzard-and-the-lizard-wizard|King Gizzard]], [Space Quest’s Main theme](https://www.youtube.com/watch?v=ZghhSuFQWp4) and even non-music like Pulp Sci-fi Novel Covers since I felt those would help flesh out the vision I had for the track. Not the grandest song to cap off my time with Volume 6, but one I feel pretty good about.

    Fun Fact: The title comes from a manga of the same name about two boys bonding over their shared struggles with Neurodivergence and bonding over stargazing. Given Rypite’s being canonically autistic and special interest in space, it felt right.

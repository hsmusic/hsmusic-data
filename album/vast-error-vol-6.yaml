Commentary: |-
    <i>Rainy:</i> ([YouTube description](https://www.youtube.com/watch?v=RZy95H1QpjU))

    Shout out to [[artist:veritas-unae|VeritasUnae]] for the title suggestion. If I remember correctly, the impetus for this track was me listening to [[track:hydro-city-zone-act-1|“Hydrocity Zone Act 1”]] from Sonic 3 and thinking that I wanted to make something similar for Oricka. For better or worse, Violetbloods have historically associated with Sega Genesis/Megadrive sounds thanks to Toby Fox’s instrumental choices on [[Eridan’s Theme]].  Rather than leaning into the swashbuckling triplet driven feel from that track, I decided to lean heavily into the swaggering funk/new jack swing influence present in Genesis-era Sonic music. In addition to Hydrocity Zone, I took inspiration from other tracks with similar inspirations such as [[Davesprite|“Davesprite”]] by Toby Fox, [[track:buzz-off|“Buzz Off”]] by Warxtron and [[track:character-catastrophe|“Character Catastrophe”]] by Caelan Kier. With this medley of influences, the song feels more like a Murrit track in the vein of [[track:mammory-master|“Mammory Master”]] than anything you would typically associate with Oricka. Regardless, it’s a favorite of mine because of how different it is from what I usually do.

Commentary: |-
    <i>sleepytimejesse:</i> ([Bandcamp about blurb](https://sleepytimejesse.bandcamp.com/album/make-music-throw-music-a-yoshis-island-tribute))

    Join Yoshi on a new adventure! Swing, fly, and dive into the mysterious caverns of the island where new baddies await!

    "Make Music, Throw Music" is a compilation of artists paying homage to the music of Nintendo's Yoshi's Island (SNES). All music is composed using the new Yoshi's Island soundfont ripped and compiled from the game by [[artist:william-kage]].

    <i>sleepytimejesse:</i> ([Bandcamp credits blurb](https://sleepytimejesse.bandcamp.com/album/make-music-throw-music-a-yoshis-island-tribute), excerpt)

    Project Director and Co-Producer: [[artist:sleepytimejesse]]

    Soundfont Designer and Producer: [[artist:william-kage]]

    Special thanks to [[artist:fluidvolt]] for additional soundfont design.

    You can find more from these artists at:<br>
    [[artist:sleepytimejesse]]<br>
    [[artist:william-kage]]<br>
    [[artist:maxo]]<br>
    [[artist:shannon-mason|Pongball]]<br>

    <i>cookiefonster:</i>
    Meenah has three walkaround themes in Homestuck, one in each of the Openbound games. Her first two, [[Fuchsia Ruler|Fuschia Ruler]] and [[Hate You]], have plenty of remixes (mostly in fan albums), but according to the Homestuck Music Wiki, the third ([[108 Stars of Density]]) had none until now! Therefore, I felt it would make sense to remix 108 Stars of Density first and foremost for this track. I originally considered making the whole thing in 6/8 time to match 108 Stars of Density, but then I decided it would be easier to do it in 4/4. I did still want at least one of my Beforus troll songs to be non-4/4, so I did that for [[The Spiteful Saboteur|Damara’s track]].

    The song starts off pretty simple, but it really gets going once Fuschia Ruler kicks in with those kickass deep pitch-bending squarewaves, which are meant to replicate the dubstep noises so common in Meenah’s songs. It’s not the most complex or motif-dense song in this album, but I think it fits Meenah’s character quite well. It’s just the right mix of badass and sassy, and all three songs I referenced get their own portions in the spotlight. I didn’t reference any tracks other than her three walkaround themes, because I felt those three were enough to make a Troles song out of.


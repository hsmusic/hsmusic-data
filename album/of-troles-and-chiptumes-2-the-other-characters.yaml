    Caliborn’s song, on the other hand, I knew from the beginning would be a total banger.

    Originally this song was going to come right after [[Green Sun at the End of the Tunnel|god tier Calliope’s]], but I swapped the two when I decided to begin Caliborn’s song with a transition from Calliope’s, to represent her going to sleep and him waking up. Long before I started Caliborn’s song, I knew full well what it would sound like: a chaotic remix of [[The Lordling]] with other Caliborn motifs that showcases his personality—a sadistic badass who never, EVER gives up. In contrast to [[Muse of Lolpipops|Calliope’s song]], this one ended up sounding exactly like how I imagined it would.

    Caliborn’s songs are much easier to work with than Calliope’s, and it helps that he has a fair amount of motifs indirectly related to him. For instance, I included [[Walk-Stab-Walk (R&E)|Walk-Stab-Walk]] in this because it fit well with Red Sucker, and because it represents his alliance with his session’s version of Jack Noir. When making this album, I found that if a Homestuck song I’m working on has a large number of motifs to work with, it eventually snowballs into a huge motif medley as I find more and more motifs that vaguely relate to the song’s premise, or just fit well musically. The same happened when I made [[From Nobody to Nightmare to Nobody|Aranea’s song.]]


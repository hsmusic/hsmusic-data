Commentary: |-
    <i>cookiefonster:</i>
    One thing I’ve definitely improved at since 2016 is naming songs. Some songs in [[album:of-troles-and-chiptumes|the original Troles]] have really stupid names like [[The Not-Fuckass Not-Waltz]] or [[The Ascended Twilight Fangirl]].

    On a less silly note, I personally think Kanaya’s track is the weakest track on Troles, so I found Porrim’s song a good opportunity to take a second shot at it, especially since they’re fairly similar characters. This song has some parallels with Kanaya’s track such as the call-and-response section that appears in both, though this one switches a few motifs: [[Darling Kanaya]] is replaced with [[Darling Dolorosa]], and [[Gardener]] is replaced with the removed Homestuck song [[track:guardian]] (thanks to [[artist:lilithtreasure|LilithNaNBweh]] for suggesting that!).

    I really enjoyed putting the melody of Darling Dolorosa over a different set of chords from the original song, one that sounds a little bit like a beach theme from a video game. The song ended up sounding quite cheerful and a little flirty, which I think suits Porrim’s character wonderfully. Most of the song is in major key, but I made it switch to minor key during the Gardener portion, and I love how that part sounds.


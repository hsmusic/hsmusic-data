Commentary: |-
    <i>cookiefonster:</i>
    I’ve always been fascinated by the concept of the light at the end of the tunnel. It’s the point in an arduous journey where you can just feel in your body that you’re close to the end, which is an enthralling point to reach whenever I’m doing a big creative project like this one. In Homestuck, I personally think that god tier Calliope’s first speaking scene marks the point where you can see the [[light at the end of the tunnel]]. It’s page 7596 out of 8130, because holy fuck Homestuck is so damn long. No wonder most people who try to read it give up early on.

    I like to think the Cool and New Music Team song “Light at the End of the Tunnel” represents nearing the end of the team’s brave, difficult journey to complete their [[album:call-and-new-2-locomotif|convoluted second telephone game album]]. That connection is why I decided I should remix that song and [[track:reverie|throw in]] [[track:voidlight|Calliope]] [[track:the-lyrist|motifs]] in my track for god tier Calliope. That way, this song is not just an homage to Homestuck but also to my boy [[artist:cryptanark|Crypt]] who’s been a part of the Cool and New Music Team for longer than even me, and whose music has always been an inspiration to me.

    <i>itsAlana:</i>
    and so, the end is near, and so i face the final curtain

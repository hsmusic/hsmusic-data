Commentary: |-
    <i>cookiefonster:</i>
    I found Kankri a tricky character to write a song because pretty much all of his songs are slow, and many of them I found unusable for a chiptune arrangement. Additionally, his personality is so different from his dancestor Karkat that it didn’t feel logical to use Karkat songs as an alternative (except for [[Crustacean|a small reference near the end]]). He’s one of those characters that doesn’t spark enough passion in most fans to write songs about him, except if they’re in a project where they need to make songs for every Beforan troll (e.g. the albums [[album:beforus]] and [[album:beforusbound]]), and that was the situation I found myself in.

    I decided to view this track as an interesting challenge to compose something slow, since I’m more used to making hectic songs. I’m quite pleased with how this one came out! For big portions of the song I went in my own direction instead of following any of the songs I quoted all that faithfully. I think my favorite part is around 1:50 where the chord progression twists up and the instruments gradually recede, in order to lead up to the final portion with Karkat’s motif.

    <i>pktgrillao:</i>
    I think that the Signless as a concept goes so goddamn hard, so I used some of his imagery to amp Kankri up. They're technically the same guy, ain't it? If you want the backstory for why Kankri looks like this, check the notes from [[artist:cookiefonster|mr. cookiefonster]] himself.

    <i>[[artist:cookiefonster|cookiefonster's notes]]:</i>
    I (cookiefonster) want the art to show Kankri's tall pants without a sweater.

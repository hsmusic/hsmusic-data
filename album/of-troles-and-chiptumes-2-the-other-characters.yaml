- The Broken Clock
- The Lost Child
Commentary: |-
    <i>cookiefonster:</i>
    I didn’t have a clear vision of how Damara’s track would sound when I started it. I experimented with different ideas for how the song should begin, then once I found one that worked, I almost let the song write itself so to speak. Which is to say, I surprised myself a lot with the directions I went with this. I decided to start with referencing [[All Alone (Redux)]], a song in 3/4 time written for Damara, then decided the entire song should be in triple meter, which is a good way to get out of my comfort zone because hardly any of my Homestuck fan music is in 3/4 time; the only half-decent one till now was [[Bleat Like a Goat Mom]].

    It was a little tricky to pick motifs that would still sound good and recognizable in 3/4, especially ones that relate in some way to Damara. I ended up picking just two others besides All Alone (Redux): [[The Broken Clock]] since Damara is a time player and I wanted to do something with that song, and [[The Lost Child]] which is a theme for her post-scratch self, the Handmaid. Back in 2017, my CANMT colleague [[artist:pipko-fanfare]] made a song called [[The Fixed Clock]] which is a recreation of The Broken Clock but converted from 13/8 time to 4/4 time, so I thought it would also work well to convert it to 3/4, and I was right! Likewise, I like the way I converted The Lost Child to 3/4 without turning it back to [[psych0ruins]].

    The reason this track ended up so long (by my standards) is because once I explored all I wanted to with The Lost Child, I wanted to rewind through all of the song’s previous sections one by one till it returned to where it started. Personally, I love that Damara’s song turned out to be so long and complex. I didn’t expect to explore her character in so much depth musically, but I did! My favorite part is in the second portion at 2:43 where The Broken Clock is combined with The Lost Child. I think the chords I chose for this section sound really pretty, and the melody of The Broken Clock fits over them seamlessly.


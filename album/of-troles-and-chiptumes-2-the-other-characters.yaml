Commentary: |-
    <i>cookiefonster:</i>
    And now we have the first song I composed for disk 2 of this album! I didn’t start the songs for disk 2 (aside from disk jingles) till I finished disk 1. My original plan was to do [[Hoo!|Jane’s song]] first, but I wasn’t sure where to go with it. Then one day at work, an idea popped in my head for how Jake’s song for the album should sound, so I shelved my attempt at Jane’s song and started this one instead.

    My idea was that this song should have a groovy swing rhythm reminiscent of, for example, the [[Inspector Gadget Main Theme|Inspector Gadget theme song]], and it ended up working spectacularly! It nicely blends two genres that both have precedence in Jake’s musical backlog: honky-tonk ragtime and brassy adventure music. My favorite part is the chiptune approximation of a piano solo that plays [[A Taste for Adventure]]. That part is inspired by [my 8-bit cover](https://www.youtube.com/watch?v=eesnLChXJ6k) of [“Arid Canyon Zone Act 2”](https://www.youtube.com/watch?v=AVLMUu9mP3I) from Sonic Robo Blast 2, particularly the piano bridge section.

    If you’re wondering why [[Dissension (Original)|Dissension]] wasn’t in [[track:the-march-of-jade|Jade’s song]], this one is why. I felt that motif was a good fit for Jake because it’s referenced heavily in A Taste for Adventure, so in my mind that motif can be used for both characters.

    <i>itsAlana:</i>
    jake and dirk are echos of each other; isolated in an infinite stretch of ocean, looking out over the endless barrier of distance and time between them and human contact; but jake is centered while the glow of hope consumes him, the ancient ruins of the frog temple before him

- track:spider8ite
- track:spiders-claw
- Rex Duodecim Angelus
- Carne Vale
Commentary: |-
    <i>cookiefonster:</i>
    Aranea is a two-faced character, so I decided to make her track a song of two halves to represent her before and after her villainous turn. In the official discography Aranea has very little music to work with, but she does at least have [[Cobalt Corsair]] which I knew I would use heavily in this song. In fan albums Aranea has more music, but this still presented a challenge because it usually takes me a few weeks or so to get acquainted enough with a song to remix it. That’s why Aranea was the third last Beforus troll I wrote my song for.

    At the start, this song was really tough to write, but once I got the ball rolling a minute in, the song came together surprisingly quickly. It starts representing Aranea in her starting state: an exposition fairy who has spent innumerable sweeps gathering knowledge in dream bubbles without aging a day. Then, as the drums fade in, she learns about Lord English and starts playing her part in a plan to defeat him, as represented especially by the [[“English”]] motif. When English switches to the Cool and New Music Team’s [[track:1-through-15|“1 Through 15”]] (also a theme for Lord English), that’s when her sinister side awakens.

    I think the discordant part at 1:49 is pretty cool, because it represents Aranea reviving herself so she can hijack the alpha kids’ session. Then when the melody of [[track:spider8ite|Spider8ite]] kicks in, the mask is off. She’s officially a villain now and she’s motivated by a neverending thirst for relevance. Then the song gets crazier and motifs play in fast succession, as Aranea’s desperation increases and her plans start to crumble. The little reference to [[Spider’s Claw]] represents her becoming more and more like Vriska. The fast improvised notes towards the end represent the Condesce, whose plans also got completely ruined, grabbing Aranea by the neck and screaming at her. Then the empress snaps Aranea’s neck, and the spidertroll falls into lava dying a just death, represented by the ending of [[Carne Vale]] arranged in 3/4 time.

    <i>TheCosmere64:</i>
    This Song has somewhat of a melancholy feel to it, with the change from an upbeat theme to more sinister, chronicaling Aranea's turn to antagonist in the story, but not in a triumphant/evil way.

    I wanted to capture with my art that Aranea isn't necessarily a cackling evil woman but someone who simply has goals and wants to achieve them, albeit at any cost. Not sorry for what she did but doing what she does due to a feeling of deep longing for relevence.

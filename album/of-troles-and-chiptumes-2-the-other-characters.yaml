- Muse of Nanchos
- track:fireflies-owl-city
Commentary: |-
    <i>cookiefonster:</i>
    I wasn’t expecting Calliope’s song to turn out to be one of my best for this album, but holy shit, I absolutely fucking cooked with this one. I think it sounds really tender and emotional and is one of the most special tracks of this album. It helps that even though I only realized it recently, I actually have quite a bit in common with Calliope. The main thing is that she geeks out about the lore of media she likes in incredibly autistic ways, and so do I.

    I struggled for a while on how to start this song, till I decided the lovely pizzicato strings that open her song [[Reverie]] would make for a perfect introduction. Then I gave the rest of the song a lofi beat of sorts, with lots of relaxing chiptune strings and chimes playing the melody of [[Stellarum Salve]]. I made sure to put more parts of Stellarum Salve than just what’s included in its better-known counterpart, [[Carne Vale]]. The title of the song is a reference to my 2016 original composition [[Muse of Nanchos]], because I’ve always wanted to revisit it in some fashion, and Calliope’s song gave me motivation to do just that. I rounded out the song by including [[track:fireflies-owl-city]] by [[artist:owl-city]], with the rationale that the firely known variously as Serenity or Twinkly Herbert has a connection of sorts with Calliope. And because I’ve worked plenty with the song Fireflies in the past, including [an 8-bit cover from 2020](https://www.youtube.com/watch?v=FAYmqvXRVLU).

    <i>cookiefonster:</i>
    I’ve never drawn Calliope before and used this album an opportunity to draw her. I decided to draw her doing what she loves most: beefing up on her Homestuck lore. The art has some fun little references to how well I know my Homestuck lore. For instance, the lack of the Capricorn zodiac sign represents how Gamzee censored all information about himself in Rose’s journal, so Calliope never learned anything about him. Also, spirals are annoyingly hard to draw, but I’m pleased with how the spirals on her cheeks look.

    Fun fact: I actually drew this track art before making the song itself. The art for [[Green Sun at the End of the Tunnel|god tier Calliope’s song]] was also made before the song existed, and it helped give inspiration for what the song should sound like.

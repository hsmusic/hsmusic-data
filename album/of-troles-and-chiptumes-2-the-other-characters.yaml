Commentary: |-
    <i>cookiefonster:</i>
    Cronus was a tricky character to write a song for, because I find him completely insufferable in every way. Yet I didn’t want his track to reflect how much I hate his character; instead, I wanted it to reflect how much surprisingly good fan music he has. I decided this would primarily be a remix of his blues-style song [[track:aquasex-renegade|“Aquasex Renegade”]], but a little more upbeat and jazzy, because I like to dabble in writing jazzy music now and then—see also [[Detective Cherry Inspector|Terezi’s song]] from [[album:of-troles-and-chiptumes|the original Troles]]. I referenced [[Land of Cruisin and Bruisin|two other]] [[Vwiolet Vwelvwet|Cronus songs]] from [[album:beforus|the Beforus album]] as well and took plenty of liberty in how I included them.

    While most songs in this album represent what the characters are actually like, this one instead represents what Cronus fantasizes himself as: a greasy-haired 1950’s blues musician who everyone finds irresistibly hot. So I like to think of this song as a musical peek inside Cronus’s mind. I filled this song with as many blues tropes as I possibly could—heavy use of the blues scale, tons of jazzy seventh chords, improvised twists on all the melodies I quoted, and most importantly, a super-cheesy jazzy chord at the end.

    <i>TheCosmere64:</i>
    introduced originally as a justification as for why there's two moons accidentally, i've included aspects of dream bubbles here, which are primarily from earth (pieces of john's house, his tree and the moon being half troll, half earth moon), which is like a reference to Cronus's human kinning.

    He's such a tool, his track i think encapsulates this because of how jazzy and laid back it is for how much of an asshole he is.

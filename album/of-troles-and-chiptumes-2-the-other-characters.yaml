Commentary: |-
    <i>cookiefonster:</i>
    For Mituna’s song, I had one word in mind above all else: chaotic. I thought it would fit Mituna’s chaotic personality to have some songs completely unrelated to his character, and in particular I felt that [[“lecuid SMASH”]] by [[artist:whatislostinthemines]] (Mines for short) had strong Mituna vibes, so I felt I could combine that song with Mituna motifs to make a song for him. Plus, remixing that song would be returning the favor after Mines put such an awesome spin on my own song [[Muse of Nanchos]] in [[“Two master classes, a knife enthusiast, and a green dude walk into a bar.”]] I also incorporated a song that has nothing to do with Homestuck at all, [[artist:paul-mccartney]]’s cult classic song [[“Temporary Secretary”]]. Or is it actually called [[Temporary Secretary|“Jerry Temporary”]]? Who can say for sure?

    This song was a lot of fun to put together because I love chaotic songs! I kind of wish the Beforus trolls had more songs as hectic as this, but you know, that’s what I’m here for. Every character’s track in this album is meant to showcase their personality in musical form as strongly as possible. This heavily uses [[track:the-mituna-method|The Mituna Method]] much like my Sollux song [[“The Gemoni Mustard Blood”]] did, because I consider it the definite Mituna motif. I also ended the song with a bit of [[The Blind Prophet]] as a callback to The Gemoni Mustard Blood. Oh yeah, and [[Gold Pilot]] is in there for all of you who were salty I didn’t include it in my Sollux song.

    <i>cookiefonster:</i>
    I decided to do the track art for this one myself, because I knew exactly what I wanted it to be: a retrace of the McCartney II album art that says M. Captor ♊.


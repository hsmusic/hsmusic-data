Referenced Tracks:
- TIMAEUS TECH FI
- Anbroids
- Unite Synchronization
- Owner of a Lonely Heart
- Versus
- Despot
- track:jungle-3
Commentary: |-
    <i>cookiefonster:</i>
    Dirk is one of the most badass characters in Homestuck, and his alternate selves perhaps even more so—remember, his pre-scratch self once sliced a meteor in half. So for Dirk, I truly needed to make a song that could live up to his badassery. His song for the album can be broken up into three movements; let’s break them down.

    <b>Movement 1:</b> When brainstorming ideas for Dirk’s song, I remembered there were two songs about him on [[album:fondly-regard-illustration]], both total bangers, so I decided it would be fun to reference one of those instead of just relying on his canon repertoire. Thus I started the song by referencing [[TIMAEUS TECH FI]] from that album. Then I combined it with [[Anbroids]] and [[Unite Synchronization]], the two Dirk-related songs that play in the comic, and added some funky chords beneath them.

    <b>Movement 2:</b> I wasn’t sure where to continue after I did all I wanted to with Unite Synchronization, until I decided to throw a non-Homestuck song into this, namely [[“Owner of a Lonely Heart”]] by [[artist:yes]] because Dirk is a heart player. The song ended up a natural combination with [[“Versus”]], a song that’s indirectly related to Dirk. Movement 2 didn’t last too long; I felt the song needed to switch gears once again or else Owner of a Lonely Heart would dominate the whole thing.

    <b>Movement 3:</b> This movement is centered around [[Despot]], which is easily my favorite Dirk song. I initially thought I would only reference it subtly, but itended up dominating the entire third movement. This part is mainly a hardcore chiptune remix of Despot, but it also quotes my own [[track:jungle-3]], and around 2:50 the melody and chords go in a new direction until the song returns to where it began. As is common of video game songs, it doesn’t loop right to the beginning, but instead includes a modified version of the intro that dies down then builds up a little bit, until it loops to an earlier point in the song.

    To conclude this song, I did something highly unusual for me: a fadeout ending. In the early days of CANMT I used to complain about fadeout endings all the time, so it might come as a surprise that I did one. I did this partly because I couldn’t think of a good way to end it, and party because I thought it’d be fun to make this song loopable as though it were video game music. That should help distinguish Dirk’s track from the rest of this album, since he’s quite an eccentric guy.

    <i>itsAlana:</i>
    dirk is above it all, perched on the radio tower, technology and connection and invention, sending his heart and his head over the airwaves; but like jake, the waves divide him from all humanity, no matter how high his technological ability climbs.

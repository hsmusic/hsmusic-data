Commentary: |-
    <i>cookiefonster:</i>
    It’s been a longtime idea of mine (suggested by other CANMT members) to do a Troles-style song specifically for Rose, so this album was a perfect opportunity to do just that, and perhaps subvert expectations a little in the process. I’ve already made two chiptune songs about Rose in the past: [[track:s-rose-jef-strife]] in 2016, and [[Aggrieve (Knightcore Mix)]] in 2021. Both are hectic battle themes, so for Troles 2 I felt I should musically interpret her character a different way. This time, Rose gets an elegant classy waltz that heavily uses a chiptune approximation of a violin.

    [[Aggrieve]] is one of my favorite Homestuck motifs and I always have fun coming up with new spins on it. For this song, I arranged the motif into 3/4 time and later on came up with a major key variant of it, which ended up becoming my favorite part of the song. If I make a song and end up really liking one specific section, I like to to end the song by reprising that section till it leads to a conclusion. I used lots of other Rose motifs too, of course—[[Black Rose / Green Sun|Black Rose/Green Sun]] and [[Endless Climb]] were natural fits with the time signature. Before I decided to make this song a waltz, I considered heavily using [[Core of Darkness]] from [[album:prospit-and-derse]]. Instead I squeezed in a bit of [[Derse Dreamers]] near the end of the song. At the very end of the song I put in [[Darling Kanaya]], as a reference to Rose and Kanaya’s romantic relationship and because it fit perfectly with the song’s time signature.


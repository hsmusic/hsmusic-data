URLs:
- https://coolandnewwebcomic.bandcamp.com/track/scratch-that
Commentary: |-
    <i>cookiefonster:</i>
    We’re almost at the end, folks—this is my song for Doc Scratch. He’s not quite a human, troll, or cherub, but he has lots of lines in the comic and is a significant enough character that I felt he deserved a track on the album.

    Originally Horuss was going to be the only character to get [[Who?|an original composition]], but then I decided Scratch should also get an original piece. There’s no shortage of official and unofficial music related to Doc Scratch, yet writing an original song for him just felt right to me. I can’t really explain why. For this song I wanted to lean all the way into the villainous sound, to a higher degree than most of Scratch’s songs do. It’s meant to sound like a jazzy villain song from a kids’ movie, but in an elegant classy way. The composition began as a melody I hummed to myself a bunch at work; when that happens, I like to film a recording of myself when I get the chance so I don’t forget how the melody sounds. As I said earlier in this booklet, writing original songs is hard! But making a song out of Scratch’s existing motifs would’ve been harder.

    <i>Jebb:</i>
    Photobashing is fun! This was done with primarily 3 images - the bar, the guy, and the head - and welded all together with some cleanups into this piece. Pretty proud of this, especially considering i've never really properly tried anything like it before! I really enjoy Scratch as a villain so it was neat to have him taking a photo in a torn apart bar.

    Ignore that he doesn't have his bowtie. This is him casual-style. Yup.

Commentary: |-
    <i>cookiefonster:</i>
    And to finish off, we’ve got the final song I made for this album: a final boss battle theme for Lord English, meant to be this album’s counterpart to [[Rex Mille Geromius]]. I wanted this song to frequently change key, in a similar fashion to [Egg Satellite Zone](https://www.youtube.com/watch?v=rnWdjFlQ_C8) from Sonic Robo Blast 2, and I decided the best way to do that was to end each section with an unexpected chord that seamlessly leads into a new key.

    I pulled all the stops composing this and eventually I got tired of pulling stops and just wanted to finish the damn thing. Still, I think this is very much a worthy final track for this album. I think this is a song I can look back on many years from now and think “holy shit, how did I do that?”

    The song starts with [[Battle Against an Unfathomable Enemy]], a Homestuck song that doesn’t get enough love, then mostly uses three main motifs: [[English]], [[Negastrife]], and my own Rex Mille Geromius. Then I put in a crazy dissonant section with the CANMT’s [[Scratching Consequences]] and [[track:1-through-15]], plus backwards Negastrife because Lord English is a time traveler. After the dissonant section comes a remix of [[Oppa Toby Style]] with a bunch of key changes, including my favorite part which is where [[Moshi Moshi?]] comes in. At the end I admittedly just wanted to wrap up the song, but I’m still very proud of how this came out.

    Also, the title is an homage to my interest in large numbers, since quetta- is the metric prefix for 1,000,000,000,000,000,000,000,000,000,000 (a nonillion). Likewise, you could call an extremely tiny battle (e.g. between a hydrogen and helium atom) a “quectostrife”.

    <i>pktgrillao:</i>
    Lord English didn't look menacing enough in Act 7. He looked more grotesque than menacing. Anyways, shoutouts to [cookiefonster's homestuck commentary](https://cookiefonster.com/2015/09/18/new-post-series-cookie-fonster-dissects-homestuck-introduction/), the best archive of homestuck imagery according to google and my way of getting references.

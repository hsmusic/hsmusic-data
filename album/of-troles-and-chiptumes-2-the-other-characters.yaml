Commentary: |-
    <i>cookiefonster:</i>

    This was the final song I wrote for disc 1 of my album—I saved Meulin’s track for last. When discussing on Discord which songs I should use in each of my Beforus troll themes, someone suggested I should use [[InterNep]] from [[album:lofam5|LOFAM5]] in Meulin’s song. When I heard that song for the first time, I was blown away and knew immediately that I should follow this suggestion wholeheartedly. As [[artist:tee-vee]] himself said about the song: “<i>Even though I was inspired by Nepeta I think it could very much fit Meulin as well, it's a very Leijon track in my mind.</i>”

    In the end, this turned out to be a modernized rehash of Nepeta’s [[album:of-troles-and-chiptumes|Troles song]], [[“Everyone Forgets She Kills Animals”]]—a hectic mix of songs related to the Leijons, plus a few songs indirectly related. Nepeta’s track used [[Davesprite]] and [[Sunsetter]] because of Davepetasprite^2, and this song uses [[Renai Circulation]] because Meulin likes anime gifs and because I thought it would fit well musically. Not to mention that Renai Circulation is one of the most infectious songs I’ve ever heard. In my mind, both Nepeta and Meulin warrant the craziest, most fun songs you could possibly imagine. Though some people prefer to write slow romantic songs for them, and that’s okay too!


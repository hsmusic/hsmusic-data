Track: Who?
Duration: 2:26
Color: '#487aef'
Cover Artists:
- 80%VAL
Art Tags:
- Horuss
URLs:
- https://coolandnewwebcomic.bandcamp.com/track/who
Commentary: |-
    <i>cookiefonster:</i>
    Fun fact: when I met a fellow Homestuck fan in a summer camp back in 2016 and told them about [[album:of-troles-and-chiptumes]], they suggested that if I make a song about Horuss I should title it “Who?” because he’s such a forgettable character. Ten years later, I followed through with this idea!

    This song is one of two in my album that is a completely original composition. I decided Horuss’s track should be fully original for three reasons: (1) it would fit him as a “blank slate” character, (2) it would be an interesting challenge since I don’t compose original music much, and (3) it’s frankly easier to compose a Horuss song myself than try to dig up songs with usable melodies to remix. I think most of Horuss’s songs are too gloomy and eerie (and don’t have much of a melody), so I felt he deserved a theme that’s more lighthearted. He loves horses, robots, and horse robots, so I decided to make this a sort of military march akin to [[Horschestra]]. If you ever want to remix this into your very own Horuss song, you’re more than welcome to!

    Writing original compositions is hard! But to fair, writing a song out of existing Horuss motifs would’ve been even harder. While writing this song, I knew that after I finished it, the next one for me to write would feel a lot easier.

    <i>80%VAL:</i>
    Y'know I've never drawn this horse guy before and honestly I might not have thought to for a long long time if it wasn't for him being one of the untaken characters towards the end of this projects timeline.

    Initially when I first started working on my art pieces for this album I thought "Hey sure I think I can draw a minimum of 2 characters by the end" but then I got so fired up from working on the last two might as well, right?

    So I checked who else was availible and I was like sure why not, it'll be a fun challenge, never drew a guy like that before. Anyway, I've been converted now, I ended up absolutely adoring Horuss Zahhak by the end of this piece.

    As someone who mutually works on machines I find myself relating to em in some fashion.

    Anyway I surprised even myself with this one since it was a pretty tough month for me but it ended up being one of my best pieces from this project.

    While you're here go out and buy yourself a a set of good acrylic markers, they're simply the best!

Commentary: |-
    <i>cookiefonster:</i>
    I know this sounds nothing like a march; the song’s title is meant as a callback to the first song I ever composed for CANMT, titled [[“the march of jaed”]], which is also nothing like a march. That song was a purposely bad and incoherent medley of Jade motifs, whereas this one takes the same premise but does it sincerely.

    I decided to start this song with a motif that appears quite early in Homestuck but is seldom remixed, [[Ballad of Awakening]]. I did make an [8-bit cover of it in 2019](https://www.youtube.com/watch?v=nczhv3kTbgc) though! When thinking of a spin I could put on that song, I decided I should make the entirety of Jade’s song in 5/4 time. She’s a quirky girl so an unusual time signature would suit her perfectly. I want to say I’ve never written music in 5/4 before, but I’ve made a handful of arrangements of music in that time signature so I do have a little experience working in it.

    From then on, this song is a tour of Jade’s musical repertoire minus the [[track:guardian|removed]] Bill Bolin [[track:mutiny|songs]]. [[Carefree Action]]/[[Carefree Victory|Victory]] gets plenty of time to shine here, because I remember when [[artist:james-roach]] released [[track:carefree-victory-remix|Jade’s Pesterquest theme]], he said Carefree Action was the motif that felt most like hers, and I think he had a good point. The song is mostly upbeat and joyful, but it has a more action-oriented section when [[Atomic Bonsai]] and [[Courser]] come in, which represents her courage and fighting prowess. That part was meant to sound somewhat like something [[artist:toby-fox]] and/or [[artist:zun]] would write, hence the sudden key change. And then after that part, the song returns to where it began with a pinch of [[The Beginning of Something Really Excellent]], a motif I almost forgot to include.


Commentary: |-
    <i>Cool and New Music Team:</i> ([Bandcamp about blurb](https://coolandnewwebcomic.bandcamp.com/album/of-troles-and-chiptumes-2-the-other-characters))

    All songs composed with FamiTracker

    <i>cookiefonster:</i>
    Back in 2016, I made a Homestuck fan album titled [[album:of-troles-and-chiptumes]]. The first twelve songs I made all over the course of a week (July 11 to 18, 2016), while the final song [[Rex Mille Geromius]] took me about two weeks (July 24 to August 7) due to procrastination.

    For many years now, since at least as early as 2018, I've wanted to do a sequel to Of Troles and Chiptumes, but I wasn't sure what the sequel should consist of. My ideas were to make remastered themes for the twelve Alternian trolls in Homestuck (I actually did do one for Vriska, called [[Madame Controversielle 2]]), or themes for the Cool and New Web Comic trolls, or themes for other characters in Homestuck. In the end I decided to go with the last idea, with the album divided into three disks. Disk 1 (12 tracks) is about the Beforus trolls, disk 2 (8 tracks) is about the beta and alpha kids, and disk 3 (5 tracks) is about the cherubs. All three disks have a short jingle to open them, which means this album adds up to 28 tracks. 29, if you count [[track:an-unfinished-chiptune-remix-of-the-fake-eridans-theme-that-i-made-in-2017|my very silly bonus track]].

    I began working on this album on May 12, 2026. I finished the final track on November 7, so suffice to say this took quite a bit longer than the original Troles!

    If you know anything about me, you’ll know that I’ll never stop being a gigantic Homestuck fan, no matter how much drama the fandom goes through. This album serves as a tribute not just to Homestuck the webcomic, but also to the wonderful world of Homestuck music, both official and fanmade. I worked my ass off making this album and I hope you enjoy listening to it!

    Shoutouts to the track artists for absolutely KILLING IT with the track art.

    —Cedric Fausey (cookiefonster)

    <i>pktgrillao:</i>
    So, I wanted to represent the three groups of characters in the album, by picking a recognizable one of each. My mind quickly went to [[flash:6901|[S] Game Over]] to represent the most important characters of Discs 2 and 3, but, what about the dancestors on Disc 1? Well, I thought about Kankri not because he's the most important one, instead I chose him because rule of funny. He'd be the most likely to try and lecture the two knuckleheads trying to kill each other. (About the alpha kids? Well, there's some Dirk glasses on the background, I guess.)

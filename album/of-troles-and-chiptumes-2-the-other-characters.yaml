Commentary: |-
    <i>cookiefonster:</i>
    Kurloz doesn’t have much depth as a character, but he does have one absolutely fucking amazing song related to him: [[“le canrival”]] by [[artist:noisemaker]] (known in [[album:lofam4|LOFAM4]] as [[track:premortem|“Premortem”]]), an electronic remix of [[Purple Tyrant]] that is one of the most beloved songs the Cool and New Music Team has ever produced. Therefore I decided Kurloz’s track in my album should be the Canrival remix that I’ve always wanted to make. And oh my god, this one was such a joy to make. I ended up going for a similar vibe to frantic battle themes from Deltarune, especially [[Attack of the Killer Queen]]. The quiet section at 1:24 in particular is heavily inspired by the quiet part of Attack of the Killer Queen, where [[Berdly|Berdly’s motif]] is played on harpsichords.

    Gamzee’s song [[“The March of the One True Juggalo”]] is already one of my favorite tracks I did in [[album:of-troles-and-chiptumes|the original Troles]], so this one to me feels almost like a remastered version of Gamzee’s track. It references Purple Tyrant (through le canrival), [[Purple Bard]], and [[Carne Vale]], all motifs that I also used in Gamzee’s song. In particular, it quotes Carne Vale in a better, more prominent way than its predecessor song did. Overall I’m incredibly proud of how this track came out. I like to imagine the song would play if one of the Beforus trolls (Cronus perhaps?) somehow manages to get on Kurloz’s bad side and they have a dramatic duel where Kurloz shows us all his freaky superpowers.

    <i>bunnysoryu:</i>
    :o)

Commentary: |-
    <i>cookiefonster:</i>
    After all those songs for Beforus trolls I mostly don’t care about, Disk 2 begins a song about my favorite Homestuck character, the one and only John Egbert! Pretty much every friend of mine who’s read Homestuck says that I’m a lot like him, and they aren’t wrong. I really love this character which means I knew John’s song had to be extra special: something action-oriented but also tender and earnest.

    The song starts off sort of like a John counterpart to my own [[Aggrieve (Knightcore Mix)]] from 2021, remixing [[Showtime (Original Mix)|Showtime]] instead of [[Aggrieve]], then it expands upon the song with a variety of other John motifs. I’m very proud of including [[Planet Healer]] into this, because according to the Homestuck Music Wiki I’m the first person to remix that song, which is kind of nuts considering it appeared in Homestuck. At heart the song remains an extrapolation of Showtime, even as it includes all those elements of [[Doctor]] and [[Heir Conditioning]], which is why it calms down when it reaches the bridge section of Showtime. That leads into [[Lifdoff]] (a major key reimagining of Showtime), then more of Planet Healer, and finally [[How Do I Live]] because the song’s title references John’s favorite movie, Con Air. Oh, and it ends with the [[Showtime (Imp Strife Mix)|Showtime victory]] [[track:fanfare|fanfare]] to reference more music that plays in Homestuck itself.

    I knew John’s song would be a special one, but I wasn’t expecting it to be almost five minutes long. I suppose that’s inevitable when this character had such an abundance of material to work with.

    <i>80%VAL:</i>

    When I first started drawing John for this one I was expirimenting with a new style because originally this piece started on digital!

    I would've probably continued it as a digital illustration if I didn't have about 2 weeks to get everything done, (and my usual style might've taken longer so I decided to do something that only needed one layer (traditional)).

    Anyway so I transfered the sketch onto my sketch pad by using my ipad as a makeshift light board and going over it again on paper, then colored it from there. I even used my gel eyeliner for the linework because I didnt have a pen at the time.

    I drew in the bg last minute because it seemed vacant, [[artist:cookiefonster|Cookie]] suggested LOWAS since I had used purple as a temporary color and honestly, makes the most sense in hindsight!


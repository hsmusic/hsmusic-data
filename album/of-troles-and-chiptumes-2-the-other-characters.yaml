Commentary: |-
    <i>cookiefonster:</i>
    I don’t care that much for most of the Beforus trolls as characters, but I actually do have a soft spot for Rufioh. He’s a nice dude who doesn’t know why everyone has a crush on him and isn’t ashamed to love TV shows that some think are only for kids. Plus, he was put in the comic as an homage to Dante Basco which is also pretty cool.

    Rufioh’s track presented an interesting challenge because I used his and Tavros’s backlog of songs quite thoroughly in Tavros’s song for [[album:of-troles-and-chiptumes|Troles 1]], [[“Mexican But Not Really”]]. In particular, that song heavily referenced Rufioh’s [[track:breathtak1ng|“Breathtak1ng”]], which is my favorite of the principal tracks from the Beforus album. It’s a lovely medley of the Nitrams’ themes plus a few related to their fellow breath player John, and I feel that on a subconscious level it may have inspired Troles as a whole. I’ve always been fascinated by Homestuck songs that combine various motifs into something greater than the sum of their parts (e.g. [[Descend]] or [[Rex Duodecim Angelus]]), and I especially loved that Breathtak1ng was such a medley designed around one particular character. This track ended up even more shamelessly inspired by Breathtak1ng.

    [[Bronze Rebel]] is Rufioh’s most recognizable motif, so I decided to use it heavily in this song, but with a lot of little alterations to the melody. Breathtak1ng I also felt obligated to reference in this song; since I referenced the first half in Mexican But Not Really, for this one I focused instead on the second half. One motif related to the Nitrams that I didn’t use at all in Tavros’s song was [[“iRRRRRRRRECONCILA8LE”]], so I figured, why not use it here? This one was a lot of fun to put together, especially with all the chords played on a chiptune imitation of a guitar. It felt almost as if I was 8-bit covering a song with whistling and guitar, except it was in fact my own composition.

    If you recognize the melody at 0:48, then congratulations, you’re a true cookiefonster fan! It’s an original melody I wrote on a whim for Mexican But Not Really, so I thought it’d be fun to bring that melody back for Rufioh’s track.

    <i>itsAlana:</i>

    shoutout to my fiance for telling me to put shojo bubbles in the background; no one has ever been more right than them.

Commentary: |-
    <i>cookiefonster:</i>
    This was the very first track I made for Troles 2—Latula is all about being a super-rad gamer girl, so I knew writing a chiptune theme for her would come naturally. I also knew I wanted this to be a completely different type of song from Terezi’s track [[Detective Cherry Inspector]], a song I was a little hard on in [my Troles commentary video from 2017](https://www.youtube.com/watch?v=USoHDGQiNVA?t=1852) but I now think is one of the coolest tracks from [[album:of-troles-and-chiptumes|that album]] because it’s so jazzy and suits Terezi’s character really well. Likewise, this is without a doubt one of my favorite tracks from Troles 2— it’s just so true to my musical style. Most of Latula’s songs from fan albums feel a little too restrained in my opinion; I feel her character demands the raddest gamer girl banger you could possibly imagine, so that’s what I decided this track should be.

    The bulk of it is a chiptune reimagining of [[G4M3 OR D13]] from Tensei’s [[album:strife-2]], a song originally written for Latula, and I sprinkled in a few other motifs related to the Pyropes. I had a lot of fun putting in a shitload of crazy drum fills like you’d hear in a Mega Man game. Percussion used to be my least favorite part about making chiptunes, but now it’s one of my favorite parts.

    This song has a notable parallel to Terezi’s song from Troles: both have bridge sections quoting [[Teal Seer]]. Writing that part was one of those moments where I could just imagine exactly how part of a song should sound like in my head, so I wrote that part without even really thinking about it.

    <i>bunnysoryu:</i>

    BRO-NOTES: Latula was so rad, ha ha. I mean damn.

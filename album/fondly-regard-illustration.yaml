Commentary: |-
    <i>Reese:</i>
    A piece that features new unabstracted sprites of Dirks Bro and ICP. I've always thought about how cool it would have been for there to be an actual strife flash for this fight and how awesome the song for this hypothetical flash would be.

    <i>Jebb:</i>
    Coulrocide is a track which i had worked on for quite a while, and one which I am personally very, very proud of. It has everything - orchestra, electronic, breakcore... I tend to compose music which i would personally listen to, and this is DEFINITELY such a track. There's a hell of a punch in it, and for a reason.

    While making this song i had realized that there aren't really any tracks made for the grand battle of the ICP vs Alpha Strider??? So, of course, I tried to give the scene justice, considering its context.

    Every part goes back and forth between Dave and ICP having the upper hand in the battle, and it is reflected in the feel and the motifs of each separate segment. I tried to represent the full story with the melodies, from the start to the gory end. If you listen closely, you can hear each part:

    - (0:00) The Juggalos overlooking their domain.
    - (1:23) Dave appearing to challenge them.
    - (1:45) The combatants walking towards eachother, walk transitioning to run.
    - (2:00) The battle commencing.
    - (5:46) The juggalos' last ditch attempt to kill Strider.
    - (5:55) Single conclusive SLICE to kill them both, the clowns' bodies falling heavily onto the ground.
    And finally,
    - (6:02)<br><code style="color: #f2a400">TT: The few witnesses would report seeing only a man with a sword on a shitty skateboard, gently rising into the night sky.<br>TT: No one ever saw him again.</code>

    (P.S, the whistling at the end was me. Since i am kinda bad at whistling, i pitched it up quite a bit.)

    I would also very much like to thank [[artist:horizonseek-studios|PuyoPuyoESports]] for coming up with the track name "Coulrocide" (it was Clownicide before that) and [[artist:reese|Puff]] for giving me the inspiration to make this track with their absolutely lovely artwork!

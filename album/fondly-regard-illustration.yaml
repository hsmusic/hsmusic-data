Commentary: |-
    <i>Jebb:</i>
    It's very funny to look at all of the absolutely glorious art pieces present in this album and then gaze upon mine, drawn in MS Paint, with my signature mouse. HOWEVER, i must say - in the end, i really like the execution of the idea. The dual colors, the Libra sign acting as a table for the jury, the nooses metaphorically pointing towards the centre.... I really like the composition in this piece, is what i want to say.

    I didn't really have any ideas for this piece going in, i sorta just started doodling and each piece fell into place slowly. An interesting (bad) thing about the MS Paint chalk brush is that it has a lot of very sharp angles, thus it ends up looking very unnatural when you use it to draw anything at all. I ended up manually softening the edges of basically every single instance where they were way too sharp. Ended up making the whole thing look a lot more polished.

    At one point a version without the mouth was attempted, however i felt like it didn't look feral enough, like how the current version does (because we ALL know that Terezi loooooves her executions).

    Finally, thanks a lot to Gryo for picking up this piece! The more dramatic NSMB Ghost House vibe is great, and really does fit the art.

    <i>Makin:</i> (album management)
    This track was nameless for nearly a year until gryotharian came up with this masterpiece, just 56 minutes after saying, "I still got nothing on title ideas". Never give up.

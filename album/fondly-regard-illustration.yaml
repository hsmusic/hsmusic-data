Commentary: |-
    <i>Awkward:</i>
    So this piece actually started as a sketch I made when I was around 16. I made it for a drawing class as a piece to work on perspective (and because I wanted to insert my fandoms into my schoolwork as many dorky teenagers do). I had wanted to clean up that piece for a while now and make a finished drawing out of it, so when the pitch for this album was just "hey art team draw whatever you want" I decided on this direction pretty much instantly.
    The actual drawing process for this took FOREVER. The rendering looks simple in hindsight but I had to redo it like four times in order to get it to look right. The earliest sketches I have date back to September or October 2023 and I didn't end up finishing it until September 2024. So that's like... a whole year's worth of me taking this on bit by bit. But I think it's something I can be proud of!

    <img src="media/misc/golden-sights-skaian-skies-sketch.jpg" width="400">

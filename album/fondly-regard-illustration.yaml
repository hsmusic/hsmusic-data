Commentary: |-
    <i>Selan Pike:</i>
    Sepulchritude, but <i>Pieta</i> style

    <i>Circlejourney:</i>
    Problem Sleuth (the character) using Sepulchritude at the climax of *Problem Sleuth* (the comic) is still one of my favourite moments in any comic I've read, and I love how Selan Pike captured it here. I wanted to make a track reflecting the themes threaded through both the comic scene and the Piéta motif. Chopped samples were meant to gesture to the reality-bending intensity of the moment, while the orchestral chimes and xiao relate to the divine references. The quotes are of two of my favourite [[album:weird-puzzle-tunes]] tracks - I enjoyed the chance to call back to fond early memories of UMSPAF and the first album they released after I joined, which Selan Pike incidentally also illustrated for! We've come full circle.

    <i>SleepyHeck:</i>
    Screenshot of the obscure MMO RPG "SBURB 2: Online™", depicting a PARTY of PLAYERS participating in a RAID against one of the endgame BOSSES of the "The Clownprince of Zillyhoo™" EXPANSION PACK.

    Inspiration hit when I, out in the wild, encountered a short PepsiCola AU comic about them growing up playing a SBURB MMO game together. Coupled with that we can never have enuff STRIFE battle themes and me being a FF14 fan, I got an idea about classpected players taking on a SBURB Raid boss forcefully lodged into my brainwrinkles. I also felt that NPC enemies needed som love, so I decided on the Lich(?) thing from the opening of [[flash:4109|[S] Cascade]] would fit the bill as the raid boss.


Commentary: |-
    <i>Pax Probliscum:</i>
    When I saw Artatruc's great artpiece I knew this was the perfect moment to create a track I'd imagine the Strilondes would make if they got together for a recording jam! It loosely follows the structure of Derse Dreamers, but with a few letimotifs scattered throughout the track that I felt represents each of the Strilonde identities, as well as including the other Derse tracks of the Prospit and Derse album (the objectively better side of the album :P).

    Dave and Rose were already featured in Derse Dreamers with the Atomyk Ebonpyre and Endless Climb motifs respectively. Adding in Even in Death for Roxy was an easy choice, and builds momentum in the track. However, finding a good motif for Dirk was a bit more difficult, until I remembered that Austin, Atlantis had the perfect melancholic tone to lead the last section of the song into Now I'm A Villain (which I honestly just wanted to use since the [[album:beyond-canon]] album has some banger tunes that I don't think have been featured in the fanmusic scene).

    Alternative track name: strilonde-mix-final-final2-FINAL-hellaJeff soundbites removed.mp3

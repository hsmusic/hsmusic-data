Commentary: |-
    <i>Kett:</i>
    I had a few ideas for my art piece, but ultimately decided on something TTRPG related and remembering the Soul-Fraying Games comic, it was the perfect combo! The characters had some great designs for their D&D selves, and it's a shame we didn't get to see any of their campaign actually play out because pretty sure Terezi would have had some great encounters for them!
    For the fight I wanted to show off their chosen classes as well as their personalities as best I could, hence why despite Dave and Karkat both being knights, Karkat is immediately going to rush the fight whereas Dave is in a more defensive stance. I did toy with the idea of creating two versions, with Karkat as the 1/2 undead, 1/2 uneaten crab-sandwich but in the end decided against it. Who knows, I may revisit the piece and make that version a reality.

    <i>Circlejourney:</i>
    Adore the concept of the art piece! As a TTRPG afficionado myself, I loved having the opportunity to break out the orchestral instruments and really lean into the high fantasy sound. Someone described this as music you might hear at the fantasy tavern - mission accomplished, I think.

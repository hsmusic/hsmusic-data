Commentary: |-
    <i>Cecily Renns:</i>
    As an OG [[group:canmt|cool and new music team]] member, the [[album:jpeg|jpeg]] album we did was one of my favourites ever, so when UMSPAF started one too I absolutely wanted to join.
    The artwork here by Jas really spoke to me, because I always love the idea of the characters performing music together in Homestuck related media, and Chixie is my favourite Friendsim character. And when the prompt said "Punk rock-y/Any vocals would be good", I thought this one was a match made in heaven for me specifically.
    This one went through multiple iterations, as I was cycling through various folk punk bands that were favourites of mine for inspiration. Against Me and The Front Bottoms were considered, as well as a [[artist:scott-stutzman|Scott Stutzman/Kasko Lunford]] type track, but eventually I settled for a classic AJJ style song, with a yelled rap section which was inspired by Jeff Rosenstock.
    This is a very political song by nature of it being folk punk. The first verse went through the most changes. Sometimes, you just read about all the serious stuff in the news and as an artist, you might feel like none of what you do matters. But I think making art in the face of tragedy is a radical action itself. It doesn't compare to like, direct action or community organizing, but to express yourself and grow your soul in a world that wants you to stay quiet and die can be a powerful thing.
    P.S: Free Palestine!!!

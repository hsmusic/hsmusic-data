Commentary: |-
    <i>Monckat:</i>
    Whistles the eternally pure hearted virtuoso clown/sex worker/revolutionary messiah soars high above the paltry concerns of the world, in search of his one true guiding light: the unequalled, unimpeachable, and definitely un-cannibalistic Ringmaster Pendlecoat. Will his judgment bring joy or despair to his clownish allies Gumblin and Doodlebean? Find out in the next spectacular issue, which will be releasing to legions of adoring fans any day now! Any day now...

    Completed or not, The Starlight Calliope remains my favorite thing Hussie's ever done, the art in particular having been deeply embedded in the bedrock of my own style since the day I first saw it. I've long hoped to see more fan media made for this comic, and this album seemed like a perfect opportunity to strong-arm a Whistles Musical Theme into existence. Ucklin of course exceeded all my expectations!

    <i>Ucklin:</i>
    Monckat's incredible art was the impetus for me finally reading *Whistles*. As I did, I was trying to think of an angle for lyrics that would convey the most important parts of who Whistles is in his setting— In a way that wasn't so specific as to not have an emotional anchor in real life. I decided to through the eyes of someone who sees the best in him, Doodlebean, and to imagine what she might be enamored with in him. He's someone unwaveringly optimistic in an objectively dark world, and that's a trait I think can inspire awe when you feel grounded yourself. That's how I ended up with the chorus. Then, Monckat mentioned they originally imagined something darker and more like the band Clowncore to go with the art. Oh! Wellll... I didn't want to throw away the chorus, but I paired it with a much more stagnant and distorted verse, and a good old DVS sax bridge. I didn't plan it from the start, but I feel like that juxtaposition was lucky because it highlights how Whistles' optimism verges on unnerving!

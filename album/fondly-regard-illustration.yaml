Commentary: |-
    <i>Ender:</i>
    Even though I spend the majority of my time on random Homestuck projects, my true love is The Dark Crystal. This piece is specifically inspired by the Wall of Destiny from the movie, which I have actually seen in real life. It's cool as hell. I wanted to depict a prophetic wall hidden deep in the bowels of Earth C, foreshadowing the eventual timeline loop of Lord English dying in the Epilogues...or at least in half of them. There's also the implication that Caliborn will one day be born on Earth C itself, so no matter what they do or where they go his influence is always there. The text on the top and bottom is written in Alternian, and the bottom ended up being obscured a bit by the torches, but here's the full prophecy:

    "To the canon we must adhere<br>Two timelines the choice will steer<br>Time will tell, the truth is clear<br>The demon is already here"

    It's a half-decent, syllable-matching word replacement of the iconic prophecy from the Wall of Destiny in The Dark Crystal, which is:

    "When single shines the triple sun<br>What was sundered and undone<br>Shall be whole, the two made one<br>By Gelfling hand, or else by none"

    One of these days I'll make part two to this piece by making a massive Lord English puppet and choreographing and puppeteering my own version of this whole ending battle in question. Like that big skeleton from Kubo and the Two Strings. Man I love puppets. But that's a lot of work so for now you get some drawings and also A Very Homestuck Puppet Show.

    <i>ruby:</i>
    I saw a wip of the artwork and my brain immediately went to The Legend from [[album:deltarune-ch1-ost|DELTARUNE]], so I decided to basically remake The Legend with Homestuck motifs, focusing on English for obvious reasons.
    instead of just recreating the song, I wanted to give it a more orchestral vibe, with some of the original elements serving as backing.

    the end result is a kind of hybrid between Toby's style and more serious orchestra, which I think sounds really cool!
---

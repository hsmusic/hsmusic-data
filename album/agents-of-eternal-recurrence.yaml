Commentary: |-
    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary)

    This is probably the stupidest song I've ever written. My idea was, well, [["Chain of Prospit"]] is basically what people imagine a "Homestuck song with lyrics" would be like, with direct references to the comic itself. How about I take that one step further and just write a song ABOUT making Homestuck fan comics???

    Our good friend Tay (AKA [[artist:whatislostinthemines|WHATISLOSTINTHEMINES]]) takes the reins here for the lead vocals, something they belted out in a day which is impressive. But also somehow I got [[artist:michael-guy-bowman|Michael Guy Bowman himself]] to do the "Losing My Edge" LCD Soundsystem parody segment. We're all still trying to figure out how this happened.

    There is also an interpolation of "Would You Like to Talk About Homestuck" by Ken Ashcorp here, a very old song that makes fun of Homestuck fans. I found it through the band Ear Piercings' [cover of it](https://www.youtube.com/watch?v=28mMN6rEZWI), which takes its cynicism and turns the song into a genuine celebration of the fandom. If I was going to reference any song in this album, I thought it'd be this one.

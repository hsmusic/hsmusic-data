Commentary: |-
    <i>Cool and New Music Team:</i> ([Bandcamp about blurb](https://coolandnewwebcomic.bandcamp.com/album/agents-of-eternal-recurrence))

    You are a god and never have I heard anything more divine.

    Mobius Trip and Hadron Kaleido, agents of Prospit and Derse. They once fought on the... Ah, what the hell. We all know that's just set dressing. "Agents of Eternal Recurrence" is a love letter to the Homestuck fan community. That's really all there is to say on the matter.

    A tribute to Michael Guy Bowman's [[album:mobius-trip-and-hadron-kaleido|"Mobius Trip and Hadron Kaleido"]]

    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary - front)

    <i>"What if some day or night a demon were to steal after you into your loneliest loneliness, and say to you, "This life as you now live it and have lived it, you will have to live once more and innumerable times more; and there will be nothing new in it, but every pain and every joy and every thought and sigh and everything unutterably small or great in your life will have to return to you, all in the same succession and sequence" ... Would you not throw yourself down and gnash your teeth and curse the demon who spoke thus? Or have you once experienced a tremendous moment when you would have answered him: "You are a god and never have I heard anything more divine." "<br>
    \- "The Gay Science," Friedrich Nietzsche</i>

    (You're certain that Nietzsche said that.)

    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary - foreword)

    To talk about Agents of Eternal Recurrence, we need to talk about Rain.

    When I was 15-16 years old, I had an idea to make a concept album about the Homestuck fandom. It would be a rock opera of grand proportions, an 88 minutes long undertaking, with musical stylings ranging from synthpop to indie rock to zolo and Bulgarian choir music.

    It sucked. But I'm glad that album exists. In a way, Agents of Eternal Recurrence is an album ABOUT that album.

    Rain was filled with so much irony, so much pretentiousness and general self-importance; I've always wanted to make an album about Homestuck with none of that shit, because my music, nowadays, is generally known for how heartfelt and unironic it is. Basically, my roots as a musician come from Homestuck - and my current fans don't know that, and the Homestuck fandom doesn't know what my music is like now. This is the bridge that gaps them together, I hope. This album is also my tribute to Michael Guy Bowman's phenomenal record [[album:mobius-trip-and-hadron-kaleido|"Mobius Trip and Hadron Kaleido,"]] and I hope he is proud of me for making this album. I tried to put all the little things about his music that I love into these songs. This is my excuse to make my own [[album:moons-of-theseus|"Moons of Theseus,"]] an incredible fan tribute to MTAHK that I wish I had contributed to.

    Agents of Eternal Recurrence, originally titled "Agents of Skaia," is an album I've wanted to make for years. My love letter to the Homestuck fandom. My love letter to you. Thanks for listening!

Commentary: |-
    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary)

    This is the oldest song in the album, dating all the way back to 2017, although it bares no resemblance whatsoever to that version musically. I had an idea to make a [["Lies With the Sea"]] tribute for Rain, and get Rayhana (AKA [[artist:kal-la-kal-la|Kal-la-kal-la]]) to sing it, so I finally decided to whip this one out. The only thing I really kept is the iconic lyric, the "It's hard" line, which - and sometimes people are shocked to remember this - is said by Eridan. And hey, Eridan, underwater theme, it all came together in the end!

    Rayhana also absolutely rips in this one. Go check out her works as [[group:nasqueron|Nasqueron]] if you're looking for this kind of noisy guitar music!

    Anyway, this is a song about Rose and her mom.

Commentary: |-
    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary)

    [["Fly"]] is a song about sweet bro and hella jeff, so for its mirror track, I wanted to write a song about cool and new web comic. The thing we all came here for! (At first.)

    I've always wanted to explore the idea of The Corruption: What does it mean to become a "shittier" version of yourself? How would Rose feel in that situation, having lost all of her friends and watching them be transformed into these deranged psychopaths? And, of course, we eventually discover that Rose herself was "corrupted," only having been "enhanced" recently. I think of this song as taking place in her [[flash:roze-mentle-breakdown|"mental breakdown"]] [S] page, contemplating all these feelings and revelations. Taking a stupid memey premise and turning it into a serious thing is basically what CANWC is known for!

    I got [[artist:circlejourney|Circlejourney]] to perform this song, who did an incredible job. I took inspiration from their works, such as the songs [["First Storm of Summer"]] and [["Summer Heat."]] I love their works and it was a pleasure to work with them here.

Commentary: |-
    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary)

    The final track is a collaboration with [[artist:ucklin|Ucklin]], who I'm proud to call a good, longtime friend of mine. She wrote the verses and the chorus, (based on my concepts) and gave me some notes on the rest of the lyrics as well, so this is the only song that is actually co-written.

    I wanted to cap off the album with a genuine, earnest song about venturing into a fandom, likening it to the "rabbit hole" from Alice in Wonderland, and the feeling of going deeper and deeper inside this iceberg.

    Musically, if you haven't noticed, it is a pastiche of "The Machine" by Lemon Demon. I wanted this album to have a "Geek Rock" vibe to it, so there's a lot of Lemon Demon, They Might Be Giants and, of course, Bowman influences on it.

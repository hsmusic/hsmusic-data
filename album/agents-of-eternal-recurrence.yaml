Commentary: |-
    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary)

    See, my idea for the [["No Release"]] equivalent track was to make a song making fun of the troll quadrants. But I quickly ran into an issue.

    1\. I love shipping. I'm a shipper. I'm an old, classic type of fandom girly, who likes shipping.

    2\. I think the quadrants are fun. I know they were made to make fun of shippers. I don't care. I have a moirail in real life. Hussie invented "queerplatonic" before that became a thing people said 10 years later.

    So in the end, I had to follow what my heart told me. This is an ode to all the shippers out there, who, in my opinion, really keeps a fandom alive. It is the shippers who still make fan art, fanfics and music even after so much time. The creator of Mobile Suit Gundam attributed the success of the franchise to fujoshis. That tells you everything, I think.

    This song is also sung by my friend [[artist:biddy-fox|Biddy Fox]], my fellow bandmate in the band MIDI Bunny! She says she sang this song from the perspective of Nepeta so that's canon now.

Commentary: |-
    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary)

    The last song I wrote for the album. Working title was "Appearification." At first, I wanted to write about Problem Sleuth, but I couldn't really remember much, so I started looking at the MSPA Wiki page for appearifiers. Then I remembered Roxy's whole thing with apperifying stuff, and I ended up writing a song about doomed/null timelines, which made it a lot more interesting than if it were just PS references.

    The song is obviously inspired by Modify by Lemon Demon (the hooks even rhyme!) but I hope there's a bit of They Might Be Giants energy seeping through here with the usage of the accordion.

    We also got an ungodly amount of people to shout "APPEARIFY!!!" for this song. I hope you're happy.

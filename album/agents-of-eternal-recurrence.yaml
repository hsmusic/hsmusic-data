Commentary: |-
    <i>[[artist:cecily-renns|"Kaleido"]]:</i> (booklet commentary)

    [["Dawn of Man"]] is such a visceral, personal track, and I love that THAT is what MTAHK starts out with. A deeply existential song about mortality and life's purpose in the face of death. It has nothing to do with Homestuck, yet has everything to do with it.

    I guess this is my attempt to live up to that opening banger. "Memories" is about my thoughts on my legacy as an artist. As a musician who has made so many songs, so many albums and so many stories, I often wonder what will eventually survive and be remembered in history. And is being remembered what really matters anyway, or is it the present that matters? I wanted to talk about how I feel about those feelings. I didn't wanna rehash the same themes as "Dawn of Man," but wanted to make a song that is equally personal to me as a musician.

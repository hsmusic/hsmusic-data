Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/boards-and-lines), excerpt)
    Stage 1 track from the itch.io game jam Quadge.
    Play the game here: [out-there-games.itch.io/quadge](http://out-there-games.itch.io/quadge)

    <i>Jebb:</i> ([SoundCloud description](https://youtu.be/2WLkqDfRKao), excerpt)
    When i saw this game, i thought it was a bit bare sound-wise, since there was no music, no sound effects, none of that. So, i decided to whip up some sfx and a quick track. I tried to match the music to the events of the stage, and i'd say i did pretty good. Fun fact - i still can't beat that level lmao
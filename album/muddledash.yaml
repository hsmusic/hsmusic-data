Track: Slidesurf
Duration: 2:49
URLs:
- https://spellmynamewithabang.bandcamp.com/track/slidesurf
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/slidesurf))

    slidesurf would not be here if i didn't fight for it. this was a reject track through and through until i came back to it over a year later and tried to rescue it from the ashes. part of that was that originally, when we were going through the "what the heck is the SOUND for this thing" stages at the beginning, this was the first track niall really liked.

    it got vetoed by kieryn way back but i'm glad, now, that it was at the time. the current direction of the music is way tighter and more fitting for a game about racing octopi, honestly.

    thankfully, the track was strong enough to stand alone even after months and months of working on progressively better stuff. it deserved its own unique treatment, and the version of slidesurf that ended up making the cut is beefed up significantly.

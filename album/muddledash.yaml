    <i>rj lake:</i> ([Bandcamp credits blurb](https://spellmynamewithabang.bandcamp.com/album/muddledash), excerpt)
    muddledash is the fourth album from rj lake, comprising two years of work and the complete musical content of a game by slampunks, out NOW on nintendo switch, itch.io, and steam courtesy of pqube games.

    instrumental pop music taken to its logical heat-death extreme, the ost is flooded with small passages and asides, loopy analog synths, and so many drums.

    i hope you love it as much as the love that went into it.

    art by [[artist:rachel-lake|rachel lundin]]

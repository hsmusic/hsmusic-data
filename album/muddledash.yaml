    this song didn't really come together until niall flippantly said "maybe this is an end credits tune?" and i structured it as such.

    turns out, uh, we don't actually have an end credits. or even an ending to speak of . the credits screen just kind of keeps the menu music going over it when you highlight the option for it. but the concept lead to an extensive, super heavy rework and juice-up that gave the song much needed structure and direction it didn't have and it's way better, even if it's just being used as a good ol' background tune these days

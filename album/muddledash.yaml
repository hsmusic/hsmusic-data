Track: Octopile
Duration: 3:44
URLs:
- https://spellmynamewithabang.bandcamp.com/track/octopile
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/octopile))

    spy vibes

    this song and [[Dark Day for a Spaghetti Child|dark day for spaghetti child]] almost didn't make the album, and unlike every other case here, it wasn't for lack of being good! because of deadlines i had to scrap these two because they were just not far enough along to make our release date.

    thankfully, as things happen, we ended up having our release pushed back and i had a lot more time to work on these two and get them into the game proper.

    there's a lot i like about this track. there's bass stuff that, because i can't help myself, is basically right out of shinobi 3. there's a lot of fun lil melodies and countermelodies that fade out and return. there's a neat epiano that gets chopped and screwed into nothingness at several points. there's record scratches!

    scratches!

    gotta love record scratches.

Track: Octopus's Garden Party
Duration: 3:05
Referenced Tracks:
- DASH!!!!!!!!
URLs:
- https://spellmynamewithabang.bandcamp.com/track/octopuss-garden-party
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/octopuss-garden-party))

    okay i said [[DASH!!!!!!!!]] was the theme song but i lied. this is the actual theme song of the game.
    i mean, there can be two, i guess.

    this was the first time the "sound" of the game and its soundtrack really came together in a big way. thrill vibe might have been the real first track (we'll get to that later) but this one ended up really hitting the buttons a bit better. being major key didn't hurt.

    the best part of this tune is the doubletime DNB breakout at 1:54, easily. that was a late-game addition that worked shockingly well.

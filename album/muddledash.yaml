Track: Takoyaki Walky Talky
Duration: 2:47
URLs:
- https://spellmynamewithabang.bandcamp.com/track/takoyaki-walky-talky
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/takoyaki-walky-talky))

    this was the 7th overall track sketched for the game and tensions were a bit high at the time because we still hadn't really nailed down the overall direction for the music, even if other "definitive" tracks were already agreed upon. thankfully, this was a MEGAhit with both the dev team and myself, despite (well, because of, actually) being a nearly 1:1 ripoff of the style of super monkey ball 2's soundtrack imo

    when i had writer's block, which i had a lot during the middle bits of working on this soundtrack, sometimes i would actually use this track as a base i could build on and then remove once the song could stand on its own. i mean this literally; i'd copy and paste the mp3 in, maybe slow it down or pitch it up or reverse it, and then use that to create new basslines, melodies, and patterns to help maintain the "feel" of this track.

    a fair few tracks were started this way very directly, most notably [[rumblepals]] and [[cephalosquad]].

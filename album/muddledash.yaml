Track: A Birthday Party Spent With Almost All Your Friends
Duration: 2:38
URLs:
- https://spellmynamewithabang.bandcamp.com/track/a-birthday-party-spent-with-almost-all-your-friends
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/a-birthday-party-spent-with-almost-all-your-friends))

    it took me a whole lotta time to figure out the track order for this album release, and for a lot of that time four legged race took this spot at the end of the album proper. but after so very many times listening through my speculative album order playlists and thinking "oh wow this is a great ending track" when it gets to this one, it just seemed natural to switch them around.

    i don't even know what to say about this track. it came together very quickly and i don't even feel like i made it. i feel like i stole it from someone smarter, cooler, and less fatigued.

    but somehow i made this song, and honestly, if i might brag a bit,

    it rules

    the melancholy and happy sublime, that feeling when those two vibes meet, riiiiiiight in the center between them? that is a tone i will probably spend my entire life chasing.
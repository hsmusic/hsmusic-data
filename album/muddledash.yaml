Track: Chill Vibe
Duration: 2:50
URLs:
- https://spellmynamewithabang.bandcamp.com/track/chill-vibe
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/chill-vibe))

    by some metrics, this is the oldest song here. i gotta qualify those metrics, though; obviously [[DASH!!!!!!!!]] came earlier, and [[thrill vibe]] itself is an older song too; both of those, though, got radical revisions towards the end of development that kind of complicate how "old" they really qualify as. but chill vibe is pretty much exactly how it was since day one. originally this was just the full replacement for thrill vibe; it was The Version, until i decided to split the file into two branches. but while the first branch kept going, chill vibe ended up pretty much complete from the day it was initially started. the only thing i added past the first day of this earliest version of the song is some extra bass work in the middle and the synth riffs near the end. everything else is incredibly dated by the freshness of the other tracks and my "work every day a little bit" approach to them.

    it nicely occupies the initialization page, forever providing chill vibes before the thrillier ones take hold.
---
Track: Welcome to Slamtown
Duration: 2:40
URLs:
- https://spellmynamewithabang.bandcamp.com/track/welcome-to-slamtown
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/chill-vibe))

    look i'm not gonna mince words here, this is probably the best song here.

    welcome to slamtown is so good it actually pisses me off because after i made this i tried desperately to make songs as good as it and a grand total of 0% of the time this works out.

    this was the 29th sketch made in the process of working on this album and let me tell you: i was scared, at first, when i put it together. it didn't really sound anything like the tracks that came before it outside of the staccato chords that are sort of muddledash's main musical trick. for a good while i considered not even pitching it for the game and holding onto it for something else, because it didn't square with what i thought muddledash was.

    i'm very glad this is a part of this soundtrack. it marks the nice, definitive full-swing start of the second half of the album, and also kind of begat [[the death of slamtown]], which is a personal fave of mine here.

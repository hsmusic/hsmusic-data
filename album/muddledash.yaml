Track: Thrill Vibe
Duration: 3:22
URLs:
- https://spellmynamewithabang.bandcamp.com/track/thrill-vibe
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/thrill-vibe))

    RECORD SCRATCHES!

    this song was the VERY first song made for the game that 1000000% the dev team and me both felt seriously was a hit, was definitely a part of the game. the close inspiration for the vibe of the initial sketch was actually the arcane kids game "perfect stride" and its associated soundtrack (i hate to say "i liked it before it was cool"* but damn if i wasn't a LAGS backer who loved some perfect stride way before sonic dreams collection and the...bubsy thing) but the current mix has gotten away from that pretty significantly, morphing into its own weirdo hip-hop thing.

    if there's any indie skateboarding game it feels like it's a part of NOW...it's maybe...olliolli? i could see this playing in the background of olliolli.

    the wacked out modulated arp at the end of this is the medusa2 vst, which is a creation of a friend of mine, voidshaper. it's a super excellent lil game boy vst i strongly recommend, and i'm using it here to a very non-game-boy effect. please download it if you make music digitally and check it out!

    *that's a lie, i love to say this. this is a warning to all people who want to talk to me in person. i am that guy.

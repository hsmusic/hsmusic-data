Track: Pode Position
Duration: 2:57
URLs:
- https://spellmynamewithabang.bandcamp.com/track/pode-position
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/pode-position))
    there's a type of staccato chord vibe throughout this album. you know the one i'm talking about.

    although thrill vibe sort of had it from the beginning, it wasn't a major part of the identity of the track in the same direct way it is here, where the hook just slaps you in the face with it.

    the pun here is on "octopode," of course.

    this track came after another long period of trying and failing to come up with anything good; between making [[Takoyaki Walky Talky]] and making this i threw away 17 tracks that weren't good enough to make the cut. and i put effort into those! but they just weren't good enough, in the end. you won't likely hear any of those anywhere. they will reside, forever, in the trash. so say we all.

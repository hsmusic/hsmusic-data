URLs:
- https://spellmynamewithabang.bandcamp.com/track/walk
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/walk))

    aaaaaaand already we're getting a repeat! i'm not sure where the idea to have some mirror tracks on the album came from, but it ended up working out pretty well, all told! this tune manages to contain all of [[DASH!!!!!!!!]] inside of it structurally while being so fundamentally different in feel that you'd be forgiven for forgetting that i haven't changed a fricken note out of the progression for the most part.

    that's not to say that this doesn't have its own lil foibles that i've gotten fond of. i'm very proud of the retro synth breakdown at the end-ish of the track, which is joy.

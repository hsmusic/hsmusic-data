Track: DASH!!!!!!!!
Duration: 2:34
URLs:
- https://spellmynamewithabang.bandcamp.com/track/dash
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/dash))

    the muddledash theme song! this tune was literally the very first melody ever conceived for the game.

    i got the message that i got the job working on the game while walking home from grabbing burger king, and before i even got home i had already recorded that A-E-C#/A-C#EC# hook into my phone; it practically wrote itself pretty much immediately.

    by an hour later the entire song was sketched out and outside of obviously extensive production tweaks (it's a lot synthier than the original mix) over the years afterwards, it's been pretty much the same ever since.

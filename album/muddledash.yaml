Track: The Death of Slamtown
Duration: 2:05
URLs:
- https://spellmynamewithabang.bandcamp.com/track/the-death-of-slamtown
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/the-death-of-slamtown))

    this has dreamcast vibes

    i wanted to do another round on the slamtown project file just to mess with it, and slowing it down and really just totally destroying the mix ended up yielding a weird enough vibe that i ran with it. this track is completely brickwalled especially compared to stuff like thrill vibe, which has loads of dynamics.

    this is, shocker, intentional! kicking that piano against the limiter gives the track its odd anodyne quality. it's oddly off-putting even as it's a calming tune. the vocal stuff at the end is my personal favorite touch here.

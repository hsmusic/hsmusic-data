Track: Noodle, Poodled, Bottled, Paddled
Duration: 3:14
URLs:
- https://spellmynamewithabang.bandcamp.com/track/noodle-poodled-bottled-paddled
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/noodle-poodled-bottled-paddled))

    i think this is niall's favorite song title on the whole album.

    this was the most work to make out of all of the songs here. over one hundred hours, several hundred tracks, and, inexplicably, three entirely different DAWs (reason, ableton, AND fl studio) were the source of what you're hearing here. lots of recording and sampling and recording again, many many many stemmed-out production files to compensate for audio latency.

    that's partially just an extreme overcompensation for how "meh" the sketch felt to me initially. i really didn't like how it was coming along while still recognizing that, yeah, musically it had something i liked in it.

    going overboard has a tendency of solving creative problems.

    it's not a healthy solution, though.

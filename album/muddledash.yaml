Track: Four Legged Race
Duration: 2:29
Referenced Tracks:
- DASH!!!!!!!!
URLs:
- https://spellmynamewithabang.bandcamp.com/track/four-legged-race
Commentary: |-
    <i>rj lake:</i> ([Bandcamp about blurb](https://spellmynamewithabang.bandcamp.com/track/four-legged-race))

    when muddledash's first trailer was being built by our publisher they went through the soundtrack and said nothing felt really like a "trailer song," which led to this lil guy.

    this is genetically from-birth designed to be trailer music for this game, and it turned out good enough i wanted to extend it past the 60 second cutoff the track had to be for the ad and/or ads. it's a bop!

    the drop was a production nightmare. a fun one, but a nightmare nonetheless; probably this is my most cpu-intensive project file of all time, with over a hundred generator VSTs making my life hell. rachel had to help me figure out an easier way to sidechain to make this track even a feasible proposition, but i'm glad it's together.

    stitching together [[octopus's garden party]] and [[DASH!!!!!!!!]] works way better than i thought it did.

Track: Perfection [Draft 1]
Directory: perfection-vast-error-draft-1
Artists:
- Rom M
Duration: 3:56
URLs:
- https://vasterror.bandcamp.com/track/perfection-draft-1
Sampled Tracks:
- track:glimpses-of-perfection
Commentary: |-
    <i>Rom M:</i> ([Bandcamp about blurb](https://vasterror.bandcamp.com/track/perfection-draft-1))

    The very barebones original draft of [[track:perfection-vast-error|the penultimate Vol 5] song]]. I wanted to make a simple motif that could be easily hummed and referenced, as well as one that reflected the horror in the panels at [pages 1776](https://www.deconreconstruction.com/vasterror/1776)-[1780](https://www.deconreconstruction.com/vasterror/1780) (seriously the animation there is so good) I remember arriving at the harmony specifically through chopping up a Schonenberg piece? I don't remember which one, though...

    I also always knew I wanted the song to end with [[track:glimpses-of-perfection|""Glimpses of Perfection""]]. That drone creates such an unbelivable feeling that leaves you in awe. The rest of the song is effectively buildup for that moment.
Referencing Sources: |-
    <i>Rom M:</i> ([Bandcamp about blurb](https://vasterror.bandcamp.com/track/perfection-draft-1))

    I also always knew I wanted the song to end with "[[track:glimpses-of-perfection|"Glimpses of Perfection"]]".

    @@ [Bandcamp credits blurb](https://vasterror.bandcamp.com/track/perfection-draft-1)

    Samples: [[track:the-end-of-evangelion-tv-spot-1|The End Of Evangelion- Tv Spot 1]]<br>
    [[artist:lil-ugly-mane]] - [[Uneven Compromise]]<br>
    [[artist:rnd|Kurt 'Rnd' Burton]] - [[track:intermission-beyond-the-wall|Beyond the Wall]]

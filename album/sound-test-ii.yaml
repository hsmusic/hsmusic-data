    I think [[artist:rainy|rainy]] first gave me this idea so I wanted to try it. It's a stoner/doom metal track in the style of something Boris would do, and I think it's alright but I thought it was that good. Also, I would have released it but the song had nothing to do with the album that was coming out at the time ([[album:in-medias-res]]). By the time [[album:vast-error-vol-6|Vol. 6]] crept around my skills with metal music were much better so I decided not to use it.

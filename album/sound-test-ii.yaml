Commentary: |-
    <i>Rom M:</i> ([Bandcamp about blurb](https://vasterror.bandcamp.com/track/perfection-draft-2))

    Second, little less barebones version! It has a lot more of the recognizable elements which are present in [[track:perfection-vast-error|the final version]]. But I still had my reservations with it. The song *is* supposed to be a slow build, but the reason I went with the full on Dubstep drop in the original is because this one felt a little too stale. This one is a track to get lost in, while I wanted Perfection to terrify you and catch you off guard.

    This song was also super inspired by Bjork. Specifically the songs [Hunter](https://www.youtube.com/watch?v=flh3i44N8eQ), [Joga](https://www.youtube.com/watch?v=loB0kmz_0MM) and [Pluto](https://www.youtube.com/watch?v=cPgAjvaM2aQ), the production in those tracks are insane.

Track: 'Gofuckyourself.wav (2019)'
Artists:
- Rom M
Duration: 3:48
URLs:
- https://vasterror.bandcamp.com/track/gofuckyourself-wav-2019
Sampled Tracks:
- Group Four
- Flowey's Laugh
Commentary: |-
    <i>Rom M:</i> ([Bandcamp about blurb](https://vasterror.bandcamp.com/track/gofuckyourself-wav-2019))

    Song I made for a group project for literature class. The project was making an artistic representation of a book we read for the class, none of my groupmates did anything, hence the name. I grabbed a random loop, edited it and its chord progression using Melodyne, and sang gibberish on it - along with the sentence ""aren't you glad its over""? Because I was! Since I was also into Air and [[artist:massive-attack]] at the time, I grabbed some random ambient pads, weird percussion and played with them. Decent results overall. I have no idea what I sampled at the end there, besides [[Flowey's laugh]]. Sorry. Regardless, this same loop later made its way onto [[Purple Hot Mess]]. Wow!

    The book was George Orwell's 1984 by the way.
Referencing Sources: |-
    <i>Rom M:</i> ([Bandcamp about blurb](https://vasterror.bandcamp.com/track/gofuckyourself-wav-2019))

    I have no idea what I sampled at the end there, besides [[Flowey's laugh]].

    @@ [Bandcamp credits blurb](https://vasterror.bandcamp.com/track/gofuckyourself-wav-2019)


Commentary: |-
    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/deep-sea-trouble), 2/3/2018)

    Here's a surprise track for the Vast Error Music Team's newest EP, "Running for Eons". One of the characters in the comic, Murrit, has an array of televisions in his hive that broadcast long-forgotten relics of troll pop culture. This song takes those references and stuffs as many possible into [[Deep, Deep Trouble|a classic Simpsons beat]]. Hope you enjoy it!

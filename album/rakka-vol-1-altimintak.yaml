Commentary: |-
    <i>The Paradox Music Team:</i> ([Bandcamp about blurb](https://pascalpotatovandenbos.bandcamp.com/album/rakka-vol-1-altimintak))

    RAKKA is a narrative written by GITGOT, powered by her music and visuals in the form of short animations and a concept-album.

    Here's a short synopsis:

    FOUR ROOMMATES ARE DONE WITH THEIR BORING DAY TO DAY LIFE.
    AFTER RECEIVING A MYSTERIOUS MESSAGE, THEY DECIDE TO TAKE A LEAP OF FAITH.
    ON THEIR JOURNEY, THEY QUICKLY REALISE THAT THEY’RE NOT THE ONLY ONES WITH THIS DESTINATION.

    THEY FIND OUT THINGS ABOUT THEMSELVES AND THE PEOPLE AROUND THEM THAT THEY’D RATHER FORGET, AND TRY TO POWER THROUGH TO THE VERY END.

    Unravel all the secrets within the story, and find out what's going on! There's a lot more to be heard and seen from this narrative.

    This EP is part one of a three-parter of EP's. This narrative will end with a shortfilm-animation, and a deluxe album!

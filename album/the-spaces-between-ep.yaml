Commentary: |-
    <i>Elaine Wang:</i> ([Bandcamp download blurb](https://hesperidia.bandcamp.com/album/the-spaces-between-ep))

    Plus bonus alternate version of cover with missing letters, for the [Sburb Glitch FAQ](https://archiveofourown.org/works/340777) fans in the audience.

    <i>Elaine Wang:</i> ([Bandcamp about blurb](https://hesperidia.bandcamp.com/album/the-spaces-between-ep))

    This is an EP about Void, which is a Homestuck aspect.

    This is mostly back catalog tracks that I polished for the purpose. Veers closer to ambient than my usual work.

    I should probably note that I've been working on another project! But I can't quite talk about it in public yet, so that's why I opted for minialbum. I like keeping my release schedule up.

    Please let me know if you make/want to sell anything based on my music - we can work out a licensing/royalty arrangement.

Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor)

    The listed date is the game's Japanese release. The PC-98 version of Brandish has a soundtrack release that is part of the album [Falcom Special Box '93](https://vgmdb.net/album/1464). The SNES version ports and arranges that music. English track names here are unofficial translations.

    No music credits are available for the SNES release; Brandish's music as a whole is credited Falcom Sound Team J.D.K. who are identified (for Brandish on PC-98) as Mieko Ishikawa and Atsushi Shirakawa; individual track credits are not available.

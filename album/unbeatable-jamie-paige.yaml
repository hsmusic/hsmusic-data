Lyrics: |-
    woke up on the wrong side of my head
    packed inside a box and halfway dead
    tied up with a knot
    just like i oughta be, this part of me
    and i could say the words you want to hear
    and make the pretty package disappear
    but would you even want me now?
    no eulogies for parts of me

    do you really think it’s simple to encapsule it?
    (can you even hear me?)
    that the parts you didn’t like were just an accident?
    (or are these words just quitting?)
    do you really think so little, little, little, little,
    (do you think so little of me?)

    take in the all of me
    see what you wanna see
    no cause for sympathy
    you won't listen if it don't sound sweet
    regards and low esteem
    it's all meant implicitly
    speak now or hold your peace
    and forget this part of me
    no love, no eulogies

    got off at the wrong stop in my mind
    a lotta awful words for me to find
    it's all a goddamn waste of time
    no energy, apart from me
    'cause i could say the word, make it all so clear
    or i could make a change, and face my fear
    but i always take the wrong way out
    so far to be a part of me

    do you think i’d be so stupidly compassionate
    (can you even see me?)
    without carrying a weight enough to balance it?
    (or did this not have meaning?)
    do you really think so little, little, little, little,
    (do you think so little of me?)

    look through my eyes
    at what you what from me
    no silence, sanded off edges
    can't you fake it just one moment?

    i look through your eyes
    at an unfamiliar face
    the shape of your reflection
    the colors melt in two directions
    and spill into my afterimage

    take in the all of me
    see what you wanna see
    no cause for sympathy
    'cause why listen if it don't sound sweet?
    regards and low esteem
    the same shit you always sing
    speak now or hold your peace
    and forget this part of me
    no love, no eulogies


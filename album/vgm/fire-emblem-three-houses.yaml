Lyrics: |-
    Reach for my hand
    I'll soar away
    Into the dawn
    Oh, I wish I could stay

    Here in cherished halls
    In peaceful days
    I fear the edge of dawn
    Knowing time betrays

    Faint lights pass
    Through colored glass
    In this beloved place

    Silver shines
    The world dines
    A smile on each face

    As joy surrounds
    Comfort abounds
    And I can feel I'm breaking free
    For just this moment, lost in time
    I am finally me

    Yet still I hide
    Behind this mask
    That I have become
    My blackened heart
    Scorched by flames
    of a force I can't run from

    I look to you
    Like a red rose
    Seeking the sun
    No matter where it goes

    I long to stay
    Where the light dwells
    To guard against the cold
    That I know so well

    As the rain falls
    On the path
    I chase your shadow

    I don't feel
    A single drop
    Or the ground below

    Then you turn to me and I
    Stop before I know
    And the lie upon my lips
    I let it go

    Cross my heart
    Making vows
    I know will be betrayed

    A sad girl's pleas
    Live only
    For a breath and then they fade

    My dearest wish
    Is that you'll know
    These tender thoughts
    That only seem to grow

    They are as snow
    Melting away
    Yet seeking your warmth
    If only for a day

    The blue
    Moonlight
    Cuts across our sight
    As pure and clear
    As a ringing bell
    Reaching for us in the night

    As the wind
    Calms my thoughts
    I hold strong
    On this terrace
    I feel at peace
    Carried away by the wind's song

    Open the door
    And walk away
    Never give in to
    The call of yesterday

    Memories that made
    Those days sublime
    These ruined halls entomb
    Stolen time

    Reach for my hand
    I'll soar away
    Into the dawn
    Oh, I wish I could stay

    Here in cherished halls
    In peaceful days
    I fear the edge of dawn
    Knowing time betrays

    <i>Cello:</i> (wiki editor, 7/10/2026)

    <i>Oddity</i> (previously known as <i>Mother 4</i>) is an upcoming RPG based in the Mother series. As of the time of this commentary, the game has not been released yet due to a speculated development hell, which includes a change of game engine, a rushed and internally unannounced change of title and iconography, etc.

    Due to this, the game does not have a visual representation, nor a release date. If the game were to release at some point, the wiki will be properly updated with that information.

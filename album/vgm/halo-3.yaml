Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor)

    Bit of a weird case! [Halo 3's soundtrack](https://vgmdb.net/album/5033) contains many tracks with multiple movements; the "containing" audio tracks themselves are not given names. Three Gates (0:47) is the first movement in a three-parter, followed by Ascent (1:15) and Leonidas Returns (2:33). The durations of these segments are marked in the album booklet.

    The streaming release, however, only uses the first movement from each audio track as the title for that *entire* track; all three movements above sum to about 4:35, matching the streaming release, itself just titled "Three Gates".

    Also, the album booklet presents its tracks (across two discs) mostly structured by in-game level name. Three Gates is part of "The Covenant" (as are nine other titled movements).

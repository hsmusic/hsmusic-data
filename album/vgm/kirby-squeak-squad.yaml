Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor, 4/13/2024)

    This track isn't included on any official soundtrack release; ~~all artists~~ are credited for sound on Kirby: Squeak Squad. The title is a translation of its appearance on the Nintendo Mobile site, where it's called ボス戦 ([thanks to User:Gigi on WiKirby](https://wikirby.com/wiki/User:Gigi/Kirby_music_names)).

    It's better known as "Oncoming Peril" or "Treasure Scuffle".

    <i>Quasar Nebula:</i> (wiki editor, 10/25/2025)

    We previously credited this track to all artists credited for sound in-game; it's just [[artist:unknown-artist]] now. Those artists are: [[artist:hirokazu-ando]], [[artist:jun-ishikawa]], [[artist:tadashi-ikegami]], [[artist:shogo-sakai]].

Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor)

    The date listed here is the game's North American release (on the Wii). Track titles and durations are from [The Legend of Zelda: Twilight Princess HD Sound Selection](https://vgmdb.net/album/55626) and [The Legend of Zelda: Twilight Princess HD Original Soundtrack](https://vgmdb.net/album/59413), both released in 2016 - companion with Twilight Princess HD, the remaster for Wii U. Twilight Princess and Twilight Princess HD share the same music, so these releases work as references for Twilight Princess in general.

    Sound Selection has official English track names, and these are used where available. But it's only a selection of the full soundtrack, so other names are unofficial localizations from Original Soundtrack (Japan-exclusive). Track durations are *all* taken from Original Soundtrack, for better consistency.

    Track-by-track credits are available on Sound Selection (via its CD-Text) but not on Original Soundtrack. (So, we only have explicit credits for select tracks.) Several composers contributed to Twilight Princess, so other sources are referenced and noted on track pages.

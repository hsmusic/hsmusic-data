Commentary: |-
    <i>ruby:</i> (wiki editor, 11/12/2026)
    this game was originally released as "Doubutsu no Mori" in Japan for the Nintendo 64 in 2001. later that same year, it would receive an expanded port for the Nintendo GameCube, known as "Doubutsu no Mori+". this port would get localized as "Animal Crossing" and be released in North America in 2002. on the wiki, we mostly aim for North American presentation where applicable, hence the choice to present this game as the North American "Animal Crossing".

Track: Strike Back
Name Style: unofficial localization
Additional Names:
- Name: >-
    逆襲
  Annotation: >-
    booklet pg. 1:
    [マザー2 ギーグの逆襲](https://vgmdb.net/album/800)
Artists:
- Hirokazu Tanaka
URLs:
- https://www.youtube.com/watch?v=EE6FocnZw0k
Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor)

    AKA "Counterattack". On the 1994 CD soundtrack, this track is the first part in track 1, プロローグ <b>PROLOGUE</b>. *In turn,* "Counterattack" / "Strike Back" represents two in-game tracks, which are unofficially AKA:

    - [The Evil Giygas Attacks! (Part 1)](https://www.youtube.com/watch?v=Rd7k_W1aQ2s)
    - [The Evil Giygas Attacks! (Part 2)](https://www.youtube.com/watch?v=QN4auugHLo4)

    The listening link above is for the entire CD track, "PROLOGUE", which also includes [["This is No Time For Sleeping"]].

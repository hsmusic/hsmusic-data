- https://www.youtube.com/watch?v=bQzYJBTBVEc
Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor)

    On the 1994 CD soundtrack, this track is a segment of プロローグ <b>PROLOGUE</b>.

    That CD track is split into two titled parts: 逆襲 ("Counterattack" or "Strike Back") is the main menu opening; 眠ってる場合じゃない ("This Is No Time to Be Sleeping") plays during an in-game walkaround near the start of the game.

    "One Fateful Night" represents the first segment of 眠ってる場合じゃない ("This Is No Time to Be Sleeping").

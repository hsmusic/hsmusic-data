Commentary: |-
    <i>SpilledCereals:</i>
    This is the song i had the most problems with writing lyrics for, i literally only figured them out less than a week before releasing this album. I took a bunch of lyrics from some songs that i was gonna do for this album but got scrapped. Somehow i made it work.

    I wanted to remind people that this is not regular loser music but DRAGON loser music so i decided to use the fact that dragons probably have scales and that they can probably be worn down by friction.

    The second verse is i think probably some of my best work lyrics wise on this album, i like the imagery of sewing something directly onto someone (especially when that someone designs clothes). i think it's a good metaphor for the things we do sometimes to put up appearances and how some relations permanantly change you. this also could be another scrap for the transfem nelrith believers in chat.

Commentary: |-
    <i>SpilledCereals:</i>
    haha get it the third song is an "i want song" it's like musicals haha i get it ha.<br>
    you know what's not funny?

    Plagiarism.

    So i basically stole the whole melody, some lyrics and a bit of the chord progression off of the song [["Our Generation"]] by Janis fka [[artist:sliimy]]

    Aside from being one of the most awesome piece of Myspace Millenial Pop, it was made by a, then, gay "guy" that transitioned into an awesome non binary trans woman. foreshadowing is a literary device.

    The line "i want a starcrossed breath" comes from me mishearing "we want a Starbucks please" and the whole "it's just a ha-heartbeat" comes from the song, in context it's about accepting gay people loving eachother. foreshadowing is a literary device.

    I think the standout line has to be "I envy your dresses, your friends and your shirts" as it continues the window shopping themes of [["Heartbreak Studio"]] off of [[album:nibiru]], by making Nelrith envious of the things that surround Maragi be it social or physical. the insistance of clothes really emphasizes the superficiality of his love. it could also be another scrap for the transfem nelrith believers in chat. foreshadowing is a literary device.

    Transfem Nelrith will not happen and and if it did she would be worse off on estrogen according to [[artist:dizzims|Dizz]].

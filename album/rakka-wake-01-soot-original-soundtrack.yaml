Commentary: |-
    <i>The Paradox Music Team:</i> ([Bandcamp about blurb](https://pascalpotatovandenbos.bandcamp.com/album/rakka-wake-01-soot-original-soundtrack))

    A homage to the gritty fiction of the ’90s. “RAKKA: WAKE 01 - SOOT” unfolds as an episodic, linear visual novel that blends paper-cut style comics, animation, music and dialogue into a slow-burn mystery thriller that dares you to dig deeper — even when you really, really shouldn’t.
    
    You can buy RW1S on Steam here: https://store.steampowered.com/app/3455080/RAKKA_WAKE_01__SOOT/

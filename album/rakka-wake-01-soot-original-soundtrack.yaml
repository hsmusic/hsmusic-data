    Think I’m finally seeing now
    The message offered relief
    Yet put a gun in my mouth
    Filled my worries with shallow doubts

    Shallow waters run deep
    And ever since we left I
    Feel this sense of unease
    And every hour is a tight breath
    Need a release
    I cannot give it a rest
    I feel the weight on

    (Me)

    (Me)

    I feel the weight on

    (Me)

    (Me)

    I feel the weight on

    (Me)

    (Me)

    I feel the weight on


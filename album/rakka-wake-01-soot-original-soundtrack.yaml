    I feel the weight on me

    Things used to be so simple
    Mornings on the balcony
    It all changed when a call came in
    Tell me, what do you want?
    What do you need?

    And now I’m stuck in a car with you calling me out
    Someone’s onto us
    Under a shroud
    Of uncertainty
    I feel a breath collect on the edge of a scream

    Stay with me
    We’re gonna hold on to this
    Free to roam the world, you see?
    You’re gonna be fine for as long as you need

    It’s okay, it’s all good when we’re driving
    Close to losing my sanity trying
    To keep my head up
    When I feel the tide is turning
    On

    Me!

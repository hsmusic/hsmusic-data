Commentary: |-
    <i>Jamie Paige:</i> ([Bandcamp about blurb](https://jamiepaige.bandcamp.com/album/machine-love), excerpt)

    "i want it to be true, to be like you!"

    this is a tribute to [[track:mimi-no-aru-robotto-no-uta|Song of the Eared Robot (耳のあるロボットの唄)]] by [[artist:nwp8861|nwp8861]], a song that is incredibly near and dear to me; if you haven't heard the original, i strongly encourage you to listen to it here, as Machine Love directly quotes and interpolates it - www.nicovideo.jp/watch/nm3611741

    watch the mv here! - www.youtube.com/watch?v=sqK-jh4TDXo

    <i>Jamie Paige:</i> ([Bandcamp credits blurb](https://jamiepaige.bandcamp.com/album/machine-love), excerpt)


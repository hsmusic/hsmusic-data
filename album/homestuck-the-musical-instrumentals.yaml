    @@ [Description of every YouTube video in the playlist](https://www.youtube.com/watch?v=VGi_FdrL5Bo&list=PL0P2Oz15enioE3s4YgiabdmTGNCVaF87U&index=1)
    Happy 4.13! That's right! We have found and are sharing the instrumentals for Homestuck: The Musical, as well as updating our permission guidelines! [[artist:lumistarlight|Lumi]] is now providing blanket permissions for all covers/remixes of her songs. We do not want these songs involved in any other musical productions or for someone to profit off of our composer's hard work, but everything else is fair game!

    If you do choose to cover our songs please link back and credit us+Lumi, and don't forget to let us know! We love seeing and sharing work created by you guys.

    If you want to help support our wonderful composer, please consider throwing her a couple bucks over on her ko-fi: http://ko-fi.com/lumistarlight
    And if you want to see what she's up to now you can see her latest project over at: [ember*night - "Chasing Dragons" 【official MV】](https://www.youtube.com/watch?v=GPJpQ-BcIQs)

    For lyrics and a more in-depth explanation, please visit us at our tumblr: [homestuckthestagemusical](https://homestuckthestagemusical.tumblr.com/)

    “Homestuck: The Musical” is a musical adaption of Homestuck, the webcomic by [[artist:andrew-hussie|Andrew Hussie]], which can be found here: http://mspaintadventures.com
    We performed at Northwest Fanfest 2014 in Vancouver.



    <i>Fabbe:</i> (wiki editor, 8/7/2026)

    Neither the SoundCloud nor the YouTube release of the album have a complete list of tracks (As YouTube has [[When You Wake Up (Reprise) Instrumental]] added twice along with less consistent naming, but the SoundCloud release doesn't include [[track:cascade-intrumental|[S] Cascade Instrumental]], very likely by mistake, so the track list is an amalgamation mostly based on the SoundCloud release, but with [S] Cascade Instrumental added where it is in the YouTube release.
    
    Notably neither of the albums feature [[Welcome to Homosuck Instrumental]], and as such it is noted as a single release on this wiki, but the fact that it is not included is very likely a mistake.


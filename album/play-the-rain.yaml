Commentary: |-
    <i>Lark Mordancy:</i> ([Tumblr](https://larkmordancy.tumblr.com/post/16201699226/too-l8-this-is-my-final-entry-to-the-homestuck), 1/20/2012)

    <b>Too L8</b>

    This is my final entry to [[album:coloUrs-and-mayhem-universe-a|the Homestuck Music Contest]], this time for Vriska. This song was written with her [confession scene](https://homestuck.com/005366) in mind, so it quotes from John’s leitmotif [[Doctor]] as well as [[track:MeGaLoVania]] and [[Spider’s Claw]] for Vriska. There’s also a bit of [[Sburban Jungle]], [[Homestuck Anthem]], and [[track:bl1nd-just1c3-1nv3st1g4t1on|BL1ND JUST1C3: 1NT3RROG4T1ON]], since I like to end my songs on a morbid note.

    The piano/chiptune combo from [[Wanderer's Vigil|WV]] returns here, since I find it fairly useful for setting a melancholy mood. The electric guitar and bass were pretty much required, this being a Vriska theme after all. The alternation between the heavy guitar parts and the lighter piano sections was chosen to reflect the changing tone of Vriska’s conversation with John, the leitmotifs roughly matching the various subjects they talk about.

    Too L8 took longer to put together than [[Batrachian Biogeny|BB]] and WV combined, mostly due to school and sickness, but I’m still not certain about parts of it. Feedback was greatly appreciated on the first two songs, and any comments on this one would be fantastic.
---

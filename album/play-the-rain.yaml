Commentary: |-
    <i>Lark Mordancy:</i> ([Bandcamp about blurb](https://larkmordancy.bandcamp.com/album/play-the-rain))

    A collection of Homestuck-based songs.

    <i>Quasar Nebula:</i> (wiki editor, 6/1/2026)

    Tracks [[track:stalemate-play-the-rain]] and [[track:720413]] are later releases, from August 2012 and February 2013 respectively. The original tracks (all the rest of them) were probably never reordered - [the earliest archive](https://web.archive.org/web/20121130072838/http://larkmordancy.bandcamp.com:80/album/play-the-rain) of this album is from November 2012, so it's later than Stalemate's inclusion, but Stalemate (then and now) was just at the end of the track list. 720413 was later inserted as track 2. Note the artist's commentary: 720413 is described as "basically the sequel" to opening track [[Sburban Genesis]], so the album placement clearly fits.

    Also note: This album's initial release precedes [[album:lofam2]]. Sburban Genesis was included in LOFAM2; 720413, itself released later than LOFAM2, was in turn included in [[album:lofam3|LOFAM3]].

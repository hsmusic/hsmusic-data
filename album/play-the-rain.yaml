    Theme for the Warweary Villein.

    <i>Lark Mordancy:</i> ([Tumblr](https://larkmordancy.tumblr.com/post/15552274971/wanderers-vigil-this-is-my-second-entry-to-the), 1/8/2012)

    <b>Wanderer’s Vigil</b>

    This is my second entry to [[album:coloUrs-and-mayhem-universe-a|the Homestuck Music Contest]]. This song is for WV in his various identities, from Villein to Vagabond. The industrial drum set was chosen to give a feel for his origins as a pawn in the vast mechanisms of SBURB, while the determined mood is based on his defiance in the face of overwhelming odds. The song briefly quotes from [[Sburban Jungle]], along with [[Skaian Skirmish]].

    Thanks for all the feedback on [[Batrachian Biogeny]]!

    <i>Lark Mordancy:</i> ([Tumblr](https://larkmordancy.tumblr.com/post/25841053676/wanderers-vigil-first-update-back-in-the-old), WIP, 6/25/2012)

    <b>Wanderer’s Vigil (First Update)</b>

    Back in the old days of a couple months ago, I entered a piece called Wanderer’s Vigil into [[album:coloUrs-and-mayhem-universe-a|the Homestuck Music Competition]]. It was pretty low-quality, but I think I’ve figured out some of the parts that didn’t work in it, such as the square waves and lack of equalization. Here’s an updated rendition. It’s still in progress, and feedback on what to work on next would be great, but it’s at least better than it was. Whoo, musical progress!

    Oh, yeah, and it’s a theme for WV on the Battlefield. Quotes are from [[Skaian Skirmish]] and [[Sburban Jungle]].

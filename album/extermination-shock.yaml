Commentary: |-
    <i>WHATISLOSTINTHEMINES:</i> ([Bandcamp about blurb](https://what.bandcamp.com/album/extermination-shock))

    Soundtrack for the dog-fighting space sim.

    [store.steampowered.com/app/2510820/Extermination_Shock/](https://store.steampowered.com/app/2510820/Extermination_Shock/)

    <i>WHATISLOSTINTHEMINES:</i> ([Twitter](https://twitter.com/WHATISL0ST/status/1800224792110571722), 6/10/2024)

    Extermination Shock's demo is out as part of Steam NEXT fest! I did a bunch of work on the music and sound for this. If space dogfights sounds like your jam, give it a try!<br>
    [(Steam link)](https://store.steampowered.com/app/2510820/Extermination_Shock/)

    <i>WHATISLOSTINTHEMINES:</i> ([Twitter](https://twitter.com/WHATISL0ST/status/1808931605353746816), 7/4/2024)

    [(Bandcamp link)](https://what.bandcamp.com/album/extermination-shock) The original soundtrack for Extermination Shock is now up on my bandcamp!

    The soundtrack will be available on steam as well in a few weeks, once Valve approves the store page for it anyhow.

    <i>WHATISLOSTINTHEMINES:</i> ([Tumblr](https://whatislostinthemines.tumblr.com/post/755100551468957696/oh-and-if-youre-interested-in-the-soundtrack), 7/4/2024)

    [(Steam link)](https://store.steampowered.com/app/2510820/Extermination_Shock/)

    I completely neglected to update my tumblr with this, but Extermination Shock, the dogfightin' space sim I've been making the music for for a few years is out now! Take a look if it sounds like your thing!

    Oh, and if you’re interested in the soundtrack, it’s available on my bandcamp at [(Bandcamp link)](https://what.bandcamp.com/album/extermination-shock)<br>
    It’ll be available on Steam as well once Valve finishes reviewing the store page! Expect that in a few weeks!

    <i>Extermination Shock:</i> ([Steam page description](https://store.steampowered.com/app/2992040/Extermination_Shock_The_Original_Soundtrack/))

    The soundtrack for the game!

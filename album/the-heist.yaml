Commentary: |-
    <i>SerialSymphony:</i> ([Bandcamp about blurb](https://serialsymphony.bandcamp.com/album/the-heist))

    A Midnight Crew Fan EP, dedicated to my favourite HS characters [[album:midnight-crew-drawing-dead|and album]].

    <i>SerialSymphony:</i> ([SoundCloud album description](https://soundcloud.com/serialsymphony/sets/smooth-jazz-will-now-commence))

    A Tribute to the Midnight Crew from Homestuck

    (more songs to come)

    <i>SerialSymphony:</i> ([Tumblr](https://serialsymphony.tumblr.com/post/169298361414/the-heist-by-serialsymphony))

    Kicking off 2018 with some old and new Homestuck jazz jams, give it a listen!

    <i>Lilithtreasure:</i> (wiki editor, 5/29/2025)

    The entry of The Heist is modeled off the later Bandcamp release, from [[date:January 4, 2018]], but [the earlier SoundCloud release](https://soundcloud.com/serialsymphony/sets/smooth-jazz-will-now-commence) of the album had only 4 tracks with a different track order, released on [[date:May 30, 2014]]; only one track appears only on the SoundCloud release, [[track:beatdown-strifing-saxophones-mix]].

    <details><summary>SoundCloud track order</summary>

    1. [[track:showdown-the-heist|Showdown]] (née The Showdown)
    2. [[Officially Canon]] (née Swing(OFFICIALLY CANON))
    3. [[Beatdown(Strifing Saxophones Mix)]]
    4. [[The Old Ultraviolence]] (née The Getaway)

    </details>

    After doing some investigation into the damage, I just have to say, wow. What sort of miracle took place for Chronos to be able to alter the code this badly without everything in the game going down the drain? As promised, a plan towards repairing the wreckage is in the works. First stop: Skaia.

    Without Skaia as its old blue self, the most important parts of the session will be pretty much out of luck. There will definitely be some sections that I would appreciate some assistance with, but first I will have to set up a helper console and get most of the heavy duty patchwork out of the way before handing over the nitty gritty.

    <i>[[artist:wertercatt]], [[artist:quasar-nebula|Lan]]:</i> (wiki lyrics)

    (After doing some investigation into the damage-)

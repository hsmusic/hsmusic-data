Commentary: |-
    <i>Flock Ornis:</i> (First Guardian, [Tumblr](https://sbargv2.tumblr.com/post/53171266489/while-im-continuing-work-on-preening-this-code-i))

    While I’m continuing work on preening this code, I thought maybe it could be useful to look back on what has happened so far.

    ==> Listen

    <i>lavenderSiren:</i> (album organizer, private Discord, regarding wallpaper used, 8/23/2025)

    I forget who did the static puzzle however (yes, it's technically a puzzle)

    <i>wertercatt, lavenderSiren:</i> (conversation in private Discord, 8/24/2025)

    *wertercatt:*<br>
    Had the great idea of looking through the SBARGv2 backroom google docs to see if I can figure out who made the uncredited audio puzzles. Unfortunately I failed to find any details on 'em

    *lavenderSiren:*<br>
    unfortunately the audio puzzles were a bit more off the cuff, from what I could remember. We didn't particularly engage in much documentation

    *wertercatt:*<br>
    Yeah, I think the current documented state is the best we're gonna get

    *lavenderSiren:*<br>
    one thing for sure, I wish it was easier to archive skype logs. Because I think I tried to do that once, but had no idea how to make the output readable or anything. not to mention it was on my craptop, so I'm not even sure if that mess of files ever made it across or anything

    *wertercatt:*<br>
    Do you want to give any final commentary on composing specific tracks or the Volume 1 album in general?

    *lavenderSiren:*<br>
    hmm... well, the decision to package it up in album form was sorta spontaneous. from what I could remember. There wasn't any expectation of even making an album until somebody on the team (I think it was [[artist:kaylen|Kaylen]]) decided it would be cool to put all the music that was made for the ARG into an album. This is of course why most of the tracks are just puzzle audio in volume 1.

    *wertercatt:*<br>
    Looking back on it, is there anything you wish you did differently about the Volume 1 release?

    *lavenderSiren:*<br>
    not particularly. only difficulties were in packaging and getting confused on whether I was supposed to render in wav or mp3<br>
    other than that, I didn't have much expectation beyond what it was

    *wertercatt:*<br>
    I suppose my last question is: Do you have a favorite track on <i>SBARG Volume 1</i>?

    *lavenderSiren:*<br>
    uhhh.. prolly [[track:ballad-of-the-guardian|ballad of the guardian]]?

    *wertercatt:*<br>
    Thanks for all of your help with this, by the way!

    *lavenderSiren:*<br>
    no problem!

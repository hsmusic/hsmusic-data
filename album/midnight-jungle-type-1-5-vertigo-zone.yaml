Commentary: |-
    <i>The Paradox Music Team:</i> ([Bandcamp about blurb](https://pascalpotatovandenbos.bandcamp.com/album/midnight-jungle-type-15-vertigo-zone))

    The second addition to the "MIDNIGHT JUNGLE" series.

    This racing game inspired concept album is a mixed love letter to the music and style of RIDGE RACER TYPE 4/5 and F-Zero GX/AX, which i have completely fallen in love with. So i wanted to create something fresh for fans like me to enjoy.

    This album has also been featured as the soundtrack for the game "Avenge Myself", which you can play here!: [madmanepic.itch.io/avenge-myself](https://madmanepic.itch.io/avenge-myself)

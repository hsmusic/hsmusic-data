Commentary: |-
    <i>Josh “HyperOrange” Woodward:</i> ([Bandcamp Description](https://cheezquest.bandcamp.com/album/land-of-logic-and-skyscrapers))
    These songs have been done for quite some time, only now do they get a release! Both songs feature the Land of Logic and Skyscrapers, a vast neon world seeking liberation. Two takes on one idea, one fitting more in the "completing the quest" theme, and another fitting more into the "quest completed, planet liberated" category.

  <i>wertercatt:</i> (wiki editor)

  The following is transcribed from [an Omegle conversation screenshot showing how the track was originally released.](https://hsmusic.wiki/album-additional/sbargv2-volume-2/Omegle%20chat%20log%209a1c14d.png) The conversation happened on November 9, 2013

  You're chatting with a random stranger on Omegle!<br>
  You both like v2battlefield<br>

  *Stranger:* A wild BLACK KING appeared!<br>
  12,241,370 HP<br>
  [http://sbargv2.com/thereckoning.mp3](https://hsmusic.wiki/media/album-additional/sbargv2-volume-2/thereckoning.mp3)

  The BLACK KING brandishes a suitably<br>
  oversized survival knife against you. It<br>
  stretches its arm far enough to reach towards<br>
  you with the massive point of its blade. What<br>
  will you do?

  \>Examine<br>
  \>Attack<br>
  \>Attack with title powers<br>
  \>Defend<br>
  \>SBURBAN FINALE [12/12 EXECUTE]<br>

  *You:* MM: Execute Sburban Finale.

  *Stranger:* You EXECUTE SBURBAN FINALE.<br>
  13,000,000 DAMAGE DEALT.

  The BLACK KING has fallen! The SCEPTER<br>
  falls and snaps in half, stopping The<br>
  Reckoning.

  *You:* "JACKPOT!"

  *Stranger:* Examine SCEPTER?

  *You:* Kyle: Sure, why not? Give it a look.

  *Stranger:* There's something rolled up inside.

  *You:* Kyle: Examine.

  *Stranger:* It's a sheet of paper with a bunch of letters. /<br>
  yndjgjiejkjsojoogidhf/

  *You:* Kyle: Captchalogue paper.

  *Stranger:* You captchalogue the paper.<br>
  Congratulations!<br>
  Stranger has disconnected.
Referencing Sources: |-
  <i>lavenderSiren:</i> (track credit research document, 8/11/2025)


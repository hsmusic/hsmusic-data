Commentary: |-
  <i>lavenderSiren:</i> ([Bandcamp about blurb](https://sbargv2.bandcamp.com/album/sbargv2-volume-2))

  Contains tracks from act 3 and 4.

  <i>Kaylen:</i> (As [EMMY](http://hsmusic.wiki/tag/emmy-sbargv2/), [Tumblr](https://sbargv2.tumblr.com/post/72695781547/chirrup-emmy-here-since-ornis-joined-you-all))

  Chirrup! Emmy here! :>

  Since Ornis joined you all through the door, I’ve been left in charge of things in the Medium. I’m making sure everything is running smoothly. It’s a bit quieter around here now, but I don’t mind it that much.
  In the meantime, it might be nice to take another retrospective look at all the fun times we had.

  [==> Listen](https://sbargv2.bandcamp.com/album/sbargv2-volume-2)

  <i>wertercatt:</i> (wiki editor)

  On Bandcamp, the album was credited to the pseudonym "SKAIANET". Also the link in the Tumblr announcement post had the hover text ":>"

  <i>wertercatt, lavenderSiren:</i> (Conversation in private Discord, 8/11/2025)

  *lavenderSiren:*<br>
  I found a folder called SBARGV2 OST with both volume 1 and 2, as well as an unreleased "volume 3" that's mostly scraps from "iwannabethechump" and that walkaround with thoren and SL

  *wertercatt:*<br>
  Oh I don't have Volume 3

  *lavenderSiren:*<br>
  yeah, I'm pretty sure I never distributed it

  <i>wertercatt, lavenderSiren:</i> (Conversation in private Discord, 8/27/2025)

  *wertercatt:*<br>
  Now that I'm moving onto *SBARGv2 Volume 2*, here's a quick question dump [[artist:lavendersiren|@Nick]]:<br>
  1) Any overarching comments on Volume 2?<br>
  2) Is there anything you wish you did differently when releasing it?<br>
  3) What's your favorite track on the second album?<br>
  4) Do you think you'll ever release the unfinished SBARGv2 Volume 3 project, or another album of SBARG music in the future?

  *lavenderSiren:*<br>
  1. volume 2 had a lot more substantial material to work with. since it was in the thick of the session and I wasn't completely unprepared, this one actually got a chance to feel like an actual album (though I did cram the master waveform in there, simply because it was an audio based puzzle)<br>
  2. tbh I have no idea what I'd want to do differently<br>
  3. my favorite track... that's a tough one. there's a lot of good ones on volume 2.<br>
  4. if there's a demand that doesn't get overwritten by demand for something else, I might consider compiling an album of sbarg related music beyond volume 1 and 2. I know I certainly have material that can be put towards those ends.<br>


Commentary: |-
    <i>Toby Fox:</i> ([Tumblr](https://undertale.tumblr.com/post/150356633250/before-the-song-undertale-was-completed-it-went))

    Before the song “[[track:undertale|UNDERTALE]]” was completed, it went through a completely different iteration. This version sounds a bit more sad, which I think would have been less effective.

    It wasn’t until I heard a certain song that I was inspired to completely change the chords and guitar accompaniment. This new guitar accompaniment then served as the basis for “[[track:memory-undertale|Memory]],” so we have a lot to thank that inspiring song for.

    That’s all of the unused songs. See you tomorrow for a brief retrospective on my past year.

    The composer for the Who Wants to be a Millionaire TV Show is actually [[artist:matthew-strachan]], the original credit is wrongly attributed to [[artist:cole-porter]], who actually composed the 1956 song ["Who Wants to Be a Millionaire?"](https://www.youtube.com/watch?v=MnVTH_nCbuk)

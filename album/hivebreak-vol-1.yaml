Commentary: |-
    <i>Eighteen "Elbows"</i>: ([Bandcamp about blurb](https://eighteenelbows.bandcamp.com/album/hivebreak-vol-1))

    This album is based on characters, concepts, and story elements from the Homestuck fanventure, Hivebreak. Which you can read at [tinyurl.com/Hivebreak](https://mspfa.com/?s=11632&p=1) !!!

    Mainly consisting of covers from a multitude of sources, mostly from a diverse selection of video games, though some are covers of classical pieces and there are a few original pieces as well!

    We here at Eighteen "Elbows" (and the author of the Hivebreak story who we have worked quite closely with) hope you enjoy both the Hivebreak album and the Hivebreak ADVENTURE!!!

    We love you <3

    Homestuck is owned by Andrew Hussie. He made it with his tender orange fingers.

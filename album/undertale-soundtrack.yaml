- Date: March 24, 2025
  Artists: [Kenón, Witch's Cadence, Meulanie, ruby, Makin]
  Annotation: >-
    [HSMusic Discord](https://discord.com/channels/749042497610842152/1353743089164095548/1353800191622254666),
    excerpt
  Body: |-
    <i>Kenón:</i><br>
    I'm so glad someone mentioned [[track:oppa-toby-style|Penumbra in OTS]] because I thought I hallucinated it and was too scared to bring it up-

    You don't wanna be the "Penumbra is in everything" gal but sometimes It Is In Fact In The Things

    <i>Witch's Cadence:</i><br>
    I mean it's a decently common enough motif throughout homestuck<br>
    So it's not crazy to think it might be in a homestuck track<br>
    It's when people think they hear it outside of homestuck that you really gotta double check

    <i>Meulanie:</i><br>
    maybe penumbra was the roaring knights we made along the waking world

    <i>Kenón:</i><br>
    I think it's fair to hear Penumbra in Hopes and Dreams and [[THE HOLY]], I think they were both intentional, but I also don't think Penumbra is going to be a Deltarune motif or the song itself will show up in the game

    I think THE HOLY was derived directly from Penumbra, but is intentionally different enough to stand as its own separate motif, like Penumbra itself does for Doctor

    It WILL show up as a motif throughout the game, but Penumbra itself won't.

    <i>Meulanie:</i><br>
    where did the "penumbra in deltarune" thing come from to begin with

    <i>ruby:</i> cryptic tobyposting

    <i>Makin:</i><br>
    when he was teasing penumbra on tumblr he used wording that sounds a lot like deltarune lore<br>
    and deltarune was always in the planning stages so it makes sense he decided to use it there

    <i>ruby:</i> and then the holy happened to be kinda similar

    <i>Kenón:</i><br>
    His cryptic Deltarune Twitter messages were basically recordings of his cryptic Penumbra Q&A and Twitter messages

    I'd say more than KINDA similar<br>
    It's not the same but Toby absolutely knew what he was doing with that<br>
    It was intentionally close

    <i>Makin:</i><br>
    I'm anti-PP-is-in-everything and I still think it's pretty likely it will be used in deltarune yeah, this isn't some insane fan cope

    <i>ruby:</i><br>
    oh i totally agree, it is too close for it to be coincidence
    pp must mean a lot to toby, so there's no way he accidentaly made it so similar and shipped it without noticing
    also PP in HaD
- Date: May 6, 2025
  Artists: [SergeantSnivy]
  Annotation: >-
    [YouTube comment](https://www.youtube.com/watch?v=jTaibdPA8jU&lc=UgxsGa2fH5qHw1qx3xR4AaABAg)
    on ["the PENUMBRA PHANTASM insanity spiral"](https://www.youtube.com/watch?v=jTaibdPA8jU)
  Body: |-
    [52:46](https://youtu.be/jTaibdPA8jU?t=3166) I really think you're underselling this. This excerpt in Hopes and Dreams is 100% quoting Penumbra specifically, not just [[Doctor]]. In particular, it's quoting the melody in the Penumbra piano demo at [12:55](https://youtu.be/jTaibdPA8jU?t=775). This melody in the demo sounds a lot like the first measure of Doctor, but it's distinct in two important ways:

    - The final two notes are different
    - The contour of the harmony exactly mirrors the contour of the melody, with only the intervals between notes slightly tweaked. The scale degrees of the melody are 3 2 4 2 2 3 while the harmony's are 5 4 7 4 4 5.

    In the piano excerpt of Hopes and Dreams, the scale degrees in the melody and harmony are an exact match to this part of Penumbra (in a different key) rather than any part of Doctor.

    For a similar reason, I'd also say that the excerpt of [[Oppa Toby Style]] at [13:28](https://youtu.be/jTaibdPA8jU?t=808) is definitely pulling from Penumbra. The melody is a bit jumbled up, but the correspondence between degrees in the melody and harmony is exactly the same as it is in Penumbra - 3 in the melody pairs with 5 in the harmony, 2 in the melody pairs with 4 in the harmony, etc.

    Super well-done video overall, I just really wanted to point this out
- Date: May 20, 2025
  Artist Text: >-
    [[artist:ruby]] and
    [[artist:quasar-nebula|Jackie]]
  Annotation: >-
    [HSMusic Discord](https://discord.com/channels/749042497610842152/779895315750715422/1374380762136186890)
  Body: |-
    <i>ruby:</i><br>
    oh right [the video](https://youtu.be/jTaibdPA8jU) said it was doctor in pp<br>
    as I've gone over before, it is definitely pp and not doctor yeah<br>
    but the part of pp itself is undeniably based on doctor<br>
    saying hopes and dreams references doctor is like saying [[track:another-medium|another medium]] references [[track:doctor|doctor]]<br>
    completely skipping over the middle step that is [[track:patient|patient]]

    <i>Jackie:</i> there's a chain there yeah but it's a chain. the attachment isn't link A to link C

    <i>ruby:</i><br>
    but leaving out the middle link is leaving out incredibly important nuance<br>
    because the part has been changed fundamentally<br>
    so its appearance in C doesn't represent how it was in A<br>
    yet it perfectly represents its appearance in B
- Date: May 21, 2025
  Artist Text: >-
    [[artist:quasar-nebula|Lan]],
    [[artist:makin]],
    [[artist:witchs-cadence]], and
    [[artist:ruby]]
  Annotation: >-
    [HSMusic Discord](https://discord.com/channels/749042497610842152/779895315750715422/1374787124007800842),
    excerpt
  Body: |-
    <i>Lan:</i><br>
    The conversation with PP in Hopes and Dreams is, well, something I've attempted to log in a huge as fuck "Referencing Sources" section for H&D on the music wiki... I need to get OK's from everyone before actually committing this, but I've gathered and re-read I think every single discussion about PP in H&D. (I've read a chunk of related stuff about PP in Deltarune more broadly, also.)

    My takeaways on the convo presently are:

    1. Mostly everybody agrees that Penumbra Phantasm is in Hopes and Dreams. (There's some argument that it's just Doctor, mainly from Makin in june/july 2024, but it's kinda fringe. Interrobang has also expressed skepticism that it's any particular motif at all.)

    2. There's a substantial argument that although the reference *is there,* it might-well not be there *on purpose* — that Toby has reused melodies on accident because he is human and people do that. Comments on this angle from Red Rax and Rainy and Jebb, october 2024.

    3. Deltarune fans are proooooooobably coming more and more to take it as Universal Fact that Penumbra Phantasm is in Hopes and Dreams. I haven't taken a real vibe check but I suspect that 99.8% of those fans will/do feel it's intentional.

    <i>Makin:</i><br>
    I retract my argument that it's doctor, and support the PP interpretation, though it's still possible toby reused it by accident

    <i>Lan:</i><br>
    It's kinda more sporadic so I don't think @vriska (8Ω 0.5W) actually shows up in the quoted records here at all, but she also expressed taking it as given / certain that PP exactly matches H&D, just to bring up another voice there, ex. [#music-discussion](https://discord.com/channels/749042497610842152/749067042250031214/1285630946753642578) - also shared their gut feeling re: how refs should be organized for the music wiki [#music-discussion](https://discord.com/channels/749042497610842152/749067042250031214/1239297520157593692) (<- I haven't gone through discussion from *this* link closely, but that comes next...)

    Intentionality in referencing is a big subject of interest for the music wiki as a whole, in my opinion. My personal gut is that 1) I *do* think Toby is intentionally using PP at bare minimum in H&D and co. from Undertale, and that he is *probably* still thinking about it in Deltarune nowadays; and that 2) intentionality matters *enough* that I would say H&D does reference Penumbra Phantasm, but Battle! (Battle Tower) does not reference A Baby Legend.

    or A History of Babies or whatever.

    <i>Witch's Cadence:</i> yeah I agree with this

    <i>Makin:</i> I don't think anyone has made a single good argument about battle tower

    <i>Lan:</i> I'm entertaining the notion that they are dot for dot the same melody (i.e. analogous to PP in H&D), but yeah it's rhetorical haha I don't actually know (or care) anything about that one.

    <i>Witch's Cadence:</i> I think if anything people have made fantastic arguments against it lol

    <i>ruby:</i><br>
    battle tower is not an exact match<br>
    hopes and dreams is an exact match

    <i>Lan:</i> As usual I am not a musician, I do not know music, and I don't really engage in Music Talk for my own sake, tho it interests me... but uh huh, ^nodding.

    <i>ruby:</i><br>
    battle tower is loosely the same melodic idea<br>
    just toby-isms<br>
    but the piano in hopes and dreams specifically plays the same thing as pp

    <i>Makin:</i> I don't even think battle tower is even a mild match, it's like calling two arpeggios the same melody

    <i>Lan:</i> From that angle, we can include PP in H&D on the grounds only that it's an exact match - without concerning intentionality

    <i>ruby:</i><br>
    we can't leave out intentionality here<br>
    I always say this when we talk about it but<br>
    both songs must mean a lot to toby<br>
    there is no way it was done accidentaly

    <i>Lan:</i> I 100% agree w/ this fwiw

    <i>Makin:</i> I vote to leave out intentionality, if someone screws up and accidentally plays C instead of B, it's not a reference

    <i>ruby:</i> [re: battle tower]<br>
    it starts with the same rhythm, at the very least, but the notes don't match either way

    <i>Lan:</i> The thing with intentionality for me is -

    <i>ruby:</i><br>
    we can't put words into toby's mouth<br>
    and we shouldn't

    <i>Lan:</i> I think it's critical to understanding music in context. I think it's something *we should think about* when considering what the Point of any music even is. But I also think it's super nebulous and speculative, very often, when we don't get a confident and unambiguous word one way or the other from the composer. That makes me hesitant to use it as a deciding factor - on whether to include or exclude a reference. (...But I wonder if it's necessary, sometimes, too.)

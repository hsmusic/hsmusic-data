    <i>Red Rax:</i><br>
    My opinion is that all of these references that are kind of unclear like penumbra phantasm in hopes and dreams or [[track:core|core]] in [[track:oppa-toby-style|oppa Toby style]] or [[track:gasters-theme|gasters theme]] in whatever are just genuine coincidences

    I feel like Toby Fox, who’s written so many melodies over his career, might just accidentally repeat himself at some point, subconsciously using something he already wrote

    Just look at [[track:battle-battle-tower|the song he did]] for Pokémon sword and shield!  It sounds VERY similar to a The Baby Is You song, but Toby said that he came up with the melody on the way back from a meeting with the Pokémon people, and I’m very much inclined to believe that he did and just accidentally reused a melody he’d forgotten he’d already written

    <i>Rainy:</i><br>
    Yeah I agree<br>
    Dudes only human and he's bound to reuse melodies unintentionally<br>
    Like look at that hopes and dreams-esque melody in [[track:snow-pollen|snow pollen]]

    <i>Jebb:</i><br>
    Yeah<br>
    Once again i began to reconsider a lot of things after i found out that my brain accidentally redid a bassline 1 to 1 note to note in one of the songs i submitted to lofam<br>
    I need to edit together a small video so that i can reference this easier<br>
    But yeah<br>
    The brain is super good at accidentally regurgitating melodies you like<br>
    Penumbra phantasm in hopes and dreams may be an accident, so may baby is you in pokemon, so can many other things<br>
    We can't know for sure

    <i>ruby:</i><br>
    pp in had feels so purposefully hidden though

    <i>Jebb:</i><br>
    Yeah i mean it WOULD make complete sense<br>
    Hopes and dreams was like Toby's magnum opus for Undertale

    <i>ruby:</i><br>
    mhm, if there's any track with enough time and care put in to where it'd avoid accidental references, it'd be hopes and dreams<br>
    but then again, we don't know

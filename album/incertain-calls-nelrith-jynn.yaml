Commentary: |-
    <i>SpilledCereals:</i> (commentary file)

    At first i had done an actual cover of [[track:let-go|let go]] as my indie rock project ["Lahire"](https://lahirevdc.bandcamp.com/), but seeing the incredible opportunity i had in front of me i decide to use it as the last song on nelriths album. This cover is really telling of how he just falls short in every way on this project:

    He's one song short of [[album:curtain-call-maragi-radi|Curtain Call]], and even then he didn't even manage to make 9 original songs because the last song is a cover of a song that's not even the last song on that album. and it still manages to be longer than most of the other songs he made.
    Doesn't help that the song doesn't even appear on the tracklist on the album cover because i don't think he would admit that he put it on there.

    Let Go in the original album's context was about selling out but now it's about one dragon's concerning obsession with his ex because i don't think i've stressed this enough but none of the songs on Curtain Call are about Nelrith but every song on incertain Calls are about Maragi, this is very much intentional.

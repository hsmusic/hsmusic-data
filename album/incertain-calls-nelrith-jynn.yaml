Commentary: |-
    @@ [Bandcamp about blurb](https://desynced.bandcamp.com/album/incertain-calls-nelrith-jynn), 10/1/2026

    Amidst the fanfare following Maragi Radi's chart crushing album "Curtain Call" an abandoned response album is found thrown away in an alleyway. I wonder who Maragi Radi was to this person?

    incertain Calls is the follow up album to last years [[album:curtain-call-maragi-radi|"Curtain Call"]] now coming to the perspective of her ex boyfriend, created by SpilledCereals.

    <i>Quasar Nebula:</i> (wiki editor, 10/4/2026)

    Digitally, this album exists in two slightly discrete forms. For album presentation here we've treated it like it's an actual physical CD release, as the cover art depicts - that's why the ninth track is listed as "hidden" (and is untitled).

    incertain Calls was released on SoundCloud on December 14, 2025 (the date we use here). Notably, its album release date is set a couple months earlier: October 1, 2025, the same day as [[album:curtain-call-maragi-radi]]. On SoundCloud it's a pared-down presentation - just numbered tracks, in all. Jebb compares the two albums:

    > <i>[[artist:quasar-nebula|Lavender]]:</i> oh and maybe a few notes about its relation to curtain call, how that one was super under wraps and incertain calls was… not<br>
    > AFTER I FACT CHECK MYSWLF ON THAT

    > <i>[[artist:jebb]]:</i><br>
    > Yeah lol that was also the intention<br>
    > Curtain Call is under wraps, super high production, shiny and glittery and on bandcamp, full track art treatment<br>
    > Incertain Calls is pretty much public, low production, just randomly chucked on soundcloud without proper track naming, not a single hand drawn art piece and the cover is just the disk

    incertain Calls did end up releasing on Bandcamp, alongside [[album:renew-your-rites]], on the one-year-anniversary of Curtain Call, October 1, 2026.

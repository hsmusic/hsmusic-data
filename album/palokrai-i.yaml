Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor, 9/16/2025)

    Most of Palokrai's tracks have custom release dates on Bandcamp, which we represent here, despite the tracks within the albums themselves actually being released all or almost all at once. This track is missing a custom release date! However, its lime label fits [[track:maibasojen-lofam|the numbering system]] used across Palokrai: 3.03.02 places it after 3.02.02 ([[track:baptikonyen|the previous track]]) and before 3.04.02 ([[track:saltovahr|the next track]]).

    Unfortunately, since the custom track dates on Bandcamp are the *only* source for these track dates (the numbering system does *not* represent specific dates, and the album was prepared on Bandcamp mostly after its tracks were created), the date used for this track is arbitrary. <s>So... this track has no date at all. Eep!</s>

    <i>Quasar Nebula:</i> (wiki editor, 9/18/2025)

    We emailed the artist and received file-modification details for all the tracks from Palokrai I. Since there are multiple files for each track (including MP3, MuseScore, and occasionally alternate versions), there are also multiple dates. The clearest standouts are for <code class="filename">Istojabeȝo.mscz</code> (7/4/2025) and for <code class="filename">Istojabeȝo-2.mscz</code> (7/7/2025). Both of these place this track between the two adjacent ones, as expected. For the wiki we're using the first.

Commentary: |-
    <i>Quasar Nebula:</i> (wiki editor, 9/16/2025)

    Since these two tracks are hidden on Bandcamp and only available as part of the album download, they don't have custom on-site track release dates. However, the artwork for [[track:cforenso]] indicates multiple parts to Cforenso itself, <s>so we're going out on a limb and reusing the date for that track, here.</s>

    <i>Quasar Nebula:</i> (wiki editor, 9/18/2025)

    We emailed the artist and received file-modification details for all the tracks from Palokrai I. The Cforenso tracks together have a handful of dates and files, sorted earliest to latest here:

    - 11/21/2020, 00:04:49 <code class="filename">CforensoP1.mp3</code>
    - 11/27/2010, 21:45:37 <code class="filename">CforensoP2.mp3</code>
    - 11/30/2010, 17:45:39 <code class="filename">Cforenso.mscz</code>
    - 11/30/2010, 19:07:24 <code class="filename">Cforenso.mp3</code>
    - 12/02/2010, 23:12:02 <code class="filename">Cforenso II.mscz</code>
    - 12/02/2010, 23:12:16 <code class="filename">Cforenso III.mscz</code>
    - 12/02/2010, 23:19:21 <code class="filename">Cforenso II.mp3</code>
    - 12/02/2010, 23:20:16 <code class="filename">Cforenso III.mp3</code>
    - 12/18/2010, 18:33:38 <code class="filename">Cforenso No Echo.mp3</code>

    It looks like these tracks were in continuous production for a week or two, and were finalized or exported more or less at the same time. That date is the same as [[track:cforenso]] is custom given on Bandcamp, so this affirms these tracks sharing the same date.

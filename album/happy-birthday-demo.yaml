Commentary: |-
  @@ [YouTube description](https://www.youtube.com/watch?v=TccXaS8Wabw)
  This is a demo of [[track:happy-birthday-homestuck-the-musical|a song]] to be featured in "Homestuck: The Musical", a production by the Midnight Stage Crew with music by [[artist:lumistarlight|Goodnight Lumi]]. We are a Vancouver, BC based team aiming to have our first show in the Summer of 2014.

  "Homestuck: The Musical" is a musical adaption of Homestuck, the webcomic by [[artist:andrew-hussie|Andrew Hussie]], which can be found here: http://mspaintadventures.com

  Roles have not been casted yet. This demo was recorded by stand-in singers.

  Auditions will be taking place in October, and anyone interested in auditioning can find more information here: [395626677226398](https://www.facebook.com/groups/395626677226398/)


Commentary: |-
    <i>Fruzmig:</i> ([A Troubled's Cosmos behind the scenes](https://fruz.quest/mspa/atroubledscosmos/))

    <b>Production</b>

    The backstory is that [[artist:etchjetty|EtchJetty]] had the idea and [[artist:ethan-clark|Ethan Clark]] immediately made a test for an instrumental and I decided to make the whole thing from there. Since including the whole extended cast would have been troublesome for a variety of reasons I kept it to just the guys that appear in the game (and Rose Lalonde).

    I wrote a few lyrics and ideas over the course of 3 days and then I locked in for 3 hours to write the whole thing and Ethan made a new version of the instrumental with the structure of chorus - 8 bar verse repeating 10 times for each character (or set of characters), at the same time I forwarded the lyrics to the big man Vibri for approval before getting it recorded and she didn't request any changes.

    Over the next fortnight [[artist:skeeptieel|Skeep☆Tieel]] recorded most of the thing with the direction of "just do an attempt at impressions of these characters [who are original so you have to make your own guess as to what they sound like, obviously]" and "you can record the chorus once or you can do variations on it like An Under's Tale does" and they did, the chorus never gets stale because it's so funny. I always get [[artist:articulatelycomposed|articulatelyComposed]] to voice women named Rose Lalonde regardless of public domain-ity and this was no exception, and because I thought she'd pull off Nortman's energy perfectly I also got her for that. Both AC and S☆T killed it.

    Skeep also mixed the whole thing and once that was done I worked on the art and designs for the Troubled Cosmonaut and Rose Lalonde that would appear in the music video since Andrew didn't make a design for those (in fairness Rose Lalonde is not in this game so that makes sense), but they did show the Cosmonaut's hand and I extrapolated making the Cosmonaut look like a Bard Quest guy from the way that hand looked, except with a more fitting outfit for hanging out in outer space. For Rose I just made a blonde woman and added whatever detail came to mind first without thinking about it twice.

    Finally with all that done, [[artist:ydgeon|YDGeon]] did it again, he made a super clean video for the song, my direction was to simply add the characters images as they came, have a spinning disk in the back and so on. But he added so many neat little details that I didn't specify, such as the ever expanding Jabroni, that was really funny. This also marked the first production from the Six-Eyed Circle which is the dōjin circle of YDGeon, Skeep☆Tieel, and Fruz; as you all know we've done a lot of stuff together but this is the first as the circle, what's next..?

    <b>Lyric explanations, references, and notes</b>

    <b style="color: red">I'm just spitting facts, that's why my text is red</b> - Reference to the Red Truths in Umineko.

    <b style="color: red">I'm a freak, you're a phony, I'll make you bow to Jabroni</b> - References a lyric from [Hulk Hogan vs. Kim Jong-il](https://www.youtube.com/watch?v=Zlu_SVDTUF4) by ERB.<br>
    <b style="color: red">I don't keep ladies in chains I ain't worried 'bout those</b> - Jabroni is a decent man who doesn't keep ladies in chains unlike evil people out there somewhere in space.

    <b style="color: red">How dare you say I piss on the poor? I piss on the floor!</b> - References the "How dare you say we piss on the poor?" Tumblr post, also takes inspiration from the fact that I once misread it as "piss on the floor" for some reason.

    <b style="color: red">Sigh... It's not easy being green</b> - Kermit reference.<br>
    <b style="color: red">'Cause I'm a mean green father from outer space!</b> - Little Shop of Horrors reference.<br>
    <b style="color: red">But I'm not like Mean Father, look</b> - Look? I thought Mean Father said "No" instead of "Look." What does this phrasing mean then?

    <b style="color: red">WE’LL FUCK YOUR SHIT UP, ME AND THE DAMN BOYS!</b> - This is one of the lines where I make up lore about the characters just so that they can have a rhyme, what boys? I guess he must have friends but we don't really meet them. With more thought this wouldn't happen, but my philosophy while writing prevented that.<br>
    <b style="color: red">YOU CAN CHOKE ON THE SPACE DICK OF A SPACE DOG WITH EXTRA SPACE BALLS!</b> - This references one of the incidentals which is exactly the described dog.

    Lambo Calzone's whole verse is meant to rhyme with "buckaroo." By any means necessary, what canoe? More made up lore, except it's canon made up lore since it's in the actual game, so I guess it's just lore, but I made it instead of Andrew.

    The Incidentals verse is a very special one, firstly the incidentals teach you that you can click on them as a group and then some notable ones show up, Unlucky Luciano references Lucky Luciano's famous catchphrase, and Nice Peter explains his name twice after saying he wouldn't say it twice, Rose Lalonde quickly leaves because she's not in the game, nevertheless she's a public domain character who has no relation to any other characters of similar appearances, names, or backstories, she's just a famous book writer with hits like 50 Shades of Space.

    Patalie Nortman's opening couplet and last line reference [Natalie's Rap 2.0](https://www.youtube.com/watch?v=B8K9jAJ3Ong), one of my favorite songs by one of my favorite artists, conveniently Portman's and Nortman's names make for a nice letter change in the "just for sport, man" -> "just for snort, man" lyric, her whole attitude throughout the verse is inspired by Natalie's in her song (and its prequel). And like I mentioned before, I got guest voice articulatelyComposed for her role because I thought she'd pull it off perfectly, and she did. The inclusion of Natalie's Rap 2.0 in the game was also the first time Andrew heard the song, they think it's really good. Was a The Lonely Island reference in MSPA in anyone's bingo card?

    Patalie mentions having more lines in this song than in the whole game, this also applies to other characters like Nervous Arnold but I wrote her verse before his and I didn't want to change the line. It also conflicted a little with the concept of Arnold's verse being spent half trying to escape and half trying to impress the guests due to Lambo's presence, the main philosophy when writing these lyrics was "don't think about it too hard."

    The game draws a similarity between Nervous Arnold and Unpopular Creature in that they're both nervous, so I was juggling ideas between him and Arnold, for a moment I considered Arnold not having a real verse because he was just too nervous to do it, but then I realized it was better if the one to do the "doesn't have a verse" joke was Unpopular Creature, in the game one of the jokes with his death is that a 17 second clip of gunshots plays in its entirety and that would fit perfectly for the ending, where the instrumental stops and the gunshots are still going, on top of the fact that he doesn't speak at all, on the other hand I feel like an actual Unpopular Creature verse would have been funnier than the verse that Arnold got, however the gunshots joke was funnier than his verse would have been and sometimes you have to sacrifice a funny joke for a funnier joke.

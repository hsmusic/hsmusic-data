Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/warden), excerpt)
    Finally, i present to you the last track, made 3 years after the release of the mod, specifically for this album - WARDEN!
    If you have seen the SoundCloud upload of this album, a WIP of this track was initially attached. For the longest time i wanted to actually turn it into a full track, but never had the time or much of an excuse to do it. Uploading my discography to Bandcamp is what pushed me to finish it.
    This is the music for a battle against Aleph Null's mysterious living program, WARD. After Boyfriend enters the digital realm and tries to communicate with it, the program begins to get more and more into the song, and eventually fully overtakes BF. However, with the power (or, well, the motifs really) of various characters throughout the comic, BF takes over and calms WARD down.
    Truth be told, i think the song narratively works better with Sauron (the comic's protagonist) being in place of BF, but i lost a part of his chromatic somewhere along the way and i have better control over BF's chromatic. Additionally, that's what the initial WIP version of this track used - so, no real problem.
    I consider this a culmination and a final farewell to the first ever project i composed for. I hope you enjoy the end result as much as i do.
Referencing Sources: |-
    <i>Jebb:</i> ([Bandcamp credits blurb](https://jebb.bandcamp.com/track/warden))

Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/album/fnf-aleph-null-ost), excerpt)
    Full soundtrack for the first project i have ever composed for - FNF: Aleph Null, the Friday Night Funkin' mod for the (now taken down) webcomic, Aleph Null.
    
    Featuring sketches i made while working on the mod (12-15) and a brand new track made just for this album - [[track:warden|WARDEN]]!
    
    Thanks to [[artist:adrian-gravitygauntlet-wahrer|Adrian Wahrer]] for the great album art!
    
    If you are interested in where this comes from, the mod can be found here: [gamebanana.com/mods/375898](https://gamebanana.com/mods/375898)

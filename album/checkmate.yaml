Commentary: |-
    <i>ifer:</i> ([Bandcamp about blurb](https://unofficialmspafans.bandcamp.com/track/mailtime-bluesy))

    I wanted to depict Jack in his Agent facet, playing the piano while surrounded by piles of mail and forms that he’s ignoring in favour of playing the piano. I depicted him in my xeno style, with just the slightest spiralling on the rings above his neck and below his waist to indicate his uniform a the time. Before the Queen ruined it in honour of John’s harlequin doll.

    I had to use 3d models to get all the posing and lines and perspective right, but the shading is allll me baby. As is the xeno!Jack model to begin with. Trying to decide how Jack was visually distinct from CD and DD (who i’d already made models for) was interesting. I ended up making him one segment shorter than DD and one taller than CD, and having both his waist joint and the cutout for his rear leg reminiscent of his signature suit. I think it turned out well.

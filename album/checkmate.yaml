Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://unofficialmspafans.bandcamp.com/track/paper-trail))
    Listen. I wanted to do the PM/Jack album sooooo badly, but when it finally got greenlit and the time came around to make the PM track, i kinda fumbled around for a while. This is the end result of me just saying "yeah sure whatever this will do". For a track that's less than 2 minutes long i took a really long time to make it because i just did not feel like it for some reason. But hey, at least i finished it!<br>
    I wanted this track to feel and sound like the start of some big new adventure, with PM walking orderly towards her goal of delivering the next piece of mail in her bag. And also, uh. The structure and vibe of this track are very much taken directly from "New Adventure" from A Hat In Time's soundtrack. Like, listen to it, it's horrendously close. At some point while making this i realised that what i was making was just said track and went "screw it" and took what worked from it wholesale while adding a little bit of my own spin on it. A little bit.

Commentary: |-
    <i>yuuDii:</i> ([Bandcamp about blurb](https://unofficialmspafans.bandcamp.com/track/flatrate))

    Make through the waste, shod rags of sand o'er long time-lost lea;
    parcel in hand e'er twelve-ninety fee, deliv'rance in haste.

    <i>ricemilk:</i> ([Bandcamp about blurb](https://unofficialmspafans.bandcamp.com/track/flatrate))
    I'm so glad I was able to make this song's track art. It's such a banger. My first concept was PM as a modern post-woman, or more like, the cartoon version of one? Then, I read [[artist:yuudii|Veronika's]] wonderful commentary, listened to the finished version, and it was clear I HAD TO put PM back into her rags, as well as replace the metropolitan jungle with a desert. I thought the dynamic pose is enough to convey the fresh feel of this song. I think the colors help a bit too. A few people helped me choose. My friend called them "jojo-esque" which made me laugh.

Commentary: |-
    <i>yuuDii:</i> ([Bandcamp about blurb](https://unofficialmspafans.bandcamp.com/track/head-hunting))

    If you've ever cut your way through a study felt- one of the kinds you get at the bougie arts 'n crafts store that sells the stuff made by a family specialized in the craft for five generations and up-marked three or five times past regular retail value despite the fact it's still only felt, not the cheap dollar store stuff for kiddies who don't know or need better or the rag at Michaels meant to fool the undiscerning fool who fancies themself a discerning non-fool on felted matters- you already kind of know what it's like to cut through the paunchy green necks of one of these lunks. 'Course, no felt you can buy'll coat your cutting implement of choice and the surrounding scenery in cherry-red candied blood, or provide a cardboard-roll spine to catch on if you go limp-wristed mid-swing. And it certainly won't provide a heady 'thunk' as the dimwits dome hits the ground, a thunk that would be cringeworthy if it were a real head; if you could muster even the tiniest amount of respect for the pestilentially verdant goon, or if it was still, you know, attached between their shoulders. Really, you ought to be surprised at just how easily it is to make a training dummy for just this purpose: really, the dollar store stuff's fine for the job, and it's not like a cardboard tube is difficult to pilfer from the back of some department store, especially during the holidays when they're presumably going through rolls and rolls of wrapping paper wrapping up gifts for the dopes who can't be bothered to do it themselves, to do the bare minimum for the season: really, it's not much more than wrapping a few layers of the fabric around a center rod of pulpy paper, roughly in contour with the silhouette of the body- these lime-shaded pricks barely follow any rules of anatomy recognizable from a textbook or even basal observation of your fellow man, you don't need to get that close- then finish off the jobs with a gaudy hat (preferably stolen from the homeless for that extra bit of misery) and stuff the topper with rocks. There you have a decently-accurate replica of the buffoons for use in multitude ways: consider training your sabre arm and technique on them; they make for convenient pin-cushions for those of you so inclined to tailoring; a fantastic punching bag, though mind that you don't punch into the rocks, or otherwise upset the dummy such that the hat (and rocks) fall on you; lovely gift to wrap up and present to a heist-team member, or some gal you're sweet on, or to the twerp behind the...
Crediting Sources: |-

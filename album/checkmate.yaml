    <i>Rainy:</i> ([Bandcamp about blurb](https://unofficialmspafans.bandcamp.com/track/the-mail-never-fails))
    I tried to make a silly but heroic JRPG character theme for PM but I got something a bit more serious sounding instead. I think it still works since she's VERY serious about the mail and you should be too

    <i>ricemilk:</i> ([Bandcamp about blurb](https://unofficialmspafans.bandcamp.com/track/the-mail-never-fails))
    PM is such an underrated character so I was super excited about this project. I've gotten into needle-felting a while ago and decided it'll be the perfect oppurtunity to get out of my comfort zone and make something fresh and special, as my own art skills became rusty. I think it balances out the heroism and the quite cute nature of the carapacians. My original sketch for this song was far too bleak and just didn't fit the vibe. I unknowingly created kind of an inversion of the comic by painting the gothic cathedrals and photobashing PM herself. I had been hesitating through the whole process but the support of my friends and the great reception from the team assured me it was worth it.

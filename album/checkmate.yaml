Commentary: |-
    <i>allahrts:</i> ([Bandcamp about blurb](https://unofficialmspafans.bandcamp.com/track/ivory-deliverance))
    Oh boy, this has got to be one of the more convoluted art pieces I’ve made, but maybe that's why I love it so much ha. When I first listened to this song it was in a call with [[artist:star-nomad|star-nomad]], and immediately she realized that we should do a dual art piece together of PM and Jack. [[artist:star-nomad|star-nomad]] was the one who came up with the rough concept sketch too. When working on this piece I wanted it to fit with the musics tone, which meant I redid this piece many times. To me the undertones of the music sounded both tragic and optimistic at the same time. Like someone who’s seen the worst of the worst, yet still keeps moving forward.

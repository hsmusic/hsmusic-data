    103RO0006

    I used to be into Homestuck, once upon a time. Enough to RP, even. The less said about what was both an embarrassing escapade and a really unhappy time in my life in retrospect, the better. However, a smattering of fan music came about as a result of this brief obsession, all of which is collected under here for your listening pleasure- with a bonus remix of [[Gold Mage]] by YM2612 wizard [[artist:haunter|BlastProcessed]]!

    <i>Decon Theed, repeatedScales|[[artist:repeatedscales]]:</i> ([Bandcamp credits blurb](https://103records.bandcamp.com/album/the-ever-so-unfortunate-tale-of-the-right-honorable-arpege-clavier-chapter-1-of-92000000), excerpt)


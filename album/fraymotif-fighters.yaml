Commentary: |-
    <i>Rainy:</i> ([YouTube description](https://www.youtube.com/watch?v=39KXnY8KynY), excerpt)

    I was asked to write commentary for the two tracks, so here you go. I’ve always had a soft spot for Jane, so taking on the task of writing a strife theme for here was something I didn’t even need to think about. As one can probably hear, the track has heavy influence from the Kirby series. The goofy, saccharine sound of those soundtracks fit Jane’s silly personality, so I had to go for it. I initially wanted to do something more in the style of Flashygoodness but gave up lol. This song also sees me revisiting a fansong I wrote in 2018 called [[track:lifesaver-stlap2|“Lifesaver”]] which was on the now delisted album [[album:stlap2|Stable Timeloops and Paradoxes 2]]. Coming back to melodies that I wrote 6 years ago feels odd but doing really made me appreciate how far I’ve come since then.

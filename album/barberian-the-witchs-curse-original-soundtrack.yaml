Track: Foundation (Foyer)
Directory: foundation
Suffix Directory: true
Reference By Directory: outside album
Duration: 4:26
URLs:
- https://jebb.bandcamp.com/track/foundation-foyer
Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/foundation-foyer))

    While the game is very much inspired by Zelda and Binding of Isaac, i wouldn’t say the soundtrack is. In fact, i am not quite sure what i would say it’s inspired by. Back when the game was envisioned as 8-bit, the soundtrack was supposed to be entirely chiptune, or rather it was supposed to use the Cave Story soundfont. However, as the game developed and we realized that sticking to 8-bit graphics would be overly difficult, we decided to go into a more gameboy advance-esque aesthetic, and the soundtrack’s direction changed to bout - now sporting soundfonts from around that era of games.

    That’s why there is so much Mother 3 in here. And also because i just like how it sounds.

    Beyond that, i decided to go a bit ham with the time signature in the latter half of the track, having it be 5/4 three times and then 3/4 two times.

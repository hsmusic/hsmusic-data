    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/hairnet-kitchen))

    This track channels a spanish-esque sound while also, for once in this ost, extensively using samples. Since this was the final floor, i decided to make the theme more frantic compared to the other two.

    The breakdown at the end samples the Upward Movement (Dave Owns) drum loop (a track from homestuck). I love that sample so much ngl, i use it any chance i get - so i decided to sneak in the slightest bit of homestuck in this game jam as well.

    That part also samples pot and pan sounds.

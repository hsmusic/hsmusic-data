Track: The Witch's Curse (Final Boss)
Directory: the-witchs-curse
Duration: 2:59
Sampled Tracks:
- Wrestling Stone Cold
URLs:
- https://jebb.bandcamp.com/track/the-witchs-curse-final-boss
Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/the-witchs-curse-final-boss))

    And finally, the boss theme of the Witch herself!

    This track was primarily inspired by [“Haunted Castle”](https://youtu.be/BjptlCSAl8A) from Team Sonic Racing and very slightly Lchvasse’s [“Dick Dastardly Richardson Theme”](https://youtu.be/c9FGzHZHNqs). The song is meant to almost taunt you, in big part signified by the Kefka laughs and the Bald chorus from Wrestling Stone Cold.

    I was debating on the name for this one a lot, but ended up going with the title drop. After all, who else but the Witch deserves it? (This is a great moment to mention that the original quote the game’s subtitle references is actually “the curse of the witch”, however, probably due to misremembering, we instead went with “the witch’s curse”. Which turned out to be a good thing, considering several other jam games ended up using the proper quote for their subtitle, so ours ended up standing out!

    I was originally planning on making a phase 2 theme which would be basically the same thing as this but with the main motif of the game. However, we decided that this track was already long enough to last for two phases. Oh, and we didn’t have enough time to actually make a second phase, so either way it ended up working out.

    I sure do love composing metal, so this was a treat to make. Really fun track to work on, and great end result too! (in my opinion.)

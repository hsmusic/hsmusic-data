Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/overgrowth-greenhouse))

    This was the first track i made for the game! There’s a WIP version of it out there which is made entirely out of organaya (the Cave Story music sequencer) instruments, since it was started before we decided that the game wasn’t gonna be in a NES-esque style. I decided to give myself a lot more freedom with the arrangement once we ditched that idea, however a lot of the organaya instruments are still in the final version.

    I wanted this track to evoke a feeling of awe, and for the player to audibly go “oooh damn” when the drop happens. That’s right, it’s showoff hour, hope you enjoy it.

    Side note, mastering this was kinda hellish because this has much more bass than every single other track on the ost.

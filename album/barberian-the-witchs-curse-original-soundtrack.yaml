Commentary: |-
    <i>Jebb:</i> ([Bandcamp about blurb](https://jebb.bandcamp.com/track/bigwig-foyer-boss))

    I was debating for some time on whether to have one boss theme or a unique one for each floor, and ultimately i decided on the 2nd option. It gave every boss more personality while also being easier to make due to the tracks being remixes of the floor themes (i made all 3 boss themes in the last couple hours of the jam).

    For this one i got rid of a section, added a guitar, another layered on lead, and spiced up the drums. But you could already hear that. Probably.

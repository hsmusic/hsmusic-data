    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/shambles))

    “Our “undeath” allows any part of our bodies once severed or damaged to continue living independently. It’s not as though we have much control over them once they're cut from the nervous system, however. A severed hand is still a severed hand, even if it pulsates futilely with life… Regrettable as it is that my body had to be left behind, I’m an optimist. Just take me back to Margaret, and things should be okay.”

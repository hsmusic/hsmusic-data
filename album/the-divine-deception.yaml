Commentary: |-
    <i>Thomas Ferkol:</i> ([Bandcamp about blurb](https://eidolonorpheus.bandcamp.com/track/capillarian-forest))

    An expansive forest connects eastern Alacastor, southern Nifel, and northern Ancilastor. Once the holy grounds of an old god of earth, few travel through the forest for holy reasons in this day. Ancient, petrified trees stand like walls around the outer forest, deterring most travelers from the wonders within. Beyond the wooden and stone skeletons, the trees grow wilder, taller, and more curiously than anywhere else. Bioluminescent boughs pulsate with dim lights at the forest's heart.

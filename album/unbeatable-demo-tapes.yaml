Commentary: |-
    <i>D-CELL GAMES:</i> ([Bandcamp about blurb](https://dcellgames.bandcamp.com/album/unbeatable-demo-tapes))

    Includes instrumentals for tracks 2-8 as bonus tracks.

    UNBEATABLE: DEMO TAPES is the official soundtrack for UNBEATABLE [white label] - a special episode set in the world of UNBEATABLE. We will be updating DEMO TAPES with new music each time [white label] is updated, so please check back regularly!

    You can play UNBEATABLE [white label] here:<br>
    [store.steampowered.com/app/1290490/UNBEATABLE_white_label/](https://store.steampowered.com/app/1290490/UNBEATABLE_white_label/)

    DEMO TAPES is separate from the final UNBEATABLE soundtrack, which will be released when UNBEATABLE is complete. All mixes presented in DEMO TAPES are not final and are subject to change in the full game.

    [unbeatablegame.com](https://www.unbeatablegame.com)

    <i>D-CELL GAMES:</i> ([Bandcamp credits blurb](https://dcellgames.bandcamp.com/album/unbeatable-demo-tapes))

    [[artist:peak-divide|peak divide:]]<br>
    [[artist:clara-maddux|Clara Maddux]] - composition, arrangement, guitars, bass, drums, lyrics<br>
    [[artist:vasily-nikolaev|Vasily Nikolaev]] - composition, arrangement, synths, mixing, mastering

    [[artist:rachel-lake|Rachel Lake]] - vocals, composition<br>
    [[artist:rj-lake|RJ Lake]] - music supervision, lyrics, arrangement & composition on track [[track:familiar-unbeatable-demo-tapes|1]] & [[track:forever-when|8]]<br>
    [[artist:andrew-cleveland|Andrew Cleveland]] - guitar solo on track [[track:waiting-unbeatable-demo-tapes|2]]<br>
    [[artist:derrick-lightning|Derrick Lightning]] - saxophone on track [[track:motherbound-unbeatable-demo-tapes|9]]<br>
    [[artist:andrew-tsai|Andrew Tsai]] - cover art design

    <i>ruby:</i> (wiki editor, 06/11/2025)
    as of 7 June 2025, what used to be the [[artist:peak-divide]] Bandcamp page rebranded to the [[artist:d-cell-games]] Bandcamp. while the artist for this album hasn't explicitely been updated, [[artist:rj-lake|RJ]] has stated that the vocal tracks for the game will, from now on, be listed as being by [[artist:unbeatable]]. that's why they are credited as such here on the wiki.

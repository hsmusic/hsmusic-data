Commentary: |-
    <i>Jamie Paige:</i>
    "and let me hear some more of that song!"

    just a compilation of some errant tracks from this era - stuff that otherwise would never get a proper release!<br>
    dedicated to the upcoming ten year anniversary of releasing music as jamie paige<br>
    unmastered 'cause of the vibes<br>
    bandcamp exclusive 'cause it's for the real ones<br>
    all lowercase 'cause this one doesn't count<br>
    ❤️💚

    if youre looking at this tracklist and going "wtf wheres that other song"... all in due time, my friend

    sunrise 101.1<br>
    daydream 1


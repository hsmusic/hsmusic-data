Commentary: |-
    <i>SplitSuns:</i> ([SoundCloud description](https://soundcloud.com/splitsuns/stoker-of-nightmares))

    This is my contribution to the Paranatural Fanmusic Team's debut album, "The Mayview Mixtape". When I heard that such a project was being organized for Paranatural, I knew I had to make a song about Forge, one of my favorite spirits from the comic. I took a lot of cues from 80's-themed horror film soundtracks, such as Disasterpeace's work on the film "It Follows". I've been sitting on this song since last September, so I'm glad it's finally released! Enjoy.

Commentary: |-
    <i>Unknown Artist:</i> ([Bandcamp blurb](https://paranaturalfanmusicteam.bandcamp.com/album/the-mayview-mixtape), excerpt)

    Most kids in the extra-normal town of Mayview have surely thought at one point or another that their life would be much cooler with some fitting background music to accompany their time at school, with friends, or fighting power-hungry spirits. This mixtape will give such a soul exactly what they're looking for. It's host to songs dedicated to numerous characters, locales, and villains from Paranatural, with contributions from an array of talented musicians and artists across the fandom.

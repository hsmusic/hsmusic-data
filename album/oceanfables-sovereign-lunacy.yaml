Track: Fi Albidaya
Additional Names:
- ف ةيادبلا (Arabic)
- In The Beginning (English)
Duration: 1:51
URLs:
- https://nightslights.bandcamp.com/track/fi-albidaya
Commentary: |-
    <i>leiirue:</i> (booklet commentary)

    "<i>يف ةيادبلا</i>"<i>, or “In The Beginning”</i>

    <i>“<span style="color: #ffcccc">One notable record states that she had a warm smile which could melt mountains, but bore a heart that was harder than stone</span>.”</i>

    This song is a complete 180 from [[track:lunacy-prelude|Prelude]], but that’s because I wanted to make it a kind of ‘sickeningly sweet’. I thought that’d fit for someone like The Beginning - with such a wonderful exterior and a bitter interior. There were so many iterations of the song that I wasn’t happy with, and eventually ended up with this as the final! I’m not sure if I made it sound too much like baby music though, haha ^^;;

    Most of the songs in this album will have non-English names by the way! The celestials write their books in different languages, and I thought it’d be nice to have that represented in the song titles. I made them all Romanized for accessibility’s sake, however.

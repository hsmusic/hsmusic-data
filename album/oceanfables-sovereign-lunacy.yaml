    "<i>فافش</i>"<i>, or “Transparent”</i>

    <i>“<span style="color: #ccccff">A reserved king whose gift is the Shadow Blood of Umbra</span>.”</i>

    Honestly, I REALLY wanted to use the [[track:blood-pact]] motif! [[artist:witchs-cadence|Witch’s Cadence’s]] music is quite good, and I recommend checking out her Oceanfalls album [[album:oceanfables-ethological|“Ethological”]] if you haven’t. I also went on vibes for this one - a slow song seemed to fit The Unseen more than a fast paced one. Maybe I could’ve made it calmer, but I think it’s a good song for all of the Umbra clan as well, so !!

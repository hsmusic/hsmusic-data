Track: Zetsubō no Shōjo
Directory: zetsubo-no-shojo
Additional Names:
- 絶望の少女 (Japanese)
- The Despair Girl (English)
Duration: 1:40
URLs:
- https://nightslights.bandcamp.com/track/zetsub-no-sh-jo
Commentary: |-
    <i>leiirue:</i> (booklet commentary)

    "<i>絶望の少女</i>"<i>, or “The Despair Girl”</i>

    <i>“<span style="color: #ffccff">A soft-spoken queen whose gift is the Shadow Seal</span>.”</i>

    I tried to make The Reformer’s theme quite soft, but still giving off the feeling of despair, due to her book being called “Diary of the Despair Girl”. And also due to the fact that she’s an exorcist, I made the song slightly unsettling.

    I honestly really enjoy this song, especially the tempo shifts, even if it’s not much substance-wise. (Which was totally intentional by the way! I wanted it to sound decently empty.) It’s not exactly my favourite song in the album, though.

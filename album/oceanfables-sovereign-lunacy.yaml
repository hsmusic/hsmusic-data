Track: Lunacy - Prelude
Duration: 1:33
URLs:
- https://nightslights.bandcamp.com/track/lunacy-prelude
Referenced Tracks:
- Wieczna Wiedza
Commentary: |-
    <i>leiirue:</i> (booklet commentary)

    An ominous prelude. I thought it’d fit as the area theme for the moon, which is why I made it at first. After making it though, I did see it as a fitting opening for the album. I think it sets the tone for the celestials quite nicely :]

    I had a lot of fun making it. I’m honestly super proud of the little harmony between the melodies at the end of the song! However, it was made when I was afraid to stray away from classical music, which isn’t necessarily a bad thing, just an interesting thing to note. It’s probably my favourite song in the album composition wise.

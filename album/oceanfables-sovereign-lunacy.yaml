Commentary: |-
    <i>Nights:</i> ([Bandcamp about blurb](https://nightslights.bandcamp.com/album/oceanfables-sovereign-lunacy) / [YouTube description](https://www.youtube.com/watch?v=-0zoPYHQ2nQ), excerpt)

    Oceanfables: Sovereign Lunacy is a solo album by [[artist:leiirue]], featuring 13 original tracks based on the characters and story of the webcomic Oceanfalls. The accompanying track artwork is also made by leiirue.

    Get the musician (leiirue's) commentary on the production of this album & its tracks [here](https://drive.google.com/file/d/1Z64ftPh43EAK3jDKGaW3dP6fYkIaVuyB/view).

    <i>leiirue:</i> (booklet commentary)

    Hi! I’m Leiirue, but you can call me Leii. I’m the artist behind “Sovereign Lunacy”.

    I honestly really enjoyed creating this album, even if I feel like I could’ve tweaked some of them more ^^; - but I hope you enjoy it nonetheless! It took me a while to make, reworking the songs and whatnot, but I’m fairly happy with the final result.

    This album started due to me thinking that the celestials should have more love and recognition, and what better way to do that than creating songs for them? I absolutely adore the writing [[artist:nights]] has done for them, even if we don’t have much information on them yet. I tried to be genuine to their personalities and made songs that I believe fit them.

    I decided to make commentary about the songs to better help people understand what I was trying to achieve with them! I might not explain things the best, so please bear with me. They won’t be too in-depth, but I hope that reading them will be enjoyable. :]
Crediting Sources: |-
    <i>Nights:</i> ([Bandcamp credits blurb](https://nightslights.bandcamp.com/album/oceanfables-sovereign-lunacy))

    Album, music and artwork by [[artist:leiirue]]

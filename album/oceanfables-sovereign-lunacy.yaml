Track: Zorn Gottes
Additional Names:
- Divine Wrath (English)
Duration: 2:01
URLs:
- https://nightslights.bandcamp.com/track/zorn-gottes
Commentary: |-
    <i>leiirue:</i> (commentary booklet)

    "<i>Divine Wrath</i>"

    <i>“An amiable, innovative king, whose gift is the Dewinger, a masterfully crafted tool of extraction.”</i>

    For some reason The Merciful seems very “holy” to me, it might be his design? I tried to give the song the feeling of sanctity, and the feeling of discomfort. There’s a lot of things off about him, such as his blood fixation (and the fact that he has body parts of other celestials). I made this song pretty experimental in terms of my music, and I’m pretty proud of how it turned out! I felt innovative making it, which I think fits him a lot.

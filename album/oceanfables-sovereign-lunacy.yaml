Commentary: |-
    <i>leiirue:</i> (booklet commentary)

    "<i>成長</i>"<i>, or “Growth”</i>
    
    <i>“<span style="color: #ccffcc">A crafty king and talented bladesmith, whose gift is the Grassblade</span>.”</i>

    I started the song off with woodwinds, since The Cunning created the Grassblade. Woodwinds remind me of plants for some reason. I wanted to give it a calm atmosphere at the start, and make it evolve after that, honestly just for fun! I just went with vibes somewhat for this one, and I think it turned out pretty good :)

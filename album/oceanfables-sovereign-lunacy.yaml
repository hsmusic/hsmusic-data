Commentary: |-
    <i>leiirue:</i> (commentary booklet)

    "<i>دبلأا عشجلاي</i>"<i>, or “Endless Greed”</i>

    <i>“<span style="color: #ffffcc">An indefatigable queen who was only recently crowned. The ruler of all rulers, who stands at the peak of the hierarchy of worlds, illuminated by the light of total dominance</span>.”</i>

    I actually used two motifs here! Both from songs that have yet to be released, however. I’m honestly not a huge fan of what I did for it, but I hope you enjoy it despite that. The tempo changes were very fun! I wanted to make it sound menacing yet have a sort of… “sweet” note to it? To be honest this is two motifs mashed together. HOWEVER, I did compose one of them so it’s not like I was lazy or anything!!

Name: Feedback & Suggestions
Directory: feedback
Content: |-
    <strong>Feature requests?<br>Noticed a data error?<br>Itching to see that one album you love on the wiki?</strong>

    Please let us know! We appreciate feedback a lot, and always want to bring improvements and additions to the wiki.

    There are three main channels through which you can reach the folk working on the wiki:

    - [[static:discord|HSMusic Community Discord Server]] - The official Discord, and a friendly place to drop feedback, discuss the wiki, or just hang out.

    - [[static:forum|HSMusic Forum]] - The official online forums, and a pretty similar space as the Discord server - only it's a forum!

    - Email - it's <code>nebula at hsmusic dot wiki</code>! A little less new-fashioned, but probably practical if you're sending a longer-form message or don't prefer to share in a chatty community space.

    Thanks so much for sharing your feedback!

    <hr>

    <b>Crediting &amp; privacy notice:</b>

    We always want to give credits for contributions, but we strongly value privacy and anonymity, too. When you send feedback, either through the public Discord, the forums. or email, we'll make sure to ask if you are okay with having your name shared in the [[static:changelog|public update changelog]], and if so, by what name you'd like to be credited.

    Additionally, when sending via email, we will generally share the content of your email in the Discord or on the forums (so the folk who are responsible for actually bringing your feedback to the website will see it!). We'll always strip/anonymize personal details (name, email address) before sharing.

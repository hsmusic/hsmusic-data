Name: About & Credits
Directory: about
Content: |-
    Welcome to HSMusic Wiki, a fan-made Homestuck music wiki!
    [Homestuck](https://www.homestuck.com/) has always been an incredible creative collaboration, and especially beloved by the community—not to mention a crucial part of that collaboration—is Homestuck's humongous soundtrack, comprising well over 500 diverse tracks by dozens of musicians and artists. This wiki aims to be an interesting and useful resource for anyone interested in that music, as well as an archive and up-to-date reference for all things related.

    On the history of this site: it was originally created as a remake of Homestuck's official [Bandcamp](https://homestuck.bandcamp.com/), which saw its content particularly restructured on 25 October 2019. HSMusic Wiki aimed to be a longer-lasting resource and reference: track art is archived for good, solo albums (and beyond!) are all catalogued in one place, and URLs will always stay consistent. Today the official Bandcamp is mostly restored to its original form, albums, artwork, URLs and all. This wiki's thrilled to see that; meanwhile, [[static:changelog|thanks to everyone]] who's contributed and helped along the way, we've become a hub way beyond what anyone could've expected. We bring together artist commentary from the decade and a half since, thorough track references, details on flashes, tagging for artworks, MIDIs and sheet music, and plenty more besides. We're proud of what we've made this place, together!

    Nowadays, HSMusic Wiki also operates as a center for all sorts of fan music, a starting point where avid listeners can explore, discover, and support artists and albums within the sphere around Homestuck music. We're always looking to share new music here, so if there's anything you'd like to see, please feel encouraged to [[static:feedback|drop a line]]! We also have an active [[static:discord|Discord community]] where a wide variety of folk discuss Homestuck music and work together to bring updates, new albums, and more to the HSMusic website - anyone is welcome to drop by, say hello, and help out!

    The code for this website is open source (MIT license), and can be explored or forked [on GitHub](https://github.com/hsmusic/hsmusic-wiki/). If you want to get in touch with feature requests, comments on the code, or pesky bugs which passed through unnoticed, feel free to open an issue or contact through [[static:discord|Discord]] or [[static:feedback|other means]]!

    <i>Contributor Credits</i>

    It's sort of impossible to credit everyone on one page. Or is it!? [[static:changelog|Please visit... the changelog!!]]

    The wiki is what it is, and is always becoming what it ever will be, thanks to everyone who's shared anything with it. At first that was mostly email and forum feedback pointing out fixes and smaller additions, and those still mean a really special kind of everything... but today the wiki is also directly built up, in its very data, by a bunch of longtime as well as occasional contributors. As wiki editors, they're everywhere across wiki commentary, if you keep an eye out; as contributors and awesome ordinary people, they're often active in the [[static:discord|community Discord server]]. We love welcoming and enabling help in whatever form folk want to offer it, so please stop by if you feel like waving hello!

    <i>Resource Credits</i>

    - [Homestuck's Bandcamp](https://homestuck.bandcamp.com/), the official host of Homestuck's music: We got almost all the official album listings and basic track info from here.
    - GiovanH's [complete track art archive](https://my.pcloud.com/publink/show?code=kZdJQ8kZNyIwh0Hn1ime6Ty7L2J87BE3E2ak): Early-on, thorough track art! A million thanks for putting this together and sharing this with us. At the very start, we used the [Web Archive](https://web.archive.org/web/20190720035022/https://homestuck.bandcamp.com/music) to gather track art, and nowadays we've recovered the files more
    - [NSND](https://homestuck.net/music/references.html): All the initial musical reference data! Thanks to NSND in combination with credits on the bandcamp, artists' own commentary, and loads of retrospective review by fans all around, this wiki is a rather comprehensive resource for motifs and other track references.
    - [bgreco.net (HQ Audio Flashes)](https://www.bgreco.net/hsflash.html): thumbnail captures for a bunch of the Flash animations from Homestuck itself! There were some captures missing that we took ourselves, but many Flash thumbnails are from here.
    - The [Homestuck and MSPA Music Wiki](https://homestuck-and-mspa-music.fandom.com/wiki/Homestuck_and_MSPA_Music_Wiki) on Fandom: the inspiration for this wiki! We've wanted to make a more complete and explorable wiki ever since seeing it. The Fandom wiki was also a very handy reference in putting this together, so much thanks to everyone who's worked on it!
    - [homestuck.com](https://www.homestuck.com/): Besides being the home of the webcomic this whole site is based around, the main wallpaper for the site is pulled from [More from Homestuck](https://web.archive.org/web/20250404212836/https://www.homestuck.com/info-more).
    - [carrd.co](https://carrd.co/): We stole your icons.svg file. It is ours now. :tobyfox_dog_sunglasses:
    - All organizers and contributors of the [Homestuck Vol. 5 Anthology](https://sollay-b.tumblr.com/post/188094230423/hello-a-couple-of-years-ago-allyssinian) - community-made track art for [[album:homestuck-vol-5]]! All of this art is <i>excellent</i>. Each track credits its respective cover artist.
    - Likewise for the [Beyond Canon Track Art Anthology](https://hsfanmusic.skaia.net/post/619761136023257089/unofficialmspafans-we-are-proud-to-announce-the) as well as [Alternia/Bound](https://alterniaart.tumblr.com/)!
    - [[static:feedback|All comments on the site]]: We appreciate all feedback immeasurably! People have shared a ton of ideas and suggestions, and we can't emphasize enough how incredible it is to share a project with like-minded folk interested in improving it with you.
    - [[static:changelog|Each of the countless contributions]], both from the awesome and dedicated community members of our Discord bringing album additions, reviewing existing data and content, localizing the site to languages beyond English, and more; and from everyone who has dropped an email or DM with feedback, lyrics, caught data errors, and the like: Thank you! HSMusic Wiki wouldn't be a fraction of what it is without everyone who has worked together to bring it here.

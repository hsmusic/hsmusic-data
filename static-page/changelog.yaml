        - thanks to [[artist:lilithtreasure|Lilith]] for adding [[album:the-strider-mixtape]] and [[album:the-nobles]], as well as [[album:puppeteer-beforus-single]], [[album:versus-hardmode-remix]], and the solo albums by [[artist:ducky-senpai]], plus initial work on [[album:stlap2]] and [[album:stlap3]]

    <h2 id="25-oct-2023" class="major-release"><html:a href="#25-oct-2023">[[date:25 October 2023]] - crystal hung in firmament's descent</a></h2>
    (news entry: [[news-entry:crystal-hung-in-firmaments-descent]])
    <h3>site changes</h3>
    - redesigned album commentary page to have a sticky sidebar for navigating tracks, as well as track artworks; check out [[album-commentary:lofam5a2]], [[album-commentary:beforus]] and [[album-commentary:homestuck-vol-10]] for some examples
    - added album covers to album gallery page (instead of just track covers), as well as a secondary navigation bar for jumping to gallery for the next or previous album in a group
    - added "stub" album gallery pages, for albums without any track art; you'll probably only come [[album-gallery:the-grubbles|across]] [[album-gallery:labyrinths-heart|these]] while navigating with nav links from another gallery
    - added flash act pages, showing a gallery of all the flashes exclusive to one flash! also reworked the sidebar to include these in a cleaner manner - one box with the current act and its flashes, second with all the acts on the site, further sectioned by "disc"
    - replaced the old "choose another group to filter by" link on group gallery pages (only!), as well as the "previous/next" links in the nav bar, with links in the secondary nav; this will only show up if the screen is too thin to fit the sidebar, and is accessible on both group gallery and info pages. clicking the category name (e.g. "Fan-musician groups") returns to the [[listing:groups/by-category]] listing, like before

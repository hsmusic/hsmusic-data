# Character entries

---
Tag: Brae Emit (SBARGv2)
Description: |-
  The ectobiological sister of Rise, originally created as a Heir of Time to serve as a backup, before Chronos bruteforce changed her aspect to Prince(ss) of Space.<br>
  Played by [[artist:kaylen]]
Color: "#f4e826"
---
Tag: Chronos (SBARGv2)
Description: |-
  "Ruh-Roh! It's the bad guy!"<br>
  Chronos is a proper world destroying, sprite killing, gate deleting, player killing villain. A goopy monster with the Mythological Role of 'Heir of TimeSpace' after achieving god tier in two sessions. Secretly a corrupted version of Rise from another timeline!
Color: "#898989"
Direct Descendant Tags:
- Fake Guardian Chronos (SBARGv2)
- Glitch Clone (SBARGv2)
---
Tag: Fake Guardian Chronos (SBARGv2)
Description: |-
  Before the End of Act 2 flash, Chronos was pretending to be the session's real First Guardian as he hacked it into working. Primarily using this position to coerce the players into doing his evil bidding, culminating in sacrificing several sprites for a sprite battery project before revealing himself.
Color: "#4ac925"
---
Tag: Flock Ornis (SBARGv2)
Description: |-
  The real First Guardian of SBARGv2, previously imprisoned by Chronos. Flock Ornis is a well-spoken anthro crane who took over the SBARGv2 blog starting in Act 3, helping the Players fix the session enough to kill Chronos and claim the Ultimate Reward.<br>
  Played by [[artist:kaylen]]
Color: "#4ac925"
---
Tag: Glitch Clone (SBARGv2)
Description: |-
  A clone of Chronos, completely distorted and glitched out by the Blue Hole.
Color: "#898989"
---
Tag: Rise Emit (SBARGv2)
Description: |-
  A Heir of Time, originally working as Chronos' apprentice to kill off the dreamselves of Players among other betrayals. However, they eventually made a heelturn and became a valued protagonist of the Session's main plotline.
Color: "#fa4343"
---
Tag: Samael (SBARGv2)
Description: |-
  "* It's you!"<br>
  Samael is a generic shell of a character, given a nickname by happenstance. When they appear in flashes or track art, you're intended to mentally replace them with yourself. A very Everyman-esque Player.
Color: "#898989"
---
Tag: EMMY (SBARGv2)
Description: |-
  A robotic bird with a friendly and silly AI personality, EMMY was created to assist Flock Ornis in fixing the session.<br>
  Played by [[artist:kaylen]]
Color: "#4ac925"
---
Tag: Benny (SBARGv2)
Description: |-
  Prospitan who wears a pumpkin on their head. Funniest thing I've ever seen.
Color: "#ffffff"
---
Tag: imagineBreaker (SBARGv2)
Description: |-
  Self-insert character of [Metreu](https://metreu.tumblr.com/), had the glitchy aspect of Null which could disable nearby Aspect energy.
Color: "#99d3e1"
---
Tag: shinyJiggly (SBARGv2)
Description: |-
  Self-insert character of [[artist:lavendersiren]], a nonbinary Prince of Time using prostheticLegKind.
Color: "#d48cd3"
---
Tag: doctorSpace (SBARGv2)
Description: |-
  Self-insert character... I don't know much about them. Space player, I assume.
Color: "#049f00"
---
Tag: slothfulLunchmeat (SBARGv2)
Description: |-
  Self-insert character of [Brienne](https://bsky.app/profile/kzinssiebroiler.bsky.social), was a Maid of Life.
Color: "#269e1e"
---
Tag: atomicEagle (SBARGv2)
Description: |-
  Self-insert character of a guy named Brad. Self-prototyped with an Eagle sprite, hence the wings.

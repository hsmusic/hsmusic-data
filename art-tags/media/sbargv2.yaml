# Extra Fictional Locations

Tag: The Hotel (SBARGv2)
Description: |-
  A hotel straddling the multiverse, where anyone could drop in and show up for a moment of wacky hijinks. Roleplaying here was a way to destress from the horrors of the Incipisphere for the Players.


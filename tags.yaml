    Not officially a character of her own, the Squiddles Girl, mysteriously manifest in the track art for [[track:ocean-stars-falling]], is [quite](https://forgottenhsfacts.tumblr.com/post/144839853814/who-is-on-the-cover-art-of-ocean-stars-falling-in) [the](https://www.reddit.com/r/homestuck/comments/162zqa1/track_art_for_ocean_stars_falling_who_is_this/) [enigma](https://www.youtube.com/watch?v=QmEZzp7o8i8&lc=UgzHTEp089uPbq7nMIh4AaABAg). What's present of her design lines up [[media:misc/magical-squiddles-girl.jpg|quite closely]] with one of the magical girls of [[flash:squiddlevid]], a flash that was bundled with the release of [[album:squiddles]] back in 2010. She may or may not be experiencing a [recent](https://www.tumblr.com/feengoid/721155997772791808/squiddle-girl-from-ocean-stars-falling) [resurgence](https://www.tumblr.com/spaghettidismay/723199915010965504/i-dont-really-like-how-it-turned-out-but-anywayyy).


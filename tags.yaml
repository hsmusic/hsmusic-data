# -------------------------------------
#  Character archetypes.
# -------------------------------------
#
#   Organization and sorting might be subject to change, here, but
#   so far we're grouping archetypes by species (of the "main" version
#   of that character), and sorting instances under an archetype roughly
#   by degree of "canonicity":
#
#   1. The single "main" instance from Homestuck
#   2. Alternate instances within Homestuck, unless specified below
#   3. Alternate instances from Homosuck
#   4. Alternate instances from the Epilogues and HS:BC
#   6. Instances specific to any given fanventure
#
#   The sorting within each of these sections is probably arbitrary,
#   at the moment.
#

---
Tag: Character archetypes

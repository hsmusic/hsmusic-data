# -------------------------------------
#  Characters from media.
# -------------------------------------
#
#  This section provides the basic structure for individual characters.
#  It DOES include specific lists of individual characters. These are
#  grouped by species. It DOES NOT include the entries for those
#  characters - it's only responsible for structuring them by media.
#  Refer to "individual character entries".
#
#  Top-level ordering here is alphabetical by media name only.
#  Each section is ordered as follows:
#
#  * The top-level "Characters from (media)" tag which provides
#    basic sectioning for everything beneath.
#  * Sectioning tags, sorted alphabetically, *no matter* their own
#    relationships to each other.
#  * "More characters from (media)", if applicable.
#
#  The top-level "Characters from (media)" tag sections according to
#  species, and should follow the top-to-bottom same order as "Species".
#  This is generally *not* alphabetical! If some characters don't have
#  a determinate species, place "More characters from (media)" at the
#  bottom of the "Characters from (media)" tag's descendants.
#
#  Top-level sectionining (immediately beneath "Characters from (media)")
#  is always by species, but may be arbitrarily subsectioned further.
#


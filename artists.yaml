  Field: Aliases
  Notes: |-
    **PinkFloydiac237:** Definitely. Referenced by two edits on the last.fm bio and then responsible *for* the two more recent edits.

    **JRMN117:** KyleSme edited Jack McMenamin's last.fm bio (introducing the reference to the "Bootleg" side-project), and there's a shout on KyleSme's page by JRMN117:

    > Hello hello, it's Jack. It's been like 3 years or something, which is way way way too long. How goes it?

    Then the latest previous comment from PinkFloydiac237 is in fact three years earlier, so it adds up. Also, JRMN117 joined last.fm on 4/13/2013 and left the comment on KyleSme's page on 4/14/2013, and JRMN work as real name initials.

    And to boot, sanctferum refers to Jack "JRMN117" McMenamin as the artist behind The Paradox Paradigm [on tumblr](https://sanctferum.tumblr.com/post/144522683302/not-terezi-pyrope-sanctferum), so.

Description: |-
    An ARG and roleplay group that forked off of the original SBARG after it ended. Still going today under new season names, although it has drifted more towards being multifandom than just Homestuck over the years.
    <hr class="split">
    SBARGv2 was an experience and a half.
    It was primarily centered around fighting through a horribly glitchy session to beat up a major villain named Chronos.
    Getting into its old lore is hard these days, as you pretty much have to just read through piles of ancient roleplay logs.
    The modern post-Homestuck Act 7 fanventure None Pizza With Left Beef should also give you decent information on the SBARGv2 characters appearing in it.
    Alternatively, you can join the group's Discord and ask for an infodump from [[artist:wertercatt|wertercatt]] or [[artist:lavendersiren|lavenderSiren]], which will probably yield better results.


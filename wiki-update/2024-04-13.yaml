Wiki Update: Let's Make This a Thing
News Entry: Let's Make This a Thing
Main Update: true
Date: April 13, 2024
---
Section: site changes
Changes: |-
    - completely new "additional names" feature, <html:a href="#additional-names-intro">see below</a>; present only on track pages, just initially, but easy to expand to other pages later; displays when page title heading clicked; automatically shared between rereleases
    - artist external links, previously inline icons, are now displayed in a "wiki tooltip", displaying when hovered with a pointer or when tapped; these show the platform icon as well as aliases/handles or domain names, where relevant ([[media:misc/changelog/artist-externals-old.png|old]], [[media:misc/changelog/artist-externals-new.png|new]])
    - redesign for appearance of commentary entries, more clearly marking beginning of each new entry, linking to the writing artist, and italicizing annotation rather than artist ([[media:misc/changelog/commentary-entry-old.png|old]], [[media:misc/changelog/commentary-entry-new.png|new]])
    - cover art is almost wholly redesigned, with many stylistic changes; artworks are now very slightly rounded, the background area in main cover arts is colored "deeper", art tags are redesigned and conjoined with the artwork box, and shadows, borders, and secondary effects are generally revisited and touched up ([[media:misc/changelog/cover-art-container-old.png|old]], [[media:misc/changelog/cover-art-container-new.png|new]])
    - artworks with content warnings (aka "reveals") are also redesigned, showing warning list more clearly, displaying a warning symbol instead of the abbreviation "cw:", and generally indicating its action more clearly before it's actually revealed (main art: [[media:misc/changelog/reveal-main-old.mp4|old]], [[media:misc/changelog/reveal-main-new.mp4|new]]; gallery: [[media:misc/changelog/reveal-gallery-old.mp4|old]], [[media:misc/changelog/reveal-gallery-new.mp4|new]])
    - adjustments and additions for album commentary page: shows listening links for tracks and album alike, which open in new tab, for background listening while reading; gets the same commentary entry design as info pages; generally has a wider layout with less padding, to fit wider lines and larger artworks while still giving a focused view; info line counts number of commentary entries, rather than number of tracks with commentary, and has more accurate word count; other minor aesthetic tweaks, e.g. album commentary entry reads album name instead of just "Album commentary", slight shadow / "raised" effect on artworks ([[media:misc/changelog/album-commentary-old.png|old]], [[media:misc/changelog/album-commentary-new.png|new]])
    - improvements for "also released as" list: more compact wording, always shows year of release, with tooltip including full date of release and relative time earlier or later than the current track ([[media:misc/changelog/rerelease-layout-old.png|old]], [[media:misc/changelog/rerelease-layout-new.png|new]]; [[media:misc/changelog/rerelease-layout-tooltip.png|tooltip]])
    - group info page now shows year of each album's release, with tooltip including full date of release ([[media:misc/changelog/group-info-years.png|example]]); and, in "from other group" info, always displays groups from a different top-level category than the current group, and will show multiple groups of the same category ([[media:misc/changelog/group-info-others1.png|example 1]], [[media:misc/changelog/group-info-others2.png|example 2]])
    - artist info page now shows commentary entry annotations in commentary list ([[media:misc/changelog/artist-info-commentary-old.png|old]], [[media:misc/changelog/artist-info-commentary-new.png|new]])
    - track info page now shows list of sampled tracks immediately beneath list of referenced tracks, instead of after list of tracks that reference ([[media:misc/track-sample-reference-layout-old.png|old]], [[media:misc/track-sample-reference-layout-new.png|new]])
    - album info page now displays zero durations, "_:__", with a faded-out appearance and tooltip ([[media:misc/changelog/album-info-zero-duration-old.png|old]], [[media:misc/changelog/album-info-zero-duration-new.png|new]]), and foregoes duration info altogether if every track in the album has zero duration ([[media:misc/changelog/album-info-nada-duration-old.png|old]], [[media:misc/changelog/album-info-nada-duration-new.png|new]])
    - art tag gallery page now shows illustrator info, just like album gallery
    - group infoboxes (and secondary nav) on album page now match sorting order of group gallery page, fixing navigation inconsistencies when multiple albums are released on the same day
    - improvements for "shorthand" names in artwork tag lists: previously shorthands would always be used (e.g. [[tag:meimona-oceanfalls|Meimona]] instead of [[tag:meimona-oceanfalls|Meimona (Oceanfalls)]]), now this is only the case when the shorthand name isn't ambiguous with another tag ([[media:misc/changelog/ambiguous-tags-old.png|old]], [[media:misc/changelog/ambiguous-tags-new.png|new]]); when a shorthand name is used, a wiki tooltip now presents the full name ([[media:misc/changelog/tag-tooltips.mp4|example]])
    - track lyrics are now inherited from original release, avoiding accidental variations
    - news entry page gets previous and next links at bottom, including date of the linked news entry as well as, in a tooltip, how much earlier or later it was posted compared to the current entry ([[media:misc/changelog/news-entry-previous-next.png|example]])
    - various improvements for layout responsiveness, especially when slightly adjusting browser window size: nav bar generally performs better word wrapping; on album pages, very long artist lists wrap earlier than track names ([[media:misc/changelog/album-track-responsiveness-old.png|old]], [[media:misc/changelog/album-track-responsiveness-new.png|new]])
    - added support for image content warnings in commentary (e.g. [[track:walls-covered-in-blood]] original artwork, [[track:light-burns-out-gestalt]] WIPs)
    - practically endless internal changes, both as groundworks for new and future features, and improvements for anyone working on data files locally
---
Section: bug fixes
Changes: |-
    - fixed rereleases being counted in artist per-group duration info ([[media:misc/changelog/artist-group-rerelease-duration-old.png|old]], [[media:misc/changelog/artist-group-rerelease-duration-new.png|new]])
    - removed tracks which aren't dated from artist chronology links, so most an artist's recently dated track doesn't have "next" link leading into dateless tracks ([[media:misc/changelog/chronology-before-dateless-old.png|old]], [[media:misc/changelog/chronology-before-dateless-new.png|new]])
    - fixed album YouTube video links displaying as "full album" when the album includes only a single track
    - fixed artists being credited as both "artist" and "contributor" on a track, with an annotation only on the latter, being mispresented as *only* contributing that part, by hiding annotation altogether ([[media:misc/changelog/artist-contrib-mispresentation-old.png|old]], [[media:misc/changelog/artist-contrib-mispresentation-new.png|new]])

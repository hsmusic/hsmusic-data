Wiki Update: recompose, refine
Main Update: true
Date: July 24, 2020
---
Section: new features
Changes: |-
    - two new albums archived, both from [Casual Sunday](https://casualsunday.bandcamp.com/) (a group of the artists behind countless homestuck tracks): [[album:shortcuts]] and [[album:p-s]]
    - added durations to every track, and rough total sums to album and artist pages
    - added keybindings (shift+N, shift+P, shift+R) for common navigation (respectively next, previous, random) on track, album, and flash pages
    - six new listings:
        - [[site:list/albums/by-duration/|Albums - by Duration]]
        - [[site:list/artists/by-duration/|Artists - by Duration]]
        - [[site:list/tracks/by-duration/|Tracks - by Duration]]
        - [[site:list/tracks/by-duration-in-album/|Tracks - by Duration (in Album)]]
        - [[site:list/tracks/in-flashes/by-album/|Tracks - in Flashes &amp; Games (by Album)]]
        - [[site:list/tracks/in-flashes/by-flash/|Tracks - in Flashes &amp; Games (by First Feature)]]
    - restructured the [[album:unreleased-tracks]] album to be broken into four reorganized sections

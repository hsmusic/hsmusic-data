Commentary: |-
    <i>Richard Gung:</i> ([Tumblr](https://web.archive.org/web/20120730134616/http://ink-redulous.tumblr.com/tagged/homestuck), 6/22/2012)

    Hi, I made this a million years ago. [[artist:michael-guy-bowman|Bowman]] has been a close friend for a long time, and we lived together at the time I was putting this together, so I asked him to whip something up for it real quick-like.

    The whole thing is based mostly in the spirit of old King of Fighters eyecatch intros, with this particular arrangement being most inspired by [KOF2003](https://www.youtube.com/watch?v=MwdVaAa5nI0). There’s a brief visual reference to Guilty Gear in there as well.

    And yeah, as silence says (I’ve quoted everyone below), the project fell apart in a rather expected manner. However, as a gift, everyone can have the Street Strifer theme for free, right [here](http://www.notenoughink.com/agifttoyou/Sburban%20Strifer%201.1.mp3).

    > <i>homestucksonyoutube:</i><br>
    > and now for something that<br>
    > is ridiculously awesome

    > <i>kingoftheforest:</i><br>
    > WHOA

    > <i>attemptedirony:</i><br>
    > oh hey forum things forum things are GREAT

    > <i>[[artist:lizawithazed|lizawithazed]]:</i><br>
    > Fun fact: Bowman himself did the [[Sburban Jungle]] variant in this, and this is the only place you can find it currently.

    > <i>[[artist:catboss|konec0]]:</i><br>
    > OHHHHHHHHHH SHIT.

    > <i>[[artist:eston-schweickart|siasinsilence]]:</i><br>
    > Hahaha, I remember this<br>
    > Fun fact, I was on the team for this project before it fell apart<br>
    > Good times

    <i>Quasar Nebula:</i> (wiki editor, 3/28/2026)

    Date for the flash here (4/7/2010—it's old!) is via [the original upload](https://web.archive.org/web/20150116125801/https://www.youtube.com/watch?v=elyQSvC0IAA). It sounds about right for when the project and trailer would've been in production. The description links to the above Tumblr commentary, so it was definitely edited in later, apparently replacing the original description, if one was present.

    <b>Chumi:</b> Of course, these are references to the Eridan vs Kanaya fight. When drawing Tavros, I was looking up a lot of javelin-throwing pictures and thinking “Man this kid must be strong as hell to throw a lance one-handed” LMAO.

    <b>Kim:</b> Tavros is actually the strongest beta troll right behind Equius (this is a lie).

    <b>Andi:</b> This scene really hits right for me and feels totally like Vriska to do this. I think Chumi did amazing capturing the simplicity of the nostalgic part of the style and also Tavro’s lancing pose. It’s got a nice line of action!

    <b>Floral:</b> The shapes Chumi uses in this silhouette are so chef kiss!! I just love how they read right after the other, the motion is so clear.

    <figure>
    <img src="media/misc/hsbc-666/dead.png" width="450">
    </figure>

    <b>Chumi:</b> This CG is an edit of Vriska dying on LOMAP before going God Tier. Her expression was changed so she’s smiling because this “skewering-before-falling-off-a-cliff’ was her plan all along! Too bad it didn't work out as she hoped.

    <b>James:</b> I didn’t ask you to make her smile, you did that on your own and it worked out great.

    <b>Kim:</b> The smile is actually such a funny and interesting addition to this because at this point of time you can see how self-assured she is about this Whole Deal when she couldn’t be more far off LOL. It’s like Aradiabot said... you’re not here for “redemption,” Vriska, you’re here to grow up!!!

    <b>Andi:</b> think making her smile triumphantly is the right move. When she does things her way, of course it's going to feel right to her. But in this case, she literally made things last ten times longer than it needed to be. She’s going to have to learn her lessons for as long as it takes.

    <b>Kim:</b> And this brings us onto part TWO!!!! (Or is this technically Chapter 1 since the first bit is technically the Prologue? Whatever, ANYWAY–)


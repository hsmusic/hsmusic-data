Commentary: |-
    <i>Chumi, James Roach, isaac joey, ozmodai, HONE, Sollay, Miles:</i> ([Patreon: "02-2025 [S] 8r8k Flash Commentary"](https://www.patreon.com/homestuck/posts/02-2025-s-8r8k-123286519), 3/1/2025)

    <b>[[artist:chumi|Chumi]], <i>[S]: Make the audience 8r8k 100 more times</i>:</b> Hello and welcome to the commentary! It’s been a few months hasn’t it? Well get ready, cause we have a few months worth of work to talk about as we dissect the flash! Because there is just so much to talk about, flash commentary will be split over two months. Additionally, we’ll be combining the artist and writer commentary for the flash into one Mega Commentary. It was brought up that it makes more sense to talk about story beats when readers can see the shots at the same time.

    Not only do we have our writers here, but we have some guest artists as well! Please feel free to introduce yourselves!

    <b>[[artist:james-roach|James]], <i>Director</i>:</b> Hello, I’ll be adding some story commentary where applicable.

    <b>[[artist:isaac-joey|Isaac]], <i>excited to be here</i>:</b> :D !!! I was invited to help with several assets for the flash, and I could not be more excited to be here!!!

    <b>[[artist:ozmodai|Ozzy:]]</b> Hi, hello! I usually am preoccupied with fantrolls more often than not, but it was an honor getting to help with the art on such a meaty (or sweet for Candy?) flash!

    <b>[[artist:hone|Hone:]]</b> HONE(ほね)です。よろしくお願いします！

    <b>[[artist:spicyyeti|Spicyyeti:]]</b> hi ← compositor

    <b>[[artist:sollay|Soleil:]]</b> Hello! I was here to deliver some “ancestors” and I couldn’t have been more excited!

    <b>[[artist:andi-r|Andi]], <i>still cursed and hexxed</i>:</b> HI! It’s been a pleasure to work with ya’ll and I’m happy to have contributed to this crazy, ambitious flash!

    <b>[[artist:haven-daniels-taylor|Haven:]]</b> WOOOOOOOO!!!!!!!! It’s finally done!!!!!

    <b>[[artist:kim-quach|Kim]], <i>Art Director (normal mode)</i>:</b> And what an absolute powerhouse team of people, honestly. As the Art Director, let me just say it was such an absolute joy to get to collab with more awesome and talented artists from this fandom for this flash, and–of course–not to mention the fact everyone did such an amazing job as well! I feel like I always say that every time we drop a commentary, but I can’t help it when it’s just true....!!

    Each artist had a pretty even and sizeable share of parts too, so I think everyone really got a chance to shine. 👁 We’ll get to see a little insight on who did what in this commentary here too, heheh.

    Also, BIIIIG shoutout to Floral for boarding this entire flash. When we saw the first animatic of it, we were all immediately blown away.... Floral just Understands The Assignment. It’s a pretty dense flash with a fast-paced song too, but I think we were able to reach a pretty decent medium with it!

    [Let’s take a look at the rough animatic shall we?](https://www.patreon.com/homestuck/posts/s-8r8k-rough-123014140)

    <b>Kim:</b> Honestly, even in its rough stage it’s still a pretty enjoyable watch. LOL

    <b>[[artist:floralmarsupial|Floral:]]</b> Aw thanks Kim! I learned a lot during the process of this animatic, including learning After Effects and Animate. Essentially this process went from an ideas stage that all the writers and team was a part of, then we picked the song before I touched thumbing.

    We played with a couple different ideas but in the end we went with the [[Aggrievocation]] since it had a pretty constant, rapid beat that helped sell the overwhelming chaos of the battlefield. Starting out, I was asked to make sure this flash didn’t reach over 2 minutes which...with all these ideas did NOT happen. But I’m very grateful to the team for sticking through with this longer flash, for a war that didn’t get much spotlight I think we gave it a nice farewell. True to war, everything happens at once and hits like a brick fucking wall.

    These flashes from here on out can only get better as we perfect the pipeline, and I’ve been making notes on how to tweak and evolve my boarding skills. I have a great respect for this style of limited animation and I’m so excited for everything that’s coming next!!

    <b>Sollay:</b> I loved the animatic, I immediately knew it was going to turn out great. Exciting!

    <b>Kim:</b> Before we went into the actual production phase, I wanted to show off the color key we prepared for this flash. I mentioned it in a previous artist’s commentary, but it is *very* important *when* the events of this flash and the next following updates (!!!) will occur.

    Here’s part one of the color keys that will be relevant for this commentary!


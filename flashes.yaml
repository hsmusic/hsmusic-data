    <b>Kim:</b> Everyone so small... They are like bugs....

    We’ve sprinkled them throughout the past few updates, but what finally gets a big feature in this flash are the funny crab tanks that the troll rebellion utilizes.

    <figure>
    <img src="media/misc/hsbc-716/crab1.png" width="475">

    <b>James:</b> If it is unclear what Jake is doing here, he is coating the meteor in Hope. Before Jake had always used his Hope powers in a distinctly passive, almost accidental and reactionary way. While that is still somewhat the case here, he is showing much more control and purpose in his application of them. His powers have fully matured, allowing him to be more direct in his usage of the aspect.


    </figure>

    <b>Haven:</b> I drew most of the flash assets for [S] Ly’lac: Look. It was my second time working so closely with Floral on an update like this since the intermission and we were like a well inked machine. It was very fun honestly, excited to work on more flashes later, simple ones (and some not so simple.) Also, isn’t Vrissy’s Derse purple hair streak sick? When we got that in there I was like Hell Yes........

    <figure>

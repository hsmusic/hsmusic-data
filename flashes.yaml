    <figcaption>Horrorterrors by [[artist:floralmarsupial]]</figcaption>
    </figure>

    <b>Floral:</b> I also helped make the final horrorterror! I ended up just splicing a bunch of different little creatures into here, since I didn’t want to over think a design, especially with the tentacles which should feel immense and fluid. I thought it was funny everyone kept saying it was a frog but the eyes are actually from a Tarsier.

    <b>Chumi:</b> The color-version looks crazy...

    <b>Kim:</b> I’m a BIG fan of these FRS horrorterror originals. It really delves into the body horror spookiness a lil’ bit more with the mishmash of species and the human limbs... It’s horrorterrors, we gotta get FREAKY.

    <img src="media/misc/hsbc-666/aradiahand2.png" width="450">
    </figure>

    <b>Andi:</b> This drawing was especially sentimental for me to draw. [[flash:2578|Make Her Pay]] feels so sooooo far away, yet Vriska finds herself in this position again, with her fated frenemy. This holds the essence of when Aradiabot socked her in the face, but instead of violence, she holds out her hand to escort Vriska to the next phase.

    <b>Floral:</b> Amazing!

    <figure>
    <img src="media/misc/hsbc-666/aradiagrab.gif" width="425">
    </figure>

    <b>Andi:</b> Funnily enough, this staging actually wasn’t intentional when I first drew it in the sketch phase. It was a coincidence that it was so reminiscent of this scene. But still, I think sometimes we artists have a visual library we can pull from and I think I was subconsciously remembering this as I was drawing it. I fully leaned into it once the drawing was almost finished. I think it’s a very poetic visual. These are Vriska’s core memories and I think reliving them the way she has to is very important.

    <b>Kim:</b> I’m honestly so glad you leaned into the visual callback of it... Taking this moment that was once (of many) a brutal moment of Vriska’s life, but this time it is now a moment of kindness... an extending open hand instead of a tightened fist. IT’S POETIC!! IT’S BEAUTIFUL!!!

    <figure>
    <img src="media/misc/hsbc-666/questcoon.png" width="450">
    </figure>

    <b>Floral:</b> Enter the questcoon! I was trying to not be too precious with this background since I could the structure of it would drive me fucking crazy if I did. So instead I picked a picture of a domed amphitheater and layered rock textures on top of each other over and over again to get something that felt naturally chaotic.

    <figure>
    <img src="media/misc/hsbc-666/godtier.jpg" width="450">
    <img src="media/misc/hsbc-666/godtier2.png" width="450">
    <img src="media/misc/hsbc-666/godtier3.png" width="450">
    </figure>

    <b>Chumi:</b> Gettin’ a lil’ emotion just looking at these CGs again. It’s a really tender moment.

    <b>Andi:</b> Floral coordinated this scene for this in text and I followed through with this. This also re-uses some parts of previous old HS1 panels. I wanted to emphasize the weight of this scene and how extremely sentimental and emotional this situation is for her by having Tavros and Aradia lie her down gently on the slab that was probably the most physically traumatic place to bleed to death in the past. A bit of grace while Vriska truly understands her actions. Just a phenomenal moving scene, written by Floral.

    <b>Kim:</b> I love the gentleness of this scene... Every time I look at these CGs and especially seeing it all together in the game itself makes me tear up every time. This is such a subtle acting detail but the way Aradia even gently helps Vriska lay her head down... something as small as Aradia not wanting Vriska to hurt her head on the rock flooring because she CARES!!! AUGH!!!!

    <b>Floral:</b> Andi once again absolutely delivered with these CGs and completely sold the scene from the gentle warmth coming off the rocks and all the facial expressions and EVERYTHING.


    <i>Sburbmon Team:</i> ([official Tumblr](https://sburbmon.tumblr.com/faq), excerpt)

    Sburbmon is a hack of Pokémon FireRed that changes the Pokémon into Homestuck characters, among other things like map and music changes.

    You play as Hussie, journeying to obtain Badges by battling Denizens, alongside your rival, Ryan North.

    This isn't just a reskin! All Sburbmon have unique typings, movesets, and evolution lines, and numerous story events have been changed to form a unique Homestuck experience.


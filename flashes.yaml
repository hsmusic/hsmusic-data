Commentary: |-
    <i>Furthest Ring Studios:</i> ([Twitter](https://x.com/furthest0studio/status/1988354441251352865))

    The music in this one, a delightfully ominous track called Purple, is by the amazing [[artist:memodemo|@MEMODEMO]] ! You can also find his work here: https://www.memodemo.zip

    The horrorterrors in this flash were beautifully depicted by [[artist:fai|@TheFaiao]] ! Thank you so much!

    <i>Haven Daniels-Taylor, floralmarsupial, Miles:</i> ([Patreon: "12-2025 Writer Commentary"](https://www.patreon.com/homestuck/posts/12-2025-writer-147135961), 1/1/2026)

    <figure>
    <img src="media/misc/hsbc-922/shot1.png" width="400">
    <img src="media/misc/hsbc-922/shot2.png" width="400">
    <img src="media/misc/hsbc-922/shot3.jpg" width="400">
    <img src="media/misc/hsbc-922/shot4.png" width="400">
    </figure>

    <b>[[artist:haven-daniels-taylor|HAVEN:]]</b> Ly’lac looks and sees a myriad of lovely things. In front of her eyes is Vrissy (The omegas have arrived! Or were they already here?), Some delightful Outer Gods, and a single sheltered bubble. The horn appears behind her, and she doesn’t have the chance to turn and face it’s owner.

    <b>[[artist:floralmarsupial|Floral:]]</b> [S] Ly’lac: Look was boarded and drawn by Haven and it was a flash we were all pretty excited, in a way it signified the end of the “Deltritus Planet Introduction” by crossing the threshold into the game. It also tested our new workflow for small flashes like this, which exclusively includes animate now.

    <b>[[artist:miles|MILES:]]</b> This one’s a mysterious doozy, isn’t it?  It introduces a few key details worth getting into, the first and most obviously shocking one being the presence of Vrissy on Ly’lac’s Derse.  The implications are astounding.  Amongst other things, it seems to confirm the fact that the Omega kids are going to be joining in on the Delta session, and is the first appearance of any of the Omegas at all since Vriska whisked them away at the end of Act 1.  I wonder what’s happened to them since then?  How are they here?  We’ll keep you guessing for now.

    <b>MILES:</b> There’s also the ominous presence of Horrorterrors to consider, out in the far reaches of the Furthest Ring where they belong.  Apparently, Lord English didn’t manage to get ‘em all!  They murmur rather incomprehensibly (although Ly’lac later reveals that she can make out at least some of their whispering) and one nestles around a mysterious glowing bauble.

    <b>MILES:</b> Finally, Ly’lac’s night terrors are punctuated by the looming presence of a spire and an almost... equine murmur.  What could that mean?  Then she wakes up in front of THE HORN, which probably doesn’t have all that much to do with the aforementioned spire.  Why would it?  Synchronicity between the circumstances of your dreamself and your awakeyself is kind of a tired bit.  We probably won’t use it.

    <i>Haven Daniels-Taylor, Kim Quach, floralmarsupial, Chumi:</i> ([Patreon: "12-2025 Artist Commentary"](https://www.patreon.com/homestuck/posts/12-2025-artist-147134872), 1/1/2026)

    <figure>
    <img src="media/misc/hsbc-922/storyboard1.png" width="365">
    <img src="media/misc/hsbc-922/storyboard2.png" width="328">
    <img src="media/misc/hsbc-922/storyboard3.png" width="225">
    <img src="media/misc/hsbc-922/storyboard4.png" width="332">
    <img src="media/misc/hsbc-922/storyboard5.png" width="332">
    <img src="media/misc/hsbc-922/storyboard6.png" width="332">
    <img src="media/misc/hsbc-922/storyboard7.png" width="332">
    <img src="media/misc/hsbc-922/storyboard8.png" width="332">
    <figcaption>Storyboard by [[artist:haven-daniels-taylor]]:</figcaption>
    </figure>

    <b>[[artist:haven-daniels-taylor|Haven:]]</b> This is the first flash I boarded by myself! It was really crazy to see it all come together. Initially it was just going to be static panels but I begged and pleaded with everyone to let it be a flash. Begging/Pleading = “Wouldn’t this section be really cool as a flash? I just think it’d be so dope if this part was a flash guys...” everyone: yeah we agree.

    <b>[[artist:kim-quach|Kim:]]</b> We can’t help but love swaggin’ out... It’s fun making our comic, okay!!!

    <b>[[artist:floralmarsupial|Floral:]]</b> I was the compositor for this flash and it took me overall 5 days to fully put together! It was a lot of fun, and while I was the secondary compositor for the 8r8k flash as well, and between the two I tried a slightly different workflow. One of the nice things about animate is you can just place .psd files, and the layers can be imported directly on the stage meaning minimum placement. Every time I work in Animate I feel a little bit more confident and I can’t wait to make even more flashes!


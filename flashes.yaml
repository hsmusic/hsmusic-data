Flash: '[S] JadeTok.'
Directory: hsbc-1002
Date: January 9, 2026
URLs:
- https://beyondcanon.com/story/1002
Contributors:
- MEMODEMO (music)
- floralmarsupial (art, pitch, thumbs, compositing)
- Chumi (art, outfit concepts)
- Haven Daniels-Taylor (art, outfit concepts)
- Andi R. (art, outfit concepts)
- fruitegg (art)
- Kim Quach (art, outfit concepts)
Featured Tracks:
- JadeTok
Commentary: |-
    <i>Chumi, floralmarsupial, Kim Quach, Haven Daniels-Taylor, Andi R., fruitegg:</i> ([Patreon: "02-2026 Artist Commentary"](https://www.patreon.com/homestuck/posts/02-2026-artist-151926226-151926135), 3/1/2026)

    <b>[[artist:chumi|Chumi]], <i>Jadetok!!! Jadetok!!</i>:</b> Hello and welcome to the commentary! This is gonna be a long one, because we’re talking about [S] Jadetok!!!! 👏👏👏👏 We were really excited for this one!

    <b>[[artist:floralmarsupial|Floral]], <i>That Bitch</i>:</b> Yippee! We’ve had this flash in the outline for so long it felt unreal to actually have people see it. I pitched, thumbed and composited the flash! Jade literally has my blood, sweat and tears staining her beautiful hands but I’d do it all over again for her in a heartbeat.

    <b>[[artist:kim-quach|Kim]], <i>Mister Fujoshi</i>:</b> It’s also been a hot sec since we’ve seen what the Meat crew has been up to! I keep laughing when I remember we haven’t seen Meat Dave since the pre-reboot.

    <b>[[artist:chumi|Chumi]]:</b> Let’s talk about outfits! We’ve already covered Jade, Karkat, and Callie in previous updates, but everyone on the Meat ship gets a brand spanking new outfit!

    <b>[[artist:haven-daniels-taylor|Haven]], <i>Mr Foods</i>:</b> oh my god its finally outfit time lord i’ve been waiting for this so long

    <figure class="two-columns">
    <img src="media/misc/hsbc-1002/kanaya1.png" width="250">
    <img src="media/misc/hsbc-1002/kanaya2.png" width="250">
    <figcaption>Kanaya’s Mourning Outfit Alternate by [[artist:haven-daniels-taylor]]</figcaption>
    </figure>

    <b>Haven:</b> This is super old, I’ve wanted to update her look for years now. These were some early explorations on keeping the mourning look but making her a bit more stylish. However, this was before we’d done more character work past what had already been established in HS^2 and thus we decided on going in a much more radical direction.

    <b>Kim:</b> We stopped to consider, is she still going to be wearing her mourning veil outfit as the crew are all approaching to face off with Dirk? Hmm...

    A good first step that helped guide us into the right direction was considering: What is Kanaya’s current mindset right now? And how would that reflect in her outfit? With her current look, she’s clearly hurting. Though, as the ship arrives closer to their destination at Deltritus, how does that shift? Of course, she doesn’t stop mourning her wife, but as everyone is preparing to confront Dirk we envisioned that Kanaya would be feeling more... righteous determination. She’s ready to get serious and get shit done to save her wife! No more moping around!

    <b>Chumi:</b> Time for an action outfit....

    <figure>
    <img src="media/misc/hsbc-1002/kanaya3.png" width="400">
    <figcaption>Kanaya Outfit Concepts by [[artist:andi-r]]</figcaption>
    </figure>

    <b>[[artist:andi-r|Andi:]]</b> This was my first concept I threw into the pile. I wasn’t really sure what I was going for, I think I just wanted to put her in something I thought was sophisticated, pretty and mature? But eh, there was more to do from here.

    <figure>
    <img src="media/misc/hsbc-1002/kanaya4.png" width="400">
    <figcaption>Kanaya Outfit Concepts by [[artist:andi-r]]</figcaption>
    </figure>

    <b>Andi:</b> Tbh I also kinda liked this one. I was very invested in 60s groovy fashion at this point in time. I look at a lot of old fashion photography and these were shapes I’m always drawn to. Color and piece wise, I didn’t really know exactly what I wanted to do with them though, which is why there's parts of this that feel a bit meh and uncooked to me.

    <b>Haven:</b> These were so cute. I was a big fan of everyone's designs with white pants.

    <b>Floral:</b> Oh how I adore the booblah. Nobody ever allows Kanaya to have booblah.

    <figure>
    <img src="media/misc/hsbc-1002/kanaya5.png" width="400">
    <figcaption>Kanaya Outfit Concepts by [[artist:andi-r]]</figcaption>
    </figure>

    <b>Andi:</b> I was just doing whatever. Don’t even mind this. LMFDGDAFGDFGFGADFFH I was starting to feel kinda stuck, it ended up looking more disco than what I actually wanted. I find it a little funny though considering the other’s outfits are kinda in parallel to it. This just isn’t Kanaya.

    <figure>
    <img src="media/misc/hsbc-1002/kanaya6.png" width="400">
    <figcaption>Kanaya Outfit Concepts by [[artist:andi-r]]</figcaption>
    </figure>

    <b>Andi:</b> More of this 60s high fashion, kinda vampiric look. I think this one was pretty nice. I don’t have much else to comment on, I really wanted flared pants somehow. But it was also looking a little Snowman. I think Kanaya needed a little more of her own thang.

    <b>Haven:</b> Loved this one too, very <i>Breakfast at Tiffany’s</i>.

    <b>Chumi:</b> SHE’S SO CLASSY IT LOOKS SO GOOD ON HER!!

    <b>Floral:</b> THIS SILHOUETTE WAS EVERYTHINGGGGGG!!!! Andi truly put it into our minds what level of drama we could reach here.

    <figure class="two-columns">
    <img src="media/misc/hsbc-1002/kanaya7.png" width="180">
    <img src="media/misc/hsbc-1002/kanaya8.png" width="328">
    <figcaption>Kanaya Outfit Concepts by [[artist:chumi]]</figcaption>
    </figure>

    <b>Chumi:</b> My take definitely leans toward “elegant but casual everyday wear”. I’m still a bit fond of the look, but it wasn’t exactly the tone we wanted to hit. Casual is nice, but once again... action outfit!

    <b>Floral:</b> These fits were so cute waaaah.

    <figure>
    <img src="media/misc/hsbc-1002/kanaya9.png" width="400">
    <figcaption>Kanaya Outfit Concept by [[artist:kim-quach]]</figcaption>
    </figure>

    <b>Kim:</b> While we were trying to brainstorm new outfits for Kanaya, we were also struck with the idea of why not throwback to some of Kanaya’s underappreciated dresses? We were having a conversation about how this previous dress of hers was so baller, but so unfortunate we didn’t get to see more of it in the original comic! But then we realized... why not bring it back and remix it...?!

    <b>Floral:</b> Oh how I adore a good throwback.

    <b>Chumi:</b> Dare I say... I love it...

    <b>Haven:</b> I saw this one and I was like “Oh. We can go there?”

    <figure>
    <img src="media/misc/hsbc-1002/kanaya10.png" width="500">
    <figcaption>Kanaya Outfit Concepts by [[artist:floralmarsupial]]</figcaption>
    </figure>

    <b>Floral:</b> All of my suggestions for the new Kanaya outfit! I was honestly really proud of all of these variants and a part of me absolutely would want them to use them in some kind of illustration at some point. The jumping off point for the red jacket was the Van Hellsing anime, I was always a big fan of her Clown Hunting red dress too and wanted to invoke a similar vibe since her feelings have shifted to a more focused rage towards Dirk.

    <figure>
    <img src="media/misc/hsbc-1002/vanhellsing.png" width="400">
    </figure>

    <b>Floral:</b> The last two are more based off what Chumi and Haven were pitching with slight revisions.

    <b>Andi:</b> THERE WERE SO MANY OF THESE THAT I WAS LIKE, DAMN I WANT THEM ALL... the second middle was really really hitting for me. I really loved the shape language Floral put down for these.

    <b>Kim:</b> I’m also a huge fan of the second middle one. She has such a mystery to her... We just love dressing up the characters, it’s always so hard to pick just the one.

    <figure>
    <img src="media/misc/hsbc-1002/kanaya11.png" width="400">
    <figcaption>Kanaya Outfit Concepts by [[artist:haven-daniels-taylor]]</figcaption>
    </figure>

    <b>Haven:</b> This was my first idea I had during our pre-jadetok dev period. I was pulling a bit from Kim’s ideas and I wanted something that seemed comfortable and adult. Harkening back a bit to the drapes adorning her hive as a child.

    <b>Floral:</b> I loved Luna Moth so much I had to include her into the flash somehow, so I made it her pajamas during the Little Prince sleepover. It’s based on one of my favorite outfits for her so it was a must.

    <figure>
    <img src="media/misc/hsbc-1002/kanaya12.png" width="575">
    <figcaption>Kanaya Outfit Concepts by [[artist:haven-daniels-taylor]]</figcaption>
    </figure>

    <b>Haven:</b> After I finished the *Luna Moth* design I heard a voice say  “okay, but she came here to slay right?” to which I responded with this look.

    <b>Andi:</b> THESE WERE ALL BANGING. I loved every iteration here. This was very Kanaya to me.

    <b>Kim:</b> We put it all to a vote, and Haven’s CUTTHROAT Kanaya outfit won!!

    <b>Floral:</b> It really did feel so right from the moment he pitched it.

    <b>Chumi:</b> This outfit was an instant hit with all of us tbh.

    <figure>
    <img src="media/misc/hsbc-1002/kanaya13.png" width="400">
    <figcaption>Final Kanaya Outfit Design drawn by [[artist:kim-quach]], Designed by [[artist:haven-daniels-taylor]]</figcaption>
    </figure>

    <b>Kim:</b> The last step was drawing it in the house style and cleaning up the design that would help it feel more streamlined and fitting within the Homestuck universe!

    <b>Floral:</b> Sooooooo pretty.

    <b>Andi:</b> YUP. THAT’S OUR NAYA. I love Chicnaya.

    <b>Chumi:</b> I loved that the middle black-and-white part is reminiscent of an old outfit. Also I notice that we kinda love the long colored belts.

    <b>Kim:</b> It’s quite Homestuck-esque ain’t it? Kanaya’s Eridan cape ribbon, Rose’s classic grimdark dress... Who doesn’t love a good sash?

    <figure>
    <img src="media/misc/hsbc-1002/dave.png" width="525">
    <figcaption>Dave Outfit Concepts by [[artist:haven-daniels-taylor]]</figcaption>
    </figure>

    <b>Haven:</b> Back during Addendum 1 I drew up dave A2 and everyone was like “yep. Thats our new dave” but somehow that original drawing was lost. No one has it and no one knows where it went but we all remember seeing it. So during our jadetok dev I just drew it up again and then added the B-side designs as a secondary. They were an instant hit.


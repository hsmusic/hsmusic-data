    <b>Andi:</b> And now..... DAVEPETA!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

    <figure>
    <img src="media/misc/hsbc-666/davepeta.png" width="525">
    </figure>

    <b>Chumi:</b> Davepeta... We are winning!!!

    <b>Andi:</b> I remember when we were beginning assignments for the sprites, I immediately volunteered to do Davepeta. They’re one of my favorite sprites and I was very grateful they let me.

    <b>Floral:</b> Makes me go uuuwaaaaaaa at the roleplaying and cutesy ones in particular.

    <b>Kim:</b> We couldn’t have asked a better person to do the Davepeta sprites... literally SO cute. Big fan of the >3< sprite. Nya nya... Maybe <i>Homestuck</i> can afford to be a little moe.

    <b>Andi:</b> It was really fun to try to capture their mannerisms as stoicism isn’t the only defining trait here anymore! (Considering most people see Davepeta as Davesprite with a sprinkle of Nepeta.) But no! Nepeta is just as much in the front as Davesprite is! I wanted to show more of Nepetas' quirks here, her cute expressions and charms. Especially her role playing habits seeping through unapologetically.

    Also, man, I was worried about how Davepetas wings would manage to fit in the scene but I think it's okay if they're a little obscured. Most people went ahead and ripped them and saw it all anyway. Thanks for enjoying the sprites guys! It did make me happy to see our hard work paid off!! You may see a few new unique sprites or two coming soon. Look out for it :3

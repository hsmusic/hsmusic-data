    <b>Chumi:</b> A rare pair! It’s nice to see Jane and Kanaya in relative vicinity of each other after what went down in Candy. Note the subtle 108... The colors... Hmmm...

    <figure class="two-columns">
    <img src="media/misc/hsbc-1002/shot11a.png" width="250">
    <img src="media/misc/hsbc-1002/shot11b.png" width="220">
    <figcaption>Sketch by [[artist:floralmarsupial]]<br>
    Art by [[artist:floralmarsupial]] and [[artist:chumi]]</figcaption>
    </figure>

    <b>Floral:</b> The juxtaposition between the thumb and the finished product is so fucking funny. Super grateful to Chumi for helping me in a clutch and finishing off the details regarding the gun and the table and the davekat background.

    Speaking of which, what's that on Dave? Is his back scratched up? Are they preexisting scars? Or might that be his hairy damn belly?

    It’s hair. Hairy!Dave 2026 BAAABBYYYYYYYYYYYYYYYYYYYYYY!

    <b>Chumi:</b> The way things escalated so much in the final drawing LMAO.

    <figure>
    <img src="media/misc/hsbc-1002/shot12a.png" width="250">
    <figcaption>Sketch by [[artist:haven-daniels-taylor]]</figcaption>
    </figure>

    <b>Haven:</b> Dave’s anger level rising.

    <figure>
    <img src="media/misc/hsbc-1002/shot12b.png" width="220">
    <figcaption>Art by [[artist:fruitegg]] and [[artist:chumi]]</figcaption>
    </figure>

    <b>Chumi:</b> I didn’t notice until someone on the team pointed this out, but it looks like Jake is pulling up the blanket on Karkat’s leg. IT WAS NOT INTENTIONAL BUT IT IS FUNNY!!! I just wanted him to be caressing Karkat’s thigh gently!!! Dave is NOT happy.... He’s mad his boyfriend is so popular and universally adored.

    <b>Floral:</b> It begins.

    <figure class="two-columns">
    <img src="media/misc/hsbc-1002/shot13a.png" width="250">
    <img src="media/misc/hsbc-1002/shot13b.png" width="250">
    <figcaption>Sketches by [[artist:floralmarsupial]]</figcaption>
    </figure>

    <b>Floral:</b> Smiles. The way this drawing haunted me until I finally figured out how to make it click. I love them your honor. And if you look closely Karkat is wearing a different outfit, because i loved seeing him with shorts.

    <figure class="two-columns">
    <img src="media/misc/hsbc-1002/shot14a.png" width="250">
    <img src="media/misc/hsbc-1002/shot14b.png" width="220">
    <figcaption>Sketch by [[artist:floralmarsupial]]<br>
    Art by [[artist:chumi]]</figcaption>
    </figure>

    <b>Chumi:</b> My magnum opus.... My favorite panel.... I was so happy to be able to make this panel real. I have nothin’ else to say. MY GIRL IS HAPPY AND ROCKING IT OUT... Life is worth living after all...! Also Dave is there, hiding behind the curtain because this ain’t about him.

    <figure>
    <img src="media/misc/hsbc-1002/shot15a.png" width="250">
    <figcaption>Sketch by [[artist:floralmarsupial]]</figcaption>
    </figure>

    <figure>
    <img src="media/misc/hsbc-1002/shot15b.png" width="220">
    <img src="media/misc/hsbc-1002/shot15c.png" width="220">
    <figcaption>Art by [[artist:chumi]]</figcaption>
    </figure>

    <b>Chumi:</b> AND ANOTHER ONE! Dave and Jade’s relationship was one of my favorites in Homestuck proper, and I feel like they’ve been put through the wringer recently HAHA. It’s just nice for them to have an awkward, but nice moment together after everything that’s happened. They haven’t forgotten that they’re the best of friends :’)

    <figure>
    <img src="media/misc/hsbc-1002/shot16a.png" width="260">
    <figcaption>Sketch by [[artist:floralmarsupial]]</figcaption>
    </figure>

    <b>Floral:</b> We were making thumbnails on the spot for this scene and this is what I threw down.

    <figure class="two-columns">
    <img src="media/misc/hsbc-1002/shot16b.png" width="235">
    <img src="media/misc/hsbc-1002/shot16c.png" width="220">
    <figcaption>Sketch and Art by [[artist:kim-quach]]</figcaption>
    </figure>

    <b>Kim:</b> My one and only contribution to the Jadetok flash! Just a bunch of pals having fun, nothing ominous or looming happening here...!

    <b>Chumi:</b> Girl I see you.

    <b>Haven:</b> We just kept putting them back in the fucking room with the blow up chair.

    <figure class="two-columns">
    <img src="media/misc/hsbc-1002/shot17a.png" width="240">
    <img src="media/misc/hsbc-1002/shot17b.png" width="240">
    <figcaption>Sketch by [[artist:floralmarsupial]]</figcaption>
    </figure>

    <b>Haven:</b> I didn’t have to put this sketch in the commentary, but I wanted you to see it.

    <b>Floral:</b> fdsjakfhsajfas sometimes I truly am thumbing out some complete bullshit. Haven showed this to me and I think I said, “Who did that?”

    <figure>
    <img src="media/misc/hsbc-1002/shot18a.png" width="320">
    <img src="media/misc/hsbc-1002/shot18b.png" width="320">
    <img src="media/misc/hsbc-1002/shot18c.png" width="320">
    <img src="media/misc/hsbc-1002/shot18d.png" width="320">
    <img src="media/misc/hsbc-1002/shot18e.png" width="320">
    <img src="media/misc/hsbc-1002/shot18f.png" width="320">
    <img src="media/misc/hsbc-1002/shot18g.png" width="320">
    <img src="media/misc/hsbc-1002/shot18h.png" width="320">
    <img src="media/misc/hsbc-1002/shot18i.png" width="320">
    <img src="media/misc/hsbc-1002/shot18j.png" width="320">
    <img src="media/misc/hsbc-1002/shot18k.png" width="320">
    <img src="media/misc/hsbc-1002/shot18l.png" width="320">
    <img src="media/misc/hsbc-1002/shot18m.png" width="320">
    <img src="media/misc/hsbc-1002/shot18n.png" width="320">
    <img src="media/misc/hsbc-1002/shot18o.png" width="320">
    <figcaption>Animation Frames by [[artist:chumi]] and [[artist:andi-r]]</figcaption>
    </figure>

    <b>Andi:</b> I offered to do the lucky star animation, it was gonna take some rotoscoping and it was a bit of a drag but it came out so funny. I wasn’t able to make it to the halfway mark due to life stuff interfering with work so I asked Chumi for help. HELP CHUMI HELP! And she did such a great job filling in the later gap. Especially for having to do it in an emergency! Chumi you are truly the muscle of this team.

    <b>Chumi:</b> I love my team... I do it all for the love of the game and the people. Though... The dance animation... I’m not gonna lie... I was scared at first... Most of my animation experience (which is very little to begin with) is in Homestuck style... which is like 2 frames on repeat. But, I did my best with the rotoscoping, and things ended up turning out great! Though now I understand, animation is a pain.

    <b>Kim:</b> The dance really was the perfect cherry on the top for this flash nailing the concerningly over saccharine feeling that flash was increasingly building up to. The music working perfectly in tandem with what we needed as we get further and further into Jadetok, it gets increasingly faster and chaotic. If you haven’t seen it yet, you should watch [the behind the scenes on the music made for this flash](https://www.youtube.com/watch?v=MLlw92nfwlY) made by MEMODEMO!

    Even if Jadetok had some ominous undertones to it, it was so sweet getting to see everyone have a nice time hanging out together though. Especially for some character combinations we haven’t really gotten to see interact with each other that much!

    I hope Jadetok was an entertaining and intriguing experience for everyone as we build into the next step of our story... See you in the next commentary!


    <i>Miles, floralmarsupial, Haven Daniels-Taylor:</i> ([Patreon: "02-2026 Writer Commentary"](https://www.patreon.com/homestuck/posts/02-2026-writer-151926135), 3/1/2026)

    <b>[[artist:miles|MILES:]]</b> Jadetok was Floral’s suggestion, I believe; we thought people might be getting a bit restless with our lovely Delta kids and begin wondering what was happening to the OG characters, but in addition to the utility of that this was a sequence we wanted to do for a while.  There’s maybe not all that much left worth getting into on the Meat Ship, considering the years and years of buildup put into it, but revisiting these characters and their shenanigans and vibes and general circumstances, especially considering the aforementioned freshly revealed presence of Jane and Jake, felt pretty necessary to get into one last time.  A way to catch up with them, while we prep their landing strip.

    <b>[[artist:floralmarsupial|FLORAL]], <i>that biatch</i>:</b>  I’m late... I’m running in ... I’m out of breath but I’m here...

    But yes, I said a good bit about the thought process of pitching Jadetok in the Artist Commentary already but I am very glad the team was receptive to this very fun but high effort update. There was a lot of talk about establishing the Delta kids firmly before we started expanding to the full scope of the meat timeline. We didn’t want to linger on these guys.... just...yet. No internal world, no single update or huge all-cast pesterlog, but something engaging. Something to make us all smile.

    <figure>
    <img src="media/misc/hsbc-1002/shot3b.png" width="250">
    </figure>

    <b>Floral:</b> Roxy and Jade’s mutual interest in science actually being mentioned?

    <b>MILES:</b> Wonder what this is for...

    <figure>
    <img src="media/misc/hsbc-1002/shot4b.png" width="250">
    </figure>

    <b>MILES:</b> Here’s a shot from early on during Jane’s meteor tenure.  Understandably, a few of our gang were less than enthused to bring her along, and the people of Earth C were definitely a little startled to have their president elect spirited away.  Luckily they were able to reconcile their differences offscreen with little to no complications, and Earth C doesn’t really matter right now.  They’ll be fine, Swifer’s got it or whatever.

    <b>Floral:</b> Karkat’s giant middle finger is so funny to me.

    <b>[[artist:haven-daniels-taylor|HAVEN:]]</b> I relate to Jade in this moment. What would I do without my Janey?

    <figure>
    <img src="media/misc/hsbc-1002/shot5b.png" width="250">
    </figure>

    <b>Floral:</b> It’s just really painful isn’t it? But this was one of the first things I envisioned for this section because it’s just so fun and goofy! I think while it made sense that the general tone of the meat crew was a little dour with the looming arrival, this showed there is still joy when you seek it out and have fun.

    <b>MILES:</b> They’re fucking crazy style in there.  I’ve seen a lot of speculation on the physics of what’s going on in here and all answers are valid but they’re fucking.

    <b>Floral:</b> The Fuckening Begins.

    <figure>
    <img src="media/misc/hsbc-1002/shot6b.png" width="250">
    </figure>

    <b>MILES:</b> This was a big deal for us; Roxy desperately needed to boss up and get a fit off.  Totally understandable for him to go through his baby hoodie period or whatever while he played around with beginning to present masc, but that outfit had to go, and what better way to mark the passage of time than seeing him climb that flexeladder and come into his own, finding his unique style.  Look how happy everyone is to see it.  I’m with you, Kanaya, this shit brings a tear to my eye.

    <b>HAVEN:</b> Real Roxy is back.

    <figure>
    <img src="media/misc/hsbc-1002/shot7c.png" width="250">
    </figure>

    <b>MILES:</b> Another fuck yes outfit level up. This one might be my personal favorite, I love Jake’s incredible 70’s vibe. To be honest, I love all the outfit changes we’ve managed thus far, my team are geniuses.

    <b>Floral:</b> Guys I feel like something bad is gonna happen to Karkat.

    <figure>
    <img src="media/misc/hsbc-1002/shot9d.png" width="250">
    </figure>

    <b>Floral:</b> Little Prince Pajama Time. It healed my heart to see them all gathered around, camped out. It also features one of my favorite things to do with characters, which is accentuating how one thing that could mean a lot to one character can totally turn off another.

    Jade is just outright refusing the choices made in the story, which I like because it shows what she values.

    <figure>
    <img src="media/misc/hsbc-1002/shot11b.png" width="250">
    <img src="media/misc/hsbc-1002/shot11c.png" width="250">
    </figure>

    <b>HAVEN:</b> Oh Jake, he’s so quirky! So violent and erratic and unpredictable these days!

    <b>MILES:</b> Speaking of Jake, let’s hop around through these pics a bit out of order to take a look at him.  While we’ve seen a little of Jane, and got a nice glimpse into her lovely dream, there’s not much we can get out of Jake to figure out what’s up with him that isn’t in these snippets off of Jadetok.  There’s a volatility and intensity to Jake that’s a bit escalated, here, in tandem with his newfound swagger.  How’s he been holding up after opening his heart up to Dirk so emotionally only to be shut down with such brutal precision?  What’s he thinking?

    <b>Floral:</b> The last we saw him he was so morose, and that made sense! So you have to wonder what happened between then and now to get him like this...?

    I penciled both of these panels and it was such a joy to draw Meat!Jake, I genuinely love Jake and I love the versions of him that are so unrestrained.

    <figure>
    <img src="media/misc/hsbc-1002/shot12b.png" width="250">
    </figure>

    <figure>
    <img src="media/misc/hsbc-1002/shot13c.png" width="250">
    </figure>

    <b>MILES:</b> Luckily he’s been having a lot of beautiful playtime with Karkat and the gang.  After getting so emotionally eviscerated it’s nice to see him with lots of enrichment.  Karkat heals all wounds.

    <b>Floral:</b> Dave’s face on the other hand definitely suggests he’s not quite on the same page as the rest of them.

    <b>HAVEN:</b> He’s holding his breath trying to die.

    <figure>
    <img src="media/misc/hsbc-1002/shot15b.png" width="250">
    </figure>

    <b>Floral:</b> I feel like this is a moment people have been waiting for since Jade woke up, especially with the context of their Candy marriage weighing so heavily on their friendship in the readers minds.

    The fact it happens off screen is just a wee bit tongue and cheek ain’t it?

    <b>HAVEN:</b>  Just a wee bit.

    <figure>
    <img src="media/misc/hsbc-1002/shot16d.png" width="250">
    </figure>

    <b>Floral:</b> Don’t you love it when everything is so nice and awesome and nothing feels off or wrong?

    <b>MILES:</b> We get a few interloper swipes towards the end of Jadetok, as the music accelerates a bit more frantically.  Things get a bit contested... we actually stayed up pretty late the night before Jadetok came out making some little tweaks during this segment.

    <b>HAVEN:</b> Is there anything odd about watching your best friends? &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; latest posts?

    <figure>
    <img src="media/misc/hsbc-1002/shot19.png" width="400">
    </figure>

    <b>MILES:</b> Hey, what did she mean by this?

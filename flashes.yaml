    <b>Ozzy:</b> Shoutout to Karkat for dying [that one time](https://www.homestuck.com/008231) and giving me the perfect expression to throw onto this troll soldier.

    <b>James:</b> The sequence that happens here has been sort of a long time coming, at least for me personally. I am always wanting to show more of what classpects can do. Aspect, I feel sort of speaks for itself a lot of the time. Life as an aspect is pretty easy, and the Thief class seems to be pretty straightforward. So how can we use this creatively?

    I tend to think of the Classes as not having a set of “Moves” and “Abilities.” We get into this a little bit in the Dave and Aradia conversation. They merely function as a way of interacting with the aspect. So as a thief “stealing” life seems like a no-brainer in a battle, but then what can she do with that? Stealing the life of an enemy and giving it to someone else to revive them was one thing, maybe using the life force to bolster your troops was another. We came up with a whole handful of cool things she could do, but I wonder... what are the broader implications of that? She seems to be very practiced at this. Hm!


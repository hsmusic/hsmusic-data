    <b>Spicyyeti:</b> i plan to release the guide publicly the next time i finish a flash using the swf-replacement method that i ACTUALLY DID FINISH DEVELOPING FOR THIS PROJECT, I JUST DIDNT HAVE TIME TO CONVERT THE WHOLE THING BEFORE IT CAME OUT KAGLSKDAJF. kohi put me onto an adobe animate extension called pixianimate. its kind of abandoned, but basically what it can do is export your animation to webgl which has

    - pixel-perfect quality
    - good performance, equal to swfs

    so pixianimate has that over adobe animate’s built-in export to html5 feature that uses createJS (also abandoned). BUT with the built in feature you can export with

    - javascript (interactive features)
    - sound

    i had to program custom features and basically build all that shit back in when i exported with pixi. but i found it to be worth it, because AA’s export to html5 has significantly worse performance than swfs. and what we wanna do here is create a product either equal or better to what was done with flash-player in the beforetimes. next time...the flash wont be an mp4. I Can Tell You That Much.

    <b>Miles:</b> Yay!!!!!!!!!!!!!!!!!!!!!!!!!

    <br>
    <b>Kim:</b> PHEW that was quite the hearty commentary wasn’t it, fellas? Look forward to the next one cos there’s definitely so much to cover for the upcoming update! (Honestly, when isn’t there?) Thanks for reading, as always!

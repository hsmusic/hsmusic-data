Commentary: |-
    <i>Miles, James Roach:</i> ([Patreon: "07-2024 Writer Commentary"](https://www.patreon.com/posts/07-2024-writer-109375638), 8/3/2024)

    <b>[[artist:miles|MILES:]]</b> Starting, of course, with ANOTHER [S] PAGE THAT DROPPED AT THE BEGINNING OF JULY!!!!!!! AHHHHHH!!!!!!!  This was the final third of what, internally, was referred to as Update 10 (which contains everything from John and Vriska arriving at the meteor to Vriska meeting up with Davepeta in her hive).  If we’re being fully honest, we forgot to pop this final third into last month’s Patreon commentary, LOL.  So I’ll cover it here.

    It’s been so, so cool to see the multimedia aspect of Homestuck kick way the fuck back into gear.  We get one crazy flash of the OUTSIDE of an esoteric singularity realm, now we get one of the INSIDE?  Are you kidding me?  Never let it be said that we don’t spoil you.

    <figure>
    <img src="media/misc/hsbc-656/horses.png" width="450">
    </figure>

    <b>MILES:</b> Here, Vriska finds herself in a locale that is all-too-familiar, yet eerily different.  This bit actually WAS conceived as an [S] page from the getgo, as we really wanted to sell the mysterious, haunting nature of this transition, and James and Kim did a fantastic job with the sight and soundscapes.  I love the wistful, spacious vibe of it all.  I also knew for sure that if we were going to find ourselves in yet another purgatorial, Silent Hill-type situation, those enigmatic Homestuck Horses were going to need to show up again, in all their spectral majesty.  Horses, as you and Vriska well know, are extremely important staples of Homestuckian metaphysics.  Something deep is afoot here.  Or ahoof, I guess.

    <b>[[artist:james-roach|JAMES:]]</b> Miles this may please you to know, but everyone was like “wheres equius’s house?

    <i>Kim Quach:</i> ([Patreon: "06-2024 Artist Commentary"](https://www.patreon.com/posts/06-2024-artist-107993576), 7/12/2024)

    <b>[[artist:kim-quach|Kim:]]</b> AND NOW... It is onto the next flash animation! This one’s actually pretty short since there’s not as many moving parts compared to the last one. Since this one’s a bit more standard, I was able to put together a rough animatic for this one. That way, I can pass the rough animatic down to James, our musician, so he could figure out the audio timing.

    <figure>
    <img src="media/misc/hsbc-656/animatic.gif" width="450">
    </figure>

    <b>Kim:</b> Ya like seeing the temporary assets I used for this? LOL

    <figure>
    <img src="media/misc/hsbc-656/eyes.gif" width="450">
    </figure>

    <b>Kim:</b> I don’t usually do this kind of animation that often where it requires a lot more puppeteering, and splitting up parts to animate as separate assets.. Puppeteering I still consider a new type of animation (even though it’s not by now; I know, I know–!) I was trained in traditional paper animation and hand-drawn digital animation, but I’m fascinated by getting to know how new animation methods work (like Live2D, After Effects, and Adobe Animate) and using this as an opportunity to train myself in them!

    <figure>
    <img src="media/misc/hsbc-656/fullbody.png" width="450">
    </figure>

    <b>Kim:</b> Kim: This shot of Vriska actually has a whole fullbody hiding in the bleed–! I wanted to lowkey reference this panel and type of Hero Mode style below for this shot in particular, since the poses were quite similar, hehe.

    <figure>
    <img src="media/misc/hsbc-656/reference.gif" width="425">
    </figure>

    <figure>
    <img src="media/misc/hsbc-656/zoomout.png" width="450">
    </figure>

    <b>Kim:</b> After watching the final version of the flash, does looking behind the curtains of it feel like forbidden information to you guys?

    Also, what’s particularly interesting about this shot is that we’ve never actually seen the surrounding area around Vriska’s hive depicted before. 🤔 It almost feels cursed seeing it from this view... Something else seems to be missing too, hmmmm...!!!

    Bonus: If you stayed and watched ‘til the end of the flash........ I applaud you. That’s it. LOL

    Last but not least, HUGE props and thanks to our technical staff, Kohi, for helping composite and put together these multimedia panels on the website. These animated sound pages wouldn’t be possible without Kohi’s help and expertise!

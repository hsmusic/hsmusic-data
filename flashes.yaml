    <b>Chumi:</b> The very first shot... Like in so many other flashes, we get a closeup on a character’s eye. Frankly I didn’t notice the swirl of the iris around the pupil until I was staring right at the picture.

    <b>Kim:</b> I don’t think John ever got one of these iconic eye super close-ups in the base comic either, so this one’s actually a first for him! We had to do a bit of movie magic peeling one of the Striders’ pupils close-up from a previous flash and utilizing [other funny eye close-up panels](https://www.homestuck.com/007233) for John’s eye color. I’m a huge stickler for consistency LMAO.


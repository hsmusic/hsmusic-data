    <b>Kim:</b> What I thought was endearing was how the rebellion persisted to keep up their troll culture, their funky bug technology! In some of the earlier updates, you can even see how others were still utilizing troll-esque bug technology even on Earth C. We were thinking maybe the tanks should be a bit more bug-esque, but I think having it a *bit* more evolved into crab tanks felt more thematically relevant; Meenah’s aquatic themes and Karkat’s crab.

    I’m a big fan of what I’ve been calling the KING KRAB tank. It’s supposed to be the BIG tank the generals, Meenah and Karkat, pilot around during the war. Of course, with a lil’ touch of Karkat’s iconic HOMES SMELL YA LATER. There’s something endearing to think about that he’s still found of this funny little sickle he had ever since he was 6 sweeps (13 years) old.

    <b>Chumi:</b> I mentioned in a [previous commentary](https://www.patreon.com/homestuck/posts/06-2024-artist-107993576) that the initial draft of the crab tanks was just a regular ass tank with bug legs attached to it LMAOO. It was very shitty and I’m so happy we had time to sit down and make these look epic.


Flash: '[S] Peruse Librarium.'
Directory: hsbc-888
Date: October 8, 2025
URLs:
- https://beyondcanon.com/story/888
Contributors:
- Miles (music)
- floralmarsupial (art)
Featured Tracks:
- UNIMPEACHABLE
Commentary: |-
    <i>Miles, floralmarsupial:</i> (Patreon: ["11-2025 Writer Commentary"](https://www.patreon.com/homestuck/posts/11-2025-writer-144917418), 12/2/2025)

    <b>[[artist:miles|MILES:]]</b> Swiss’ Librarium section was really fun, for a number of reasons.  First of all, I got to do the music for it, so I wrote a song I called UNIMPEACHABLE.  Getting to join the Homestuck music canon was so sick, and if you can believe it I actually started learning to produce music JUST for HS:BC.  I spent a decent amount of time learning FL Studio (which I still always call Fruity Loops despite never having used it until this year) and I obviously still have a long way to go, because the song is pretty rough, but I was really, really proud of how it came out; Mr. President from the HS Official Discord actually helped me do some of the mixing on the song to get it sounding a little cleaner, which I appreciated as a newbie.  I saw someone on the HS Official Discord ask if Toby Fox did the music for this section, and that’s probably the single best compliment any song I ever make in my entire life is going to get.  Whoever said that, I remember.  It meant a lot to me.

    <b>MILES:</b> I wanted to sort of emphasize Swiss’ affect of coolness with a slick, jazzy theme, and I had some shamisen plucks in there to emphasize the East Asian influences in Satyr society.  I’ve definitely come to think of saxophone as Swiss’ Signature Instrument, whereas shamisen is more of a satyrwide instrument, and the main sax-melody (which I still like A LOT) in this song as Swiss’ leitmotif, so I hope someday we can see that woven into future songs as the HS:BC musical canon evolves to take on a life of its own in that same self-referential way that Homestuck songs tend to be.  Having done one song, it really makes me wanna do a billion more, but I want to get a whole slew of other people into Homestuck first!  Maybe I can noodle a few more out for some future albums... :J

    <b>MILES:</b> ANYWAY, the Librarium flash was ALSO fun because we got to do so much more infodumping about Swiss and his thoughts on satyr society!  We learn about Grand Prancellors, a little bit about the contentious history of back and forth wars between nymphs and satyrs, ancient slaughters, another mention of a mysterious satyr/nymph duo who rocked the ancient world with their schemes, the nature of satyr democracy, their love of rap, a whole bunch of awesome stuff!  I feel like it gives a really fun little slice of Swiss’ thoughts and interests.  The reaction to this was also pretty funny, because I saw a LOT of assumptions about satyr society from this page, and as time went on I think it became more clear to people that some of the more contentious beliefs here come off the way they do because of Swiss’ own young thoughts and narrative voice but I still wanted to touch on it briefly here, something that fell by the wayside here is that satyrs and nymphs have been at peace with one another for some time now!  They keep to themselves, though.

    <b>[[artist:floralmarsupial|FLORAL:]]</b> For two species that were meant to battle to extinction, Rose and Dirk didn’t think hard enough about separating them by land and sea. Turns out it’s actually pretty easy to ignore each other and focus on their own societies.  At least once they got out a couple thousand years of warring and almost endings of the world out of the way.

    <i>floralmarsupial:</i> ([Patreon: "11-2025 Artist Commentary"](https://www.patreon.com/homestuck/posts/11-2025-artist-144912758), 12/2/2025)

    <figure class="four-columns">
    <img src="media/misc/hsbc-888/book1.png" width="135">
    <img src="media/misc/hsbc-888/book2.png" width="135">
    <img src="media/misc/hsbc-888/book3.png" width="135">
    <img src="media/misc/hsbc-888/book4.png" width="135">
    <img src="media/misc/hsbc-888/book5.png" width="135">
    <img src="media/misc/hsbc-888/book6.png" width="135">
    <img src="media/misc/hsbc-888/book7.png" width="135">
    <img src="media/misc/hsbc-888/book8.png" width="135">
    <figcaption>Covers by [[artist:floralmarsupial]]</figcaption>
    </figure>

    <b>[[artist:floralmarsupial|Floral:]]</b> I did 8 of the 10 book covers for the flash and it was so much fun photobashing everything! I tried to give every cover its own distinct look and though I’m not a graphic designer I was happy with how these aligned with other books I had seen. Again these are also supposed to be expensive looking books, first editions.

    I also tried to have as much fun with these as possible. Influence Sheeple is actually a splicing of gay porn vhs and dvd covers. I also tried to get more of an apparent Japanese influence within the culture by mixing with ukiyo-e paintings. I was also trying to include pieces from the Renaissance that was specifically Flemish (Rise and Fall) along with Medieval Woodcuts (Grey Rain.)

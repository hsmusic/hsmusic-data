    <b>James:</b> In the background (unpictured) of this scene, we see Jade enlarging the heads of the soldiers to the point where it becomes so heavy it snaps their necks. Space is a very straightforward aspect, dealing with the literal size, location and scale of things. This can be interpreted in a lot of ways, both mechanically and narratively but in terms of combat we wanted to think of some of the horrifying things you could do with that. It was important we showed what happens when you push what are effectively gods into a corner. These are figures of LORE on Earth-C that just showed up one day and are living in apartments in the city. For example, imagine if Athena turned out to be real and was just living in New York, then one day a civil war broke out and she picked a side. And so did like, Odin and Anubis who also turned out to be real and as a normal guy you just had to watch them duke it out.

    There needed to be a reason it never came to this before now. Jade could just make someone explode by growing their Skeleton and nothing else, or she could teleport them into the sun, no-clip them halfway into each other or just compress and condense them into a tiny cube. Imagine you watched that happen, and then a blue aura surrounded them and they were back to normal, minus the thousand yard stare that came with the memories of that happening to them. We conveyed it in a funny way with the bobble-heads but everything that is happening here is terrifying.


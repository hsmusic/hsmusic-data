Commentary: |-
    <i>Miles, James Roach:</i> ([Patreon: "06-2024 Writer Commentary"](https://www.patreon.com/posts/06-2024-writer-108028072), 9/13/2024)

    <b>[[artist:miles|MILES:]]</b> THE [S] PAGE!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

    God it felt good to get this out.  We may have mentioned this somewhere, but originally, this was just going to be a series of (still very cool) gifs.  But when we saw it all together, we thought “fuck it, let’s go for broke”.  We wanted to measure our abilities, as it were, and [[artist:kim-quach|Kim]] blew this shit out of the water yet again.

    I could say so much more, but everyone probably wants me to shut up.  So I will.  I will shut up, for one topic, and then I will immediately start talking again.  Other writers, take it away!

    <b>[[artist:james-roach|JAMES:]]</b> No you basically said it all there. The track uses a handful of other hyper-relevant themes. I want to say it was on purpose. I talked about some of the choices in other places, but for these short little cutscene style [S] pages I thought it would be cool to do some sound effects. Homestuck doesn’t have many. This was an issue that came up during hiveswap production all those years ago. We tried to do it homestuck style and for short ones like this it kind of just doesn’t work. Maybe we can find a balance.

    Also nobody ever tells you how inconvenient it is to type brackets all the time I’m going back to calling them flashes.

    <i>Kim Quach, Chumi:</i> ([Patreon: "06-2024 Artist Commentary"](https://www.patreon.com/posts/06-2024-artist-107993576), 7/12/2024)

    <b>[[artist:kim-quach|Kim:]]</b> The last thing we see of her until we see her get zucked into The Point.... R.I.P. Vriska you will be missed..... jk she’s fine (probably), but let’s get to talking about the animation!

    As some of you may have already heard, this particular page wasn’t initially going to be a whole sound page. Actually, the writer of this particular update, [[artist:miles]], said he originally envisioned this would be a short gif LOL. But the more I worked on boarding this particular sequence, the fancier it got. It felt appropriate that it’d be a little Epic and Mysterious. “What does this machine do?! What happened to Vriska?! What’s happening?!?!?” Need to build up that tension!

    <figure>
    <img src="media/misc/hsbc-653/storyboard.png" width="450">
    </figure>

    <b>Kim:</b> I approached boarding this sequence like I would with any traditional storyboard for animation! Noting all the actions, the number of shots, the camera movements, etc. Usually I would make a rough animatic before I’d start animating, but considering this sequence utilized a mix of both After Effects and traditional hand-drawn animation– I put this together a bit more unorthodox.

    I did consider for a hot second hand animating the first four shots (like the sliding assets and the warping), because AE can kind of be hell to fiddle around with. But y’know what I realized. It was more hell to hand animate it LOL.

    What I HAD to hand-animate, though, was the actual Vriska warp as she’s flying into the portal, the sand in the timer, and the fire. If I hadn’t, any preset I could find only seemed odd looking...

    <figure>
    <img src="media/misc/hsbc-653/ae.png" width="450">
    </figure>

    <b>Kim:</b> If it’s of any interest to y’all, fun fact, most of the assets and hand-animated sequences were done in Clip Studio Paint. Here’s a peek of how it looks behind the curtain! While I can’t speak for Andrew’s animation process– I think what may be an interesting tidbit for people outside of the animation field, usually in animation there’s a lot of extra bleed room outside of the camera! Some secret little things and details you don’t see in the final animation itself... 👁

    Just kidding, there’s usually nothing exciting in there, (cos it’s always meant to be cut out anyway) but the extra bleed serves as fail-safe in case things need to be adjusted around or resized. Cool to know there’s a little more to it though, right?

    Looking at this screencap, not gonna lie, my file organization for this sequence is a little insane but I Made It Work LOL.

    <figure>
    <img src="media/misc/hsbc-653/vriska-warp.gif" width="450">
    </figure>

    <b>[[artist:chumi|Chumi:]]</b> AHHH

    <b>Kim:</b> Here’s the Vriska warp isolated without all the crazy camera transitions and whatnot. It happens a little fast though, doesn’t it? It’s okay, it’s supposed to happen very quickly, but you may have missed the funny little warped Vriska faces that briefly show just before she disappears LOL. Here’s the warp slowed down for your convenient observation. :-)

    <figure>
    <img src="media/misc/hsbc-653/vriska-warp-slow.gif" width="450">
    </figure>

    <b>Kim:</b> “Wait a minute, wasn’t it a wider shot when Vriska was warped into the Point?” Good observation theoretical asker! I did a sneaky little camera trick actually! When the camera zooms outward, it happens very quickly that I swap the background out for the wide shot.

    <figure>
    <img src="media/misc/hsbc-653/zoom.gif" width="450">
    </figure>

    <b>Kim:</b> It happens so seamlessly you don’t even notice it, right? Here it is again at 20% speed. 👀

    <figure>
    <img src="media/misc/hsbc-653/zoom-slow.gif" width="450">
    </figure>

    <b>Kim:</b> Call that Movie Magic, babey....!!!!

    <figure>
    <img src="media/misc/hsbc-653/rough.gif" width="450">
    </figure>

    <b>Kim:</b> This is the only rough animation I still have for this whole sequence LOL. I’m still pretty proud of this shot tbh! The camera working upwards revealing the activating flame, the hourglass clicking into place, the focus shift onto “what will this timer do?” then the PSYCHE! mwah love it.

    Also, this entire shot was animated in CSP! When I first started animating in CSP, I always figured the animation function was pretty rudimentary, but when I found out you could do camera movements and sliding assets WITHIN the program..... It was a game changer.

    Making animations for Homestuck really is a dream come true! I’ll be getting back to you guys more on the next animation in the next part of this update, heheh.

    <b>Chumi:</b> Kim is the goat. Kim is the goat!!!

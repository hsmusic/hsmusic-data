    <b>Kim:</b> The bit of pixel dithering on the metal was such a nice touch for these sprites too (chef’s kiss) MAGNIFICO.

    <b>Floral:</b> Actually gasped when I saw these for the first time like SHEEEESH so good.

    <figure>

    Now, you may have been wondering, “what the haell is all the hubbub with this ‘HELL TIER’ nonsense I keep hearing about?” You can actually thank that one for being another Andrew Hussie original! If you’re a hardcore Beyond Canon fan, some of you may remember that it was mentioned Andrew had two mandates for Homestuck’s sequel that HAD to stay from his outline. One, being Yiffany’s character AND....... lo and behold, TWO is Hell Tier Vriska!

    Her concept and design was one of the first few things we as a team worked on together when this project started up again. While the core of her concept has essentially stayed the same, with our team’s reboot, the direction and purpose of it is what mostly changed. Fun fact, Andrew’s original design notes for her in the outline said she would have red hair, blue skin, and look like an insanely demonic anime pirate lady. Do what you will with that information LOL.


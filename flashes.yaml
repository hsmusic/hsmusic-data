    <b>Welp</b>

    So it seems people have found out about something.

    [[artist:andrew-hussie|Andrew Hussie]] decided to retroactively update the [S] Rose and Dave: Shut up and jam. page.

    4th song, it replaced [[Shatterface]]. The new song is called [[track:derse-dreamers|Derse Dreamers]]. Fitting, no? Hope you enjoy it. It’s part of [[album:prospit-and-derse|my upcoming solo album]]. :>

    HYPE TIME.

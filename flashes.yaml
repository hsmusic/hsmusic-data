    <img src="media/misc/hsbc-666/tavros1.gif" width="180">
    <img src="media/misc/hsbc-666/tavros2.gif" width="180">
    <img src="media/misc/hsbc-666/tavros3.gif" width="180">
    </figure>

    <b>Floral:</b> Going into it, I wanted his talksprite to capture a small part of the Alterniabound sprite charm while falling in line with our style sensibilities. I put some brain power into it, and the baby head with far apart eyes ended up being key to the whole thing.

    <b>Andi:</b> AHHHH these Tavros’ WERE SOOOO ADORABLE. They completely captured his vibes.I think Floral absolutely nailed the alterniabound essence. Thank you for bringing him back to us...

    <b>Chumi:</b> TAVROS IS SO CUTE I am obsessed.

    <b>Haven:</b> So perfect lovely baby boy.

    <b>Chumi:</b> I did a few of the featured CG’s, mainly the Tavros vs. Vriska ones. They were all quite easy to do since they were essentially redraws of already existing assets. A few edits and voila!! Throw ‘em into the game guys!!

    <b>James:</b> Chumi is like an expert at panel edits at this point. I keep asking her to do them.

